<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Taupunkt-Rechner Widget</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#fff;color:#1a2733;padding:14px;font-size:14px;line-height:1.5}
label{display:block;font-weight:700;font-size:12.5px;margin:8px 0 3px}input{width:100%;padding:8px 10px;border:1px solid #cfd9e2;border-radius:7px;font-size:14px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button{display:block;width:100%;margin-top:10px;background:#0f6ba8;color:#fff;border:none;padding:10px;border-radius:7px;font-weight:800;font-size:14px;cursor:pointer}
.res{display:none;margin-top:10px;border-top:1px solid #e4ebf0;padding-top:8px}.res.on{display:block}
.v{font-weight:800;font-size:15px}.g{color:#1f8a4c}.b{color:#c0392b}.s{color:#5b6b78;font-size:12px}
.src{margin-top:10px;font-size:11.5px;color:#5b6b78}.src a{color:#0f6ba8}
</style>
</head>
<body>
<strong style="font-size:15px;">💧 Taupunkt-Rechner: Keller lüften?</strong>
<div class="row">
  <div><label for="ta">Außen °C</label><input id="ta" type="number" value="28" step="0.5"></div>
  <div><label for="rh">Feuchte %</label><input id="rh" type="number" value="60" min="5" max="100"></div>
</div>
<label for="tk">Keller °C</label><input id="tk" type="number" value="17" step="0.5">
<button id="go" type="button">Prüfen</button>
<div class="res" id="res"><div class="v" id="v"></div><div class="s" id="s"></div></div>
<p class="src">Kostenloses Widget von <a href="https://getecoback.com/guide/keller-lueften-sommer.html?utm_source=widget&utm_medium=embed" target="_blank" rel="noopener">getecoback.com — Keller richtig lüften</a></p>
<script>
(function(){var $=function(i){return document.getElementById(i);};
function dew(t,rh){var g=Math.log(rh/100)+(17.62*t)/(243.12+t);return (243.12*g)/(17.62-g);}
$("go").addEventListener("click",function(){
var ta=parseFloat($("ta").value),rh=parseFloat($("rh").value),tk=parseFloat($("tk").value);
if(isNaN(ta)||isNaN(rh)||isNaN(tk)||rh<5||rh>100)return;
var td=dew(ta,rh),ok=td<(tk-2),v=$("v");
v.className="v "+(ok?"g":"b");v.textContent=ok?"✅ Ja — jetzt kurz stoßlüften":"❌ Nein — Fenster zu lassen";
$("s").textContent="Taupunkt außen: "+td.toFixed(1)+" °C · Wände ~2 °C kühler gerechnet";
$("res").className="res on";});})();
</script>
<script>(function(){try{var b=JSON.stringify({n:"widget_view",p:location.pathname,r:document.referrer,m:{host:(document.referrer?new URL(document.referrer).hostname:"direct")}});if(navigator.sendBeacon){navigator.sendBeacon("https://getecoback.com/api/ev",new Blob([b],{type:"text/plain"}));}}catch(e){}})();</script>
<script>
(function(){
  // Self-serve configuration: an embedding site can set an accent colour and
  // point the result at its own contact page. Values are validated here —
  // colour must be a hex triplet, the CTA must be http(s) — so a crafted URL
  // cannot inject script or a javascript: target.
  try{
    var q=new URLSearchParams(location.search);
    var c=q.get("c")||"";
    if(/^[0-9a-fA-F]{6}$/.test(c)){
      var s=document.createElement("style");
      s.textContent="button{background:#"+c+" !important}.src a{color:#"+c+" !important}.ebcta{background:#"+c+" !important}";
      document.head.appendChild(s);
    }
    var cta=q.get("cta")||"", lab=(q.get("ctal")||"Jetzt Beratung anfragen").slice(0,60);
    if(cta){
      var u=null; try{u=new URL(cta);}catch(e){u=null;}
      if(u&&(u.protocol==="https:"||u.protocol==="http:")){
        var a=document.createElement("a");
        a.className="ebcta"; a.href=u.href; a.target="_top"; a.rel="noopener";
        a.textContent=lab;
        a.style.cssText="display:block;text-align:center;margin-top:10px;padding:10px;border-radius:7px;background:#0f6ba8;color:#fff;font-weight:800;text-decoration:none;font-size:14px";
        var res=document.getElementById("res");
        if(res)res.appendChild(a);
      }
    }
  }catch(e){}
})();
</script>
</body>
</html>
