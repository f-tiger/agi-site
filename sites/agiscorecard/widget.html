<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>AGI Countdown Widget — The AGI Scorecard</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:#0a0a0b;color:#e8e8ec;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
       display:flex;align-items:center;justify-content:center;padding:12px}
  .card{width:100%;max-width:340px;text-align:center}
  .label{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#7c6af5;margin-bottom:6px}
  .clock{display:flex;justify-content:center;gap:8px;margin:8px 0 10px}
  .unit{background:#18181d;border:1px solid rgba(255,255,255,.08);border-radius:8px;padding:7px 0;width:64px}
  .num{font-size:22px;font-weight:700;color:#7c6af5;font-variant-numeric:tabular-nums}
  .ul{font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:#8888a0;margin-top:2px}
  .chips{display:flex;justify-content:center;gap:5px;flex-wrap:wrap;margin-bottom:10px}
  .chip{font-size:10px;font-weight:600;padding:3px 8px;border-radius:6px;border:1px solid}
  .ok{color:#4fc3a1;border-color:rgba(79,195,161,.35);background:rgba(79,195,161,.1)}
  .bad{color:#e05555;border-color:rgba(224,85,85,.35);background:rgba(224,85,85,.1)}
  .open{color:#7c6af5;border-color:rgba(124,106,245,.35);background:rgba(124,106,245,.1)}
  .pend{color:#8888a0;border-color:rgba(255,255,255,.15);background:rgba(255,255,255,.05)}
  .score{display:flex;align-items:baseline;justify-content:center;gap:6px;margin:2px 0 10px}
  .sc-num{font-size:26px;font-weight:700;color:#7c6af5;font-variant-numeric:tabular-nums;line-height:1}
  .sc-lab{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#8888a0}
  a.brand{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;color:#e8e8ec;text-decoration:none}
  a.brand:hover{color:#7c6af5}
  .dot{width:6px;height:6px;background:#4fc3a1;border-radius:50%;display:inline-block}
</style>
</head>
<body>
<div class="card">
  <div class="label">Time to AGI — Aschenbrenner's 2027 baseline</div>
  <div class="clock">
    <div class="unit"><div class="num" id="d">—</div><div class="ul">Days</div></div>
    <div class="unit"><div class="num" id="h">—</div><div class="ul">Hours</div></div>
    <div class="unit"><div class="num" id="m">—</div><div class="ul">Min</div></div>
    <div class="unit"><div class="num" id="s">—</div><div class="ul">Sec</div></div>
  </div>
  <div class="score"><span class="sc-num">62.5</span><span class="sc-lab">/100 · AGI-2027 Thesis Tracker</span></div>
  <div class="chips">
    <span class="chip ok">3 on track</span><span class="chip bad">1 wrong</span>
    <span class="chip open">2 open</span><span class="chip pend">2 pending</span>
  </div>
  <a class="brand" href="https://agiscorecard.com/?utm_source=widget" target="_blank" rel="noopener">
    <span class="dot"></span>Live verdicts at agiscorecard.com &rarr;
  </a>
</div>
<script>
function t(){var x=new Date('2027-01-01T00:00:00Z')-new Date();if(x<0)x=0;
document.getElementById('d').textContent=Math.floor(x/864e5).toLocaleString();
document.getElementById('h').textContent=String(Math.floor(x%864e5/36e5)).padStart(2,'0');
document.getElementById('m').textContent=String(Math.floor(x%36e5/6e4)).padStart(2,'0');
document.getElementById('s').textContent=String(Math.floor(x%6e4/1e3)).padStart(2,'0');}
t();setInterval(t,1000);
</script>
</body>
</html>
