/* ===== levels =====

var LEVELS = [
  { spec: "collect every \u25c6, then reach \u2715", par: 6, ops: ["FWD", "LEFT", "RIGHT"],
    g: ["#######",

        "#######"] },
  { spec: "collect every \u25c6, then reach \u2715", par: 10, ops: ["FWD", "LEFT", "RIGHT"],

        "#...#",
        "#X..#",
        "#####"] },
  { spec: "collect every \u25c6, then reach \u2715", par: 5, ops: ["FWD", "LEFT", "RIGHT", "UNTIL \u25c6"],
    g: ["########",

        "########"] },
  { spec: "collect every \u25c6, then reach \u2715", par: 6, ops: ["FWD", "LEFT", "RIGHT", "UNTIL WALL"],

        "#>.....#",
        "#.####.#",
        "#D....X#",
        "########"] },
  { spec: "collect every \u25c6, then reach \u2715", par: 10, ops: ["FWD", "LEFT", "RIGHT", "UNTIL WALL", "UNTIL \u25c6"],
    g: ["#########",
        "#>.....D#",
        "#.#####.#",
        "#D.....X#",
        "#########"] },
  { spec: "collect every \u25c6, then reach \u2715", par: 10, ops: ["FWD", "LEFT", "RIGHT", "UNTIL WALL", "UNTIL \u25c6"],

var fxc = document.getElementById("fx"), fxx = fxc.getContext("2d"), confetti = [];

var DIRS = [[1, 0], [0, 1], [-1, 0], [0, -1]];   /* 0 = east, clockwise */

function loadLevel(i) {

  grid.forEach(function (row, y) { row.forEach(function (c, x) { if (c === ">") grid[y][x] = "."; }); });

function at(x, y) { return (grid[y] && grid[y][x]) || "#"; }
