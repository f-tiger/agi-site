  :root{--display:'Fredoka One',-apple-system,'Segoe UI',Arial,sans-serif;--bg:#0b0e15;--ink:#e8edf7;--mut:#7c88a3;--line:rgba(255,255,255,.09);--panel:#151a26;
        --bot:#ffd166;--goal:#66d9ff;--gem:#8affc1;--bad:#ff6b7a;}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{background:radial-gradient(900px 560px at 50% -10%,#161f33 0%,var(--bg) 62%);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans JP",sans-serif;
    display:flex;flex-direction:column;align-items:center;min-height:100%;overflow:hidden;
    touch-action:none;user-select:none;-webkit-user-select:none;}
  header{width:100%;max-width:900px;display:flex;align-items:center;justify-content:space-between;padding:8px 12px;
    background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.015));border-bottom:1px solid rgba(255,255,255,.07);
    box-shadow:0 8px 24px rgba(0,0,0,.35);position:relative;z-index:6;}
  .logo{font-family:var(--display);font-weight:400;font-size:19px;letter-spacing:2px;text-shadow:0 2px 0 rgba(0,0,0,.6);}
  .logo em{font-style:normal;color:var(--bot);}
  .hbtn{background:linear-gradient(180deg,#232b3f,#161c2b);border:1px solid rgba(255,255,255,.10);border-bottom:3px solid rgba(0,0,0,.55);
    color:#c9d2ea;border-radius:11px;height:38px;min-width:38px;padding:0 11px;font:inherit;font-size:12.5px;font-weight:800;cursor:pointer;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.10);transition:transform .06s,border-bottom-width .06s;}
  .hbtn:active{transform:translateY(2px);border-bottom-width:1px;}
  /* A <canvas> carries an intrinsic height from its width/height attributes, and a
   flex item defaults to min-height:auto -- so the canvas could GROW to fill the
   column but never SHRINK, and with body{overflow:hidden} everything below it
   (the controls) was pushed off a short viewport with no way to scroll to them.
   `flex:1 1 0` + `min-height:0` is what lets it shrink; layout() then resizes the
   backing store to whatever box it actually got. */
  #stage{flex:1 1 0;min-height:0;width:100%;max-width:900px;display:block;}
  .rack{width:100%;max-width:900px;padding:0 14px 6px;display:flex;flex-wrap:wrap;gap:6px;}
  /* buttons with a physical bottom edge: pressing pushes them down, which is the
     single cheapest "this is a real game" signal a control can give */
  /* instruction keys: an icon first, the word small beneath, a glossy top edge and
     a physical bottom edge. Visuals carry the meaning; the text confirms it. */
  .op{border:1px solid rgba(255,255,255,.10);border-bottom:4px solid rgba(0,0,0,.6);border-radius:13px;
    background:linear-gradient(180deg,#242c42 0%,#181e2f 55%,#131827 100%);color:var(--ink);
    font:inherit;font-size:10.5px;font-weight:800;padding:6px 12px 5px;min-height:52px;min-width:62px;cursor:pointer;letter-spacing:.6px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 6px 14px rgba(0,0,0,.35);transition:transform .06s,border-bottom-width .06s;}
  .op svg{width:22px;height:22px;display:block;filter:drop-shadow(0 2px 0 rgba(0,0,0,.5));}
  .op span{font-family:var(--display);font-weight:400;font-size:11.5px;letter-spacing:.8px;}
  .op.run span{font-size:14px;}
  .op:active{transform:translateY(3px);border-bottom-width:1px;}
  .op.run{background:linear-gradient(180deg,#2ad39a 0%,#12a874 60%,#0d8a5f 100%);color:#04261a;border-color:rgba(255,255,255,.25);
    font-size:13px;min-width:96px;letter-spacing:1.2px;}
  .op.run svg{width:20px;height:20px;}
  .op.clr{background:linear-gradient(180deg,#3a1f2a,#231520);}
  .op.seek{background:linear-gradient(180deg,#2a3560 0%,#1b2344 55%,#141b36 100%);border-color:rgba(124,155,255,.35);}
  .dots{display:flex;gap:6px;align-items:center;}

    var think = seeking.think > 0;
    cx.save(); cx.setLineDash([5, 6]); cx.lineDashOffset = -nowT * 40;
    cx.strokeStyle = think ? "rgba(124,155,255," + (0.55 + 0.4 * Math.sin(nowT * 12)) + ")" : "rgba(124,155,255,.55)"; cx.lineWidth = 3;
    cx.beginPath(); cx.moveTo(C.ox + bot.x * C.s + C.s / 2, C.oy + bot.y * C.s + C.s / 2);
    for (var si = 0; si < seeking.path.length; si++) cx.lineTo(C.ox + seeking.path[si][0] * C.s + C.s / 2, C.oy + seeking.path[si][1] * C.s + C.s / 2);
    cx.stroke(); cx.setLineDash([]); cx.restore();

    cx.strokeStyle = "#7c9bff"; cx.lineWidth = 2;

    if (think) { cx.fillStyle = "#7c9bff"; cx.font = "800 11px -apple-system,'Segoe UI',sans-serif"; cx.textAlign = "center";

  cx.fillStyle = "#241a02"; cx.beginPath(); cx.arc(C.s * .035, 0, C.s * .052, 0, 7); cx.fill();

  cx.beginPath(); cx.arc(-C.s * .17, -C.s * .30, C.s * .05, 0, 7); cx.fill();
  cx.strokeStyle = "#241a02"; cx.lineWidth = 1.5; cx.beginPath(); cx.moveTo(-C.s * .17, -C.s * .26); cx.lineTo(-C.s * .17, -C.s * .16); cx.stroke();
