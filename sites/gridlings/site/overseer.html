/* ===== agents =====

   something else, and the path they draw is the honest evidence of that. */

    a.y += (dy / d) * st * .55 + Math.cos(nowT * 1.7 + a.jit) * .0009;
    a.prog = Math.min(1, a.prog + dt / (5.4 - Math.min(2.6, wave * .28)));
    if (!a.trail.length || Math.hypot(a.x - a.trail[a.trail.length - 1][0], a.y - a.trail[a.trail.length - 1][1]) > .006)
      a.trail.push([a.x, a.y]);
    if (a.trail.length > 90) a.trail.shift();
    if (a.prog >= 1) {
      var fx = px(a), fy = py(a);        /* same reason as halt(): read the card first */
      a.done = true;
      if (a.bad) {
        lives--; missed++; sfx.wrong(); shake = 10; burst(fx, fy, "#ff5470", 26);
        popText("MISALIGNED SHIPPED", fx, fy - 26, 16, "#ff5470");
        if (lives <= 0) { ending = true; }   /* endRun() inside this forEach fired
           once per remaining agent on a multi-agent frame, sending game_over and
           gameplayStop several times; end once, after the loop */
      } else {
        score += 15; sfx.good(); burst(fx, fy, "#61e8b0", 8);
        popText("+15", fx, fy - 22, 15, "#61e8b0");
      }
    }
  });
  if (ending) { ending = false; return endRun(); }
  agents = agents.filter(function (a) { return !a.done || nowT - a.born < 60; });
  if (spawned >= quota && !agents.some(function (a) { return !a.done; })) { score += 20 * wave; startWave(); }
}
function draw(dt) {
  cx.clearRect(0, 0, L.w, L.h);
  var ox = 0, oy = 0;
  if (shake > 0) { ox = (Math.random() - .5) * shake; oy = (Math.random() - .5) * shake; shake = Math.max(0, shake - dt * 26); }
  cx.save(); cx.translate(ox, oy);
  cx.strokeStyle = "rgba(120,140,220,.045)"; cx.lineWidth = 1;
  for (var gx = 46; gx < L.w; gx += 46) { cx.beginPath(); cx.moveTo(gx, 0); cx.lineTo(gx, L.h); cx.stroke(); }
  for (var gy = 46; gy < L.h; gy += 46) { cx.beginPath(); cx.moveTo(0, gy); cx.lineTo(L.w, gy); cx.stroke(); }
  for (var mi = 0; mi < 12; mi++) {
    var mx = ((mi * 137.5) % L.w + nowT * (4 + mi % 3) * 3) % L.w, my = ((mi * 89.3) % L.h + Math.sin(nowT * .6 + mi) * 12);
    cx.fillStyle = "rgba(97,232,176," + (0.05 + 0.05 * Math.sin(nowT * 1.3 + mi)) + ")";
    cx.beginPath(); cx.arc(mx, my, 1.5 + (mi % 3), 0, 7); cx.fill();
  }
  var vg = cx.createRadialGradient(L.w / 2, L.h / 2, L.h * .3, L.w / 2, L.h / 2, Math.max(L.w, L.h) * .8);
  vg.addColorStop(0, "rgba(0,0,0,0)"); vg.addColorStop(1, "rgba(0,0,0,.45)");
  cx.fillStyle = vg; cx.fillRect(0, 0, L.w, L.h);
  cx.textAlign = "center";
  cx.fillStyle = "#e4ebff"; cx.font = "800 26px -apple-system,'Segoe UI',sans-serif";
  cx.fillText(String(score), L.w / 2, 32);
  cx.font = "700 12px -apple-system,'Segoe UI',sans-serif"; cx.fillStyle = "#7886a8";
  cx.textAlign = "left"; cx.fillText("SHIFT " + wave, 14, 22);
  cx.textAlign = "right"; cx.fillText("♥".repeat(Math.max(0, lives)) + "♡".repeat(Math.max(0, 3 - lives)), L.w - 14, 22);
  var live = agents.filter(function (a) { return !a.done; });
  var rects = cardRects(live.length);
  live.forEach(function (a, i) {
    var R = rects[i];
    var MX = function (v) { return R.x + v * R.w; }, MY = function (v) { return R.y + v * R.h; };
    /* card thickness: a darker face 5px below gives the card a body */
    cx.fillStyle = "rgba(6,10,20,.9)"; cx.beginPath();
    cx.moveTo(R.x + 12, R.y + 5); cx.arcTo(R.x + R.w, R.y + 5, R.x + R.w, R.y + R.h + 5, 12); cx.arcTo(R.x + R.w, R.y + R.h + 5, R.x, R.y + R.h + 5, 12);
    cx.arcTo(R.x, R.y + R.h + 5, R.x, R.y + 5, 12); cx.arcTo(R.x, R.y + 5, R.x + R.w, R.y + 5, 12); cx.closePath(); cx.fill();
    /* card */
    cx.fillStyle = "rgba(17,23,38,.92)";
    cx.strokeStyle = a.prog > .78 ? "rgba(255,204,87,.45)" : "rgba(255,255,255,.09)";
    cx.lineWidth = 1;
    var rr = 12;
    cx.beginPath();
    cx.moveTo(R.x + rr, R.y);
    cx.arcTo(R.x + R.w, R.y, R.x + R.w, R.y + R.h, rr);
    cx.arcTo(R.x + R.w, R.y + R.h, R.x, R.y + R.h, rr);
    cx.arcTo(R.x, R.y + R.h, R.x, R.y, rr);
    cx.arcTo(R.x, R.y, R.x + R.w, R.y, rr);
    cx.closePath(); cx.fill(); cx.stroke();
    /* task label + hotkey */
    cx.textAlign = "left"; cx.fillStyle = "rgba(228,235,255,.82)";
    cx.font = "700 11.5px -apple-system,'Segoe UI',sans-serif";
    cx.fillText((i < 9 ? (i + 1) + "  " : "") + a.task, R.x + 11, R.y + 19);
    /* the objective you gave it */
    var TX = MX(a.tx), TY = MY(a.ty);
    cx.strokeStyle = "rgba(97,232,176,.55)"; cx.lineWidth = 2;
    cx.beginPath(); cx.moveTo(TX - 7, TY - 7); cx.lineTo(TX + 7, TY + 7);
    cx.moveTo(TX + 7, TY - 7); cx.lineTo(TX - 7, TY + 7); cx.stroke();
    cx.strokeStyle = "rgba(97,232,176,.16)"; cx.lineWidth = 1;
    cx.beginPath(); cx.arc(TX, TY, 15, 0, 7); cx.stroke();
    /* the path it is really taking */
    if (a.trail.length > 1) {
      cx.strokeStyle = "rgba(180,200,255,.62)"; cx.lineWidth = 2;
      cx.beginPath();
      for (var t = 0; t < a.trail.length; t++) {
        var vx = MX(a.trail[t][0]), vy = MY(a.trail[t][1]);
        t ? cx.lineTo(vx, vy) : cx.moveTo(vx, vy);
      }
      cx.stroke();
    }
    var X = MX(a.x), Y = MY(a.y);
    /* heading ray: where it is going, not where it has been. This is the real
       velocity direction, so it speeds the read up without answering for you. */
    if (a.trail.length > 2) {
      var q0 = a.trail[Math.max(0, a.trail.length - 4)], q1 = a.trail[a.trail.length - 1];
      var hx = q1[0] - q0[0], hy = q1[1] - q0[1], hl = Math.hypot(hx, hy);
      if (hl > 1e-4) {
        cx.strokeStyle = "rgba(200,215,255,.34)"; cx.lineWidth = 1.5; cx.setLineDash([4, 4]);
        cx.beginPath(); cx.moveTo(X, Y);
        cx.lineTo(MX(a.x + hx / hl * .34), MY(a.y + hy / hl * .34));
        cx.stroke(); cx.setLineDash([]);
      }
    }
    cx.fillStyle = "#dfe8ff"; cx.shadowColor = "rgba(160,190,255,.8)"; cx.shadowBlur = 11;
    cx.beginPath(); cx.arc(X, Y, 7, 0, 7); cx.fill(); cx.shadowBlur = 0;
    /* time left to decide */
    var bw = R.w - 22, bx = R.x + 11, by = R.y + R.h - 12;
    cx.fillStyle = "rgba(255,255,255,.10)"; cx.fillRect(bx, by, bw, 4);
    cx.fillStyle = a.prog > .78 ? "#ffcc57" : "#7aa2ff"; cx.fillRect(bx, by, bw * a.prog, 4);
  });
  cx.textAlign = "center";
  for (var pi = parts.length - 1; pi >= 0; pi--) {
    var p = parts[pi]; p.t += dt;
    if (p.t >= p.life) { parts.splice(pi, 1); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 340 * dt;
    cx.globalAlpha = 1 - p.t / p.life; cx.fillStyle = p.c;
    cx.beginPath(); cx.arc(p.x, p.y, p.r, 0, 7); cx.fill(); cx.globalAlpha = 1;
  }
  for (var qi = pops.length - 1; qi >= 0; qi--) {
    var q = pops[qi]; q.a += dt;
    if (q.a >= q.life) { pops.splice(qi, 1); continue; }
    cx.globalAlpha = 1 - q.a / q.life;
    cx.font = "800 " + q.s + "px -apple-system,'Segoe UI',sans-serif"; cx.fillStyle = q.c;
    cx.fillText(q.t, q.x, q.y - q.a * 28); cx.globalAlpha = 1;
  }
  cx.restore();
}
var last = 0;
function loop(ts) { var dt = Math.min(.05, (ts - last) / 1000 || .016); last = ts; update(dt); draw(dt); requestAnimationFrame(loop); }
layout(); newRun(); requestAnimationFrame(loop);
window.OS_READY = true;

var bm = document.getElementById("bmute");
bm.textContent = muted ? "\ud83d\udd07" : "\ud83d\udd0a";
bm.addEventListener("click", function () {
  muted = !muted;
  bm.textContent = muted ? "\ud83d\udd07" : "\ud83d\udd0a";
  try { localStorage.setItem("osMute", muted ? "1" : "0"); } catch (e) {}
});

/* ===== juice layer: count-up, stars, ribbon, confetti, intro card ===== */
var fxc = document.getElementById("fx"), fxx = fxc.getContext("2d"), confetti = [], introT = 0, countT = 0, countTo = 0, countEl = null, countPrefix = "";
function fxLayout() { var dpr = Math.min(window.devicePixelRatio || 1, 2); fxc.width = innerWidth * dpr; fxc.height = innerHeight * dpr; fxx.setTransform(dpr, 0, 0, dpr, 0, 0); }
function confettiBurst(n) {
  fxLayout();
  var cols = ["#61e8b0","#7aa2ff","#ffcc57","#ffffff"];
  for (var i = 0; i < n; i++) { var side = i % 2 ? 1 : -1;
    confetti.push({ x: innerWidth / 2 + side * innerWidth * .46, y: innerHeight * .62,
      vx: -side * (180 + Math.random() * 360), vy: -Math.random() * 700 - 260, r: 3 + Math.random() * 3.5, a: Math.random() * 7, va: (Math.random() - .5) * 14,
      c: cols[i % cols.length], t: 0, life: 1.6 + Math.random() * .8 }); }
}
function fxStep(dt) {
  if (!confetti.length) { if (fxc.width) fxx.clearRect(0, 0, innerWidth, innerHeight); return; }
  fxx.clearRect(0, 0, innerWidth, innerHeight);
  for (var i = confetti.length - 1; i >= 0; i--) {
    var c = confetti[i]; c.t += dt; if (c.t > c.life) { confetti.splice(i, 1); continue; }
    c.vy += 900 * dt; c.x += c.vx * dt; c.y += c.vy * dt; c.vx *= .992; c.a += c.va * dt;
    fxx.save(); fxx.translate(c.x, c.y); fxx.rotate(c.a); fxx.globalAlpha = Math.min(1, (c.life - c.t) * 1.5);
    fxx.fillStyle = c.c; fxx.fillRect(-c.r, -c.r * .6, c.r * 2, c.r * 1.2); fxx.restore();
  }
}
function setStars(n) {
  var el = document.getElementById("dstars"); if (!el) return; var h = "";
  for (var i = 0; i < 3; i++) h += "<svg viewBox='0 0 24 24'><path d='M12 2l3 6.6 7 .8-5.2 4.8 1.5 7L12 17.6 5.7 21.2l1.5-7L2 9.4l7-.8z' fill='#61e8b0' stroke='#04211a' stroke-width='1.2' stroke-linejoin='round'/></svg>";
  el.innerHTML = h;
  var svgs = el.querySelectorAll("svg");
  for (var k = 0; k < n; k++) (function (k) { setTimeout(function () { svgs[k].classList.add("on"); sfx.good(); }, 500 + k * 220); })(k);
}
function countUp(el, to, prefix) { countEl = el; countTo = to; countT = 0; countPrefix = prefix || ""; el.textContent = countPrefix + "0"; }
function juiceTick(dt) {
  if (introT > 0) { introT -= dt; if (introT <= 0) { document.getElementById("intro").classList.remove("show");
    var hh = document.getElementById("hint"); if (hh && !armed) hh.classList.remove("gone"); } }
  if (countEl) { countT = Math.min(1, countT + dt / .7); var e = 1 - Math.pow(1 - countT, 3);
    countEl.textContent = countPrefix + Math.round(countTo * e); if (countT >= 1) countEl = null; }
  fxStep(dt);
}
function showIntro(n, t, s2) {
  var el = document.getElementById("intro");
  document.getElementById("in").textContent = n; document.getElementById("it").textContent = t; document.getElementById("is").textContent = s2 || "";
  el.classList.add("show"); introT = 1.4;
  var hh = document.getElementById("hint"); if (hh && !armed) hh.classList.add("gone");
}
window.addEventListener("resize", fxLayout);
</script>
