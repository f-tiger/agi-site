  :root{--bg:#080b12;--ink:#e4ebff;--mut:#7886a8;--line:rgba(255,255,255,.09);--panel:#111726;
        --ok:#61e8b0;--bad:#ff5470;--warn:#ffcc57;}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{background:radial-gradient(1000px 620px at 50% -10%,#141d33 0%,var(--bg) 62%);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans JP",sans-serif;
    display:flex;flex-direction:column;align-items:center;min-height:100%;overflow:hidden;
    touch-action:none;user-select:none;-webkit-user-select:none;}
  header{width:100%;max-width:1180px;display:flex;align-items:center;justify-content:space-between;padding:10px 14px 0;}
  .logo{font-weight:800;font-size:17px;letter-spacing:2px;}
  .logo em{font-style:normal;color:var(--ok);}
  .hbtn{background:var(--panel);border:1px solid var(--line);color:var(--mut);border-radius:9px;width:34px;height:34px;font-size:15px;cursor:pointer;min-height:36px;}
  /* A <canvas> carries an intrinsic height from its width/height attributes, and a
   flex item defaults to min-height:auto -- so the canvas could GROW to fill the
   column but never SHRINK, and with body{overflow:hidden} everything below it
   (the controls) was pushed off a short viewport with no way to scroll to them.
   `flex:1 1 0` + `min-height:0` is what lets it shrink; layout() then resizes the
   backing store to whatever box it actually got. */
  #stage{flex:1 1 0;min-height:0;width:100%;max-width:1180px;display:block;cursor:pointer;}
  footer{width:100%;max-width:1180px;padding:2px 14px calc(9px + env(safe-area-inset-bottom));display:flex;justify-content:space-between;font-size:11px;color:var(--mut);}
  footer a{color:var(--mut);text-decoration:none;border-bottom:1px dotted var(--mut);}
  .cg footer{display:none;}
  .modal{position:fixed;inset:0;top:0;right:0;bottom:0;left:0;background:rgba(5,8,15,.86);
    -webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px);display:none;align-items:center;justify-content:center;z-index:50;padding:16px;}
  .modal.show{display:flex;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:24px 26px;max-width:380px;width:100%;
    text-align:center;box-shadow:0 18px 60px rgba(0,0,0,.55);}
  .card h2{font-size:19px;margin-bottom:8px;letter-spacing:.5px;}
  .big{font-size:40px;font-weight:800;background:linear-gradient(120deg,#61e8b0,#7aa2ff);
    -webkit-background-clip:text;background-clip:text;color:transparent;}
  .card p{color:var(--mut);font-size:13px;margin:9px 0 15px;line-height:1.6;}
  .btn{background:linear-gradient(120deg,#3fc794,#61e8b0);color:#04211a;border:0;border-radius:12px;padding:12px 26px;
    font:inherit;font-size:15px;font-weight:800;cursor:pointer;}
  #hint{position:fixed;inset:0;top:0;right:0;bottom:0;left:0;display:flex;align-items:center;justify-content:center;
    z-index:40;padding:16px;pointer-events:none;transition:opacity .45s ease;}
  #hint.gone{opacity:0;}
  .hcard{background:rgba(17,23,38,.93);border:1px solid var(--line);border-radius:16px;padding:18px 22px;max-width:390px;
    text-align:center;box-shadow:0 14px 44px rgba(0,0,0,.5);}
  .hcard .keys{margin-bottom:10px;}
  .hcard p{font-size:13.5px;line-height:1.62;}
  .hcard .go{margin-top:11px;color:var(--ok);font-weight:800;letter-spacing:1px;text-transform:uppercase;font-size:12px;
    animation:pulse 1.5s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}

  /* ---- juice layer (shared recipe across the fleet) ---- */
  .stars{display:flex;justify-content:center;gap:8px;margin:2px 0 8px;height:34px;}
  .stars svg{width:32px;height:32px;opacity:.18;transform:scale(.6);transition:opacity .25s,transform .35s cubic-bezier(.2,1.6,.4,1);}
  .stars svg.on{opacity:1;transform:scale(1);}
  .ribbon{display:inline-block;background:#61e8b0;color:#04211a;font-size:11px;font-weight:900;letter-spacing:1.6px;
    padding:4px 10px;border-radius:999px;margin-bottom:8px;opacity:0;transform:translateY(6px);transition:opacity .3s,transform .3s;}
  .ribbon.show{opacity:1;transform:none;}
  .btn{border-bottom:4px solid rgba(0,0,0,.38)!important;border-radius:13px!important;min-width:180px;font-size:16px!important;font-weight:900!important;
    transition:transform .06s,border-bottom-width .06s;}
  .btn:active{transform:translateY(3px)!important;border-bottom-width:1px!important;}
  #intro{position:fixed;left:50%;top:21%;transform:translate(-50%,-50%) scale(.9);z-index:45;pointer-events:none;
    text-align:center;opacity:0;transition:opacity .25s,transform .25s;
    background:rgba(10,13,22,.88);border:1px solid #61e8b044;border-radius:16px;padding:14px 22px;
    box-shadow:0 16px 50px rgba(0,0,0,.5);max-width:86vw;}
  #intro.show{opacity:1;transform:translate(-50%,-50%) scale(1);}
  #intro .n{font-size:13px;font-weight:800;letter-spacing:3px;color:#8a95b3;}
  #intro .t{font-size:clamp(18px,4.3vw,30px);font-weight:900;color:#61e8b0;text-shadow:0 6px 30px #61e8b055;margin-top:4px;white-space:nowrap;}
  #intro .s{font-size:14px;color:#e8edf7;margin-top:8px;opacity:.85;}
  #fx{position:fixed;inset:0;z-index:55;pointer-events:none;}
  /* ---- deep art: ops-room control wall (no eyes here -- rovers, pads, monitors, a HALT stamp) ---- */
  :root{--display:'Bungee',Impact,'Arial Black',sans-serif;}
  body{background:radial-gradient(900px 560px at 50% -12%,#12203a 0%,#0a1020 48%,#070a12 100%);}
  header{background:linear-gradient(180deg,rgba(18,26,44,.9),rgba(18,26,44,0));}
  .logo{font-family:var(--display);font-weight:400;font-size:18px;letter-spacing:1px;text-shadow:0 2px 0 rgba(0,0,0,.6);}
  .logo em{color:#61e8b0;text-shadow:0 0 14px #61e8b077,0 2px 0 rgba(0,0,0,.6);}
  .hbtn{background:linear-gradient(180deg,#1b2540,#101828);border:1px solid rgba(255,255,255,.12);border-bottom:3px solid rgba(0,0,0,.5);color:#aab6d6;}
  .card{background:linear-gradient(180deg,#16203a,#0e1526);border:1px solid rgba(255,255,255,.12);position:relative;overflow:hidden;}
  .card::before{content:"";position:absolute;left:0;right:0;top:0;height:6px;background:repeating-linear-gradient(135deg,#ffcc57 0 14px,#0c1220 14px 28px);}
  .card h2{font-family:var(--display);font-weight:400;font-size:20px;letter-spacing:1px;margin-top:6px;}
  .big{font-family:var(--display);font-weight:400;font-size:46px;}
  .btn{font-family:var(--display)!important;font-weight:400!important;letter-spacing:1px;font-size:15px!important;}
  .ribbon{font-family:var(--display);font-weight:400;}
  #intro{background:linear-gradient(180deg,rgba(18,26,44,.94),rgba(10,14,24,.94));border:1px solid rgba(97,232,176,.3);}
  #intro .n{font-family:var(--display);font-weight:400;font-size:12px;letter-spacing:3px;color:#7aa2ff;}
