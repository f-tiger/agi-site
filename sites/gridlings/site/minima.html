<style>
  /* Swiss: pure white ground, one sans family, one accent (International Orange),
     hairline rules as the only structure, tabular numerals as composition. */
  :root{--bg:#ffffff;--bg2:#f7f7f8;--ink:#111113;--mut:#6b6b70;
        --line:rgba(0,0,0,.12);--line2:rgba(0,0,0,.24);--acc:#FF4F00;}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}

    font-weight:700;padding:7px 10px;cursor:pointer;letter-spacing:.6px;min-height:36px;}
  .hbtn:hover{border-color:var(--line2);color:var(--ink);}
  /* A <canvas> carries an intrinsic height from its width/height attributes, and a
   flex item defaults to min-height:auto -- so the canvas could GROW to fill the
   column but never SHRINK, and with body{overflow:hidden} everything below it

  #stage{flex:1 1 0;min-height:0;width:100%;max-width:1280px;display:block;cursor:crosshair;}

  .heat:disabled{background:var(--bg2);color:var(--mut);cursor:default;}

<script>
"use strict";
/* ===== the landscape =====
   Every level is a sum of radial bumps over the unit square. Negative amplitude
   is a basin you want to be in; positive is a ridge that stands between you and
   one. The field is defined in NORMALISED coordinates, never in pixels, so a
   resize or an orientation change cannot alter the level you are playing. */
var LEVELS = [
  { note: "one basin — follow the arrow", steps: 760, start: [.12, .16], g: [
      { x: .62, y: .58, a: -1.00, s: .26 } ] },
  { note: "two basins — one of them is deeper", steps: 820, start: [.10, .86], g: [
      { x: .30, y: .30, a: -0.58, s: .17 },
      { x: .76, y: .62, a: -1.00, s: .20 } ] },
  { note: "a wide comfortable bowl, and a narrow deep well", steps: 1450, start: [.14, .20], g: [
      { x: .36, y: .56, a: -0.64, s: .30 },
      { x: .76, y: .28, a: -1.00, s: .14 } ] },
  { note: "the ridge lies to you", steps: 1400, start: [.09, .50], g: [
      { x: .26, y: .48, a: -0.56, s: .14 },
      { x: .47, y: .50, a: 0.46, s: .11 },
      { x: .70, y: .52, a: -1.00, s: .19 } ] },
  { note: "five dimples and one needle", steps: 1300, start: [.50, .09], g: [
      { x: .18, y: .32, a: -0.40, s: .13 }, { x: .44, y: .74, a: -0.42, s: .13 },
      { x: .74, y: .24, a: -0.38, s: .12 }, { x: .86, y: .76, a: -0.44, s: .13 },
      { x: .28, y: .86, a: -0.36, s: .11 },
      { x: .60, y: .46, a: -1.00, s: .085 } ] },
  { note: "the slope has all but vanished — the arrow will not save you here", steps: 1300, start: [.12, .84], g: [
      { x: .50, y: .50, a: -0.55, s: .62 },
      { x: .72, y: .27, a: -1.00, s: .075 } ] }
];

var GW = 161, GH = 121;              /* field sample grid, corners, normalised */
var cv = document.getElementById("stage"), cx = cv.getContext("2d");
var mapC = document.createElement("canvas"), mcx = mapC.getContext("2d");
var L = { w: 0, h: 0 };
var lvl, bumps, F, fmin, fmax, target, levels, revealed, probe, steps, maxSteps;
var running, over, won, armed, armT, nowT, score, best = 0, heatFlash, pulses;
var HEAT_COST = 75, SPEED = 0.30, dead = false;
try { best = parseInt(localStorage.getItem("mnBest") || "0", 10) || 0; } catch (e) {}

function fieldAt(x, y) {
  var v = 0;
  for (var i = 0; i < bumps.length; i++) {
    var b = bumps[i], dx = x - b.x, dy = y - b.y;
    v += b.a * Math.exp(-(dx * dx + dy * dy) / (2 * b.s * b.s));
  }
  return v;
}
/* analytic gradient — the ONLY signal the player gets, so it must be exact */
function gradAt(x, y) {
  var gx = 0, gy = 0;
  for (var i = 0; i < bumps.length; i++) {
    var b = bumps[i], dx = x - b.x, dy = y - b.y, s2 = b.s * b.s;
    var e = b.a * Math.exp(-(dx * dx + dy * dy) / (2 * s2));
    gx += e * (-dx / s2); gy += e * (-dy / s2);
  }
  return [gx, gy];
}
function buildField() {
  F = new Float32Array(GW * GH);
  fmin = Infinity; fmax = -Infinity;
  for (var j = 0; j < GH; j++) for (var i = 0; i < GW; i++) {
    var v = fieldAt(i / (GW - 1), j / (GH - 1));
    F[j * GW + i] = v;
    if (v < fmin) fmin = v; if (v > fmax) fmax = v;
  }
  /* The target is derived from the field's own measured minimum, never authored
     by hand. A hand-typed target can be unreachable (an unwinnable level) or sit
     above a decoy basin (a level that lies); this cannot be either. */
  target = fmin * 0.86;
  levels = [];
  var lo = fmin, hi = Math.max(0.02, fmax), stepv = (hi - lo) / 15;
  for (var k = lo + stepv * .5; k < hi; k += stepv) levels.push(k);
}
function loadLevel(i) {
  lvl = ((i % LEVELS.length) + LEVELS.length) % LEVELS.length;
  bumps = LEVELS[lvl].g;
  buildField();
  revealed = new Uint8Array((GW - 1) * (GH - 1));
  probe = { x: LEVELS[lvl].start[0], y: LEVELS[lvl].start[1] };
  maxSteps = LEVELS[lvl].steps; steps = maxSteps;
  over = false; won = false; heatFlash = 0; pulses = [];
  document.getElementById("mdone").classList.remove("show");
  layout();
  reveal(probe.x, probe.y, 1.35);
  hud();
}
function newRun() {
  score = 0; dead = false; running = true; armed = false; armT = 0; nowT = 0;
  loadLevel(0);
}

/* ===== rendering ===== */
function layout() {
  var dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  var r = cv.getBoundingClientRect();
  L.w = Math.max(280, r.width); L.h = Math.max(170, r.height);
  cv.width = Math.round(L.w * dpr); cv.height = Math.round(L.h * dpr);
  cx.setTransform(dpr, 0, 0, dpr, 0, 0);
  mapC.width = cv.width; mapC.height = cv.height;
  mcx.setTransform(dpr, 0, 0, dpr, 0, 0);
  /* the revealed set lives in field coordinates, so a resize only has to
     re-stamp it at the new scale — it never loses what the player uncovered */
  if (revealed) restamp();
}
function px(nx) { return nx * L.w; }
function py(ny) { return ny * L.h; }

/* marching squares over one cell, for every contour level it straddles */
function stampCell(i, j) {
  var a = F[j * GW + i], b = F[j * GW + i + 1], c = F[(j + 1) * GW + i + 1], d = F[(j + 1) * GW + i];
  var x0 = px(i / (GW - 1)), x1 = px((i + 1) / (GW - 1));
  var y0 = py(j / (GH - 1)), y1 = py((j + 1) / (GH - 1));
  for (var k = 0; k < levels.length; k++) {
    var t = levels[k];
    var s = (a < t ? 1 : 0) | (b < t ? 2 : 0) | (c < t ? 4 : 0) | (d < t ? 8 : 0);
    if (s === 0 || s === 15) continue;
    var top = [x0 + (x1 - x0) * ((t - a) / (b - a)), y0];
    var rgt = [x1, y0 + (y1 - y0) * ((t - b) / (c - b))];
    var bot = [x0 + (x1 - x0) * ((t - d) / (c - d)), y1];
    var lft = [x0, y0 + (y1 - y0) * ((t - a) / (d - a))];
    var seg = null;
    if (s === 1 || s === 14) seg = [top, lft];
    else if (s === 2 || s === 13) seg = [top, rgt];
    else if (s === 3 || s === 12) seg = [lft, rgt];
    else if (s === 4 || s === 11) seg = [rgt, bot];
    else if (s === 6 || s === 9) seg = [top, bot];
    else if (s === 7 || s === 8) seg = [lft, bot];
    else if (s === 5 || s === 10) seg = [top, rgt];   /* saddle: one of the two pairs */
    if (!seg) continue;
    /* every third contour is an index line, drawn heavier — the topographic
       convention, and the only weight hierarchy on the page */
    mcx.strokeStyle = (k % 3 === 0) ? "rgba(17,17,19,.72)" : "rgba(17,17,19,.34)";
    mcx.lineWidth = (k % 3 === 0) ? 1.5 : 1.05;
    mcx.beginPath(); mcx.moveTo(seg[0][0], seg[0][1]); mcx.lineTo(seg[1][0], seg[1][1]); mcx.stroke();
  }
}
function restamp() {
  mcx.clearRect(0, 0, L.w, L.h);
  for (var j = 0; j < GH - 1; j++) for (var i = 0; i < GW - 1; i++)
    if (revealed[j * (GW - 1) + i]) stampCell(i, j);
}
function reveal(nx, ny, mult) {
  var rad = 0.115 * (mult || 1);                 /* in normalised units */
  var ci = Math.round(nx * (GW - 1)), cj = Math.round(ny * (GH - 1));
  var ri = Math.ceil(rad * (GW - 1)), rj = Math.ceil(rad * (GH - 1));
  for (var j = Math.max(0, cj - rj); j <= Math.min(GH - 2, cj + rj); j++) {
    for (var i = Math.max(0, ci - ri); i <= Math.min(GW - 2, ci + ri); i++) {
      var idx = j * (GW - 1) + i;
      if (revealed[idx]) continue;
      var dx = i / (GW - 1) - nx, dy = j / (GH - 1) - ny;
      if (dx * dx + dy * dy > rad * rad) continue;
      revealed[idx] = 1; stampCell(i, j);
    }
  }
}

/* ===== input =====
   Pointer and keyboard both write the SAME steering vector, so neither can drift
   from the other. Nothing here reads a raw angle, and nothing uses `|| fallback`
   on a number that is legitimately allowed to be zero. */
var keys = { u: false, d: false, l: false, r: false };
var ptr = { on: false, x: 0, y: 0 };
function armIt() {
  if (armed) return;
  armed = true;
  var h = document.getElementById("hint"); if (h) h.classList.add("gone");
}
function canvasPt(e) {
  var r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) / Math.max(1, r.width), y: (e.clientY - r.top) / Math.max(1, r.height) };
}
cv.addEventListener("pointerdown", function (e) {
  if (over) return;
  ac(); armIt(); cv.setPointerCapture(e.pointerId);
  var p = canvasPt(e); ptr.on = true; ptr.x = p.x; ptr.y = p.y; e.preventDefault();
});
cv.addEventListener("pointermove", function (e) {
  if (!ptr.on) return;
  var p = canvasPt(e); ptr.x = p.x; ptr.y = p.y; e.preventDefault();
});
function lift() { ptr.on = false; }
cv.addEventListener("pointerup", lift);
cv.addEventListener("pointercancel", lift);
cv.addEventListener("pointerleave", lift);
/* dir() reads the PHYSICAL key (e.code) and falls back to e.key only for browsers
   that do not report code — so the same three fingers work on QWERTY, AZERTY and
   QWERTZ without the player rebinding anything. */
function dir(e) {
  var c = e.code;
  if (c === "ArrowUp" || c === "KeyW") return "u";
  if (c === "ArrowDown" || c === "KeyS") return "d";
  if (c === "ArrowLeft" || c === "KeyA") return "l";
  if (c === "ArrowRight" || c === "KeyD") return "r";
  if (!c) {
    var k = e.key;
    if (k === "ArrowUp") return "u"; if (k === "ArrowDown") return "d";
    if (k === "ArrowLeft") return "l"; if (k === "ArrowRight") return "r";
  }
  return null;
}
window.addEventListener("keydown", function (e) {
  var d = dir(e);
  if (d) { keys[d] = true; ptr.on = false; armIt(); e.preventDefault(); return; }
  var c = e.code;
  if (c === "Space" || c === "Enter" || c === "NumpadEnter") { armIt(); doHeat(); e.preventDefault(); }
  else if (c === "KeyR") { window.mnCg("stop"); newRun(); }
  else if (c === "KeyM") { muted = !muted; try { localStorage.setItem("mnMute", muted ? "1" : "0"); } catch (x) {} }
});
window.addEventListener("keyup", function (e) {
  var d = dir(e); if (d) keys[d] = false;
});
window.addEventListener("resize", layout);
window.addEventListener("orientationchange", function () { setTimeout(layout, 120); });

function doHeat() {
  if (over || !running || steps < HEAT_COST) { if (!over) sfx.fail(); return; }
  ac(); armIt();
  steps -= HEAT_COST;
  var ang = Math.random() * Math.PI * 2, dist = 0.17 + Math.random() * 0.31;
  probe.x = Math.max(.02, Math.min(.98, probe.x + Math.cos(ang) * dist));
  probe.y = Math.max(.02, Math.min(.98, probe.y + Math.sin(ang) * dist));
  /* the jump also buys information: it uncovers a wider disc where it lands,
     which is what makes spending steps on it a real trade and not just a reroll */
  reveal(probe.x, probe.y, 1.6);
  pulses.push({ x: probe.x, y: probe.y, t: 0 });
  heatFlash = .45; sfx.heat();
  ev("tool_use", "heat:" + lvl);
  hud();
}
document.getElementById("bheat").addEventListener("click", function () { doHeat(); });
document.getElementById("bretry").addEventListener("click", function () { window.mnCg("stop"); ev("play_again"); newRun(); });
document.getElementById("hublink").addEventListener("click", function () { ev("hub_click"); });
document.getElementById("bnext").addEventListener("click", function () {
  if (dead) { window.mnCg("stop"); ev("play_again"); newRun(); return; }
  if (lvl + 1 < LEVELS.length) loadLevel(lvl + 1); else newRun();
});

/* ===== update ===== */
function update(dt) {
  nowT += dt;
  if (!running || over) return;
  if (!armed) { armT += dt; if (armT > 7) armIt(); }
  var sx = 0, sy = 0;
  var kx = (keys.r ? 1 : 0) - (keys.l ? 1 : 0), ky = (keys.d ? 1 : 0) - (keys.u ? 1 : 0);
  if (kx !== 0 || ky !== 0) {
    var km = Math.hypot(kx, ky);              /* never 0 here: guarded above */
    sx = kx / km; sy = ky / km;
  } else if (ptr.on) {
    var dx = ptr.x - probe.x, dy = ptr.y - probe.y, dm = Math.hypot(dx, dy);
    if (dm > 0.004) { sx = dx / dm; sy = dy / dm; }
  }
  if (sx !== 0 || sy !== 0) {
    var move = SPEED * dt;
    probe.x = Math.max(0, Math.min(1, probe.x + sx * move));
    probe.y = Math.max(0, Math.min(1, probe.y + sy * move));
    steps -= move * 1000;
    reveal(probe.x, probe.y, 1);
    if (steps <= 0) { steps = 0; return endRun(false); }
  }
  if (heatFlash > 0) heatFlash = Math.max(0, heatFlash - dt);
  for (var i = pulses.length - 1; i >= 0; i--) { pulses[i].t += dt; if (pulses[i].t > .7) pulses.splice(i, 1); }
  if (fieldAt(probe.x, probe.y) <= target) return endRun(true);
  hud();
}
function endRun(didWin) {
  over = true; won = didWin;
  var d = document.getElementById("mdone");
  if (didWin) {
    var left = Math.max(0, Math.round(steps));
    var gained = 100 + Math.floor(left / 5);
    score += gained; sfx.win(); window.mnCg("happy");
    if (score > best) { best = score; try { localStorage.setItem("mnBest", String(best)); } catch (e) {} }
    document.getElementById("dt").textContent = "MINIMUM FOUND";
    document.getElementById("ds").textContent = "+" + gained;
    document.getElementById("dp").innerHTML = left + " steps left of " + maxSteps +
      "<br>Total " + score + " · best " + best;
    document.getElementById("bnext").textContent = lvl + 1 < LEVELS.length ? "Next" : "Play again";
    dead = false;
    ev("game_over", "mn:win:" + lvl);
  } else {
    sfx.fail(); dead = true; window.mnCg("stop");
    document.getElementById("dt").textContent = "OUT OF STEPS";
    document.getElementById("ds").textContent = fmt(fieldAt(probe.x, probe.y));
    document.getElementById("dp").innerHTML = "You needed " + fmt(target) +
      ".<br>The bottom you were standing in was not the bottom.";
    document.getElementById("bnext").textContent = "Try again";
    ev("game_over", "mn:dead:" + lvl);
  }
  d.classList.add("show");
  hud();
}
/* LOSS is shown as a plain positive depth so that "smaller is better" needs no
   explaining: the field is negative, the readout is its magnitude x100. */
function fmt(v) { return Math.round(-v * 100); }
function hud() {
  document.getElementById("hlvl").textContent = "LEVEL " + (lvl + 1) + " / " + LEVELS.length;
  document.getElementById("hloss").textContent = fmt(fieldAt(probe.x, probe.y));
  document.getElementById("htar").textContent = fmt(target);
  var s = Math.max(0, Math.round(steps));
  document.getElementById("hsteps").textContent = s;
  document.getElementById("hfill").style.width = (maxSteps ? (s / maxSteps) * 100 : 0) + "%";
  var hb = document.getElementById("bheat");
  hb.disabled = over || s < HEAT_COST;
  document.getElementById("hcost").textContent = "costs " + HEAT_COST + " steps";
}

/* ===== draw ===== */
function draw(dt) {
  cx.clearRect(0, 0, L.w, L.h);
  cx.drawImage(mapC, 0, 0, L.w, L.h);
  var X = px(probe.x), Y = py(probe.y);
  /* the slope reading: gradient in field space, converted to screen space,
     because the field is normalised and the viewport rarely is square */
  var g = gradAt(probe.x, probe.y);
  var vx = -g[0] / L.w, vy = -g[1] / L.h, vm = Math.hypot(vx, vy);
  if (vm > 1e-9) {
    var ux = vx / vm, uy = vy / vm;
    var len = Math.min(96, 26 + vm * L.w * L.h * 0.0016);
    cx.strokeStyle = "#FF4F00"; cx.lineWidth = 1.6;
    cx.beginPath(); cx.moveTo(X, Y); cx.lineTo(X + ux * len, Y + uy * len); cx.stroke();
    var hx = X + ux * len, hy = Y + uy * len, a = Math.atan2(uy, ux);
    cx.beginPath();
    cx.moveTo(hx, hy);
    cx.lineTo(hx - Math.cos(a - .42) * 9, hy - Math.sin(a - .42) * 9);
    cx.lineTo(hx - Math.cos(a + .42) * 9, hy - Math.sin(a + .42) * 9);
    cx.closePath(); cx.fillStyle = "#FF4F00"; cx.fill();
  } else {
    /* genuinely flat — say so, because this is the decision the game is about */
    cx.fillStyle = "#FF4F00"; cx.font = "800 11px -apple-system,'Helvetica Neue',Arial,sans-serif";
    cx.textAlign = "left"; cx.fillText("NO SLOPE HERE", X + 16, Y - 14);
  }
  for (var i = 0; i < pulses.length; i++) {
    var p = pulses[i], k = p.t / .7;
    cx.globalAlpha = 1 - k; cx.strokeStyle = "#FF4F00"; cx.lineWidth = 1;
    cx.beginPath(); cx.arc(px(p.x), py(p.y), 8 + k * 70, 0, 7); cx.stroke();
    cx.globalAlpha = 1;
  }
  cx.beginPath(); cx.arc(X, Y, 5.5, 0, 7); cx.fillStyle = "#FF4F00"; cx.fill();
  cx.beginPath(); cx.arc(X, Y, 11 + heatFlash * 26, 0, 7);
  cx.strokeStyle = "rgba(255,79,0,.55)"; cx.lineWidth = 1; cx.stroke();
  if (!armed) {
    cx.strokeStyle = "rgba(255,79,0,.30)"; cx.lineWidth = 1;
    cx.beginPath(); cx.arc(X, Y, 20 + Math.sin(nowT * 3.4) * 5, 0, 7); cx.stroke();
  }
}

var last = 0;
function loop(t) {
  var dt = Math.min(.05, (t - last) / 1000 || 0); last = t;
  update(dt); draw(dt);
  requestAnimationFrame(loop);
}
/* Playable from this instant: no menu, no click gate. This is also exactly what
   the portal's automatic "first gameplay start" check looks for. */
newRun();
ev("play_start"); window.mnCg("start");
requestAnimationFrame(loop);
window.MN_READY = true;

var bm = document.getElementById("bmute");
bm.textContent = muted ? "\ud83d\udd07" : "\ud83d\udd0a";
bm.addEventListener("click", function () {
  muted = !muted;
  bm.textContent = muted ? "\ud83d\udd07" : "\ud83d\udd0a";
  try { localStorage.setItem("mnMute", muted ? "1" : "0"); } catch (e) {}
});
</script>
</body>
</html>
