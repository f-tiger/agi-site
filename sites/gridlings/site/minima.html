  /* Swiss: pure white ground, one sans family, one accent (International Orange),
     hairline rules as the only structure, tabular numerals as composition. */
  :root{--bg:#ffffff;--bg2:#f7f7f8;--ink:#111113;--mut:#6b6b70;
        --line:rgba(0,0,0,.12);--line2:rgba(0,0,0,.24);--acc:#FF4F00;}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,sans-serif;
    font-variant-numeric:tabular-nums;
    display:flex;flex-direction:column;align-items:center;min-height:100%;overflow:hidden;
    -webkit-user-select:none;user-select:none;touch-action:none;}
  header{width:100%;max-width:1280px;display:flex;align-items:flex-end;justify-content:space-between;
    gap:12px;padding:10px 14px 8px;border-bottom:1px solid var(--line);}
  .logo{font-weight:800;letter-spacing:2.5px;font-size:15px;line-height:1;}
  .logo em{font-style:normal;color:var(--acc);}
  .lvl{font-size:11px;font-weight:700;color:var(--mut);letter-spacing:1.2px;margin-top:5px;}
  .read{display:flex;align-items:flex-end;gap:14px;}
  .num{font-weight:800;font-size:30px;line-height:.9;letter-spacing:-.5px;}
  .tag{font-size:10px;font-weight:700;color:var(--mut);letter-spacing:1.2px;margin-bottom:3px;}
  .hbtn{background:none;border:1px solid var(--line);color:var(--mut);font:inherit;font-size:11px;
    font-weight:700;padding:7px 10px;cursor:pointer;letter-spacing:.6px;min-height:36px;}
  .hbtn:hover{border-color:var(--line2);color:var(--ink);}
  /* A <canvas> carries an intrinsic height from its width/height attributes, and a
   flex item defaults to min-height:auto -- so the canvas could GROW to fill the
   column but never SHRINK, and with body{overflow:hidden} everything below it
   (the controls) was pushed off a short viewport with no way to scroll to them.
   `flex:1 1 0` + `min-height:0` is what lets it shrink; layout() then resizes the
   backing store to whatever box it actually got. */
  #stage{flex:1 1 0;min-height:0;width:100%;max-width:1280px;display:block;cursor:crosshair;}
  .bar{width:100%;max-width:1280px;display:flex;align-items:center;gap:12px;
    padding:8px 14px;border-top:1px solid var(--line);}
  .meter{flex:1;min-width:60px;}
  .mrow{display:flex;justify-content:space-between;font-size:10px;font-weight:700;
    color:var(--mut);letter-spacing:1.2px;margin-bottom:5px;}
  .track{height:3px;background:var(--bg2);}
  .fill{height:100%;background:var(--ink);width:100%;}
  .heat{background:var(--acc);border:none;color:#fff;font:inherit;font-weight:800;font-size:13px;
    letter-spacing:1.4px;padding:0 18px;height:46px;min-width:126px;cursor:pointer;text-align:left;}
  .heat span{display:block;font-size:9.5px;font-weight:700;letter-spacing:.8px;opacity:.82;margin-top:1px;}
  .heat:disabled{background:var(--bg2);color:var(--mut);cursor:default;}
  footer{width:100%;max-width:1280px;padding:0 14px calc(9px + env(safe-area-inset-bottom));
    display:flex;justify-content:space-between;font-size:10.5px;color:var(--mut);}
  footer a{color:var(--mut);}
  #hint{position:fixed;inset:0;display:flex;align-items:flex-end;justify-content:flex-start;
    padding:0 0 96px 16px;pointer-events:none;transition:opacity .3s;z-index:20;}
  #hint.gone{opacity:0;}
  .hcard{background:#fff;border:1px solid var(--line);border-left:3px solid var(--acc);
    padding:14px 16px;max-width:340px;box-shadow:0 10px 30px rgba(0,0,0,.07);}
  .hcard p{font-size:12.5px;line-height:1.5;}
  .hcard .keys{margin-bottom:9px;}
  .hcard .go{margin-top:9px;font-size:10.5px;font-weight:800;letter-spacing:1.4px;color:var(--acc);}
  .modal{position:fixed;inset:0;background:rgba(255,255,255,.86);display:none;
    align-items:center;justify-content:flex-start;padding-left:max(16px,6vw);z-index:30;}
  .modal.show{display:flex;}
  .card{background:#fff;border:1px solid var(--line2);padding:22px 24px;max-width:380px;width:100%;
    box-shadow:0 18px 50px rgba(0,0,0,.12);}
  .card h2{font-size:15px;font-weight:800;letter-spacing:2px;}
  .card .big{font-size:46px;font-weight:800;letter-spacing:-1px;color:var(--acc);margin:6px 0 2px;line-height:1;}
  .card p{font-size:12px;color:var(--mut);line-height:1.55;}
  .btn{margin-top:16px;background:var(--acc);border:none;color:#fff;font:inherit;font-weight:800;
    font-size:13px;letter-spacing:1.4px;padding:12px 22px;cursor:pointer;}
  @media (max-width:640px){
    .num{font-size:25px;} .heat{min-width:104px;padding:0 13px;} .logo{font-size:13.5px;}
    .hcard{max-width:280px;} #hint{padding-bottom:88px;}
  }

  .marks{display:flex;gap:6px;margin:8px 0 6px;}
  .marks i{width:14px;height:14px;display:block;border:1px solid var(--line2);transition:background .25s,transform .3s cubic-bezier(.2,1.6,.4,1);transform:scale(.8);}
  .marks i.on{background:var(--acc);border-color:var(--acc);transform:scale(1);}
  .ribbon{display:inline-block;border:1px solid var(--ink);padding:3px 8px;font-size:10px;font-weight:800;letter-spacing:1.6px;margin-bottom:8px;opacity:0;transition:opacity .3s;}
  .ribbon.show{opacity:1;}
  .btn{border-bottom:4px solid #b83600!important;transition:transform .06s,border-bottom-width .06s;}
  .btn:active{transform:translateY(3px);border-bottom-width:1px!important;}
  .heat{border-bottom:4px solid #b83600;transition:transform .06s,border-bottom-width .06s;}
  .heat:active:not(:disabled){transform:translateY(3px);border-bottom-width:1px;}
  .heat:disabled{border-bottom-color:var(--line);}
  .dots{display:flex;gap:5px;margin-top:6px;}
  .dots i{width:7px;height:7px;border-radius:50%;border:1px solid var(--line2);display:block;}
  .dots i.done{background:var(--ink);border-color:var(--ink);}
  .dots i.cur{background:var(--acc);border-color:var(--acc);}
  #intro{position:fixed;left:16px;top:18%;z-index:45;pointer-events:none;background:#fff;border:1px solid var(--line2);
    border-left:3px solid var(--acc);padding:12px 16px;max-width:min(360px,80vw);opacity:0;transform:translateY(6px);transition:opacity .25s,transform .25s;
    box-shadow:0 10px 30px rgba(0,0,0,.07);}
  #intro.show{opacity:1;transform:none;}
  #intro .n{font-size:10.5px;font-weight:800;letter-spacing:1.6px;color:var(--mut);}
  #intro .t{font-size:17px;font-weight:800;margin-top:3px;line-height:1.25;}
  #fx{position:fixed;inset:0;z-index:35;pointer-events:none;}
  /* ---- deep art: a surveyor's field map (light, eye-free; the fleet's only paper game) ---- */
  :root{--bg:#f4f1ea;--paper:#fbfaf6;--display:'Rubik Mono One',Impact,'Arial Black',sans-serif;}
  body{background:var(--bg);}
  header{background:var(--paper);border-bottom:0;box-shadow:0 1px 0 var(--line),0 6px 18px rgba(20,22,28,.05);position:relative;z-index:2;}
  .logo{font-family:var(--display);font-weight:400;font-size:15px;letter-spacing:.5px;}
  .lvl{font-family:var(--display);font-weight:400;font-size:9.5px;letter-spacing:.6px;white-space:nowrap;}
  .num{font-family:var(--display);font-weight:400;font-size:26px;letter-spacing:0;}
  .read>div{min-width:64px;}
  .desc{width:100%;height:3px;background:var(--bg2);margin-top:6px;position:relative;overflow:hidden;}
  .desc i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--acc);transition:width .12s;}
  .bar{background:var(--paper);border-top:0;box-shadow:0 -1px 0 var(--line);position:relative;z-index:2;}
  .track{height:6px;background:repeating-linear-gradient(90deg,var(--bg2) 0 9px,rgba(0,0,0,.16) 9px 10px);}
  .mrow{font-family:var(--display);font-weight:400;font-size:9px;letter-spacing:.8px;}
  .heat{font-family:var(--display);font-weight:400;font-size:12px;letter-spacing:.5px;}
  .heat span{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,sans-serif;font-weight:700;}
  .card{border:1px solid var(--ink);outline:1px solid var(--ink);outline-offset:3px;background:var(--paper);}
  .card h2{font-family:var(--display);font-weight:400;font-size:13px;letter-spacing:1px;}
  .card .big{font-family:var(--display);font-weight:400;font-size:44px;letter-spacing:0;}
  .btn{font-family:var(--display);font-weight:400;font-size:12px;letter-spacing:.5px;}
  #intro{background:var(--paper);}
  #intro .n{font-family:var(--display);font-weight:400;font-size:9.5px;letter-spacing:1px;color:var(--acc);}
  .hcard{background:var(--paper);}
  .hcard .go{font-family:var(--display);font-weight:400;font-size:9.5px;letter-spacing:.8px;}
  .ribbon{font-family:var(--display);font-weight:400;font-size:9px;}
  @media (max-width:640px){ .num{font-size:22px;} .lvl{font-size:8px;letter-spacing:.3px;} .logo{font-size:13px;} }
</style>

<script>
"use strict";
/* ===== the landscape =====

  { note: "two basins — one of them is deeper", steps: 820, start: [.10, .86], g: [
      { x: .30, y: .30, a: -0.58, s: .17 },
      { x: .76, y: .62, a: -1.00, s: .20 } ] },
  { note: "a wide comfortable bowl, and a narrow deep well", steps: 2100, start: [.14, .20], g: [
      { x: .36, y: .56, a: -0.64, s: .30 },
      { x: .76, y: .28, a: -1.00, s: .14 } ] },
  { note: "the ridge lies to you", steps: 1400, start: [.09, .50], g: [
      { x: .26, y: .48, a: -0.56, s: .14 },
      { x: .47, y: .50, a: 0.46, s: .11 },
      { x: .70, y: .52, a: -1.00, s: .19 } ] },
  { note: "five dimples and one needle", steps: 1500, start: [.50, .09], g: [
      { x: .18, y: .32, a: -0.40, s: .13 }, { x: .44, y: .74, a: -0.42, s: .13 },
      { x: .74, y: .24, a: -0.38, s: .12 }, { x: .86, y: .76, a: -0.44, s: .13 },
      { x: .28, y: .86, a: -0.36, s: .11 },
      { x: .60, y: .46, a: -1.00, s: .085 } ] },
  { note: "the slope has all but vanished — the arrow will not save you here", steps: 1300, start: [.12, .84], g: [
      { x: .50, y: .50, a: -0.55, s: .62 },
      { x: .72, y: .27, a: -1.00, s: .075 } ] }

var GW = 161, GH = 121;              /* field sample grid, corners, normalised */
var cv = document.getElementById("stage"), cx = cv.getContext("2d");

var running, over, won, armed, armT, nowT, score, best = 0, heatFlash, pulses;

function fieldAt(x, y) {

function stampCell(i, j) {

    else if (s === 3 || s === 12) seg = [lft, rgt];
    else if (s === 4 || s === 11) seg = [rgt, bot];
    else if (s === 6 || s === 9) seg = [top, bot];
    else if (s === 7 || s === 8) seg = [lft, bot];

  if (!armed) { armT += dt; if (armT > 7) armIt(); }
  if (jump) {                           /* airborne: the pin lands before you can walk again */
    jump.t += dt;
    if (jump.t >= .45) { jump = null; pulses.push({ x: probe.x, y: probe.y, t: 0 }); sfx.land(); }
    else return;
  }
  var sx = 0, sy = 0;
  var kx = (keys.r ? 1 : 0) - (keys.l ? 1 : 0), ky = (keys.d ? 1 : 0) - (keys.u ? 1 : 0);
  if (kx !== 0 || ky !== 0) {
    var km = Math.hypot(kx, ky);              /* never 0 here: guarded above */
    sx = kx / km; sy = ky / km;
  } else if (ptr.on) {
    var dx = ptr.x - probe.x, dy = ptr.y - probe.y, dm = Math.hypot(dx, dy);
    if (dm > 0.004) { sx = dx / dm; sy = dy / dm; }
  }
  if (sx !== 0 || sy !== 0) {
    var move = SPEED * dt;
    probe.x = Math.max(0, Math.min(1, probe.x + sx * move));
    probe.y = Math.max(0, Math.min(1, probe.y + sy * move));
    steps -= move * 1000;
    walked += move; if (walked > .05) { walked = 0; sfx.step(); }
    var tl = trail[trail.length - 1];
    if (Math.hypot(probe.x - tl[0], probe.y - tl[1]) > .01) { trail.push([probe.x, probe.y]); if (trail.length > 600) trail.shift(); }
    reveal(probe.x, probe.y, 1);
    if (steps <= 0) { steps = 0; return endRun(false); }
  }
  if (heatFlash > 0) heatFlash = Math.max(0, heatFlash - dt);
  for (var i = pulses.length - 1; i >= 0; i--) { pulses[i].t += dt; if (pulses[i].t > .7) pulses.splice(i, 1); }
  if (fieldAt(probe.x, probe.y) <= target) return endRun(true);
  hud();
}
function endRun(didWin) {
  over = true; won = didWin;
  var d = document.getElementById("mdone");
  if (didWin) {
    var left = Math.max(0, Math.round(steps));
    var gained = 100 + Math.floor(left / 5);
    score += gained; sfx.win(); window.mnCg("happy");
    var isBest = score > best;
    if (isBest) { best = score; try { localStorage.setItem("mnBest", String(best)); } catch (e) {} }
    cleared = Math.max(cleared, lvl + 1); drawDots();
    /* marks: how much of the budget was left -- half or more is a clean descent */
    var frac = left / maxSteps; setMarks(frac >= .5 ? 3 : frac >= .25 ? 2 : 1);
    document.getElementById("drib").classList.toggle("show", isBest && lvl > 0);
    squareBurst(46);
    document.getElementById("dt").textContent = "MINIMUM FOUND";
    countUp(document.getElementById("ds"), gained);
    document.getElementById("dp").innerHTML = left + " steps left of " + maxSteps +
      "<br>Total " + score + " · best " + best;
    document.getElementById("bnext").textContent = lvl + 1 < LEVELS.length ? "Next" : "Play again";
    dead = false;
    ev("game_over", "mn:win:" + lvl);
  } else {
    sfx.fail(); dead = true; window.mnCg("stop");
    setMarks(0); document.getElementById("drib").classList.remove("show"); countEl = null;
    document.getElementById("dt").textContent = "OUT OF STEPS";
    document.getElementById("ds").textContent = fmt(fieldAt(probe.x, probe.y));
    document.getElementById("dp").innerHTML = "You needed " + fmt(target) +
      ".<br>The bottom you were standing in was not the bottom.";
    document.getElementById("bnext").textContent = "Try again";
    ev("game_over", "mn:dead:" + lvl);
  }
  d.classList.add("show");
  hud();
}
/* LOSS is shown as a plain positive depth so that "smaller is better" needs no
   explaining: the field is negative, the readout is its magnitude x100. */
function fmt(v) { return Math.round(-v * 100); }
function hud() {
  document.getElementById("hlvl").textContent = "LEVEL " + (lvl + 1) + " / " + LEVELS.length;
  document.getElementById("hloss").textContent = fmt(fieldAt(probe.x, probe.y));
  document.getElementById("htar").textContent = fmt(target);
  var s = Math.max(0, Math.round(steps));
  document.getElementById("hsteps").textContent = s;
  document.getElementById("hfill").style.width = (maxSteps ? (s / maxSteps) * 100 : 0) + "%";
  var dv = fieldAt(probe.x, probe.y), dd = Math.max(0, Math.min(1, (loss0 - dv) / Math.max(1e-6, loss0 - target)));
  document.getElementById("hdesc").style.width = (dd * 100) + "%";
  var hb = document.getElementById("bheat");
  hb.disabled = over || s < HEAT_COST;
  document.getElementById("hcost").textContent = "costs " + HEAT_COST + " steps";
}

/* ===== draw: paper, painted terrain, ink contours, boot trail, survey pin ===== */
var paperPat = null, bgC = document.createElement("canvas"), bgx = bgC.getContext("2d"), tintBig = document.createElement("canvas"), tbx = tintBig.getContext("2d"), bgDirty = true;
function makePaper() {
  var c = document.createElement("canvas"); c.width = c.height = 96; var g = c.getContext("2d");
  for (var i = 0; i < 240; i++) { g.fillStyle = "rgba(20,22,28," + (0.02 + Math.random() * 0.035) + ")"; g.fillRect(Math.random() * 96, Math.random() * 96, 1 + Math.random() * 1.5, 1); }
  paperPat = cx.createPattern(c, "repeat");
}
function drawPin(X, Y, lift, flat) {
  /* shadow stays on the ground while the pin is in the air */
  cx.fillStyle = "rgba(20,22,28," + (0.2 - lift * .0015) + ")";
  cx.beginPath(); cx.ellipse(X, Y + 1.5, 7 + lift * .08, 3 + lift * .03, 0, 0, 7); cx.fill();
  cx.save(); cx.translate(X, Y - lift);
  var bob = flat ? 0 : Math.sin(nowT * 5) * .8;
  cx.translate(0, bob);
  var g = cx.createLinearGradient(-9, -24, 9, -6); g.addColorStop(0, "#ff7a3d"); g.addColorStop(1, "#e03f00");
  cx.fillStyle = g; cx.strokeStyle = "#14161c"; cx.lineWidth = 1.8; cx.lineJoin = "round";
  cx.beginPath(); cx.arc(0, -15, 8.6, Math.PI * .78, Math.PI * .22); cx.lineTo(0, 0); cx.closePath(); cx.fill(); cx.stroke();
  cx.fillStyle = "#fff"; cx.beginPath(); cx.arc(0, -15, 3.2, 0, 7); cx.fill();
  cx.fillStyle = "rgba(255,255,255,.45)"; cx.beginPath(); cx.arc(-3.5, -19, 2, 0, 7); cx.fill();
  cx.restore();
}
function draw(dt) {
  /* Three cached layers, blitted 1:1. Composing paper + dots and upscaling the
     tint every frame made the frame rate drop enough to skew the real-time
     verifier; now each is rebuilt only when it actually changes. */
  if (bgDirty) {
    var dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    bgC.width = cv.width; bgC.height = cv.height; bgx.setTransform(dpr, 0, 0, dpr, 0, 0);
    bgx.fillStyle = "#f4f1ea"; bgx.fillRect(0, 0, L.w, L.h);
    if (!paperPat) makePaper();
    bgx.fillStyle = bgx.createPattern(paperPat ? (function () { var c = document.createElement("canvas"); c.width = c.height = 96; var g = c.getContext("2d");
      for (var i = 0; i < 240; i++) { g.fillStyle = "rgba(20,22,28," + (0.02 + Math.random() * 0.035) + ")"; g.fillRect(Math.random() * 96, Math.random() * 96, 1 + Math.random() * 1.5, 1); } return c; })() : cv, "repeat");
    bgx.fillRect(0, 0, L.w, L.h);
    bgx.fillStyle = "rgba(20,22,28,.10)";
    for (var gx = 20; gx < L.w; gx += 40) for (var gy = 20; gy < L.h; gy += 40) bgx.fillRect(gx, gy, 1.2, 1.2);
    tintBig.width = cv.width; tintBig.height = cv.height; tbx.setTransform(dpr, 0, 0, dpr, 0, 0);
    bgDirty = false; tintDirty = true;
  }
  cx.drawImage(bgC, 0, 0, L.w, L.h);
  /* painted terrain under the ink */
  if (tImg) {
    if (tintDirty) { tcx.putImageData(tImg, 0, 0); tbx.clearRect(0, 0, L.w, L.h); tbx.imageSmoothingEnabled = true; tbx.drawImage(tintC, 0, 0, L.w, L.h); tintDirty = false; }
    cx.drawImage(tintBig, 0, 0, L.w, L.h);
  }
  cx.drawImage(mapC, 0, 0, L.w, L.h);
  /* boot trail: where you have been, dashed ink */
  if (trail.length > 1) {
    cx.strokeStyle = "rgba(20,22,28,.5)"; cx.lineWidth = 1.3; cx.setLineDash([3, 5]); cx.lineCap = "round";
    cx.beginPath(); cx.moveTo(px(trail[0][0]), py(trail[0][1]));
    for (var ti = 1; ti < trail.length; ti++) cx.lineTo(px(trail[ti][0]), py(trail[ti][1]));
    cx.stroke(); cx.setLineDash([]);
  }
  /* the pin: mid-jump it flies an arc from where HEAT was pressed */
  var jx = probe.x, jy = probe.y, lift = 0;
  if (jump) { var k = Math.min(1, jump.t / .45), e = k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
    jx = jump.x0 + (probe.x - jump.x0) * e; jy = jump.y0 + (probe.y - jump.y0) * e; lift = Math.sin(k * Math.PI) * 64; }
  var X = px(jx), Y = py(jy);
  /* the slope reading: gradient in field space, converted to screen space,
     because the field is normalised and the viewport rarely is square */
  var g = gradAt(probe.x, probe.y);
  var vx = -g[0] / L.w, vy = -g[1] / L.h, vm = Math.hypot(vx, vy), flat = false;
  if (!jump) {
    if (vm > 1e-9) {
      var ux = vx / vm, uy = vy / vm;
      var len = Math.min(96, 26 + vm * L.w * L.h * 0.0016), a = Math.atan2(uy, ux);
      /* a faint fan says how steep; the needle says which way */
      cx.fillStyle = "rgba(255,79,0,.10)"; cx.beginPath(); cx.moveTo(X, Y);
      cx.arc(X, Y, len + 10, a - .33, a + .33); cx.closePath(); cx.fill();
      cx.strokeStyle = "#FF4F00"; cx.lineWidth = 2.2; cx.lineCap = "round";
      cx.beginPath(); cx.moveTo(X, Y); cx.lineTo(X + ux * len, Y + uy * len); cx.stroke();
      var hx = X + ux * len, hy = Y + uy * len;
      cx.beginPath(); cx.moveTo(hx + Math.cos(a) * 4, hy + Math.sin(a) * 4);
      cx.lineTo(hx - Math.cos(a - .5) * 10, hy - Math.sin(a - .5) * 10);
      cx.lineTo(hx - Math.cos(a + .5) * 10, hy - Math.sin(a + .5) * 10);
      cx.closePath(); cx.fillStyle = "#FF4F00"; cx.fill(); cx.strokeStyle = "#14161c"; cx.lineWidth = 1; cx.stroke();
    } else {
      /* genuinely flat — say so, because this is the decision the game is about */
      flat = true;
      cx.fillStyle = "#14161c"; cx.fillRect(X + 14, Y - 26, 104, 18);
      cx.fillStyle = "#fff"; cx.font = "400 9px 'Rubik Mono One',Impact,sans-serif"; cx.textAlign = "left"; cx.textBaseline = "middle";
      cx.fillText("NO SLOPE HERE", X + 20, Y - 17); cx.textBaseline = "alphabetic";
    }
  }
  for (var i = 0; i < pulses.length; i++) {
    var p = pulses[i], k2 = p.t / .7;
    cx.globalAlpha = 1 - k2; cx.strokeStyle = "#FF4F00"; cx.lineWidth = 2 - k2;
    cx.beginPath(); cx.arc(px(p.x), py(p.y), 8 + k2 * 70, 0, 7); cx.stroke();
    cx.lineWidth = 1; cx.beginPath(); cx.arc(px(p.x), py(p.y), 4 + k2 * 40, 0, 7); cx.stroke();
    cx.globalAlpha = 1;
  }
  if (!armed) {
    cx.strokeStyle = "rgba(255,79,0,.35)"; cx.lineWidth = 1.2;
    cx.beginPath(); cx.arc(X, Y, 22 + Math.sin(nowT * 3.4) * 5, 0, 7); cx.stroke();
  }
  drawPin(X, Y, lift, flat);
}

var last = 0;
function loop(t) {
  var dt = Math.min(.05, (t - last) / 1000 || 0); last = t;
  update(dt); draw(dt);
  requestAnimationFrame(loop);
}
/* Playable from this instant: no menu, no click gate. This is also exactly what
   the portal's automatic "first gameplay start" check looks for. */
newRun();
ev("play_start"); window.mnCg("start");
requestAnimationFrame(loop);
window.MN_READY = true;

var bm = document.getElementById("bmute");
bm.textContent = muted ? "\ud83d\udd07" : "\ud83d\udd0a";
bm.addEventListener("click", function () {
  muted = !muted;
  bm.textContent = muted ? "\ud83d\udd07" : "\ud83d\udd0a";
  try { localStorage.setItem("mnMute", muted ? "1" : "0"); } catch (e) {}
});

/* ===== juice, Swiss edition ===== */
var fxc = document.getElementById("fx"), fxx = fxc.getContext("2d"), bits = [], introT = 0, countT = 0, countTo = 0, countEl = null, cleared = 0;
function fxLayout() { var dpr = Math.min(window.devicePixelRatio || 1, 2); fxc.width = innerWidth * dpr; fxc.height = innerHeight * dpr; fxx.setTransform(dpr, 0, 0, dpr, 0, 0); }
function squareBurst(n) {
  fxLayout(); var r = cv.getBoundingClientRect(), x0 = r.left + px(probe.x), y0 = r.top + py(probe.y);
  for (var i = 0; i < n; i++) { var a = Math.random() * 7, sp = 160 + Math.random() * 420;
    bits.push({ x: x0, y: y0, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 120, r: 3 + Math.random() * 4, t: 0, life: 1.1 + Math.random() * .6, ro: Math.random() * 7, vr: (Math.random() - .5) * 10 }); }
}
function fxStep(dt) {
  if (!bits.length) { if (fxc.width) fxx.clearRect(0, 0, innerWidth, innerHeight); return; }
  fxx.clearRect(0, 0, innerWidth, innerHeight);
  for (var i = bits.length - 1; i >= 0; i--) { var b = bits[i]; b.t += dt; if (b.t > b.life) { bits.splice(i, 1); continue; }
    b.vy += 700 * dt; b.x += b.vx * dt; b.y += b.vy * dt; b.ro += b.vr * dt;
    fxx.save(); fxx.translate(b.x, b.y); fxx.rotate(b.ro); fxx.globalAlpha = Math.min(1, (b.life - b.t) * 1.6);
    fxx.fillStyle = "#FF4F00"; fxx.fillRect(-b.r, -b.r, b.r * 2, b.r * 2); fxx.restore(); }
}
function setMarks(n) {
  var el = document.getElementById("dmarks"); el.innerHTML = "<i></i><i></i><i></i>";
  var is = el.querySelectorAll("i");
  for (var k = 0; k < n; k++) (function (k) { setTimeout(function () { is[k].classList.add("on"); sfx.tick(); }, 450 + k * 200); })(k);
}
function countUp(el, to) { countEl = el; countTo = to; countT = 0; el.textContent = "+0"; }
function showIntro() {
  var el = document.getElementById("intro");
  document.getElementById("in").textContent = "LEVEL " + (lvl + 1) + " / " + LEVELS.length;
  document.getElementById("it").textContent = LEVELS[lvl].note;
  el.classList.add("show"); introT = 1.6;
  var hh = document.getElementById("hint"); if (hh && !armed) hh.classList.add("gone");
}
function drawDots() {
  var d = document.getElementById("dots"), h = "";
  for (var i = 0; i < LEVELS.length; i++) h += "<i class='" + (i < cleared ? "done" : i === lvl ? "cur" : "") + "'></i>";
  d.innerHTML = h;
}
function juiceTick(dt) {
  if (introT > 0) { introT -= dt; if (introT <= 0) { document.getElementById("intro").classList.remove("show");
    var hh = document.getElementById("hint"); if (hh && !armed) hh.classList.remove("gone"); } }
  if (countEl) { countT = Math.min(1, countT + dt / .7); var e = 1 - Math.pow(1 - countT, 3);
    countEl.textContent = "+" + Math.round(countTo * e); if (countT >= 1) countEl = null; }
  fxStep(dt);
}
window.addEventListener("resize", fxLayout);
</script>
</body>
