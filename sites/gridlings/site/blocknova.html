<script>
"use strict";
/* ================= CrazyGames bridge (inline; active only with ?cg=1, GL_CG, or CG referrer) */
(function () {
  var on = window.GL_CG === true || /(^|[?&])cg=1/.test(location.search);
  if (!on) { try { on = /crazygames\./.test(document.referrer); } catch (e) {} }
  window.GL_CG = on;
  var q = [];
  window.bnCg = function (ev) { if (on) q.push(ev); };
  window.bnAd = function (done) { done(); };
  if (!on) return;
  document.documentElement.classList.add("cg");
  if (/[?&]muteAudio=true/.test(location.search)) window.GL_SDK_MUTE = true;
  var s = document.createElement("script");
  s.src = "https://sdk.crazygames.com/crazygames-sdk-v3.js";
  s.async = true;
  s.onload = function () {
    try {
      window.CrazyGames.SDK.init().then(function () {
        var g = window.CrazyGames.SDK.game;
        try {
          var st = g.settings;
          if (st && typeof st.muteAudio === "boolean") window.GL_SDK_MUTE = st.muteAudio;
          g.addSettingsChangeListener(function (st2) {
            if (st2 && typeof st2.muteAudio === "boolean") window.GL_SDK_MUTE = st2.muteAudio;
          });
        } catch (e) {}
        try { g.loadingStart(); } catch (e) {}
        try { g.loadingStop(); } catch (e) {}
        window.bnCg = function (ev) {
          try {
            if (ev === "start") g.gameplayStart();
            else if (ev === "stop") g.gameplayStop();
            else if (ev === "happy") g.happytime();
          } catch (e) {}
        };
        var seen = q.splice(0);
        for (var i = 0; i < seen.length; i++) window.bnCg(seen[i]);
        window.bnAd = function (done) {
          var fin = false;
          var end = function () { if (!fin) { fin = true; done(); } };
          try {
            window.CrazyGames.SDK.ad.requestAd("midgame", { adFinished: end, adError: end, adStarted: function () {} });
            setTimeout(end, 20000);
          } catch (e) { end(); }
        };
      }).catch(function () {});
    } catch (e) {}
  };
  document.head.appendChild(s);
})();

/* ================= analytics beacon (first-party D1 via the gridlings worker; fails silently) */
function ev(n, l) {
  try {
    var d = JSON.stringify({ n: n, l: l || "bn", p: "/blocknova" });
    var u = "https://play.agiscorecard.com/e";  // absolute: the CG upload runs on their origin
    if (navigator.sendBeacon) navigator.sendBeacon(u, new Blob([d], { type: "application/json" }));
    else fetch(u, { method: "POST", body: d, keepalive: true, mode: "cors" }).catch(function () {});
  } catch (e) {}
}

/* ================= audio: tiny WebAudio synth, no assets */
var AC = null, muted = false;
try { muted = localStorage.getItem("bnMute") === "1"; } catch (e) {}
function ac() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (AC && AC.state === "suspended") { try { AC.resume(); } catch (e) {} }
  return AC;
}
function tone(f, t0, dur, type, gain) {
  var a = ac(); if (!a || muted || window.GL_SDK_MUTE) return;
  try {
    var o = a.createOscillator(), g = a.createGain();
    o.type = type || "sine"; o.frequency.value = f;
    g.gain.setValueAtTime(0, a.currentTime + t0);
    g.gain.linearRampToValueAtTime(gain || 0.12, a.currentTime + t0 + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + t0 + dur);
    o.connect(g); g.connect(a.destination);
    o.start(a.currentTime + t0); o.stop(a.currentTime + t0 + dur + 0.02);
  } catch (e) {}
}
function sfxPlace() { tone(220, 0, 0.06, "triangle", 0.10); }
function sfxPick()  { tone(330, 0, 0.05, "sine", 0.06); }
function sfxBad()   { tone(110, 0, 0.09, "sawtooth", 0.05); }
function sfxClear(combo, lines) {
  var base = 392 * Math.pow(1.122, Math.min(combo, 8));
  for (var i = 0; i < Math.min(lines + 1, 4); i++) tone(base * Math.pow(1.26, i), i * 0.055, 0.16, "triangle", 0.12);
}
function sfxNova() {
  var a = ac(); if (!a || muted || window.GL_SDK_MUTE) return;
  try {
    var n = a.createBufferSource(), buf = a.createBuffer(1, a.sampleRate * 0.4, a.sampleRate), d = buf.getChannelData(0);
    for (var i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 2);
    var f = a.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = 900;
    var g = a.createGain(); g.gain.value = 0.35;
    n.buffer = buf; n.connect(f); f.connect(g); g.connect(a.destination); n.start();
    tone(98, 0, 0.35, "sine", 0.22);
  } catch (e) {}
}
function sfxOver() { tone(392, 0, 0.18, "sine", 0.1); tone(311, 0.16, 0.18, "sine", 0.1); tone(233, 0.32, 0.3, "sine", 0.1); }

/* ================= game state */
var N = 8;
var grid;                      // N*N ints: 0 empty, else color index+1
var tray;                      // [{shape, hue, x,y,w,h, used, novaPiece}] up to 3
var score, best = 0, combo, novaMeter, novaReady, over, started;
var drag = null;               // {pi, px, py, ox, oy}
var parts = [], pops = [], clearing = [];  // particles, text popups, clearing cell anims
var shake = 0, meterFlash = 0;
try { best = parseInt(localStorage.getItem("bnBest") || "0", 10) || 0; } catch (e) {}

var HUES = [252, 200, 160, 32, 340, 275, 130];
var SHAPES = [
  { c: [[0,0]], w: 3 },
  { c: [[0,0],[1,0]], w: 3 }, { c: [[0,0],[0,1]], w: 3 },
  { c: [[0,0],[1,0],[2,0]], w: 4 }, { c: [[0,0],[0,1],[0,2]], w: 4 },
  { c: [[0,0],[1,0],[0,1]], w: 3 }, { c: [[0,0],[1,0],[1,1]], w: 3 },
  { c: [[0,0],[0,1],[1,1]], w: 3 }, { c: [[1,0],[0,1],[1,1]], w: 3 },
  { c: [[0,0],[1,0],[2,0],[3,0]], w: 3 }, { c: [[0,0],[0,1],[0,2],[0,3]], w: 3 },
  { c: [[0,0],[1,0],[0,1],[1,1]], w: 4 },
  { c: [[0,0],[1,0],[2,0],[0,1]], w: 2 }, { c: [[0,0],[1,0],[2,0],[2,1]], w: 2 },
  { c: [[0,0],[0,1],[1,1],[2,1]], w: 2 }, { c: [[2,0],[0,1],[1,1],[2,1]], w: 2 },
  { c: [[0,0],[1,0],[2,0],[1,1]], w: 2 }, { c: [[1,0],[0,1],[1,1],[2,1]], w: 2 },
  { c: [[0,0],[1,0],[2,0],[3,0],[4,0]], w: 2 }, { c: [[0,0],[0,1],[0,2],[0,3],[0,4]], w: 2 },
  { c: [[0,0],[1,0],[0,1],[1,1],[0,2],[1,2]], w: 2 }, { c: [[0,0],[1,0],[2,0],[0,1],[1,1],[2,1]], w: 2 },
  { c: [[0,0],[1,0],[2,0],[0,1],[1,1],[2,1],[0,2],[1,2],[2,2]], w: 1 },
  { c: [[0,0],[0,1],[0,2],[1,2],[2,2]], w: 1 }, { c: [[0,0],[1,0],[2,0],[0,1],[0,2]], w: 1 }
];
var BAG = [];
SHAPES.forEach(function (s, i) { for (var k = 0; k < s.w; k++) BAG.push(i); });

function shapeDims(c) {
  var mw = 0, mh = 0;
  for (var i = 0; i < c.length; i++) { if (c[i][0] > mw) mw = c[i][0]; if (c[i][1] > mh) mh = c[i][1]; }
  return { w: mw + 1, h: mh + 1 };
}
function canPlaceAt(cells, gx, gy) {
  for (var i = 0; i < cells.length; i++) {
    var x = gx + cells[i][0], y = gy + cells[i][1];
    if (x < 0 || y < 0 || x >= N || y >= N || grid[y * N + x]) return false;
  }
  return true;
}
function anyFit(cells) {
  for (var y = 0; y < N; y++) for (var x = 0; x < N; x++) if (canPlaceAt(cells, x, y)) return true;
  return false;
}
function refillTray() {
  for (var attempt = 0; attempt < 40; attempt++) {
    var t = [];
    for (var i = 0; i < 3; i++) {
      var si = BAG[Math.floor(Math.random() * BAG.length)];
      t.push({ shape: SHAPES[si].c, hue: HUES[Math.floor(Math.random() * HUES.length)], used: false, novaPiece: false });
    }
    for (var j = 0; j < 3; j++) if (anyFit(t[j].shape)) { tray = t; armNova(); return; }
  }
  tray = [
    { shape: SHAPES[0].c, hue: HUES[0], used: false, novaPiece: false },
    { shape: SHAPES[1].c, hue: HUES[1], used: false, novaPiece: false },
    { shape: SHAPES[3].c, hue: HUES[3], used: false, novaPiece: false }
  ];
  armNova();
}
function armNova() {
  if (!novaReady || !tray) return;
  for (var i = 0; i < tray.length; i++) if (!tray[i].used) { tray[i].novaPiece = true; return; }
}
function reset(replay) {
  grid = new Array(N * N).fill(0);
  score = 0; combo = 0; novaMeter = 0; novaReady = false; over = false; started = false;
  parts = []; pops = []; clearing = []; drag = null; shake = 0;
  refillTray();
  document.getElementById("ovl").classList.remove("show");
  ev(replay ? "play_again" : "play_start");
  window.bnCg("start");
}

/* ================= layout / canvas */
var cv = document.getElementById("stage"), cx = cv.getContext("2d");
var L = {};   // layout: board origin/cell size, tray slots
function layout() {
  var dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  var w = Math.min(window.innerWidth, 520);
  var h = cv.parentElement === document.body ? cv.getBoundingClientRect().height : 400;
  h = Math.max(h, 380);
  cv.style.width = w + "px"; cv.style.height = h + "px";
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  cx.setTransform(dpr, 0, 0, dpr, 0, 0);
  var hud = 56, meterH = 26, trayH = Math.max(96, h * 0.20), pad = 12;
  var cell = Math.floor(Math.min((w - pad * 2) / N, (h - hud - meterH - trayH - pad * 3) / N));
  var bw = cell * N;
  L = { w: w, h: h, cell: cell, bx: (w - bw) / 2, by: hud + meterH + 8, hud: hud, meterH: meterH,
        trayY: hud + meterH + 8 + bw + 10, trayH: trayH, slotW: (w - pad * 2) / 3, pad: pad };
  // vertically centre the play column on tall viewports (desktop QA plays 16:9)
  var used = L.trayY + L.trayH + 8;
  var yoff = Math.max(0, (h - used) / 2);
  L.by += yoff; L.trayY += yoff; L.hud += yoff;
}
window.addEventListener("resize", function () { layout(); });

/* ================= scoring / clears */
function collectFull() {
  var rows = [], cols = [];
  for (var y = 0; y < N; y++) { var full = true; for (var x = 0; x < N; x++) if (!grid[y * N + x]) { full = false; break; } if (full) rows.push(y); }
  for (var x2 = 0; x2 < N; x2++) { var f2 = true; for (var y2 = 0; y2 < N; y2++) if (!grid[y2 * N + x2]) { f2 = false; break; } if (f2) cols.push(x2); }
  return { rows: rows, cols: cols };
}
function cellCenter(x, y) { return { x: L.bx + x * L.cell + L.cell / 2, y: L.by + y * L.cell + L.cell / 2 }; }
function burst(x, y, hue, n) {
  for (var i = 0; i < n; i++) {
    var a = Math.random() * Math.PI * 2, sp = 60 + Math.random() * 240;
    parts.push({ x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 60, life: 0.55 + Math.random() * 0.4, t: 0, hue: hue, r: 2 + Math.random() * 3 });
  }
}
function popText(txt, x, y, size, hue) { pops.push({ txt: txt, x: x, y: y, t: 0, life: 0.9, size: size || 22, hue: hue == null ? 252 : hue }); }
function applyClears(novaCells) {
  var f = collectFull();
  var lines = f.rows.length + f.cols.length;
  var clearedSet = {};
  f.rows.forEach(function (y) { for (var x = 0; x < N; x++) clearedSet[y * N + x] = 1; });
  f.cols.forEach(function (x) { for (var y = 0; y < N; y++) clearedSet[y * N + x] = 1; });
  if (novaCells) novaCells.forEach(function (i) { if (grid[i]) clearedSet[i] = 1; });
  var cleared = Object.keys(clearedSet);
  if (!cleared.length) { if (lines === 0 && !novaCells) combo = 0; return 0; }
  cleared.forEach(function (k) {
    var i = +k, x = i % N, y = (i / N) | 0, hue = HUES[(grid[i] - 1) % HUES.length];
    var c = cellCenter(x, y);
    clearing.push({ x: x, y: y, hue: hue, t: 0, life: 0.28 });
    burst(c.x, c.y, hue, 6);
    grid[i] = 0;
  });
  if (lines > 0) {
    combo++;
    var gained = lines * 10 * lines + combo * 10;
    score += gained;
    novaMeter = Math.min(6, novaMeter + lines);
    if (novaMeter >= 6 && !novaReady) { novaReady = true; meterFlash = 1; armNova(); popText("NOVA READY!", L.w / 2, L.by - 12, 24, 340); }
    var mid = cellCenter(4, f.rows.length ? f.rows[0] : 4);
    popText("+" + gained + (combo > 1 ? "  combo ×" + combo : ""), mid.x, mid.y, 22 + Math.min(combo * 2, 12), 252);
    sfxClear(combo, lines);
    shake = Math.min(6, 2 + lines * 1.5);
    if (lines >= 2 || combo >= 4) window.bnCg("happy");
  }
  return lines;
}
function detonate(gx, gy, dims, cells) {
  var cxr = gx + Math.floor((dims.w - 1) / 2), cyr = gy + Math.floor((dims.h - 1) / 2);
  var hit = [];
  for (var dy = -1; dy <= 1; dy++) for (var dx = -1; dx <= 1; dx++) {
    var x = cxr + dx, y = cyr + dy;
    if (x >= 0 && y >= 0 && x < N && y < N) hit.push(y * N + x);
  }
  var c = cellCenter(cxr, cyr);
  burst(c.x, c.y, 340, 60);
  popText("NOVA!", c.x, c.y - 10, 30, 340);
  sfxNova();
  shake = 9;
  window.bnCg("happy");
  score += 40;
  return hit;
}
function checkOver() {
  for (var i = 0; i < tray.length; i++) if (!tray[i].used && anyFit(tray[i].shape)) return false;
  return true;
}
function endGame() {
  over = true;
  window.bnCg("stop");
  sfxOver();
  ev("game_over", "bn:" + score);
  if (score > best) { best = score; try { localStorage.setItem("bnBest", String(best)); } catch (e) {} }
  document.getElementById("ovscore").textContent = score;
  document.getElementById("ovbest").textContent = "Best: " + best;
  setTimeout(function () { document.getElementById("ovl").classList.add("show"); }, 450);
}

/* ================= input */
function evtPos(e) {
  var r = cv.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}
function trayHit(p) {
  for (var i = 0; i < tray.length; i++) {
    if (tray[i].used) continue;
    var sx = L.pad + i * L.slotW, sy = L.trayY;
    if (p.x >= sx && p.x <= sx + L.slotW && p.y >= sy - 8 && p.y <= sy + L.trayH) return i;
  }
  return -1;
}
cv.addEventListener("pointerdown", function (e) {
  if (over) return;
  ac();
  var p = evtPos(e);
  var i = trayHit(p);
  if (i < 0) return;
  if (!started) { started = true; }
  var dims = shapeDims(tray[i].shape);
  drag = { pi: i, px: p.x, py: p.y, dims: dims, touch: e.pointerType !== "mouse" };
  sfxPick();
  try { cv.setPointerCapture(e.pointerId); } catch (err) {}
  e.preventDefault();
}, { passive: false });
cv.addEventListener("pointermove", function (e) {
  if (!drag) return;
  var p = evtPos(e);
  drag.px = p.x; drag.py = p.y;
  e.preventDefault();
}, { passive: false });
function dragTarget() {
  if (!drag) return null;
  var pc = L.cell * Math.min(1.05, 1);
  var lift = drag.touch ? 70 : 24;
  var w = drag.dims.w * pc, h = drag.dims.h * pc;
  var left = drag.px - w / 2, top = drag.py - lift - h;
  var gx = Math.round((left - L.bx) / L.cell), gy = Math.round((top - L.by) / L.cell);
  return { gx: gx, gy: gy, left: left, top: top, pc: pc };
}
cv.addEventListener("pointerup", function (e) {
  if (!drag) return;
  var t = dragTarget(), piece = tray[drag.pi];
  var placed = false;
  if (t && canPlaceAt(piece.shape, t.gx, t.gy)) {
    var ci = 1 + HUES.indexOf(piece.hue);
    piece.shape.forEach(function (c) { grid[(t.gy + c[1]) * N + (t.gx + c[0])] = ci; });
    score += piece.shape.length;
    piece.used = true;
    sfxPlace();
    var novaCells = null;
    if (piece.novaPiece) { novaCells = detonate(t.gx, t.gy, drag.dims, piece.shape); novaMeter = 0; novaReady = false; }
    applyClears(novaCells);
    placed = true;
  } else if (t && t.gy > -2 && t.gx > -3 && t.gx < N + 2) {
    sfxBad();
  }
  drag = null;
  if (placed) {
    var allUsed = tray.every(function (x) { return x.used; });
    if (allUsed) refillTray();
    if (checkOver()) endGame();
  }
  e.preventDefault();
}, { passive: false });
cv.addEventListener("pointercancel", function () { drag = null; });

/* ================= drawing */
function rrect(x, y, w, h, r) {
  cx.beginPath();
  cx.moveTo(x + r, y);
  cx.arcTo(x + w, y, x + w, y + h, r);
  cx.arcTo(x + w, y + h, x, y + h, r);
  cx.arcTo(x, y + h, x, y, r);
  cx.arcTo(x, y, x + w, y, r);
  cx.closePath();
}
function blockFill(x, y, s, hue, ghost, novaGlow) {
  var g = cx.createLinearGradient(x, y, x, y + s);
  if (ghost) {
    cx.fillStyle = "hsla(" + hue + ",80%,70%,.25)";
  } else {
    g.addColorStop(0, "hsl(" + hue + ",78%,66%)");
    g.addColorStop(1, "hsl(" + hue + ",72%,48%)");
    cx.fillStyle = g;
  }
  rrect(x + 1, y + 1, s - 2, s - 2, Math.max(3, s * 0.18));
  if (novaGlow) { cx.shadowColor = "hsla(340,100%,65%,.9)"; cx.shadowBlur = 14; }
  cx.fill();
  cx.shadowBlur = 0;
  if (!ghost) {
    cx.fillStyle = "rgba(255,255,255,.22)";
    rrect(x + 2, y + 2, s - 4, (s - 4) * 0.34, Math.max(2, s * 0.12));
    cx.fill();
  }
}
function draw(dt) {
  cx.clearRect(0, 0, L.w, L.h);
  var ox = 0, oy = 0;
  if (shake > 0) { ox = (Math.random() - 0.5) * shake; oy = (Math.random() - 0.5) * shake; shake = Math.max(0, shake - dt * 22); }
  cx.save(); cx.translate(ox, oy);

  /* HUD */
  cx.textAlign = "center";
  cx.fillStyle = "#e8ecff"; cx.font = "800 30px -apple-system,'Segoe UI',sans-serif";
  cx.fillText(String(score), L.w / 2, 38);
  cx.fillStyle = "#8b93b8"; cx.font = "600 12px -apple-system,'Segoe UI',sans-serif";
  cx.textAlign = "left"; cx.fillText("BEST " + Math.max(best, score), L.pad + 2, 24);
  cx.textAlign = "right"; cx.fillText(combo > 1 ? "COMBO ×" + combo : "", L.w - L.pad - 2, 24);

  /* nova meter */
  var mw = L.cell * N, mx = L.bx, my = L.hud - 6;
  cx.fillStyle = "rgba(255,255,255,.06)"; rrect(mx, my, mw, 12, 6); cx.fill();
  var frac = novaMeter / 6;
  if (frac > 0) {
    var mg = cx.createLinearGradient(mx, 0, mx + mw, 0);
    mg.addColorStop(0, "#7c6af5"); mg.addColorStop(1, "#ff5e7e");
    cx.fillStyle = mg; rrect(mx, my, Math.max(12, mw * frac), 12, 6); cx.fill();
  }
  if (novaReady) {
    meterFlash += dt * 5;
    cx.globalAlpha = 0.55 + 0.45 * Math.sin(meterFlash);
    cx.strokeStyle = "#ff5e7e"; cx.lineWidth = 2; rrect(mx - 2, my - 2, mw + 4, 16, 8); cx.stroke();
    cx.globalAlpha = 1;
  }
  cx.textAlign = "left"; cx.fillStyle = "#8b93b8"; cx.font = "700 9px -apple-system,'Segoe UI',sans-serif";
  cx.fillText("NOVA", mx, my - 4);

  /* board */
  cx.fillStyle = "rgba(255,255,255,.035)";
  rrect(L.bx - 6, L.by - 6, L.cell * N + 12, L.cell * N + 12, 14); cx.fill();
  for (var y = 0; y < N; y++) for (var x = 0; x < N; x++) {
    var bx2 = L.bx + x * L.cell, by2 = L.by + y * L.cell;
    cx.fillStyle = "rgba(255,255,255,.045)";
    rrect(bx2 + 1, by2 + 1, L.cell - 2, L.cell - 2, Math.max(3, L.cell * 0.16)); cx.fill();
  }

  /* ghost + would-clear preview */
  var t = drag ? dragTarget() : null;
  var previewSet = null;
  if (t && drag) {
    var piece = tray[drag.pi];
    if (canPlaceAt(piece.shape, t.gx, t.gy)) {
      var save = [];
      piece.shape.forEach(function (c) { var i = (t.gy + c[1]) * N + (t.gx + c[0]); save.push(i); grid[i] = 99; });
      var f = collectFull(); previewSet = {};
      f.rows.forEach(function (yy) { for (var xx = 0; xx < N; xx++) previewSet[yy * N + xx] = 1; });
      f.cols.forEach(function (xx) { for (var yy = 0; yy < N; yy++) previewSet[yy * N + xx] = 1; });
      save.forEach(function (i) { grid[i] = 0; });
      piece.shape.forEach(function (c) {
        blockFill(L.bx + (t.gx + c[0]) * L.cell, L.by + (t.gy + c[1]) * L.cell, L.cell, piece.hue, true, false);
      });
    }
  }

  /* placed cells */
  for (var y3 = 0; y3 < N; y3++) for (var x3 = 0; x3 < N; x3++) {
    var v = grid[y3 * N + x3];
    if (!v) continue;
    var hi = previewSet && previewSet[y3 * N + x3];
    var hue = HUES[(v - 1) % HUES.length];
    if (hi) { cx.shadowColor = "hsla(" + hue + ",100%,75%,.95)"; cx.shadowBlur = 12; }
    blockFill(L.bx + x3 * L.cell, L.by + y3 * L.cell, L.cell, hue, false, false);
    cx.shadowBlur = 0;
  }
  if (previewSet) {
    cx.globalAlpha = 0.35;
    Object.keys(previewSet).forEach(function (k) {
      var i = +k, xx = i % N, yy = (i / N) | 0;
      cx.fillStyle = "#fff";
      rrect(L.bx + xx * L.cell + 1, L.by + yy * L.cell + 1, L.cell - 2, L.cell - 2, Math.max(3, L.cell * 0.16));
      cx.fill();
    });
    cx.globalAlpha = 1;
  }

  /* clearing anims */
  for (var ci = clearing.length - 1; ci >= 0; ci--) {
    var c2 = clearing[ci]; c2.t += dt;
    var k = 1 - c2.t / c2.life;
    if (k <= 0) { clearing.splice(ci, 1); continue; }
    var s2 = L.cell * k;
    cx.globalAlpha = k;
    blockFill(L.bx + c2.x * L.cell + (L.cell - s2) / 2, L.by + c2.y * L.cell + (L.cell - s2) / 2, s2, c2.hue, false, false);
    cx.globalAlpha = 1;
  }

  /* tray */
  for (var i2 = 0; i2 < tray.length; i2++) {
    var pc = tray[i2];
    if (pc.used) continue;
    if (drag && drag.pi === i2) continue;
    var dims = shapeDims(pc.shape);
    var cellS = Math.min(L.slotW * 0.8 / Math.max(dims.w, 3), (L.trayH * 0.8) / Math.max(dims.h, 3), L.cell * 0.72);
    var sw = dims.w * cellS, sh = dims.h * cellS;
    var sx = L.pad + i2 * L.slotW + (L.slotW - sw) / 2, sy = L.trayY + (L.trayH - sh) / 2;
    pc.shape.forEach(function (c3) { blockFill(sx + c3[0] * cellS, sy + c3[1] * cellS, cellS, pc.hue, false, pc.novaPiece); });
    if (pc.novaPiece) {
      cx.textAlign = "center"; cx.fillStyle = "#ff5e7e"; cx.font = "800 10px -apple-system,'Segoe UI',sans-serif";
      cx.fillText("NOVA", L.pad + i2 * L.slotW + L.slotW / 2, sy - 5);
    }
  }

  /* dragged piece */
  if (drag && t) {
    var pd = tray[drag.pi];
    pd.shape.forEach(function (c4) {
      blockFill(t.left + c4[0] * t.pc, t.top + c4[1] * t.pc, t.pc, pd.hue, false, pd.novaPiece);
    });
  }

  /* particles */
  for (var pi2 = parts.length - 1; pi2 >= 0; pi2--) {
    var p2 = parts[pi2]; p2.t += dt;
    if (p2.t >= p2.life) { parts.splice(pi2, 1); continue; }
    p2.x += p2.vx * dt; p2.y += p2.vy * dt; p2.vy += 500 * dt;
    cx.globalAlpha = 1 - p2.t / p2.life;
    cx.fillStyle = "hsl(" + p2.hue + ",85%,65%)";
    cx.beginPath(); cx.arc(p2.x, p2.y, p2.r, 0, 7); cx.fill();
    cx.globalAlpha = 1;
  }

  /* popups */
  cx.textAlign = "center";
  for (var pp = pops.length - 1; pp >= 0; pp--) {
    var q2 = pops[pp]; q2.t += dt;
    if (q2.t >= q2.life) { pops.splice(pp, 1); continue; }
    var k2 = q2.t / q2.life;
    cx.globalAlpha = 1 - k2;
    cx.font = "800 " + q2.size + "px -apple-system,'Segoe UI',sans-serif";
    cx.fillStyle = "hsl(" + q2.hue + ",90%,72%)";
    cx.fillText(q2.txt, q2.x, q2.y - k2 * 34);
    cx.globalAlpha = 1;
  }
  cx.restore();
}

var last = 0;
function loop(ts) {
  var dt = Math.min(0.05, (ts - last) / 1000 || 0.016); last = ts;
  draw(dt);
  requestAnimationFrame(loop);
}

/* ================= UI buttons */
document.getElementById("bmute").textContent = muted ? "🔇" : "🔊";
document.getElementById("bmute").addEventListener("click", function () {
  muted = !muted;
  this.textContent = muted ? "🔇" : "🔊";
  try { localStorage.setItem("bnMute", muted ? "1" : "0"); } catch (e) {}
});
document.getElementById("brestart").addEventListener("click", function () { window.bnCg("stop"); reset(true); });
document.getElementById("ovbtn").addEventListener("click", function () {
  var b = this; b.disabled = true;
  window.bnAd(function () { b.disabled = false; reset(true); });
});
// The footer is stripped from portal builds (its links are root-relative and would
// point at the portal's own domain), so this element is genuinely optional. It used
// to be dereferenced unconditionally, which would have thrown on load in every
// portal package the moment the footer was removed.
var _hub = document.getElementById("hublink");
if (_hub) _hub.addEventListener("click", function () { ev("hub_click", "bn"); });

layout();
reset(false);
requestAnimationFrame(loop);
window.BN_READY = true;
</script>
