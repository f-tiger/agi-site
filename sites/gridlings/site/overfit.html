  :root{--display:'Audiowide',-apple-system,'Segoe UI',Arial,sans-serif;--bg:#07090f;--ink:#dfe7ff;--mut:#7684a8;--ai:#ff3d71;--you:#00e5a8;--panel:#10141f;--line:rgba(255,255,255,.08);}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{background:radial-gradient(1000px 640px at 50% -8%, #101b33 0%, var(--bg) 60%);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans JP",sans-serif;
    display:flex;flex-direction:column;align-items:center;min-height:100%;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;}
  header{width:100%;max-width:1400px;display:flex;align-items:center;justify-content:space-between;padding:10px 14px 0;z-index:5;}
  .logo{font-family:var(--display);font-weight:800;font-size:17px;letter-spacing:2px;}
  .logo em{font-style:normal;color:var(--ai);}
  .hbtns{display:flex;gap:8px;}
  .hbtn{background:var(--panel);border:1px solid var(--line);color:var(--mut);border-radius:9px;width:34px;height:34px;font-size:15px;cursor:pointer;line-height:1;min-height:36px;}
  /* A <canvas> carries an intrinsic height from its width/height attributes, and a
   flex item defaults to min-height:auto -- so the canvas could GROW to fill the
   column but never SHRINK, and with body{overflow:hidden} everything below it
   (the controls) was pushed off a short viewport with no way to scroll to them.
   `flex:1 1 0` + `min-height:0` is what lets it shrink; layout() then resizes the
   backing store to whatever box it actually got. */
  #stage{flex:1 1 0;min-height:0;width:100%;max-width:1400px;display:block;cursor:crosshair;}
  footer{width:100%;max-width:1400px;padding:4px 14px calc(10px + env(safe-area-inset-bottom));display:flex;justify-content:space-between;font-size:11px;color:var(--mut);z-index:5;}
  footer a{color:var(--mut);text-decoration:none;border-bottom:1px dotted var(--mut);}
  .cg footer{display:none;}
  .modal{position:fixed;inset:0;top:0;right:0;bottom:0;left:0;background:rgba(5,7,14,.84);-webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px);display:none;align-items:center;justify-content:center;z-index:50;padding:16px;}
  /* Non-blocking hint. The game is LIVE underneath from the first frame: a portal
     measures load time up to the first gameplayStart, so a click gate in front of
     the arena is the one thing that must not exist. */
  #hint{position:fixed;inset:0;top:0;right:0;bottom:0;left:0;display:flex;align-items:center;justify-content:center;z-index:40;
    padding:16px;pointer-events:none;transition:opacity .45s ease;}
  #hint.gone{opacity:0;}
  .hcard{background:rgba(16,20,31,.90);border:1px solid var(--line);border-radius:16px;
    padding:18px 22px;max-width:360px;text-align:center;box-shadow:0 14px 44px rgba(0,0,0,.5);}
  .hcard .keys{margin-bottom:10px;}
  .hcard p{font-size:13.5px;color:var(--ink);line-height:1.6;}
  .hcard .go{margin-top:12px;color:var(--you);font-weight:800;letter-spacing:1px;text-transform:uppercase;font-size:12px;
    animation:pulse 1.5s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
  .modal.show{display:flex;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:24px 28px;max-width:360px;width:100%;text-align:center;box-shadow:0 18px 60px rgba(0,0,0,.55);}
  .card h2{font-family:var(--display);font-weight:400;letter-spacing:1.5px;font-size:21px;margin-bottom:4px;letter-spacing:1px;}
  .card .big{font-size:40px;font-weight:800;background:linear-gradient(120deg,#00e5a8,#5a8cf5);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .card p{color:var(--mut);font-size:13px;margin:8px 0 14px;line-height:1.55;}
  .brief{text-align:left;background:rgba(255,61,113,.07);border:1px solid rgba(255,61,113,.25);border-radius:11px;padding:10px 13px;font-size:12.5px;margin:10px 0 14px;line-height:1.6;}
  .brief b{color:var(--ai);}
  .btn{font-family:var(--display);display:inline-block;background:linear-gradient(120deg,#00b586,#00e5a8);color:#04140e;border:0;border-radius:12px;padding:12px 26px;font-size:15px;font-weight:800;cursor:pointer;font-family:inherit;letter-spacing:.4px;}
  .btn:active{transform:scale(.97);}

  /* ---- juice layer (shared recipe across the fleet) ---- */
  .stars{display:flex;justify-content:center;gap:8px;margin:2px 0 8px;height:34px;}
  .stars svg{width:32px;height:32px;opacity:.18;transform:scale(.6);transition:opacity .25s,transform .35s cubic-bezier(.2,1.6,.4,1);}
  .stars svg.on{opacity:1;transform:scale(1);}
  .ribbon{font-family:var(--display);display:inline-block;background:#00e5a8;color:#04140e;font-size:11px;font-weight:900;letter-spacing:1.6px;
    padding:4px 10px;border-radius:999px;margin-bottom:8px;opacity:0;transform:translateY(6px);transition:opacity .3s,transform .3s;}
  .ribbon.show{opacity:1;transform:none;}
  .btn{border-bottom:4px solid rgba(0,0,0,.38)!important;border-radius:13px!important;min-width:180px;font-size:16px!important;font-weight:900!important;
    transition:transform .06s,border-bottom-width .06s;}
  .btn:active{transform:translateY(3px)!important;border-bottom-width:1px!important;}
  #intro{position:fixed;left:50%;top:21%;transform:translate(-50%,-50%) scale(.9);z-index:45;pointer-events:none;
    text-align:center;opacity:0;transition:opacity .25s,transform .25s;
    background:rgba(10,13,22,.88);border:1px solid #00e5a844;border-radius:16px;padding:14px 22px;
    box-shadow:0 16px 50px rgba(0,0,0,.5);max-width:86vw;}
  #intro.show{opacity:1;transform:translate(-50%,-50%) scale(1);}
  #intro .n{font-family:var(--display);font-size:13px;font-weight:800;letter-spacing:3px;color:#8a95b3;}
  #intro .t{font-family:var(--display);font-weight:400;font-size:clamp(18px,4.3vw,30px);font-weight:900;color:#00e5a8;text-shadow:0 6px 30px #00e5a855;margin-top:4px;white-space:nowrap;}
  #intro .s{font-size:14px;color:#e8edf7;margin-top:8px;opacity:.85;}
  #fx{position:fixed;inset:0;z-index:55;pointer-events:none;}
  #intro{top:36%!important;}
</style>
</head>

<header>
  <div class="logo">OVER<em>FIT</em></div>
  <div class="hbtns">
    <button class="hbtn" id="bmute" aria-label="Sound on/off">🔊</button>
    <button class="hbtn" id="brestart" aria-label="Restart">↺</button>
  </div>
</header>
<canvas id="stage"></canvas>
<footer>
  <span>No ads here · no account · free</span>

</footer>

<script>
"use strict";
/* ============ CrazyGames bridge (inline; active only in cg contexts) */
(function () {
  var on = window.GL_CG === true || /(^|[?&])cg=1/.test(location.search);
  if (!on) { try { on = /crazygames\./.test(document.referrer); } catch (e) {} }
  window.GL_CG = on;
  var q = [];
  window.ofCg = function (ev) { if (on) q.push(ev); };
  window.ofAd = function (done) { done(); };
  if (!on) return;
  document.documentElement.classList.add("cg");
  if (/[?&]muteAudio=true/.test(location.search)) window.GL_SDK_MUTE = true;
  var s = document.createElement("script");
  s.src = "https://sdk.crazygames.com/crazygames-sdk-v3.js";
  s.async = true;
  s.onload = function () {
    try {
      window.CrazyGames.SDK.init().then(function () {
        var g = window.CrazyGames.SDK.game;
        try {
          var st = g.settings;
          if (st && typeof st.muteAudio === "boolean") window.GL_SDK_MUTE = st.muteAudio;
          g.addSettingsChangeListener(function (s2) { if (s2 && typeof s2.muteAudio === "boolean") window.GL_SDK_MUTE = s2.muteAudio; });
        } catch (e) {}
        try { g.loadingStart(); } catch (e) {} try { g.loadingStop(); } catch (e) {}
        window.ofCg = function (ev) {
          try {
            if (ev === "start") g.gameplayStart();
            else if (ev === "stop") g.gameplayStop();
            else if (ev === "happy") g.happytime();
          } catch (e) {}
        };
        q.splice(0).forEach(function (ev) { window.ofCg(ev); });
        window.ofAd = function (done) {
          var fin = false; var end = function () { if (!fin) { fin = true; done(); } };
          try {
            window.CrazyGames.SDK.ad.requestAd("midgame", { adFinished: end, adError: end, adStarted: function () {} });
            setTimeout(end, 20000);
          } catch (e) { end(); }
        };
      }).catch(function () {});
    } catch (e) {}
  };
  document.head.appendChild(s);
})();
/* ============ beacon */
function ev(n, l) {
  try {
    var d = JSON.stringify({ n: n, l: l || "of", p: "/overfit" });
    var u = "https://play.agiscorecard.com/e";
    if (navigator.sendBeacon) navigator.sendBeacon(u, new Blob([d], { type: "application/json" }));
    else fetch(u, { method: "POST", body: d, keepalive: true, mode: "cors" }).catch(function () {});
  } catch (e) {}
}
/* ============ audio */
var AC = null, muted = false;
try { muted = localStorage.getItem("ofMute") === "1"; } catch (e) {}
function ac() { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (AC && AC.state === "suspended") { try { AC.resume(); } catch (e) {} } return AC; }
function tone(f, t0, dur, type, gain, slide) {
  var a = ac(); if (!a || muted || window.GL_SDK_MUTE) return;
  try {
    var o = a.createOscillator(), g = a.createGain();
    o.type = type || "sine"; o.frequency.setValueAtTime(f, a.currentTime + t0);
    if (slide) o.frequency.exponentialRampToValueAtTime(slide, a.currentTime + t0 + dur);
    g.gain.setValueAtTime(0, a.currentTime + t0);
    g.gain.linearRampToValueAtTime(gain || 0.1, a.currentTime + t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + t0 + dur);
    o.connect(g); g.connect(a.destination);
    o.start(a.currentTime + t0); o.stop(a.currentTime + t0 + dur + 0.02);
  } catch (e) {}
}
function noise(dur, freq, gain, t0) {
  var a = ac(); if (!a || muted || window.GL_SDK_MUTE) return;
  try {
    var n = a.createBufferSource(), b = a.createBuffer(1, a.sampleRate * dur, a.sampleRate), d = b.getChannelData(0);
    for (var i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 1.6);
    var f = a.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = freq;
    var g = a.createGain(); g.gain.value = gain;
    n.buffer = b; n.connect(f); f.connect(g); g.connect(a.destination); n.start(a.currentTime + (t0 || 0));
  } catch (e) {}
}
var sfx = {
  shot: function () { tone(880, 0, 0.045, "square", 0.025, 640); noise(0.03, 5200, 0.03); },
  kill: function () { tone(520, 0, 0.09, "triangle", 0.1, 240); tone(95, 0, 0.14, "sine", 0.14, 40); noise(0.14, 1400, 0.09); },
  bossIn: function () { tone(70, 0, 1.3, "sawtooth", 0.11, 52); tone(140, 0.1, 1.1, "square", 0.04, 105); noise(1.0, 320, 0.08); },
  bossDie: function () { noise(0.7, 900, 0.2); tone(210, 0, 0.7, "sawtooth", 0.14, 38); tone(523, 0.32, 0.3, "triangle", 0.1); tone(784, 0.48, 0.45, "triangle", 0.1); tone(1046, 0.6, 0.5, "sine", 0.07); },
  hurt: function () { tone(160, 0, 0.22, "sawtooth", 0.16, 70); noise(0.2, 500, 0.2); },
  wave: function () { tone(392, 0, 0.12, "triangle", 0.1); tone(494, 0.1, 0.12, "triangle", 0.1); tone(659, 0.2, 0.3, "triangle", 0.12); tone(784, 0.2, 0.3, "sine", 0.05); noise(0.3, 2200, 0.04, 0.2); },
  confuse: function () { for (var i = 0; i < 6; i++) tone(420 + ((i * 7) % 5) * 130, i * 0.05, 0.04, "square", 0.05); tone(700, 0.3, 0.4, "sawtooth", 0.07, 90); noise(0.45, 900, 0.16, 0.25); },
  over: function () { tone(330, 0, 0.2, "sine", 0.12); tone(262, 0.18, 0.2, "sine", 0.12); tone(196, 0.36, 0.4, "sine", 0.12); },
  beam: function () { tone(1400, 0, 0.5, "sine", 0.03, 1800); }
};
/* ============ layout */
var cv = document.getElementById("stage"), cx = cv.getContext("2d");
var W = 0, H = 0;
function layout() {
  var dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  var r = cv.getBoundingClientRect();
  W = Math.max(320, r.width); H = Math.max(360, r.height);
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  cx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener("resize", layout);

/* ============ THE MODEL — a real, transparent statistical learner over player behavior.
   dirBins: 8-direction movement histogram. orbit: signed angular motion around arena
   centre (+cw). speedAvg: EMA of speed. dodgeLR: which way the player breaks when a
   sniper locks on. conf: how sharply the histogram peaks = model confidence. */
var model;
function freshModel() {
  return { dirBins: new Array(8).fill(1), orbit: 0, samples: 8, speedAvg: 120, dodgeL: 1, dodgeR: 1, conf: 0, predDir: 0, predOrbit: 0 };
}
function learnFrame(dt) {
  var sp = Math.hypot(P.vx, P.vy);
  model.speedAvg += (sp - model.speedAvg) * Math.min(1, dt * 0.5);
  if (sp > 30) {
    var a = Math.atan2(P.vy, P.vx);
    var bin = ((Math.round(a / (Math.PI / 4)) % 8) + 8) % 8;
    model.dirBins[bin] += dt * 2;
    model.samples += dt * 2;
    var toC = Math.atan2(P.y - H / 2, P.x - W / 2);
    var tang = a - toC - Math.PI / 2;
    while (tang > Math.PI) tang -= 2 * Math.PI;
    while (tang < -Math.PI) tang += 2 * Math.PI;
    model.orbit += (Math.abs(tang) < Math.PI / 2 ? 1 : -1) * dt;
  }
  var mx = Math.max.apply(null, model.dirBins);
  model.conf = Math.min(1, (mx / model.samples) * 8 / 3);
  model.predDir = model.dirBins.indexOf(mx) * Math.PI / 4;
  model.predOrbit = model.orbit >= 0 ? 1 : -1;
}
/* prediction the enemies actually use: blend of velocity lead + learned bias */
function predictPos(t) {
  var lead = Math.min(1.5, t);
  var bx = Math.cos(model.predDir) * model.speedAvg * model.conf;
  var by = Math.sin(model.predDir) * model.speedAvg * model.conf;
  return { x: P.x + (P.vx * 0.6 + bx * 0.4) * lead, y: P.y + (P.vy * 0.6 + by * 0.4) * lead };
}
/* confusion: recent live behavior vs stated prediction */
var recent = [];
function confusionCheck(dt) {
  var sp = Math.hypot(P.vx, P.vy);
  if (sp > 40) {
    var a = Math.atan2(P.vy, P.vx);
    recent.push({ a: a, t: nowT });
  }
  while (recent.length && nowT - recent[0].t > 2.2) recent.shift();
  if (confused > 0 || model.conf < 0.55 || recent.length < 25) return;
  var agree = 0;
  for (var i = 0; i < recent.length; i++) {
    var d = Math.abs(recent[i].a - model.predDir);
    while (d > Math.PI) d = Math.abs(d - 2 * Math.PI);
    if (d < Math.PI / 2.5) agree++;
  }
  if (agree / recent.length < 0.14) {
    confused = 2.2; confuseFlash = 1; recent.length = 0;
    model.dirBins = model.dirBins.map(function (v) { return 1 + (v - 1) * 0.25; });
    model.samples = model.dirBins.reduce(function (s, v) { return s + v; }, 0);
    score += 25;
    popText("MODEL CONFUSED  ×2", W / 2, H * 0.46, 26, 160);
    sfx.confuse(); shake = 7;
    window.ofCg("happy");
  }
}

/* ============ game state */
var P, foes, shots, beams, parts, pops, score, best = 0, wave, hp, over, running, confused, confuseFlash, shake, nowT, waveMsg, inv;
var waveQuota = 0, waveSpawned = 0, waveConc = 4, spawnTimer = 0;
/* armed: the first spawn waits for the first real input (or 4s) so nobody
   dies while still reading the hint. The arena is live either way. */
var armed = false, armT = 0;
try { best = parseInt(localStorage.getItem("ofBest") || "0", 10) || 0; } catch (e) {}
var ptr = { x: 0, y: 0, on: false };
function popText(txt, x, y, size, hue) { pops.push({ txt: txt, x: x, y: y, t: 0, life: 1.1, size: size, hue: hue }); }
function burst(x, y, hue, n, spd) {
  for (var i = 0; i < n; i++) {
    var a = Math.random() * Math.PI * 2, sp = (spd || 160) * (0.4 + Math.random());
    parts.push({ x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, t: 0, life: 0.4 + Math.random() * 0.35, hue: hue, r: 1.5 + Math.random() * 2.5 });
  }
}
var modalT = 0, starOX = 0, starOY = 0, rings = [];
function reset(replay) {
  clearTimeout(modalT);   /* a modal still in flight would land on the new run */
  P = { x: W / 2, y: H * 0.6, vx: 0, vy: 0, fire: 0, a: -Math.PI / 2 };
  foes = []; shots = []; beams = []; parts = []; pops = [];
  waveQuota = 0; waveSpawned = 0; waveConc = 4; spawnTimer = 0;
  score = 0; wave = 0; hp = 3; over = false; running = false; confused = 0; confuseFlash = 0; shake = 0; inv = 0; waveMsg = null;
  model = freshModel(); recent = [];
  ptr.on = false;
  armed = false; armT = 0;
  document.getElementById("mover").classList.remove("show");
  var h = document.getElementById("hint");
  if (h) h.classList.remove("gone");
  if (replay) ev("play_again");
  /* Playable from this instant: no menu, no click gate. This is also exactly
     what the portal automatic "first gameplay start" check looks for. */
  running = true; nowT = 0;
  ev("play_start"); window.ofCg("start");
  startWave();
}
function trainingReport() {
  var lines = [];
  var pct = Math.round(model.conf * 100);
  var dirs = ["→", "↘", "↓", "↙", "←", "↖", "↑", "↗"];
  lines.push("drift bias: " + dirs[Math.round(model.predDir / (Math.PI / 4)) % 8] + "  (" + pct + "% conf)");
  lines.push("orbit: " + (model.predOrbit > 0 ? "clockwise" : "counter-cw"));
  var dl = model.dodgeL, dr = model.dodgeR;
  if (dl + dr > 3) lines.push("dodges " + (dl > dr ? "LEFT " + Math.round(100 * dl / (dl + dr)) : "RIGHT " + Math.round(100 * dr / (dl + dr))) + "% on lock");
  return lines;
}
function pickType() {
  var r = Math.random();
  if (wave >= 3 && r < 0.18) return "sniper";
  if (wave >= 2 && r < 0.45) return "predictor";
  return "chaser";
}
/* Waves keep PRESSURE on instead of dumping everything at once and leaving the
   arena empty while the last straggler is hunted down: a quota per wave, and a
   concurrent target that refills as slots free up. An empty screen is the one
   thing an arcade dodger can never afford. */
function startWave() {
  wave++;
  waveQuota = Math.round((4 + wave * 3) * Math.max(1, Math.min(2.4, (W * H) / 430000)));
  waveSpawned = 0;
  /* Every fifth wave the model stops hiding behind its minions and comes out as a
     body: a sniper-class foe whose hull IS the radar rose. It aims where it
     predicts you, takes double damage while confused, and the wave cannot end
     until it is dead. */
  if (wave % 5 === 0) { spawnBoss(); waveQuota = Math.round(waveQuota * .6); }
  // density is per-AREA: a desktop arena is ~2x a phone's, so it gets ~2x the
  // pressure. Without this the same enemy count reads as an empty field on wide
  // screens — which is exactly how a reviewer decides a dodger is not fun.
  var areaScale = Math.max(1, Math.min(2.4, (W * H) / 430000));
  waveConc = Math.round(Math.min(3 + wave, 9) * areaScale);
  spawnTimer = 0;
  nowTWave = 0;
  waveMsg = { t: 0, lines: wave === 1 ? ["cold start \u2014 no data on you yet"] : trainingReport() };
  /* the wave card doubles as the model's training report: what it now believes about you */
  if (wave % 5 === 0) showIntro("WAVE " + wave + " \u00b7 BOSS", "the model itself", "it fires where it predicts you \u00b7 confuse it for double damage");
  else showIntro(wave === 1 ? "WAVE 1" : "WAVE " + wave + " \u00b7 TRAINING UPDATE", waveMsg.lines[0], waveMsg.lines.slice(1).join("  \u00b7  "));
  if (armed) sfx.wave();   /* silent on the page-load wave: creating an
     AudioContext before a user gesture logs a Chrome autoplay warning */
  /* wave announcement moved into the intro card (it collided with the rose) */
}
var nowTWave = 0;
function spawnBoss() {
  var base = 52 + wave * 7;
  foes.push({ type: "sniper", boss: true, x: W / 2, y: -50, hp: 10 + wave, hpMax: 10 + wave, sp: base * .32, r: 34, hue: 275, lock: 0.9, aim: null, wob: 0 });
  if (armed) sfx.bossIn();
  shake = 8;
}
function spawnFoe(type) {
  var edge = Math.floor(Math.random() * 4), x, y;
  if (edge === 0) { x = -20; y = Math.random() * H; }
  else if (edge === 1) { x = W + 20; y = Math.random() * H; }
  else if (edge === 2) { x = Math.random() * W; y = -20; }
  else { x = Math.random() * W; y = H + 20; }
  var base = 52 + wave * 7;
  if (type === "chaser") foes.push({ type: type, x: x, y: y, hp: 1, sp: base * 1.15, r: 12, hue: 340, wob: Math.random() * 7 });
  else if (type === "predictor") foes.push({ type: type, x: x, y: y, hp: 2, sp: base, r: 14, hue: 275, wob: Math.random() * 7 });
  else foes.push({ type: type, x: x, y: y, hp: 2, sp: base * 0.55, r: 13, hue: 45, lock: 0, aim: null, wob: 0 });
}
/* ============ input */
function evtPos(e) { var r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
/* WASD / arrow keys as a parallel scheme — CG QA plays on desktop and an arena
   game with no keyboard option reads as thin. Space/Enter works the visible
   primary button so a whole run never needs the mouse. */
var keys = { l: 0, r: 0, u: 0, d: 0 };
var KEYMAP = { KeyA: "l", ArrowLeft: "l", KeyD: "r", ArrowRight: "r", KeyW: "u", ArrowUp: "u", KeyS: "d", ArrowDown: "d" };
function primaryBtn() {
  var m = document.getElementById("mover");
  if (m && m.classList.contains("show")) return document.getElementById("bagain");
  return null;
}
window.addEventListener("keydown", function (e) {
  if (e.repeat) return;
  var k = KEYMAP[e.code];
  if (k) { keys[k] = 1; ac(); e.preventDefault(); return; }
  if (e.code === "Space" || e.code === "Enter") {
    var b = primaryBtn();
    if (b && !b.disabled) { e.preventDefault(); b.click(); }
  }
});
window.addEventListener("keyup", function (e) {
  var k = KEYMAP[e.code];
  if (k) { keys[k] = 0; e.preventDefault(); }
});
/* a key held while the tab loses focus would otherwise stick forever */
window.addEventListener("blur", function () { keys.l = keys.r = keys.u = keys.d = 0; });
cv.addEventListener("pointerdown", function (e) { ac(); var p = evtPos(e); ptr.x = p.x; ptr.y = p.y; ptr.on = true; e.preventDefault(); }, { passive: false });
cv.addEventListener("pointermove", function (e) { var p = evtPos(e); ptr.x = p.x; ptr.y = p.y; if (e.pointerType === "mouse") ptr.on = true; e.preventDefault(); }, { passive: false });
cv.addEventListener("pointerup", function (e) { if (e.pointerType !== "mouse") ptr.on = false; }, { passive: false });

/* ============ update */
function update(dt) {
  juiceTick(dt);
  nowT += dt;
  if (!running || over) return;
  nowTWave += dt;
  if (waveMsg) { waveMsg.t += dt; if (waveMsg.t > 2.6) waveMsg = null; }
  /* movement: keyboard while a key is held, else pointer follow, else coast.
     Both feed P.vx/P.vy, so the learning model reads either input identically —
     a keyboard player is profiled exactly like a mouse player. */
  var kx = (keys.r ? 1 : 0) - (keys.l ? 1 : 0), ky = (keys.d ? 1 : 0) - (keys.u ? 1 : 0);
  if (kx || ky) {
    ptr.on = false;
    var km = Math.hypot(kx, ky) || 1;
    P.vx = kx / km * 400; P.vy = ky / km * 400;
  } else if (ptr.on) {
    var dx = ptr.x - P.x, dy = ptr.y - P.y, d = Math.hypot(dx, dy);
    var v = Math.min(d * 9, 420);
    if (d > 2) { P.vx = dx / d * v; P.vy = dy / d * v; } else { P.vx *= 0.7; P.vy *= 0.7; }
  } else { P.vx *= 0.86; P.vy *= 0.86; }
  P.x = Math.max(12, Math.min(W - 12, P.x + P.vx * dt));
  P.y = Math.max(12, Math.min(H - 12, P.y + P.vy * dt));
  /* Facing is a REMEMBERED angle, not one derived per frame. Deriving it inline
     had two faults: moving due right gives atan2(0, vx) === 0, and 0 is falsy in
     JS, so the `|| fallback` swallowed it and the ship snapped to face up (only
     ever visible on the right arrow / D key, where vy is exactly 0). Second, a
     ship at rest has no angle at all, which made it jerk upward on every stop. */
  if (Math.hypot(P.vx, P.vy) > 12) P.a = Math.atan2(P.vy, P.vx);
  if (inv > 0) inv -= dt;
  learnFrame(dt);
  confusionCheck(dt);
  if (confused > 0) { confused -= dt; }
  /* grace: hold the very first spawn until the player has moved (or 4s passed) */
  if (!armed) {
    armT += dt;
    if (armT > 4 || Math.hypot(P.vx, P.vy) > 20) {
      armed = true;
      var hEl = document.getElementById("hint");
      if (hEl) hEl.classList.add("gone");
    }
  }
  /* sustained spawning: refill toward the concurrent target until quota is spent */
  if (armed && waveSpawned < waveQuota) {
    spawnTimer -= dt;
    if (foes.length < waveConc && spawnTimer <= 0) {
      spawnFoe(pickType()); waveSpawned++;
      spawnTimer = Math.max(0.13, 0.45 - wave * 0.03);
    }
  }
  /* autofire nearest foe */
  P.fire -= dt;
  if (P.fire <= 0 && foes.length) {
    var near = null, nd = 1e9;
    foes.forEach(function (f) { var d2 = Math.hypot(f.x - P.x, f.y - P.y); if (d2 < nd) { nd = d2; near = f; } });
    if (near && nd < 520) {
      var a2 = Math.atan2(near.y - P.y, near.x - P.x);
      shots.push({ x: P.x, y: P.y, vx: Math.cos(a2) * 620, vy: Math.sin(a2) * 620, t: 0 });
      P.fire = 0.16; sfx.shot();
    }
  }
  /* shots */
  for (var s = shots.length - 1; s >= 0; s--) {
    var sh = shots[s]; sh.t += dt; sh.x += sh.vx * dt; sh.y += sh.vy * dt;
    if (sh.t > 1.2 || sh.x < -20 || sh.y < -20 || sh.x > W + 20 || sh.y > H + 20) { shots.splice(s, 1); continue; }
    for (var f2 = foes.length - 1; f2 >= 0; f2--) {
      var fo = foes[f2];

    if (inv > 0 && Math.floor(nowT * 14) % 2) cx.globalAlpha = 0.45;
    cx.save(); cx.translate(P.x, P.y); cx.rotate(pa);
    /* banking: the hull narrows as lateral speed grows, like a plane rolling */
    var lat = (-Math.sin(pa) * P.vx + Math.cos(pa) * P.vy) / 420; cx.scale(1, Math.max(.6, 1 - Math.abs(lat) * .35));
    /* twin flames, flickering with speed */
    var fl = Math.min(1, spd / 300), flk = 1 + Math.sin(nowT * 40) * .25;
    if (fl > .08) { for (var fw = -1; fw <= 1; fw += 2) {
      var fg2 = cx.createLinearGradient(-8, 0, -8 - 16 * fl * flk, 0); fg2.addColorStop(0, "rgba(255,255,255,.95)"); fg2.addColorStop(.4, "rgba(0,229,168,.9)"); fg2.addColorStop(1, "rgba(0,229,168,0)");
      cx.fillStyle = fg2; cx.beginPath(); cx.moveTo(-8, fw * 5 - 2.5); cx.lineTo(-8 - 16 * fl * flk, fw * 5); cx.lineTo(-8, fw * 5 + 2.5); cx.closePath(); cx.fill(); } }
    var hull = cx.createLinearGradient(-10, 0, 14, 0); hull.addColorStop(0, "#00b586"); hull.addColorStop(1, "#b8ffe9");
    cx.shadowColor = "rgba(0,229,168,.9)"; cx.shadowBlur = 16; cx.fillStyle = hull;
    cx.beginPath(); cx.moveTo(15, 0); cx.lineTo(2, 5); cx.lineTo(-6, 12); cx.lineTo(-9, 9); cx.lineTo(-7, 3); cx.lineTo(-9, 0); cx.lineTo(-7, -3); cx.lineTo(-9, -9); cx.lineTo(-6, -12); cx.lineTo(2, -5); cx.closePath();
    cx.fill(); cx.shadowBlur = 0; cx.strokeStyle = "#04140e"; cx.lineWidth = 2; cx.lineJoin = "round"; cx.stroke();
    cx.fillStyle = "#04140e"; cx.beginPath(); cx.ellipse(3, 0, 4.5, 2.6, 0, 0, 7); cx.fill();
    cx.fillStyle = "#e6fff7"; cx.beginPath(); cx.ellipse(4, -.6, 2.4, 1.3, 0, 0, 7); cx.fill();
    cx.restore();
    cx.globalAlpha = 1;
  }
  /* kill shockwaves */
  for (var ri = rings.length - 1; ri >= 0; ri--) { var rg2 = rings[ri]; rg2.t += dt; if (rg2.t > .45) { rings.splice(ri, 1); continue; } if (rg2.t < 0) continue;
    var kk = rg2.t / .45; cx.globalAlpha = 1 - kk; cx.strokeStyle = "hsl(" + rg2.hue + ",90%,70%)"; cx.lineWidth = 3 * (1 - kk) + .5;
    cx.beginPath(); cx.arc(rg2.x, rg2.y, 6 + kk * 46, 0, 7); cx.stroke(); cx.globalAlpha = 1; }
  /* particles */
  for (var pi = parts.length - 1; pi >= 0; pi--) {
    var p2 = parts[pi]; p2.t += dt;
    if (p2.t >= p2.life) { parts.splice(pi, 1); continue; }
    p2.x += p2.vx * dt; p2.y += p2.vy * dt; p2.vx *= 0.985; p2.vy *= 0.985;
    cx.globalAlpha = 1 - p2.t / p2.life;
    cx.fillStyle = "hsl(" + p2.hue + ",85%,64%)";
    cx.beginPath(); cx.arc(p2.x, p2.y, p2.r, 0, 7); cx.fill();
    cx.globalAlpha = 1;
  }
  /* popups */
  cx.textAlign = "center";
  for (var pp2 = pops.length - 1; pp2 >= 0; pp2--) {
    var q2 = pops[pp2]; q2.t += dt;
    if (q2.t >= q2.life) { pops.splice(pp2, 1); continue; }
    cx.globalAlpha = 1 - q2.t / q2.life;
    cx.font = "800 " + q2.size + "px -apple-system,'Segoe UI',sans-serif";
    cx.fillStyle = "hsl(" + q2.hue + ",90%,70%)";
    cx.fillText(q2.txt, q2.x, q2.y - q2.t * 26);
    cx.globalAlpha = 1;
  }
  cx.restore();
}
var last = 0;
function loop(ts) {
  var dt = Math.min(0.045, (ts - last) / 1000 || 0.016); last = ts;
  update(dt); draw(dt);
  requestAnimationFrame(loop);
}
/* ============ UI */
document.getElementById("bmute").textContent = muted ? "🔇" : "🔊";
document.getElementById("bmute").addEventListener("click", function () {
  muted = !muted; this.textContent = muted ? "🔇" : "🔊";
  try { localStorage.setItem("ofMute", muted ? "1" : "0"); } catch (e) {}
});
document.getElementById("brestart").addEventListener("click", function () { window.ofCg("stop"); reset(true); });
document.getElementById("bagain").addEventListener("click", function () {
  var b = this; b.disabled = true;
  window.ofAd(function () { b.disabled = false; reset(true); });
});
document.getElementById("hublink").addEventListener("click", function () { ev("hub_click", "of"); });
layout();
reset(false);
requestAnimationFrame(loop);
window.OF_READY = true;

/* ===== juice layer: count-up, stars, ribbon, confetti, intro card ===== */
var fxc = document.getElementById("fx"), fxx = fxc.getContext("2d"), confetti = [], introT = 0, countT = 0, countTo = 0, countEl = null, countPrefix = "";
function fxLayout() { var dpr = Math.min(window.devicePixelRatio || 1, 2); fxc.width = innerWidth * dpr; fxc.height = innerHeight * dpr; fxx.setTransform(dpr, 0, 0, dpr, 0, 0); }
function confettiBurst(n) {
  fxLayout();
  var cols = ["#00e5a8","#5a8cf5","#ff3d71","#ffffff"];
  for (var i = 0; i < n; i++) { var side = i % 2 ? 1 : -1;
    confetti.push({ x: innerWidth / 2 + side * innerWidth * .46, y: innerHeight * .62,
      vx: -side * (180 + Math.random() * 360), vy: -Math.random() * 700 - 260, r: 3 + Math.random() * 3.5, a: Math.random() * 7, va: (Math.random() - .5) * 14,
      c: cols[i % cols.length], t: 0, life: 1.6 + Math.random() * .8 }); }
}
function fxStep(dt) {
  if (!confetti.length) { if (fxc.width) fxx.clearRect(0, 0, innerWidth, innerHeight); return; }
  fxx.clearRect(0, 0, innerWidth, innerHeight);
  for (var i = confetti.length - 1; i >= 0; i--) {
    var c = confetti[i]; c.t += dt; if (c.t > c.life) { confetti.splice(i, 1); continue; }
    c.vy += 900 * dt; c.x += c.vx * dt; c.y += c.vy * dt; c.vx *= .992; c.a += c.va * dt;
    fxx.save(); fxx.translate(c.x, c.y); fxx.rotate(c.a); fxx.globalAlpha = Math.min(1, (c.life - c.t) * 1.5);
    fxx.fillStyle = c.c; fxx.fillRect(-c.r, -c.r * .6, c.r * 2, c.r * 1.2); fxx.restore();
  }
}
function setStars(n) {
  var el = document.getElementById("dstars"); if (!el) return; var h = "";
  for (var i = 0; i < 3; i++) h += "<svg viewBox='0 0 24 24'><path d='M12 2l3 6.6 7 .8-5.2 4.8 1.5 7L12 17.6 5.7 21.2l1.5-7L2 9.4l7-.8z' fill='#00e5a8' stroke='#04140e' stroke-width='1.2' stroke-linejoin='round'/></svg>";
  el.innerHTML = h;
  var svgs = el.querySelectorAll("svg");
  for (var k = 0; k < n; k++) (function (k) { setTimeout(function () { svgs[k].classList.add("on"); sfx.kill(); }, 500 + k * 220); })(k);
}
function countUp(el, to, prefix) { countEl = el; countTo = to; countT = 0; countPrefix = prefix || ""; el.textContent = countPrefix + "0"; }
function juiceTick(dt) {
  if (introT > 0) { introT -= dt; if (introT <= 0) { document.getElementById("intro").classList.remove("show");
    var hh = document.getElementById("hint"); if (hh && !armed) hh.classList.remove("gone"); } }
  if (countEl) { countT = Math.min(1, countT + dt / .7); var e = 1 - Math.pow(1 - countT, 3);
    countEl.textContent = countPrefix + Math.round(countTo * e); if (countT >= 1) countEl = null; }
  fxStep(dt);
}
function showIntro(n, t, s2) {
  var el = document.getElementById("intro");
  document.getElementById("in").textContent = n; document.getElementById("it").textContent = t; document.getElementById("is").textContent = s2 || "";
  el.classList.add("show"); introT = 1.4;
  var hh = document.getElementById("hint"); if (hh && !armed) hh.classList.add("gone");
}
window.addEventListener("resize", fxLayout);
