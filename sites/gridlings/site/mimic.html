  :root{--display:'Righteous',-apple-system,'Segoe UI',Arial,sans-serif;--bg:#0a0d14;--ink:#e6ecff;--mut:#7b88ab;--line:rgba(255,255,255,.08);--panel:#141a27;
        --keep:#38d9c4;--rej:#ff6b9d;--warn:#ffc14d;}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{background:radial-gradient(900px 560px at 50% -10%,#152036 0%,var(--bg) 62%);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans JP",sans-serif;
    display:flex;flex-direction:column;align-items:center;min-height:100%;overflow:hidden;
    touch-action:none;user-select:none;-webkit-user-select:none;}
  header{width:100%;max-width:1100px;display:flex;align-items:center;justify-content:space-between;padding:10px 14px 0;}
  .logo{font-family:var(--display);font-weight:800;font-size:17px;letter-spacing:2px;}
  .logo em{font-style:normal;color:var(--rej);}
  .hbtn{background:var(--panel);border:1px solid var(--line);color:var(--mut);border-radius:9px;width:34px;height:34px;font-size:15px;cursor:pointer;min-height:36px;}
  /* A <canvas> carries an intrinsic height from its width/height attributes, and a
   flex item defaults to min-height:auto -- so the canvas could GROW to fill the
   column but never SHRINK, and with body{overflow:hidden} everything below it
   (the controls) was pushed off a short viewport with no way to scroll to them.
   `flex:1 1 0` + `min-height:0` is what lets it shrink; layout() then resizes the
   backing store to whatever box it actually got. */
  #stage{flex:1 1 0;min-height:0;width:100%;max-width:1100px;display:block;}
  .pad{width:100%;max-width:1100px;display:flex;gap:8px;padding:0 14px 6px;}
  .pbtn{flex:1;border:1px solid rgba(255,255,255,.10);border-radius:14px;background:var(--panel);color:var(--ink);
    font-family:var(--display);font-size:15px;letter-spacing:1px;padding:9px 0 7px;cursor:pointer;transition:transform .06s;
    display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 6px 14px rgba(0,0,0,.35);}
  .pbtn svg{width:22px;height:22px;display:block;filter:drop-shadow(0 2px 0 rgba(0,0,0,.5));}
  .pbtn.k{background:linear-gradient(180deg,#1e5a55 0%,#123b39 60%,#0e2f2d 100%)!important;color:#b6fff3;}
  .pbtn.r{background:linear-gradient(180deg,#5a1f3a 0%,#3b1327 60%,#2f0f20 100%)!important;color:#ffc4d8;}
  .pbtn.x{background:linear-gradient(180deg,#5a4520 0%,#3b2d13 60%,#2f240f 100%)!important;color:#ffe2a6;}
  .pbtn:active{transform:scale(.97);}
  .pbtn.k{border-color:rgba(56,217,196,.5);color:var(--keep);}
  .pbtn.r{border-color:rgba(255,107,157,.5);color:var(--rej);}
  .pbtn.x{border-color:rgba(255,193,77,.55);color:var(--warn);flex:0 0 30%;}
  .pbtn small{display:block;font-size:11px;font-weight:600;opacity:.9;letter-spacing:.4px;margin-top:2px;}
  footer{width:100%;max-width:1100px;padding:0 14px calc(9px + env(safe-area-inset-bottom));display:flex;justify-content:space-between;font-size:11px;color:var(--mut);}
  footer a{color:var(--mut);text-decoration:none;border-bottom:1px dotted var(--mut);}
  .cg footer{display:none;}
  .modal{position:fixed;inset:0;top:0;right:0;bottom:0;left:0;background:rgba(6,9,16,.86);
    -webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px);
    display:none;align-items:center;justify-content:center;z-index:50;padding:16px;}
  .modal.show{display:flex;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:24px 26px;max-width:390px;width:100%;
    text-align:center;box-shadow:0 18px 60px rgba(0,0,0,.55);}
  .card h2{font-family:var(--display);font-weight:400;font-size:19px;margin-bottom:10px;letter-spacing:.5px;}
  .verdict{font-size:13.5px;line-height:1.7;color:var(--mut);margin-bottom:14px;}
  .verdict b{color:var(--ink);}
  .verdict .hit{color:var(--keep);} .verdict .miss{color:var(--rej);}
  .big{font-family:var(--display);font-weight:400;font-size:40px;font-weight:800;background:linear-gradient(120deg,#38d9c4,#7c9bff);
    -webkit-background-clip:text;background-clip:text;color:transparent;}
  .btn{font-family:var(--display);font-weight:400!important;background:linear-gradient(120deg,#2bb9a6,#38d9c4);color:#04201c;border:0;border-radius:12px;
    padding:12px 26px;font:inherit;font-size:15px;font-weight:800;cursor:pointer;}
  #hint{position:fixed;inset:0;top:0;right:0;bottom:0;left:0;display:flex;align-items:center;justify-content:center;
    z-index:40;padding:16px;pointer-events:none;transition:opacity .45s ease;}
  #hint.gone{opacity:0;}
  .hcard{background:rgba(20,26,39,.92);border:1px solid var(--line);border-radius:16px;padding:18px 22px;max-width:380px;
    text-align:center;box-shadow:0 14px 44px rgba(0,0,0,.5);}
  .hcard .keys{margin-bottom:10px;}
  .hcard p{font-size:13.5px;line-height:1.62;}
  .hcard .go{margin-top:11px;color:var(--keep);font-weight:800;letter-spacing:1px;text-transform:uppercase;font-size:12px;
    animation:pulse 1.5s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}

  /* ---- juice layer (shared recipe across the fleet) ---- */
  .stars{display:flex;justify-content:center;gap:8px;margin:2px 0 8px;height:34px;}
  .stars svg{width:32px;height:32px;opacity:.18;transform:scale(.6);transition:opacity .25s,transform .35s cubic-bezier(.2,1.6,.4,1);}
  .stars svg.on{opacity:1;transform:scale(1);}
  .ribbon{font-family:var(--display);display:inline-block;background:#38d9c4;color:#04201c;font-size:11px;font-weight:900;letter-spacing:1.6px;
    padding:4px 10px;border-radius:999px;margin-bottom:8px;opacity:0;transform:translateY(6px);transition:opacity .3s,transform .3s;}
  .ribbon.show{opacity:1;transform:none;}
  .btn{border-bottom:4px solid rgba(0,0,0,.38)!important;border-radius:13px!important;min-width:180px;font-size:16px!important;font-weight:900!important;
    transition:transform .06s,border-bottom-width .06s;}
  .btn:active{transform:translateY(3px)!important;border-bottom-width:1px!important;}
  #intro{position:fixed;left:50%;top:21%;transform:translate(-50%,-50%) scale(.9);z-index:45;pointer-events:none;
    text-align:center;opacity:0;transition:opacity .25s,transform .25s;
    background:rgba(10,13,22,.88);border:1px solid #38d9c444;border-radius:16px;padding:14px 22px;
    box-shadow:0 16px 50px rgba(0,0,0,.5);max-width:86vw;}
  #intro.show{opacity:1;transform:translate(-50%,-50%) scale(1);}
  #intro .n{font-family:var(--display);font-size:13px;font-weight:800;letter-spacing:3px;color:#8a95b3;}
  #intro .t{font-family:var(--display);font-weight:400;font-size:clamp(18px,4.3vw,30px);font-weight:900;color:#38d9c4;text-shadow:0 6px 30px #38d9c455;margin-top:4px;white-space:nowrap;}
  #intro .s{font-size:14px;color:#e8edf7;margin-top:8px;opacity:.85;}
  #fx{position:fixed;inset:0;z-index:55;pointer-events:none;}
  .pbtn{border-bottom:4px solid rgba(0,0,0,.5)!important;background:linear-gradient(180deg,#1b2131,#131826)!important;transition:transform .06s,border-bottom-width .06s!important;}
  .pbtn:active{transform:translateY(3px)!important;border-bottom-width:1px!important;}
</style>
</head>

</div>
<footer><span>No ads here · no account · free</span><a href="/" id="hublink">more games → Gridlings</a></footer>

    <p><b>Keep it, or reject it.</b> A / S / D or tap.</p><p class="go">teach the machine your rule</p>
  </div>
</div>

  for (var mi = 0; mi < 12; mi++) {
    var mx = ((mi * 137.5) % L.w + nowT * (4 + mi % 3) * 3) % L.w, my = ((mi * 89.3) % L.h + Math.sin(nowT * .6 + mi) * 12);
    cx.fillStyle = "rgba(56,217,196," + (0.05 + 0.05 * Math.sin(nowT * 1.3 + mi)) + ")";
    cx.beginPath(); cx.arc(mx, my, 1.5 + (mi % 3), 0, 7); cx.fill();
  }
  var ped = cx.createRadialGradient(L.cx, L.cy + 10, 10, L.cx, L.cy + 10, Math.min(L.w, L.h) * .34);
  ped.addColorStop(0, "rgba(56,217,196,.14)"); ped.addColorStop(.6, "rgba(56,217,196,.04)"); ped.addColorStop(1, "rgba(56,217,196,0)");
  cx.fillStyle = ped; cx.fillRect(0, 0, L.w, L.h);
  var vg = cx.createRadialGradient(L.cx, L.cy, L.h * .3, L.cx, L.cy, Math.max(L.w, L.h) * .75);
  vg.addColorStop(0, "rgba(0,0,0,0)"); vg.addColorStop(1, "rgba(0,0,0,.5)");
  cx.fillStyle = vg; cx.fillRect(0, 0, L.w, L.h);
  cx.textAlign = "center";
  /* HUD */
  cx.fillStyle = "#e6ecff"; cx.font = "400 28px 'Righteous',-apple-system,sans-serif";
  cx.fillText(String(score), L.cx, 32);
  cx.font = "700 12px -apple-system,'Segoe UI',sans-serif"; cx.fillStyle = "#7b88ab";
  cx.textAlign = "left";
  cx.fillText(phase === "train" ? "LABELS  " + (LABEL_BUDGET - labels.length) + " left" : "EXAM  " + testIdx + "/" + testQ.length, 14, 22);
  cx.textAlign = "right";
  cx.fillText(phase === "exam" ? "♥".repeat(Math.max(0, lives)) + "♡".repeat(Math.max(0, 3 - lives)) : "BEST " + best, L.w - 14, 22);
  /* label budget pips */
  var pw = Math.min(320, L.w * .55), px = L.cx - pw / 2, py = 44;
  for (var i = 0; i < LABEL_BUDGET; i++) {
    var w = pw / LABEL_BUDGET - 3;
    cx.fillStyle = i < labels.length ? (labels[i].keep ? "#38d9c4" : "#ff6b9d") : "rgba(255,255,255,.10)";
    rrm(px + i * (pw / LABEL_BUDGET), py, w, 7, 3.5); cx.fill();
    if (i < labels.length) { cx.fillStyle = "rgba(255,255,255,.35)"; rrm(px + i * (pw / LABEL_BUDGET) + 2, py + 1, w - 4, 2.2, 1); cx.fill(); }
  }
  /* the specimen under judgement */
  /* the specimen IS the interaction -- capped at 64px it sat as a small badge
     in the middle of a large screen, hard to read the wobble/spikes on */
  var R = Math.max(34, Math.min(92, L.h * .16, L.w * .20));
  /* sorted specimens fly off to their bins */
  for (var gi = ghosts.length - 1; gi >= 0; gi--) { var gh = ghosts[gi]; gh.t += dt; if (gh.t > gh.life) { ghosts.splice(gi, 1); continue; }
    gh.x += gh.vx * dt; gh.y += gh.vy * dt; gh.vy += 900 * dt;
    drawSpec(gh.s, gh.x, gh.y, R * (1 - gh.t / gh.life * .5), 1 - gh.t / gh.life);
    if (gh.ok !== null && gh.t < .25) { cx.fillStyle = gh.ok ? "#38d9c4" : "#ff6b9d"; cx.font = "400 22px 'Righteous',sans-serif"; cx.textAlign = "center"; cx.fillText(gh.ok ? "\u2713" : "\u2717", gh.x, gh.y - R * .9); } }
  /* the incoming specimen slides in along the rail */
  curT = Math.min(1, curT + dt * 4.5);
  var ce = 1 - Math.pow(1 - curT, 3), cxOff = (1 - ce) * L.w * .45;
  if (cur) drawSpec(cur, L.cx + cxOff, L.cy, R, 1);
  /* during the exam a scan beam sweeps the specimen while the model decides */
  if (phase === "exam" && cur && !over) {
    scanT += dt; var per = Math.max(.26, .62 - testIdx * .012), sf = Math.min(1, scanT / per);
    var sy = L.cy - R + sf * R * 2;
    cx.save(); cx.beginPath(); cx.arc(L.cx + cxOff, L.cy, R * 1.05, 0, 7); cx.clip();
    var sg = cx.createLinearGradient(0, sy - 14, 0, sy + 14); sg.addColorStop(0, "rgba(124,155,255,0)"); sg.addColorStop(.5, "rgba(124,155,255,.55)"); sg.addColorStop(1, "rgba(124,155,255,0)");
    cx.fillStyle = sg; cx.fillRect(L.cx - R * 1.1, sy - 14, R * 2.2, 28); cx.restore();
    /* the model chip: which trait it is reading */
    var chip = "MODEL READS " + traitName(model.trait), cw2;
    cx.font = "400 12px 'Righteous',sans-serif"; cw2 = cx.measureText(chip).width + 26;
    var chx = L.cx - cw2 / 2, chy = L.cy - R - 46, tint = lastSays === null ? "124,155,255" : lastSays ? "56,217,196" : "255,107,157";
    cx.fillStyle = "rgba(" + tint + ",.16)"; rrm(chx, chy, cw2, 26, 13); cx.fill();
    cx.strokeStyle = "rgba(" + tint + ",.55)"; cx.lineWidth = 1; cx.stroke();
    cx.fillStyle = "rgb(" + tint + ")"; cx.textAlign = "center"; cx.fillText(chip, L.cx, chy + 18);
  }
  /* phase caption */
  cx.textAlign = "center"; cx.fillStyle = "#7b88ab"; cx.font = "600 12.5px -apple-system,'Segoe UI',sans-serif";
  if (phase === "train") {
    cx.fillStyle = "#ffc14d"; cx.font = "400 16px 'Righteous',-apple-system,sans-serif";
    var cap = Math.min(L.cy + R + 32, L.h - 78);
    cx.fillText("TEACH IT:  keep the " + traitValue(ruleTrait, ruleKeepWhen).toUpperCase() + " ones", L.cx, cap);
    cx.fillStyle = "#7b88ab"; cx.font = "600 12px -apple-system,'Segoe UI',sans-serif";
    cx.fillText("skipping is free  ·  it cannot see this instruction, only your labels", L.cx, cap + 20);
  }
  else {
    cx.fillStyle = "#7c9bff"; cx.font = "400 14px 'Righteous',-apple-system,sans-serif";
    cx.fillText("YOUR MODEL IS SORTING — " + traitName(model.trait) + " decides", L.cx, L.cy + R + 34);
  }
  /* what the labelled examples looked like, as a tiny 2x2 coverage map:
     this is the whole strategy made visible without a word of tutorial */
  if (phase === "train") {
    var cells = [[false, false], [false, true], [true, false], [true, true]];
    var cw = 30, gap = 7, tot = cells.length * (cw + gap) - gap, sx = L.cx - tot / 2, sy = L.h - 58;
    cx.font = "700 9px -apple-system,'Segoe UI',sans-serif"; cx.fillStyle = "#7b88ab";
    cx.fillText("EXAMPLES YOU HAVE TAUGHT IT", L.cx, sy - 9);
    cells.forEach(function (c, ci) {
      var n = labels.filter(function (Lb) { return Lb.s.spiky === c[0] && Lb.s.warm === c[1]; }).length;
      var X = sx + ci * (cw + gap);
      cx.fillStyle = n ? "rgba(124,155,255,.22)" : "rgba(255,255,255,.05)";
      cx.fillRect(X, sy, cw, cw);
      cx.strokeStyle = n ? "rgba(124,155,255,.55)" : "rgba(255,255,255,.10)"; cx.lineWidth = 1;
      cx.strokeRect(X + .5, sy + .5, cw - 1, cw - 1);
      drawSpec({ spiky: c[0], warm: c[1], wob: ci, n: 4 }, X + cw / 2, sy + cw / 2, 10, n ? .95 : .3);
      if (n) { cx.fillStyle = "#e6ecff"; cx.font = "800 9px -apple-system,'Segoe UI',sans-serif";
               cx.fillText(String(n), X + cw - 6, sy + cw - 3); }
    });
  }
  /* particles + pops */
  for (var pi = parts.length - 1; pi >= 0; pi--) {
    var p = parts[pi]; p.t += dt;
    if (p.t >= p.life) { parts.splice(pi, 1); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 420 * dt;
    cx.globalAlpha = 1 - p.t / p.life; cx.fillStyle = p.c;
    cx.beginPath(); cx.arc(p.x, p.y, p.r, 0, 7); cx.fill(); cx.globalAlpha = 1;
  }
  for (var qi = pops.length - 1; qi >= 0; qi--) {
    var q = pops[qi]; q.a += dt;
    if (q.a >= q.life) { pops.splice(qi, 1); continue; }
    cx.globalAlpha = 1 - q.a / q.life;
    cx.font = "800 " + q.s + "px -apple-system,'Segoe UI',sans-serif"; cx.fillStyle = q.c;
    cx.fillText(q.t, q.x, q.y - q.a * 30); cx.globalAlpha = 1;
  }
  cx.restore();
}
var last = 0;
function loop(ts) { var dt = Math.min(.05, (ts - last) / 1000 || .016); last = ts; update(dt); draw(dt); requestAnimationFrame(loop); }
layout(); newRun(); requestAnimationFrame(loop);
window.MC_READY = true;

var bm = document.getElementById("bmute");
bm.textContent = muted ? "\ud83d\udd07" : "\ud83d\udd0a";
bm.addEventListener("click", function () {
  muted = !muted;
  bm.textContent = muted ? "\ud83d\udd07" : "\ud83d\udd0a";
  try { localStorage.setItem("mcMute", muted ? "1" : "0"); } catch (e) {}
});

/* ===== juice layer: count-up, stars, ribbon, confetti, intro card ===== */
var fxc = document.getElementById("fx"), fxx = fxc.getContext("2d"), confetti = [], introT = 0, countT = 0, countTo = 0, countEl = null, countPrefix = "";
function fxLayout() { var dpr = Math.min(window.devicePixelRatio || 1, 2); fxc.width = innerWidth * dpr; fxc.height = innerHeight * dpr; fxx.setTransform(dpr, 0, 0, dpr, 0, 0); }
function confettiBurst(n) {
  fxLayout();
  var cols = ["#38d9c4","#ff6b9d","#7c9bff","#ffffff"];
  for (var i = 0; i < n; i++) { var side = i % 2 ? 1 : -1;
    confetti.push({ x: innerWidth / 2 + side * innerWidth * .46, y: innerHeight * .62,
      vx: -side * (180 + Math.random() * 360), vy: -Math.random() * 700 - 260, r: 3 + Math.random() * 3.5, a: Math.random() * 7, va: (Math.random() - .5) * 14,
      c: cols[i % cols.length], t: 0, life: 1.6 + Math.random() * .8 }); }
}
function fxStep(dt) {
  if (!confetti.length) { if (fxc.width) fxx.clearRect(0, 0, innerWidth, innerHeight); return; }
  fxx.clearRect(0, 0, innerWidth, innerHeight);
  for (var i = confetti.length - 1; i >= 0; i--) {
    var c = confetti[i]; c.t += dt; if (c.t > c.life) { confetti.splice(i, 1); continue; }
    c.vy += 900 * dt; c.x += c.vx * dt; c.y += c.vy * dt; c.vx *= .992; c.a += c.va * dt;
    fxx.save(); fxx.translate(c.x, c.y); fxx.rotate(c.a); fxx.globalAlpha = Math.min(1, (c.life - c.t) * 1.5);
    fxx.fillStyle = c.c; fxx.fillRect(-c.r, -c.r * .6, c.r * 2, c.r * 1.2); fxx.restore();
  }
}
function setStars(n) {
  var el = document.getElementById("dstars"); if (!el) return; var h = "";
  for (var i = 0; i < 3; i++) h += "<svg viewBox='0 0 24 24'><path d='M12 2l3 6.6 7 .8-5.2 4.8 1.5 7L12 17.6 5.7 21.2l1.5-7L2 9.4l7-.8z' fill='#38d9c4' stroke='#04201c' stroke-width='1.2' stroke-linejoin='round'/></svg>";
  el.innerHTML = h;
  var svgs = el.querySelectorAll("svg");
  for (var k = 0; k < n; k++) (function (k) { setTimeout(function () { svgs[k].classList.add("on"); sfx.good(); }, 500 + k * 220); })(k);
}
function countUp(el, to, prefix) { countEl = el; countTo = to; countT = 0; countPrefix = prefix || ""; el.textContent = countPrefix + "0"; }
function juiceTick(dt) {
  if (introT > 0) { introT -= dt; if (introT <= 0) { document.getElementById("intro").classList.remove("show");
    var hh = document.getElementById("hint"); if (hh && !armed) hh.classList.remove("gone"); } }
  if (countEl) { countT = Math.min(1, countT + dt / .7); var e = 1 - Math.pow(1 - countT, 3);
    countEl.textContent = countPrefix + Math.round(countTo * e); if (countT >= 1) countEl = null; }
  fxStep(dt);
}
function showIntro(n, t, s2) {
  var el = document.getElementById("intro");
  document.getElementById("in").textContent = n; document.getElementById("it").textContent = t; document.getElementById("is").textContent = s2 || "";
  el.classList.add("show"); introT = 1.4;
  var hh = document.getElementById("hint"); if (hh && !armed) hh.classList.add("gone");
}
window.addEventListener("resize", fxLayout);
