# Cloudflare Pages 配置：CI 从仓库根目录执行 `wrangler pages deploy dist`，
# 本文件为部署挂上 D1 绑定，functions/ 目录随之生效（文件路由，静态站不受影响）。
name = "aiyangmao"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "dist"

# 第一方访问统计（零外部账号）：functions/api/hit.js 写入，会话内经 MCP 直接查询。
[[d1_databases]]
binding = "HITS"
database_name = "baipiaoji-hits"
database_id = "1ee08cb8-a174-4ec3-8dbc-89ef5d28aa05"

# Server-created one-time Checkout. Secret values live only in Cloudflare:
# STRIPE_SECRET_KEY and STRIPE_WEBHOOK_SECRET. Test/live keys must match mode.
# Existing EUR49 / 30-day price is a hypothesis, not market validation.
[vars]
ADS_PRICE_CENTS = "4900"
ADS_CURRENCY = "EUR"
ADS_DAYS = "30"
ADS_STRIPE_MODE = "live"
ADS_AUTOMATIC_TAX = "false"
ADS_WATCH_ETA = "2h"

# BNB Smart Chain USDT. Recipient and watch credential stay outside git.
# Availability additionally requires configured secrets and healthy background checks.
# Independent 49 USDT experiment price, not an exchange-rate conversion of EUR49.
ADS_WEB3_ENABLED = "true"
ADS_WALLET_CHAIN = "bsc"
ADS_WEB3_PRICE_USD = "49.00"
ADS_WEB3_RPC_URL = "https://rpc-bsc.48.club"


# Owner-authorized prepaid workbench membership; shares the configured Web3 rail.
MEMBERS_ENABLED = "true"
