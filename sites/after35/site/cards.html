<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>经验卡 — 三十五后</title>
<meta name="description" content="失业中年人发出的经验卡与找人的需求:行业、年限、能提供什么、报价。点「查看联系方式」直接联系,没有中介。">
<link rel="canonical" href="https://35.agiscorecard.com/cards">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="top"><div class="wrap">
  <a class="brand" href="/">三十五<b>后</b></a>
  <nav class="main"><a href="/cards" aria-current="page">经验卡</a><a href="/post">发一张</a><a href="/paths">变现路径</a><a href="/ai-leverage">经验×AI</a><a href="/restart">二次启动</a><a href="/checklist">失业第一周</a><a href="/about">关于</a></nav>
</div></header>
<main class="wrap">
  <h1>经验卡</h1>
  <p class="lead muted">在线 <strong data-stat="offer">–</strong> 张经验卡,<strong data-stat="need">–</strong> 条需求,<strong data-stat="team">–</strong> 个在找合伙人的项目(<a href="/team">组队页</a>)。点「查看联系方式」直接联系对方;我们不做中介。</p>
  <div class="aibox">
    <div class="k">AI 撮合</div>
    <p style="margin:6px 0 10px">一句话说你要找什么人或什么项目,AI 读一遍现有的卡,按接近程度给你排,理由逐条列出。不用先发卡。</p>
    <form id="aif"><input type="search" id="aiq" maxlength="200" placeholder="例如:找一个懂工厂采购的人帮我们压成本 / 想找技术合伙人做 AI 质检"><button class="cta primary" type="submit">找</button></form>
    <div id="aiout" style="margin-top:10px"></div>
  </div>
  <div class="filters" id="filters">
    <button type="button" data-kind="" aria-pressed="true">全部</button>
    <button type="button" data-kind="offer" aria-pressed="false">我有经验</button>
    <button type="button" data-kind="need" aria-pressed="false">找有经验的人</button>
    <button type="button" data-kind="team" aria-pressed="false">找合伙人</button>
    <input type="search" id="q" placeholder="搜城市、行业、关键词" aria-label="搜索">
  </div>
  <div class="filters" id="ind">
    <button type="button" data-ind="" aria-pressed="true">全部行业</button>
    <button type="button" data-ind="制造与供应链">制造与供应链</button><button type="button" data-ind="互联网与软件">互联网与软件</button><button type="button" data-ind="零售与电商">零售与电商</button><button type="button" data-ind="金融与财务">金融与财务</button><button type="button" data-ind="教育与培训">教育与培训</button><button type="button" data-ind="医疗与健康">医疗与健康</button><button type="button" data-ind="建筑与地产">建筑与地产</button><button type="button" data-ind="物流与运输">物流与运输</button><button type="button" data-ind="政府与事业单位">政府与事业单位</button><button type="button" data-ind="媒体与广告">媒体与广告</button><button type="button" data-ind="餐饮与服务业">餐饮与服务业</button><button type="button" data-ind="其他">其他</button>
  </div>
  <div id="list" class="cards"><div class="empty">读取中…</div></div>
  <p style="margin-top:20px"><a class="cta primary" href="/post" data-ev="post_open" data-l="cards_page">发一张我的卡</a></p>
  <p class="small muted">看到可疑内容(贷款、刷单、收费培训之类)?这些卡在发布时就会被拦下人工复核;漏网的请到 <a href="/about">关于页</a> 按说明反馈。</p>
</main>
<footer><div class="wrap">
  <div class="links"><a href="/">首页</a><a href="/post">发一张</a><a href="/paths">变现路径</a><a href="/checklist">失业第一周</a><a href="/about">关于与撤卡</a></div>
  <div>三十五后 · <a href="https://agiscorecard.com/">AGI Scorecard</a> 网络的中文子站 · 不提供就业中介服务</div>
</div></footer>
<script src="/app.js"></script>
<script>
(function(){
  var qs = new URLSearchParams(location.search);
  var kind = ["offer","need","team"].indexOf(qs.get("kind")) >= 0 ? qs.get("kind") : ""; var ind = qs.get("industry") || ""; var list = document.getElementById("list"); var q = document.getElementById("q");
  function press(sel, attr, val){ document.querySelectorAll(sel).forEach(function(x){ x.setAttribute("aria-pressed", x.getAttribute(attr) === val ? "true" : "false"); }); }
  press("#filters button", "data-kind", kind); press("#ind button", "data-ind", ind);
  function apply(){
    var t = q.value.trim().toLowerCase();
    a35loadCards(list, { limit: 200, filter: function(c){
      if (kind && c.kind !== kind) return false;
      if (ind && c.industry !== ind) return false;
      if (!t) return true;
      return [c.city, c.field, c.headline, c.body, c.offers.join(" "), c.pay].join(" ").toLowerCase().indexOf(t) >= 0;
    }});
  }
  document.querySelectorAll("#filters button").forEach(function(b){ b.addEventListener("click", function(){
    document.querySelectorAll("#filters button").forEach(function(x){ x.setAttribute("aria-pressed","false"); });
    b.setAttribute("aria-pressed","true"); kind = b.getAttribute("data-kind"); a35ev("filter_use", kind || "all"); apply();
  }); });
  document.querySelectorAll("#ind button").forEach(function(b){ b.addEventListener("click", function(){ press("#ind button", "data-ind", b.getAttribute("data-ind")); ind = b.getAttribute("data-ind"); a35ev("filter_use", "ind:" + (ind || "all")); apply(); }); });
  var tm; q.addEventListener("input", function(){ clearTimeout(tm); tm = setTimeout(apply, 250); });
  a35stats(); apply();
  document.getElementById("aif").addEventListener("submit", function(e){ e.preventDefault(); var v = document.getElementById("aiq").value.trim(); if (v.length < 4) return; a35matchText(v, document.getElementById("aiout"), kind); history.replaceState(null, "", "/cards?" + (kind ? "kind=" + kind + "&" : "") + "q=" + encodeURIComponent(v)); });
  if (qs.get("q")) { document.getElementById("aiq").value = qs.get("q"); a35matchText(qs.get("q"), document.getElementById("aiout"), kind); }
})();
</script>
</body>
</html>
