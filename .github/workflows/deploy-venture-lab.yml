name: Validate and deploy commercial experiments
on:
  push:
    branches: [main, 'codex/venture-lab-*']
    paths:
      - 'sites/venture-lab/**'
      - "tools/discovery/**"
      - 'agents/tradecheck-mcp/**'
      - 'agents/filinglens-mcp/**'
      - '.github/workflows/deploy-venture-lab.yml'
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: venture-lab-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Guard — a replayed/stale push deploys main's tip, never rolls back
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git fetch origin main -q || { echo "::warning::fetch failed — stale-run guard skipped"; exit 0; }
          TIP=$(git rev-parse origin/main 2>/dev/null || true)
          case "$TIP" in
            "" | *[!0-9a-f]* ) echo "::warning::main tip unresolvable — stale-run guard skipped"; exit 0 ;;
          esac
          if [ "$(git rev-parse HEAD)" != "$TIP" ]; then
            echo "::warning::stale run — deploying main tip instead of rolling back"
            git reset --hard "$TIP"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build and validate the vertical MCP package
        working-directory: agents/tradecheck-mcp
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
          npm test
          node scripts/evaluate.mjs
          npm run package
      - name: Validate and package FilingLens MCP
        working-directory: agents/filinglens-mcp
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
          node scripts/evaluate.mjs
          npm run package
      - name: Build and validate search discovery pages
        run: |
          python3 tools/discovery/build.py --only venture
          python3 tools/discovery/validate.py --only venture
      - name: Install pinned SQL runtime, test and build
        working-directory: sites/venture-lab
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
          npm run build
          npx --yes wrangler@4 deploy --dry-run --outdir /tmp/venture-lab-worker
      - name: Check domain ownership and prepare isolated measurement table
        if: github.ref == 'refs/heads/main'
        working-directory: sites/venture-lab
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_TOKEN_ZONE: ${{ secrets.CLOUDFLARE_API_TOKEN_ZONE }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/prepare.mjs
      - name: Deploy portfolio tools
        if: github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          workingDirectory: sites/venture-lab
          command: deploy --config wrangler.generated.json
      - name: Verify public pages and event persistence
        if: github.ref == 'refs/heads/main'
        working-directory: sites/venture-lab
        run: node scripts/smoke.mjs
      - name: Publish honest experiment baseline
        if: github.ref == 'refs/heads/main'
        working-directory: sites/venture-lab
        run: node scripts/report.mjs

      - name: Verify public search pages and notify IndexNow once
        if: github.ref == 'refs/heads/main'
        run: node tools/discovery/live.mjs venture ${{ github.run_attempt == 1 && '--submit' || '' }}

      - name: Read fleet crawl health and aggregate traffic
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        timeout-minutes: 3
        run: python3 tools/discovery/audit.py
