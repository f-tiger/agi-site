name: BPJ Manju homepage traffic
on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bpj-manju-traffic-monitor
  cancel-in-progress: false
jobs:
  read-hourly-traffic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify hourly comparison
        run: node --test tools/fleet/bpj-manju-traffic.test.mjs
      - name: Check the public directory homepage
        env:
          CLOUDFLARE_API_TOKEN_ZONE: ${{ secrets.CLOUDFLARE_API_TOKEN_ZONE }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: node tools/fleet/bpj-manju-traffic.mjs
