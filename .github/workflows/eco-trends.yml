name: getecoback DE and GB trend evidence (daily)

# Keep the existing daily collection time. This workflow does not start a
# growth loop or publish pages. A manual evidence-only run validates source
# receipts and technical audits without refreshing committed snapshots.
on:
  schedule:
    - cron: '30 4 * * *'
  workflow_dispatch:
    inputs:
      evidence_only:
        description: Collect dated DE/GB evidence without changing committed snapshots
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: eco-trends
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sites/getecoback
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node tools/fetch_trends_de.mjs
        if: ${{ !inputs.evidence_only }}
      - name: Rising related queries (fast-capture signal)
        if: ${{ !inputs.evidence_only }}
        run: |
          pip install -q trendspy
          python3 tools/fetch_trends_rising.py || echo "::warning::rising fetch failed — keep last good"
      # Five-year seasonality, once a month (2026-09-24, owner: 「监控 Google trends
      # 做好品类扩展与网站自动化」). The step runs daily but the tool exits in a
      # second unless data/seasonality-de.json is ≥28 days old, so there is no new
      # cron and a failed month retries the next day instead of waiting a month.
      # It comes AFTER the rising fetch so the daily rising quota is spent first.
      # Cost: ~5 runner minutes once a month (12 batches × 20 s gap + requests)
      # + ~1 s/day for the age check. The offline test runs first: an instrument
      # the daily digest reads unattended must not ship a scale bug.
      # The expansion queue's own basket (DE-QUEUE, 2026-09-24, owner: 「站点应该
      # 持续扩展」) rides the same step with its own 28-day age check: every
      # queued or built term gets a number on the German scale, and the daily
      # run reads it before building. 2 batches ≈ +1 runner minute a month.
      - name: Monthly seasonality (5-year, only when ≥28 days old)
        if: ${{ !inputs.evidence_only }}
        run: |
          if python3 -c "import sys, os; sys.path.insert(0,'tools'); import fetch_seasonality as f; q=os.path.join(f.ROOT,'data','seasonality-de-queue.json'); sys.exit(0 if f.is_fresh(f.OUT, 28) and f.is_fresh(q, 28) else 1)"; then
            echo "seasonality files are fresh — skipped"; exit 0
          fi
          pip install -q pandas trendspy
          python3 tools/test_seasonality.py
          python3 tools/fetch_seasonality.py --if-older-than 28 || echo "::warning::seasonality refresh failed — keep last good"
          sleep 20
          python3 tools/fetch_seasonality.py --market DE-QUEUE --if-older-than 28 || echo "::warning::queue seasonality refresh failed — keep last good"
      # Same daily trigger; no new schedule, publication queue or paid API.
      # Evidence is run-specific: do not commit noisy reports or customer data.
      - name: Validate bounded opportunity collection
        working-directory: .
        run: python3 -m unittest discover -s tools -p test_eco_evolution.py
      - name: Collect DE and GB evidence and existing-page opportunities
        working-directory: .
        run: python3 tools/eco_evolution.py --output-dir "$RUNNER_TEMP/eco-evolution"
      - name: Keep dated source receipts and candidate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eco-evolution-${{ github.run_id }}
          path: ${{ runner.temp }}/eco-evolution/
          if-no-files-found: warn
          retention-days: 14
      - name: Commit snapshot if changed
        if: ${{ !inputs.evidence_only }}
        run: |
          git config user.name 'Claude'
          git config user.email 'noreply@anthropic.com'
          git add data/trends-de.json
          git add data/trends-rising.json 2>/dev/null || true
          git add data/seasonality-de.json 2>/dev/null || true
          git add data/seasonality-de-queue.json 2>/dev/null || true
          git diff --cached --quiet || { git commit -m "chore(trends): 德国热搜触发器快照 $(date -u +%F)"; git pull --rebase origin main; git push origin main; }
