name: Check BPJ video and search actions
on:
  pull_request:
    paths:
      - 'sites/baipiaoji/assets/manju-live-search.js'
      - 'sites/baipiaoji/assets/depth.*'
      - 'sites/baipiaoji/scripts/depth-pages.mjs'
      - 'sites/baipiaoji/scripts/test-depth*.mjs'
      - 'sites/baipiaoji/lib/depth-signals.mjs'
      - 'sites/baipiaoji/assets/studio/video-*.mjs'
      - 'sites/baipiaoji/scripts/test-manju-search-browser.mjs'
      - 'sites/baipiaoji/scripts/test-video-events-browser.mjs'
      - 'tools/fleet-analytics/**'
      - '.github/workflows/check-bpj-video-search.yml'
permissions:
  contents: read
concurrency:
  group: bpj-video-search-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build public pages and verify the fixed analytics contract
        run: |
          npm ci --prefix tools/revenue-studio --ignore-scripts
          node --test sites/baipiaoji/scripts/test-depth.mjs
          node --test tools/fleet-analytics/business.test.mjs tools/fleet-analytics/integrity.test.mjs
          (cd sites/baipiaoji && npm run build)
          node tools/revenue-studio/build.mjs --site bpj --out sites/baipiaoji/dist
          node tools/member-studio/build.mjs --out sites/baipiaoji/dist
          node sites/baipiaoji/scripts/finish-experience.mjs --out sites/baipiaoji/dist
          python3 tools/fleet-analytics/coverage.py --site bpj --out sites/baipiaoji/dist --write
          python3 tools/fleet-analytics/coverage.py --site bpj --out sites/baipiaoji/dist
          (cd sites/baipiaoji && node scripts/verify-dist.mjs && node scripts/check-canonical-routes.mjs && node scripts/test-video-business.mjs --dist)
      - name: Verify discovery requests, actual exports and private input exclusions
        run: |
          node tools/revenue-studio/node_modules/playwright/cli.js install --with-deps chromium --only-shell
          node sites/baipiaoji/scripts/test-depth-browser.mjs
          node sites/baipiaoji/scripts/test-manju-search-browser.mjs
          node sites/baipiaoji/scripts/test-video-events-browser.mjs
          node sites/baipiaoji/scripts/test-video-business-browser.mjs
