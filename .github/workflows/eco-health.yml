name: Site health check & weekly re-index
# ── 迁入公开 monorepo f-tiger/agi-site(2026-08-19,owner 决定)──
# 原仓 .github 为历史档案。公开仓 Actions 分钟免费。
# 本 workflow 的 run 步骤默认 working-directory: sites/getecoback/。


on:
  schedule:
     # 每天 05:00 UTC 健康检查（欧洲清晨，流量低谷）
     - cron: "0 5 * * *"
  workflow_dispatch: {}

jobs:
  healthcheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sites/getecoback
    steps:
      - uses: actions/checkout@v4

      - name: Check key pages return 200 and contain affiliate tag
        run: |
          set -e
          fail=0
          check() {
            url="$1"; must_contain="$2"
            # Same retry wrapper as deploy-getecoback.yml: one edge hiccup at
            # 05:00 UTC must not turn the daily health run red.
            for attempt in 1 2 3; do
              body=$(curl -sL --max-time 20 -w "\n%{http_code}" "$url" || echo -e "\n000")
              code=$(echo "$body" | tail -1)
              [ "$code" = "200" ] && break
              sleep 3
            done
            if [ "$code" != "200" ]; then
              echo "::error::$url returned HTTP $code"
              fail=1
            elif [ -n "$must_contain" ] && ! echo "$body" | grep -q "$must_contain"; then
              echo "::error::$url is 200 but missing expected content: $must_contain"
              fail=1
            else
              echo "OK $url ($code)"
            fi
          }
          check "https://getecoback.com/" "tag=getecoback-21"
          check "https://getecoback.com/sitemap.xml" "<urlset"
          check "https://getecoback.com/guide/beste-tragbare-klimaanlage-hitzewelle.html" "tag=getecoback-21"
          check "https://getecoback.com/en/" "tag=getecoback-21"
          check "https://getecoback.com/dc2860e32f47689a11c7bc07a21f6ffb.txt" "dc2860e32f47689a11c7bc07a21f6ffb"
          exit $fail

      # Delta-only, like the deploy workflow's IndexNow step (its comment: the
      # protocol's own FAQ asks for URLs that actually changed; resubmitting the
      # whole inventory reads as spam and devalues future submissions). Until
      # 2026-09-04 this step re-pinged all 198 sitemap URLs every Monday, which
      # contradicted that policy. Now: only <loc>s whose <lastmod> falls within
      # the last 7 days — the pages a weekly re-ping could legitimately be about.
      - name: Weekly IndexNow re-ping of pages modified in the last 7 days (Mondays only)
        if: always()
        run: |
          if [ "$(date -u +%u)" != "1" ]; then
            echo "Not Monday — skipping weekly re-ping."
            exit 0
          fi
          python3 - <<'PY'
          import datetime, json, re
          xml = open('site/sitemap.xml', encoding='utf-8').read()
          cutoff = (datetime.date.today() - datetime.timedelta(days=7)).isoformat()
          urls = []
          for block in re.findall(r'<url>(.*?)</url>', xml, re.S):
              loc = re.search(r'<loc>([^<]+)</loc>', block)
              mod = re.search(r'<lastmod>(\d{4}-\d{2}-\d{2})', block)
              if loc and mod and mod.group(1) >= cutoff:
                  urls.append(loc.group(1).strip())
          open('/tmp/idx_urls.json', 'w').write(json.dumps(urls))
          open('/tmp/idx_count', 'w').write(str(len(urls)))
          print(f"{len(urls)} sitemap URL(s) with lastmod >= {cutoff}")
          PY
          COUNT=$(cat /tmp/idx_count)
          if [ "$COUNT" = "0" ]; then
            echo "no page modified in the last 7 days — skipping the ping (a meaningless ping costs trust)"
            exit 0
          fi
          URLS=$(cat /tmp/idx_urls.json)
          curl -s -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "{\"host\":\"getecoback.com\",\"key\":\"dc2860e32f47689a11c7bc07a21f6ffb\",\"keyLocation\":\"https://getecoback.com/dc2860e32f47689a11c7bc07a21f6ffb.txt\",\"urlList\":${URLS}}" \
            -w "\nIndexNow HTTP status: %{http_code}\n" || true
