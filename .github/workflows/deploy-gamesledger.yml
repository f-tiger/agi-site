name: Deploy gamesledger

# 第五站(游戏证据层,PRD: docs/games-subsite-prd-2026-08.md)。
# 成本核算:push 路径 ~0.7 分/次;schedule 每日一次取数+部署 ~1 分 ≈ 30 分/月,公开仓免费。
# schedule 同时承担「站点自有触发器」职责:每日取 Valve 官方并发数 → 重建 → 部署。
on:
  push:
    branches: [main]
    paths: ["sites/gamesledger/**", ".github/workflows/deploy-gamesledger.yml"]
  schedule:
    - cron: "10 6 * * *"
  workflow_dispatch: {}

concurrency:
  group: deploy-gamesledger
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 防回滚守卫(2026-08-26 事故):GitHub 曾乱序补发数小时前的 push 事件,
      # 每个旧事件都按自己那个历史提交部署,把线上反复滚回旧代码——gridlings 的
      # 重定向修复当天被这样滚掉两次,CG 审核正好撞上白屏。这些站点的部署都是
      # 「按当前源码重建并发布」,所以旧事件的正确动作不是发布旧快照,而是发布
      # main 的当前 tip(幂等、绝不倒退)。用 reset --hard 而非 checkout:有 4 条
      # 流水线会 git push 回仓,detached HEAD 会让那一步失败。
      - name: Guard — a replayed/stale push deploys main's tip, never rolls back
        if: github.event_name == 'push'
        run: |
          # Fail-open by design: a network hiccup must never block a deploy —
          # without a resolvable tip we simply keep the pushed commit, which is
          # exactly the pre-guard behaviour.
          git fetch origin main -q || { echo "::warning::fetch failed — stale-run guard skipped"; exit 0; }
          TIP=$(git rev-parse origin/main 2>/dev/null || true)
          case "$TIP" in
            "" | *[!0-9a-f]* ) echo "::warning::main tip unresolvable — stale-run guard skipped"; exit 0 ;;
          esac
          if [ "$(git rev-parse HEAD)" != "$TIP" ]; then
            echo "::warning::stale run — HEAD $(git rev-parse --short HEAD) is behind main tip $(git rev-parse --short "$TIP"); deploying the tip instead of rolling production back"
            git reset --hard "$TIP"
          fi
      - name: Fetch official Steam data (schedule/dispatch only)
        if: github.event_name != 'push'
        working-directory: sites/gamesledger
        run: |
          python3 tools/fetch_steam.py
          python3 tools/fetch_top100.py || echo "::warning::top100 chart fetch failed (search pool keeps last good data)"
          python3 tools/fetch_trends_games.py || echo "::warning::trends fetch failed (trigger keeps last state)"
      - name: Weekly AI-disclosure sample (Mondays / dispatch)
        if: github.event_name != 'push'
        working-directory: sites/gamesledger
        run: |
          if [ "$(date -u +%u)" = "1" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python3 tools/fetch_ai_disclosures.py || echo "::warning::AI-disclosure sample failed this week (page keeps last good data)"
          else
            echo "not Monday — skipping weekly AI sample"
          fi
      - name: Commit refreshed data (schedule/dispatch only)
        if: github.event_name != 'push'
        run: |
          git config user.name "gamesledger-bot"
          git config user.email "noreply@anthropic.com"
          git add sites/gamesledger/data/
          git diff --cached --quiet || { git commit -m "chore(gamesledger): official Steam samples $(date -u +%F)"; git pull --rebase origin main; git push origin HEAD:main; }
      - name: Build
        working-directory: sites/gamesledger
        run: |
          if [ ! -f data/concurrents.json ]; then echo '{"samples":{}}' > data/concurrents.json; fi
          python3 tools/gen_site.py
      - name: Gate — pages parse & no empty site
        working-directory: sites/gamesledger
        run: |
          python3 - <<'PY'
          import json,re,glob,sys
          pages=glob.glob('site/*.html')
          assert len(pages)>=2, "site nearly empty"
          for p in pages:
              s=open(p,encoding='utf-8').read()
              for m in re.findall(r'<script type="application/ld\+json">(.*?)</script>', s, re.S):
                  json.loads(m)
          print(f"gate ok: {len(pages)} pages, all JSON-LD parses")
          PY
      - name: IndexNow ping (schedule/dispatch only)
        if: github.event_name != 'push'
        working-directory: sites/gamesledger
        run: |
          KEY=$(basename static/*.txt .txt)
          python3 - <<PYEOF
          import json, urllib.request, re
          urls = re.findall(r'<loc>([^<]+)</loc>', open('site/sitemap.xml').read())
          body = json.dumps({"host": "games.agiscorecard.com", "key": "$KEY",
                             "keyLocation": "https://games.agiscorecard.com/$KEY.txt", "urlList": urls}).encode()
          req = urllib.request.Request("https://api.indexnow.org/indexnow", data=body,
                                       headers={"Content-Type": "application/json"})
          try:
              print("indexnow:", urllib.request.urlopen(req, timeout=15).status, len(urls), "urls")
          except Exception as e:
              print("::warning::indexnow ping failed:", e)
          PYEOF
      - name: Deploy worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          workingDirectory: sites/gamesledger
          command: deploy
