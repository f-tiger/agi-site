name: Deploy gamesledger

# 第五站(游戏证据层,PRD: docs/games-subsite-prd-2026-08.md)。
# 成本核算:push 路径 ~0.7 分/次;schedule 每日一次取数+部署 ~1 分 ≈ 30 分/月,公开仓免费。
# schedule 同时承担「站点自有触发器」职责:每日取 Valve 官方并发数 → 重建 → 部署。
on:
  push:
    branches: [main]
    paths: ["sites/gamesledger/**", ".github/workflows/deploy-gamesledger.yml"]
  schedule:
    - cron: "10 6 * * *"
  workflow_dispatch: {}

concurrency:
  group: deploy-gamesledger
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 防回滚守卫(2026-08-26 事故):GitHub 曾乱序补发数小时前的 push 事件,
      # 每个旧事件都按自己那个历史提交部署,把线上反复滚回旧代码——gridlings 的
      # 重定向修复当天被这样滚掉两次,CG 审核正好撞上白屏。这些站点的部署都是
      # 「按当前源码重建并发布」,所以旧事件的正确动作不是发布旧快照,而是发布
      # main 的当前 tip(幂等、绝不倒退)。用 reset --hard 而非 checkout:有 4 条
      # 流水线会 git push 回仓,detached HEAD 会让那一步失败。
      - name: Guard — a replayed/stale push deploys main's tip, never rolls back
        if: github.event_name == 'push'
        run: |
          # Fail-open by design: a network hiccup must never block a deploy —
          # without a resolvable tip we simply keep the pushed commit, which is
          # exactly the pre-guard behaviour.
          git fetch origin main -q || { echo "::warning::fetch failed — stale-run guard skipped"; exit 0; }
          TIP=$(git rev-parse origin/main 2>/dev/null || true)
          case "$TIP" in
            "" | *[!0-9a-f]* ) echo "::warning::main tip unresolvable — stale-run guard skipped"; exit 0 ;;
          esac
          if [ "$(git rev-parse HEAD)" != "$TIP" ]; then
            echo "::warning::stale run — HEAD $(git rev-parse --short HEAD) is behind main tip $(git rev-parse --short "$TIP"); deploying the tip instead of rolling production back"
            git reset --hard "$TIP"
          fi
      - name: Fetch official Steam data (schedule/dispatch only)
        if: github.event_name != 'push'
        working-directory: sites/gamesledger
        run: |
          python3 tools/fetch_steam.py
          python3 tools/fetch_top100.py || echo "::warning::top100 chart fetch failed (search pool keeps last good data)"
          python3 tools/fetch_trends_games.py || echo "::warning::trends fetch failed (trigger keeps last state)"
      - name: Weekly AI-disclosure sample (Mondays / dispatch)
        if: github.event_name != 'push'
        working-directory: sites/gamesledger
        run: |
          if [ "$(date -u +%u)" = "1" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python3 tools/fetch_ai_disclosures.py || echo "::warning::AI-disclosure sample failed this week (page keeps last good data)"
          else
            echo "not Monday — skipping weekly AI sample"
          fi
      - name: Commit refreshed data (schedule/dispatch only)
        if: github.event_name != 'push'
        run: |
          git config user.name "gamesledger-bot"
          git config user.email "noreply@anthropic.com"
          git add sites/gamesledger/data/
          git diff --cached --quiet || { git commit -m "chore(gamesledger): official Steam samples $(date -u +%F)"; git pull --rebase origin main; git push origin HEAD:main; }
      - name: Build
        working-directory: sites/gamesledger
        run: |
          # A missing sample store must fail loudly — never build a site from nothing.
          [ -f data/concurrents.json ] || { echo "::error::data/concurrents.json missing"; exit 1; }
          python3 tools/gen_site.py
      - name: Gate — pages parse & no empty site
        working-directory: sites/gamesledger
        run: |
          python3 - <<'PY'
          import json,re,glob,sys
          pages=glob.glob('site/*.html')
          assert len(pages)>=2, "site nearly empty"
          verdicts=glob.glob('site/is-*-dead.html')
          assert len(verdicts)>=14, f"only {len(verdicts)} verdict pages (expected >=14)"
          for p in pages:
              s=open(p,encoding='utf-8').read()
              for m in re.findall(r'<script type="application/ld\+json">(.*?)</script>', s, re.S):
                  json.loads(m)
          print(f"gate ok: {len(pages)} pages ({len(verdicts)} verdicts), all JSON-LD parses")
          PY
      - name: Deploy worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          workingDirectory: sites/gamesledger
          command: deploy
      # Post-deploy self-check (2026-09-04): asserts the shape of a working deploy —
      # routing, sitemap/robots, the IndexNow key, JSON feeds, the live API, the badge
      # and a real 404. Runs BEFORE the IndexNow ping so a broken deploy is never pinged.
      # Read-only: never POSTs to /e.
      - name: Post-deploy self-check
        working-directory: sites/gamesledger
        run: |
          set -u
          BASE="https://games.agiscorecard.com"
          UA='gamesledger-deploy-selfcheck-bot (+ci; classified as bot by design)'
          fail=0
          # 1) 200 + zero redirects
          for p in / /methodology /dead-or-alive /is-team-fortress-2-dead /is-rust-dead; do
            ok=0; code=000; redirs=0
            for try in 1 2 3 4 5; do
              res=$(curl -s -o /dev/null -w '%{http_code} %{num_redirects}' -L --max-redirs 5 \
                    -A "$UA" -H 'Accept: text/html' "$BASE$p" || echo '000 0')
              code=${res%% *}; redirs=${res##* }
              if [ "$code" = "200" ] && [ "$redirs" = "0" ]; then ok=1; break; fi
              sleep 5
            done
            if [ "$ok" = "1" ]; then echo "OK    $p -> 200, no redirect"
            else echo "::error::$p -> HTTP $code after $redirs redirect(s)"; fail=1; fi
          done
          # 2) 200 + body contains
          check_body() { # path, grep-pattern...
            p="$1"; shift
            ok=0
            for try in 1 2 3 4 5; do
              body=$(curl -s -L --max-redirs 5 -A "$UA" -w '\n%{http_code}' "$BASE$p" || echo '000')
              code=$(printf '%s' "$body" | tail -n1); body=$(printf '%s' "$body" | sed '$d')
              if [ "$code" = "200" ]; then
                ok=1
                for pat in "$@"; do printf '%s' "$body" | grep -q -- "$pat" || ok=0; done
              fi
              [ "$ok" = "1" ] && break
              sleep 5
            done
            if [ "$ok" = "1" ]; then echo "OK    $p body contains: $*"
            else echo "::error::$p -> HTTP $code or body missing one of: $*"; fail=1; fi
          }
          check_body / 'official numbers or no numbers' '<table'
          check_body /robots.txt 'Sitemap:'
          KEYS=$(ls static/*.txt 2>/dev/null | wc -l)
          if [ "$KEYS" = "1" ]; then
            KEY=$(ls static/*.txt | head -1 | xargs -n1 basename | sed 's/\.txt$//')
            check_body "/$KEY.txt" "$KEY"
          else
            echo "::error::expected exactly one IndexNow key file in static/, found $KEYS"; fail=1
          fi
          n=$(curl -s -L --max-redirs 5 -A "$UA" "$BASE/sitemap.xml" | grep -c 'is-.*-dead' || true)
          if [ "$n" -ge 14 ]; then echo "OK    /sitemap.xml lists $n verdict pages"
          else echo "::error::/sitemap.xml lists only $n verdict pages (expected >=14)"; fail=1; fi
          # 3) JSON feeds
          check_json() { # path, python-assert-expr
            p="$1"; expr="$2"; ok=0
            for try in 1 2 3 4 5; do
              if curl -s -L --max-redirs 5 -A "$UA" "$BASE$p" -o body.json && \
                 python3 -c "import json,sys; j=json.load(open('body.json')); assert $expr, 'assert failed'" 2>/dev/null; then ok=1; break; fi
              sleep 5
            done
            if [ "$ok" = "1" ]; then echo "OK    $p JSON: $expr"
            else echo "::error::$p not valid JSON or failed: $expr"; fail=1; fi
          }
          check_json /concurrents.json 'len(j["samples"])>0'
          check_json /pool.json 'len(j)>=100'
          check_json /quiz-pool.json 'len(j["items"])>=20'
          check_json /ai-disclosures.json 'True'
          check_json '/api/live?app=440' 'j.get("ok") is True'
          rm -f body.json
          code=$(curl -s -o /dev/null -w '%{http_code}' -A "$UA" "$BASE/api/live?app=abc" || echo 000)
          if [ "$code" = "400" ]; then echo "OK    /api/live?app=abc -> 400"
          else echo "::error::/api/live?app=abc -> HTTP $code (expected 400)"; fail=1; fi
          # 4) badge
          res=$(curl -s -o /dev/null -w '%{http_code} %{content_type}' -A "$UA" "$BASE/badge/440.svg" || echo '000 -')
          case "$res" in
            "200 "*image/svg+xml*) echo "OK    /badge/440.svg -> $res" ;;
            *) echo "::error::/badge/440.svg -> $res (expected 200 image/svg+xml)"; fail=1 ;;
          esac
          # 5) real 404
          code=$(curl -s -o /dev/null -w '%{http_code}' -A "$UA" "$BASE/no-such-page-xyz" || echo 000)
          if [ "$code" = "404" ]; then echo "OK    /no-such-page-xyz -> 404"
          else echo "::error::/no-such-page-xyz -> HTTP $code (expected 404)"; fail=1; fi
          [ "$fail" = "0" ] || exit 1
          echo "self-check ok"
      - name: IndexNow ping (schedule/dispatch only)
        if: github.event_name != 'push'
        working-directory: sites/gamesledger
        run: |
          KEYS=$(ls static/*.txt 2>/dev/null | wc -l)
          [ "$KEYS" = "1" ] || { echo "::error::expected exactly one IndexNow key file in static/, found $KEYS"; exit 1; }
          KEY=$(ls static/*.txt | head -1 | xargs -n1 basename | sed 's/\.txt$//')
          python3 - <<PYEOF
          import json, urllib.request, re
          urls = re.findall(r'<loc>([^<]+)</loc>', open('site/sitemap.xml').read())
          body = json.dumps({"host": "games.agiscorecard.com", "key": "$KEY",
                             "keyLocation": "https://games.agiscorecard.com/$KEY.txt", "urlList": urls}).encode()
          req = urllib.request.Request("https://api.indexnow.org/indexnow", data=body,
                                       headers={"Content-Type": "application/json"})
          try:
              print("indexnow:", urllib.request.urlopen(req, timeout=15).status, len(urls), "urls")
          except Exception as e:
              print("::warning::indexnow ping failed:", e)
          PYEOF
