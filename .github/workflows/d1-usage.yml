name: D1 usage report

# Read-only diagnosis of the account-wide D1 free tier (5M rows read / UTC day). Prints rows read per
# database per day, the hour each day hit the limit, and the top queries by rows read. No schedule and
# no side effects: dispatch it when /api/pulse or event writes start failing with the D1 daily limit.
# Cost: < 1 minute per run. The push trigger only fires for edits to this report on the diagnosis branch.
on:
  workflow_dispatch:
    inputs:
      dataset:
        description: 'd1 or workers (workers output is encrypted)'
        required: false
        default: 'd1'
      report_public_key:
        description: 'Base64 RSA public key, required for workers diagnosis'
        required: false
      days:
        description: 'Days of history (1-14)'
        required: false
        default: '8'
  push:
    branches: ['claude/bpj-revenue-tools-9qtufj']
    paths: ['tools/fleet/d1_usage.mjs', '.github/workflows/d1-usage.yml']

permissions:
  contents: read

concurrency:
  group: d1-usage
  cancel-in-progress: true

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Redaction selftest
        run: node tools/fleet/d1_usage.mjs --selftest
      - name: Rows read by database, hour and query
        if: inputs.dataset != 'workers'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_TOKEN_ZONE: ${{ secrets.CLOUDFLARE_API_TOKEN_ZONE }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_USAGE_DAYS: ${{ github.event.inputs.days || '8' }}
        run: node tools/fleet/d1_usage.mjs
      - name: Workers request aggregates (read-only, encrypted)
        if: inputs.dataset == 'workers'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_TOKEN_ZONE: ${{ secrets.CLOUDFLARE_API_TOKEN_ZONE }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKERS_REPORT_PUBLIC_KEY: ${{ inputs.report_public_key }}
        run: |
          node --test tools/fleet/workers_usage.test.mjs
          node tools/fleet/workers_usage.mjs
      - uses: actions/upload-artifact@v4
        if: inputs.dataset == 'workers'
        with:
          name: workers-usage-encrypted
          path: /tmp/workers-usage.enc.json
          retention-days: 1
          if-no-files-found: error
