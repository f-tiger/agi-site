name: D1 usage report

# Read-only diagnosis of the account-wide D1 free tier (5M rows read / UTC day). Prints rows read per
# database per day, the hour each day hit the limit, and the top queries by rows read. No schedule and
# no side effects: dispatch it when /api/pulse or event writes start failing with the D1 daily limit.
# Cost: < 1 minute per run. The push trigger only fires for edits to this report on the diagnosis branch.
on:
  workflow_dispatch:
    inputs:
      days:
        description: 'Days of history (1-14)'
        required: false
        default: '8'
  push:
    branches: ['claude/bpj-revenue-tools-9qtufj']
    paths: ['tools/fleet/d1_usage.mjs', '.github/workflows/d1-usage.yml']

permissions:
  contents: read

concurrency:
  group: d1-usage
  cancel-in-progress: true

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Redaction selftest
        run: node tools/fleet/d1_usage.mjs --selftest
      - name: Rows read by database, hour and query
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_TOKEN_ZONE: ${{ secrets.CLOUDFLARE_API_TOKEN_ZONE }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_USAGE_DAYS: ${{ github.event.inputs.days || '8' }}
        run: node tools/fleet/d1_usage.mjs
