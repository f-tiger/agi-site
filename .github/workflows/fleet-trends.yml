name: Fleet US trends trigger (daily)

# 舰队触发器(2026-08-20):一次抓取 Google Trends US,三张站点词表分发
# (bpj AI 工具名 / agi AGI 实体 / tds niche 词)。03:45 UTC(2026-08-25 体检前移:原 04:20 晚于 agi 04:00 日循环,agi 读的是昨日数据),赶在各站每日
# 循环之前。外部副作用挂 schedule 不挂 push;一次外部抓取服务三站 = 最省礼貌。
on:
  schedule:
    - cron: '45 3 * * *'
  workflow_dispatch:
    inputs:
      full:
        description: 'Bootstrap: fetch ALL rising seeds this run (RISING_ALL), not the 2/run rotation'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: fleet-trends
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node tools/fleet_trends.mjs
      # 创业产品雷达(2026-08-24 owner 指令:输入层不能只依赖 Google Trends)。
      # PH 公开 Atom + HN Algolia,免鉴权;搭载本 schedule,增量 ~10s/天 ≈ 0.3 分/月。
      - run: node tools/startup_radar.mjs
      # 舰队 rising 关联查询(2026-08-25 owner:「bpj 按谷歌趋势优化」+「其他站点也要
      # 检查」)。当日热搜 RSS 对 bpj/agi/tds 三站 niche 词连续 6 天 matched:[],rising
      # 才是需求面。一次服务三站,全池 2 种子/次(配额纪律),搭载本 schedule 不新增
      # cron;pip + 2 种子×60s ≈ +2 分/次 ≈ +60 分/月(公开仓免费)。
      - name: Fleet rising related queries (fast-capture signal)
        env:
          RISING_ALL: ${{ inputs.full }}
        run: |
          pip install -q trendspy
          python3 tools/fleet_trends_rising.py || echo "::warning::fleet rising fetch failed — keep last good"
      # 机会撮合层(2026-09-13,owner「挖掘 Reddit 需求,匹配产品机会」):零 AI,只产派生事实
      # (主题、重现天数、Trends rising 是否同向、PH/HN 是否已有人做、舰队是否已有页),永不转载
      # Reddit 内容。demand board 有出页门:≥3 条「已确认需求且重现 ≥2 天」才写页,否则不写。
      - name: Match opportunities (Reddit requests × rising demand × existing supply)
        run: |
          python3 tools/fleet/opportunity_match.py || echo "::warning::opportunity match failed"
          python3 sites/buysomething/tools/gen_demand_board.py || echo "::warning::demand board generation failed"
      - name: Commit snapshots if changed
        run: |
          git config user.name 'Claude'
          git config user.email 'noreply@anthropic.com'
          git add sites/baipiaoji/data/trends-us.json sites/agiscorecard/trends-us.json sites/thedollscout/content/trends-us.json
          # rising 文件按站分开 add:任一站本次未轮到就不存在,合并 add 会让 git 整条
          # 128 拒绝(什么都不 stage)——必须逐个 add,缺的那个 || true 跳过不连累别的。
          git add sites/baipiaoji/data/trends-rising.json 2>/dev/null || true
          git add sites/agiscorecard/trends-rising.json 2>/dev/null || true
          git add sites/thedollscout/content/trends-rising.json 2>/dev/null || true
          # 2026-09-11:这两行此前不存在。tools/fleet_trends_rising.py 每天照常抓
          # eco-us(geo=US)与 eco-it(geo=IT)并写出文件,但提交步骤从来没 add 过它们
          # ——数据随 runner 一起销毁,20 个种子的轮转池里有 4 个(20%)在空转,全池
          # 覆盖一圈从 8 天拖到 10 天,而且 keep-last-good 对这两个槽位永远是空的
          # (每次都从零开始)。脚本的 run log 还把它们记成 "OK: n/7 updated"。
          # eco 的 US 面在 2026-09-06 切到 amazon.com 之后才真正有用,IT 试点 20 页
          # 也在等这份数据;两条预登记判定线都点名要它们,所以是补 add,不是删槽位。
          git add sites/getecoback/data/trends-rising-us.json 2>/dev/null || true
          git add sites/getecoback/data/trends-rising-it.json 2>/dev/null || true
          git add data/startup-radar.json 2>/dev/null || true
          git add data/autopilot/opportunities.json sites/buysomething/site/demand-board.html sites/buysomething/site/sitemap.xml sites/buysomething/site/llms.txt 2>/dev/null || true
          git add data/probes-rising.json 2>/dev/null || true
          git add data/probes-de-rising.json 2>/dev/null || true
          git diff --cached --quiet || { git commit -m "chore(trends): 美国区触发器+创业雷达快照 $(date -u +%F)"; git pull --rebase origin main; git push origin main; }
