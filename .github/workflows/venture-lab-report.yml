name: Commercial experiment funnel report
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Read aggregate funnel, excluding QA
        working-directory: sites/venture-lab
        run: node scripts/report.mjs
