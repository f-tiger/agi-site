name: Deploy powerbill

# The Power Bill · powerbill.agiscorecard.com — built 2026-09-15 (owner: 扩展几个适配欧洲、美国的站点).
# US + EU judgement desk on whether AI data-centre demand reaches household electricity bills.
# Research: sites/powerbill/docs/research-2026-09-15.md
# Cost: ~0.7 min per push; one daily fallback deploy ≈ 0.7 × 30 = 21 min/month; free on a public repo.
# Owner kill switch: if sites/powerbill/KILLED exists, this pipeline refuses to deploy and the live site freezes.
on:
  push:
    branches: [main]
    paths: ["sites/powerbill/**", ".github/workflows/deploy-powerbill.yml"]
  workflow_dispatch: {}
  schedule:
    - cron: "5 9 * * *"

concurrency:
  group: deploy-powerbill
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Guard — a replayed/stale push deploys main's tip, never rolls back
        if: github.event_name == 'push'
        run: |
          git fetch origin main -q || { echo "::warning::fetch failed — stale-run guard skipped"; exit 0; }
          TIP=$(git rev-parse origin/main 2>/dev/null || true)
          case "$TIP" in
            "" | *[!0-9a-f]* ) echo "::warning::main tip unresolvable — stale-run guard skipped"; exit 0 ;;
          esac
          if [ "$(git rev-parse HEAD)" != "$TIP" ]; then
            echo "::warning::stale run — deploying main tip instead of rolling back"
            git reset --hard "$TIP"
          fi
      - name: Owner kill switch
        run: |
          if [ -f sites/powerbill/KILLED ]; then
            echo "::notice::KILLED file present — owner has frozen this site; skipping deploy."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Gate — files present, worker parses, unit test passes
        working-directory: sites/powerbill
        run: |
          for f in site/index.html site/is-ai-raising-your-electricity-bill.html site/who-decides-who-pays.html site/bill-decomposer.html site/who-pays-check.html site/resources.html site/about.html site/style.css site/app.js site/llms.txt site/robots.txt site/sitemap.xml site/16507d8e1997c4be371f5fbaf7ac1985.txt worker.js wrangler.jsonc; do
            [ -f "$f" ] || { echo "::error::missing $f"; exit 1; }
          done
          node --check worker.js
          node tools/test_worker.mjs
          # GEO 层:判定页 → Markdown 孪生 + llms-full.txt(页面为唯一真源,每次部署重新生成)
          python3 tools/gen_md.py
          for f in site/is-ai-raising-your-electricity-bill.md site/who-decides-who-pays.md site/resources.md site/llms-full.txt; do [ -s "$f" ] || { echo "::error::gen_md produced empty $f"; exit 1; }; done
          # Zero-fabrication gate: never publish a per-household attribution figure
          if grep -nE '(add|cost|raise)s? (you|your (bill|household))[^.]{0,20}[$€£][0-9]' site/*.html; then echo "::error::per-household attribution figure found — not publishable"; exit 1; fi
          # Source anchors: the headline numbers must keep their publisher on the same page
          grep -q '329.17' site/is-ai-raising-your-electricity-bill.html || { echo "::error::PJM figure lost"; exit 1; }
          grep -q 'Electric Power Research Institute' site/is-ai-raising-your-electricity-bill.html || { echo "::error::counter-evidence removed — both sides are mandatory"; exit 1; }
          grep -q 'Energy Information Administration' site/is-ai-raising-your-electricity-bill.html || { echo "::error::EIA attribution lost"; exit 1; }
          # The decomposer must compute only from user input: no external data fetches
          if grep -nE 'fetch\(|XMLHttpRequest|new WebSocket' site/bill-decomposer.html; then echo "::error::decomposer must not fetch external data"; exit 1; fi
          # FAQ 可见问答与 FAQPage JSON-LD 逐条一致
          node -e '
            const fs=require("fs");
            for (const f of ["site/is-ai-raising-your-electricity-bill.html","site/who-decides-who-pays.html"]) {
              const h=fs.readFileSync(f,"utf8");
              const blocks=[...h.matchAll(/<script type="application\/ld\+json">([\s\S]*?)<\/script>/g)].map(m=>JSON.parse(m[1]));
              const ld=blocks.find(b=>b["@type"]==="FAQPage"); if(!ld) throw new Error(f+": no FAQPage");
              const vis=[...h.matchAll(/<summary>(.*?)<\/summary><p>(.*?)<\/p>/g)].map(m=>[m[1],m[2]]);
              if(vis.length!==ld.mainEntity.length) throw new Error(f+": faq count mismatch "+vis.length+" vs "+ld.mainEntity.length);
              ld.mainEntity.forEach((q,i)=>{ if(q.name!==vis[i][0]||q.acceptedAnswer.text!==vis[i][1]) throw new Error(f+": faq "+i+" differs"); });
              console.log("faq ok",f,vis.length);
            }'
          echo "gate ok"
      - name: Deploy worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          workingDirectory: sites/powerbill
          command: deploy
      - name: Post-deploy self-check
        # Every probe carries ?ci=1 so the worker keeps smoke traffic out of D1.
        # /api/pulse returning ok:true is the only live proof that the D1 binding works.
        run: |
          set -u
          fail=0
          for p in / /is-ai-raising-your-electricity-bill /who-decides-who-pays /bill-decomposer /who-pays-check /resources /about /llms.txt /llms-full.txt /is-ai-raising-your-electricity-bill.md /sitemap.xml /robots.txt /16507d8e1997c4be371f5fbaf7ac1985.txt; do
            url="https://powerbill.agiscorecard.com$p?ci=1"
            ok=0; code=000
            for try in 1 2 3 4 5; do
              code=$(curl -s -o /dev/null -w '%{http_code}' -L --max-redirs 5 --max-time 20 \
                     -A 'powerbill-deploy-smoke-bot (+ci)' "$url" || echo 000)
              if [ "$code" = "200" ]; then ok=1; break; fi
              sleep 5
            done
            if [ "$ok" = "1" ]; then echo "OK    $p -> 200"; else echo "::error::$p -> HTTP $code after 5 tries"; fail=1; fi
          done
          for a in /api/pulse; do
            body=$(curl -s --max-time 20 -A 'powerbill-deploy-smoke-bot (+ci)' "https://powerbill.agiscorecard.com$a?ci=1" || echo "")
            case "$body" in
              *'"ok":true'*) echo "OK    $a" ;;
              *) echo "::error::$a broken: ${body:0:120}"; fail=1 ;;
            esac
          done
          [ "$fail" = "0" ] || exit 1
          echo "self-check ok"
