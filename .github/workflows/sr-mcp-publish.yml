# 发布 SourceRadar 的 MCP server 到官方注册表(registry.modelcontextprotocol.io)。
# 与 bpj-mcp-publish.yml 同一机制:io.github.f-tiger 命名空间由本仓库 Actions OIDC 认证,
# 零 owner 密钥,id-token: write 即全部所需权限。
# 触发:server.json 变更(版本号变了才有意义)或手动 dispatch。
# 为什么值得发:2026-09-16 的读数是这个站真人 pv 87/28d,而同舰队的机器面在零推广下每天有
# 第三方回访——注册表是机器面唯一的「货架」,不进货架就只能等采集器偶然路过。
name: Publish SourceRadar MCP server

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['sites/buysomething/server.json', '.github/workflows/sr-mcp-publish.yml']

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sites/buysomething
    steps:
      - uses: actions/checkout@v4

      - name: Sanity — manifest points at the live endpoint
        run: |
          python3 - <<'PY'
          import json, sys
          m = json.load(open('server.json'))
          url = m['remotes'][0]['url']
          assert url == 'https://source.agiscorecard.com/api/mcp', url
          assert m['websiteUrl'].endswith('/mcp'), m['websiteUrl']
          print('manifest ok:', m['name'], m['version'])
          PY
          node tools/test_mcp.mjs

      - name: Install mcp-publisher
        run: |
          OS=$(uname -s | tr '[:upper:]' '[:lower:]')
          ARCH=$(uname -m); [ "$ARCH" = "x86_64" ] && ARCH=amd64; [ "$ARCH" = "aarch64" ] && ARCH=arm64
          curl -sL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_${OS}_${ARCH}.tar.gz" | tar xz mcp-publisher
          ./mcp-publisher --version

      - name: Login via GitHub OIDC
        run: ./mcp-publisher login github-oidc

      - name: Publish server.json
        run: ./mcp-publisher publish

      - name: Verify listing
        run: |
          sleep 5
          curl -s "https://registry.modelcontextprotocol.io/v0/servers?search=us-import-duty-facts" | head -c 400; echo
