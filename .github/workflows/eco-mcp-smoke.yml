# Verifies the live MCP server end to end: initialize, tools/list, and one real
# call per tool with expected values. The deploy workflow only asserts that
# /mcp responds; this asserts the answers are right. Runs on demand, after
# every deploy of the worker, and daily — a directory listing points third
# parties at this endpoint, so silent breakage is worse than a red build.
name: MCP production smoke test
# ── 迁入公开 monorepo f-tiger/agi-site(2026-08-19,owner 决定)──
# 原仓 .github 为历史档案。公开仓 Actions 分钟免费。
# 本 workflow 的 run 步骤默认 working-directory: sites/getecoback/。


on:
  workflow_dispatch:
  # Runs after the deploy has actually finished (2026-09-04). It used to trigger
  # on the same push and `sleep 45`, racing a deploy that takes longer than that
  # on most days — a red smoke run against the *previous* worker was noise, and
  # a green one proved nothing about the code just pushed.
  workflow_run:
    workflows: ["Deploy getecoback.com"]
    types: [completed]
  schedule:
     - cron: "17 6 * * *"

jobs:
  smoke:
    # Only smoke a deploy that succeeded; a failed/cancelled deploy already
    # reported itself. Manual and scheduled runs always go.
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name != 'workflow_run' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sites/getecoback
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Call every tool on the live server
        run: node tools/mcp_smoke.mjs
