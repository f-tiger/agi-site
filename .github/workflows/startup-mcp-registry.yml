name: Register BPJ startup MCP
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Daily update & deploy"]
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - .github/workflows/startup-mcp-registry.yml
      - sites/baipiaoji/scripts/startup-mcp-registry.mjs
      - sites/baipiaoji/startup-mcp/server.json

permissions:
  contents: read
  id-token: write
concurrency:
  group: bpj-startup-mcp-registry
  cancel-in-progress: false

jobs:
  register:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: sites/baipiaoji
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify the deployed MCP before registration
        run: node scripts/test-startup-mcp-live.mjs
      - name: Check the exact registry version
        id: registry
        run: node scripts/startup-mcp-registry.mjs --check
      - name: Publish through GitHub OIDC and verify the receipt
        if: steps.registry.outputs.publish == 'true'
        run: |
          publisher_dir=$(mktemp -d)
          curl -4 -fsSL --retry 3 --retry-all-errors --connect-timeout 10 --max-time 60 "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz -C "$publisher_dir" mcp-publisher
          cd startup-mcp
          "$publisher_dir/mcp-publisher" login github-oidc
          "$publisher_dir/mcp-publisher" publish
          node ../scripts/startup-mcp-registry.mjs --verify
