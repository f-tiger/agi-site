name: ECO analytics access and private reports
run-name: ECO analytics ${{ inputs.mode }}
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Choose credential preflight, official Google reporting, or affiliate paths
        type: choice
        options: [preflight, report, affiliate-paths]
        default: preflight
        required: true
      report_public_key:
        description: RSA public PEM (2048+ bits) for encrypted reports. Never enter a private key.
        type: string
        required: false
      affiliate_end_exclusive:
        description: End of the seven complete UTC dates for affiliate-paths (YYYY-MM-DD)
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: eco-readonly-report
  cancel-in-progress: false
jobs:
  report:
    if: inputs.mode != 'affiliate-paths' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify reporting privacy and request contracts
        run: node --test tools/eco-reporting/report.test.mjs
      - name: Read selected source and output status only
        id: report
        env:
          GA4_SERVICE_ACCOUNT_JSON: ${{ inputs.mode != 'affiliate-paths' && secrets.GA4_SERVICE_ACCOUNT_JSON || '' }}
          CLOUDFLARE_ACCOUNT_ID: ${{ inputs.mode == 'affiliate-paths' && secrets.CLOUDFLARE_ACCOUNT_ID || '' }}
          CLOUDFLARE_API_TOKEN: ${{ inputs.mode == 'affiliate-paths' && secrets.CLOUDFLARE_API_TOKEN || '' }}
          ECO_AFFILIATE_END_EXCLUSIVE: ${{ inputs.affiliate_end_exclusive }}
          ECO_REPORT_MODE: ${{ inputs.mode }}
          ECO_REPORT_PUBLIC_KEY: ${{ inputs.report_public_key }}
          ECO_REPORT_OUTPUT: ${{ runner.temp }}/eco-readonly/report.enc.json
        run: node tools/eco-reporting/report.mjs
      - name: Upload encrypted report only
        if: ${{ always() && steps.report.outputs.report_written == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: eco-official-report-encrypted
          path: ${{ runner.temp }}/eco-readonly/report.enc.json
          retention-days: 3
          if-no-files-found: error
