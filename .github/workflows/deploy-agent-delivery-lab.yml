name: Validate and deploy Agent Delivery Lab
on:
  push:
    branches: [main, 'codex/agent-delivery-*']
    paths: ['tools/fleet-analytics/**', 'tools/fleet-account/**', '.github/scripts/deploy-main-guard*', 'sites/agent-delivery-lab/**', '.github/workflows/deploy-agent-delivery-lab.yml']
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: agent-delivery-lab-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Guard — pin current main before building
        id: release
        if: github.ref == 'refs/heads/main'
        working-directory: ${{ github.workspace }}
        run: |
          bash .github/scripts/deploy-main-guard.sh prepare
          echo "DEPLOY_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate engine, privacy boundaries and worker bundle
        working-directory: sites/agent-delivery-lab
        run: |
          npm test
          npx --yes wrangler@4 deploy --dry-run --outdir /tmp/agent-delivery-worker
      - name: Check domain ownership and bind isolated feedback table
        if: github.ref == 'refs/heads/main'
        working-directory: sites/agent-delivery-lab
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_TOKEN_ZONE: ${{ secrets.CLOUDFLARE_API_TOKEN_ZONE }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/prepare.mjs
      - name: Verify fleet account security
        working-directory: ${{ github.workspace }}
        run: node tools/fleet-account/test.mjs

      - name: Enforce one consent-controlled GA4 channel on every public page
        working-directory: ${{ github.workspace }}
        run: |
          python3 tools/fleet-analytics/coverage.py --site agent-delivery-lab --write
          python3 tools/fleet-analytics/coverage.py --site agent-delivery-lab

      - name: Guard — refuse deployment if main changed during the build
        if: github.ref == 'refs/heads/main'
        working-directory: ${{ github.workspace }}
        run: bash .github/scripts/deploy-main-guard.sh check

      - name: Deploy independent worker
        if: github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          workingDirectory: sites/agent-delivery-lab
          command: deploy --config wrangler.generated.json
      - name: Verify deployed analytics version and host mapping
        if: github.ref == 'refs/heads/main'
        working-directory: ${{ github.workspace }}
        run: |
          node tools/fleet-analytics/verify-live.mjs agent-delivery-lab
          node tools/fleet-account/verify-live.mjs agent-delivery-lab

      - name: Verify actual deployed revision, assets and feedback
        if: github.ref == 'refs/heads/main'
        working-directory: sites/agent-delivery-lab
        run: node scripts/smoke.mjs
