name: Validate ECO revenue evidence boundaries
on:
  pull_request:
    paths:
      - 'tools/affiliate-growth/**'
      - 'tools/fleet-reporting/collect.py'
      - 'sites/getecoback/tools/affiliate_growth.py'
      - '.github/workflows/check-eco-revenue.yml'
      - '.github/workflows/eco-health.yml'
  push:
    branches: [main]
    paths:
      - 'tools/affiliate-growth/**'
      - '.github/workflows/check-eco-revenue.yml'
      - '.github/workflows/eco-health.yml'
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test unknowns, shared tags, returns, FX, windows and private output
        run: |
          python3 -m unittest discover -s tools/affiliate-growth -p 'test_*.py'
          node --test tools/affiliate-growth/test.mjs
