name: Build and register the EcoBack local MCP bundle

on:
  pull_request:
    paths:
      - .github/workflows/eco-local-mcpb.yml
      - tools/eco-local-mcpb/**
  workflow_dispatch: {}

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: eco-local-mcpb-${{ github.ref }}
  cancel-in-progress: false

env:
  BUNDLE: ecoback-local-tools-1.22.15.mcpb
  VERSION: '1.22.15'
  UPSTREAM_SHA: 049eec255e64bfec254698b25a12e3b7facee4c7
  NAME: io.github.f-tiger/ecoback-local-tools
  RELEASE_TAG: fleet-mcp-registry-2026-10-10
  PUBLIC_ASSET: https://github.com/f-tiger/agi-site/releases/download/fleet-mcp-registry-2026-10-10/ecoback-local-tools-1.22.15.mcpb
  REGISTRY_VERSIONS: https://registry.modelcontextprotocol.io/v0.1/servers/io.github.f-tiger%2Fecoback-local-tools/versions
  SOURCE_URL: https://github.com/f-tiger/getecoback-mcp
  MCPB_SCHEMA: https://raw.githubusercontent.com/modelcontextprotocol/mcpb/70fe3b34cd6dff1b3bba046638edc72a6467a4fb/schemas/mcpb-manifest-v0.3.schema.json

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      artifact: ${{ steps.identity.outputs.artifact }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: f-tiger/getecoback-mcp
          ref: ${{ env.UPSTREAM_SHA }}
          path: eco-mcp-upstream
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and exercise the pinned package locally
        run: |
          test "$(git -C eco-mcp-upstream rev-parse HEAD)" = "$UPSTREAM_SHA"
          test "$(node -p 'process.versions.node.split(".")[0]')" = '22'
          node tools/eco-local-mcpb/build.mjs eco-mcp-upstream "$RUNNER_TEMP/eco-local-mcpb"
      - name: Identify this build artifact
        id: identity
        run: printf 'artifact=eco-local-mcpb-%s-%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.identity.outputs.artifact }}
          path: |
            ${{ runner.temp }}/eco-local-mcpb/artifacts/${{ env.BUNDLE }}
            ${{ runner.temp }}/eco-local-mcpb/artifacts/SHA256SUMS
            ${{ runner.temp }}/eco-local-mcpb/servers/ecoback-local-tools.json
            ${{ runner.temp }}/eco-local-mcpb/smoke-results.json
          if-no-files-found: error
          retention-days: 14

  verify-artifact:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      artifact: ${{ needs.build.outputs.artifact }}
      sha: ${{ steps.bundle.outputs.sha }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: ${{ runner.temp }}/eco-local-mcpb
      - name: Read back offline CI artifact and exact local manifest
        id: bundle
        run: |
          root="$RUNNER_TEMP/eco-local-mcpb"
          digest=$(sha256sum "$root/artifacts/$BUNDLE" | cut -d ' ' -f1)
          test "$(cat "$root/artifacts/SHA256SUMS")" = "$digest  $BUNDLE"
          jq -e --arg name "$NAME" --arg version "$VERSION" --arg url "$PUBLIC_ASSET" --arg sha "$digest" --arg source "$SOURCE_URL" '
            .name == $name and .version == $version and ((.remotes // []) == []) and
            .title == "EcoBack – Haushaltshilfen für Deutschland" and
            .description == "Fenstersauger, Kellerfeuchte und Trocknungskosten offline prüfen. Ratgeber und Wetter auf Wunsch." and
            .websiteUrl == $source and .repository.url == $source and .repository.source == "github" and
            (.packages | length) == 1 and .packages[0].registryType == "mcpb" and
            .packages[0].identifier == $url and .packages[0].fileSha256 == $sha and
            .packages[0].transport.type == "stdio"
          ' "$root/servers/ecoback-local-tools.json"
          jq -e --arg name "$NAME" --arg version "$VERSION" --arg revision "$UPSTREAM_SHA" --arg sha "$digest" --arg latest "$REGISTRY_VERSIONS/latest" '
            .name == $name and .version == $version and .sourceRevision == $revision and
            .fileSha256 == $sha and .tools == 2025 and .pages == 21 and .legacyNames == 8 and .windowExamples == 12 and
            .network == "disabled" and (.firstExamples | type == "array" and length > 0) and
            (.lastPageExample != null and (.lastPageExample | length) > 0) and
            .finder.topMatch == "entfeuchter_ablaufcheck" and
            .finder.examples == ["entfeuchter_ablaufcheck","dusche_zeit_bei_wasserbudget"] and
            .finder.liveExampleRejected == true and
            .compact.tools == ["ecoback_werkzeug_finden","ecoback_werkzeug_ausfuehren"] and
            .compact.topMatch == "entfeuchter_ablaufcheck" and .compact.exampleOutcome == "pump_check" and
            .compact.citationsPreserved == true and .compact.liveToolRejected == true and
            .drainRoute == {
              name:"entfeuchter_ablaufcheck",
              guide:"https://getecoback.com/guide/luftentfeuchter-keller.html?utm_source=eco-mcp&utm_medium=referral&utm_campaign=keller-ablauf#ablauf-vor-kauf",
              source:"https://www.meaco.de/produkt/meaco-dry-arete-one-pumpe/",
              outcomes:["pump_check","pump_check","gravity_check","tank","inspect_route"]
            } and .compact.drainRoute == .drainRoute and
            .measuredVentilation == {
              name:"keller_lueften_taupunkt_messwerte",
              guide:"https://getecoback.com/guide/keller-lueften-sommer.html#taupunkt",
              cases:[["kondensationsrisiko",19.5,10.4,-4.5,-9.1,false],["probeweise_lueften",6.7,10.4,8.3,3.7,false],
                ["grenzbereich_nachmessen",6.7,10.4,0.3,3.7,true],["keine_trocknung",14.4,10.4,1.6,-4,false],
                ["grenzbereich_nachmessen",10,13.2,1,3.2,true]],
              missingRejected:true,legacyPreserved:true
            } and .compact.measuredVentilation == .measuredVentilation and
            .exactFilter.tool == "luftreiniger_ersatzfilter_zuordnung" and
            .exactFilter.guide == "https://getecoback.com/ersatzfilter.html#finder" and
            .exactFilter.unresolved == true and .exactFilter.unsupportedRejected == 4 and
            (.exactFilter.records | map({model,guide,source})) == [
              {model:"beurer-lr401",guide:"https://getecoback.com/ersatzfilter.html#beurer-lr401",
                source:"https://www.beurer.com/de/p/69309/"},
              {model:"levoit-core-300s",guide:"https://getecoback.com/ersatzfilter.html#levoit-core-300s",
                source:"https://levoit.de/products/levoit-core-300-und-core-300s-ersatzfilter-hepa-filter"}
            ] and
            ((.exactFilter.records | map(.status)) == ["documented_variant","documented_variant"] and
              (.exactFilter.records | map(.partNumber)) == ["69309",null] or
             (.exactFilter.records | map(.status)) == ["source_recheck","source_recheck"] and
              (.exactFilter.records | map(.partNumber)) == [null,null]) and
            .compact.exactFilter == .exactFilter and
            .philipsFilter.name == "philips_verdunsterfilter_zuordnung" and
            .philipsFilter.guide == "https://getecoback.com/guide/luftbefeuchter-ratgeber.html#philips-verdunsterfilter" and
            .philipsFilter.rejected == 3 and
            (.philipsFilter.records | map(.[2])) == [
              "https://getecoback.com/guide/luftbefeuchter-ratgeber.html#philips-hu4803-01",
              "https://getecoback.com/guide/luftbefeuchter-ratgeber.html#philips-hu2716-10",
              "https://getecoback.com/guide/luftbefeuchter-ratgeber.html#philips-hu2716-10",null
            ] and
            ((.philipsFilter.records | map(.[0:2])) == [["documented_variant","FY2401/30"],
              ["documented_variant","FY3446/30"],["candidate_not_documented","FY3446/30"],["identify_model",null]] or
             (.philipsFilter.records | map(.[0:2])) == [["source_recheck",null],["source_recheck",null],
               ["source_recheck",null],["identify_model",null]]) and
            .compact.philipsFilter == .philipsFilter and
            .warmthCost == {
              name:"heizdecke_stromkosten_nennleistung",
              guide:"https://getecoback.com/guide/heizdecke-stromverbrauch.html#waerme-rechner",
              records:[[0.22,0.077,6.6,2.31,"EUR",30],[0.22,0.077,0.22,0.077,"EUR",1],
                [0.22,0.077,6.6,2.31,"CHF",30]],
              rejected:6
            } and .compact.warmthCost == .warmthCost and
            .hygrometerComparison == {
              name:"hygrometer_messbereiche",
              guide:"https://getecoback.com/guide/luftfeuchtigkeit-richtig-messen.html#hygrometer-vergleichen",
              records:[[5,true,[52,58],[57,63],[57,58]],
                [5.1,true,[52.6,57.6],[57.6,62.8],[57.6,57.6]],
                [5.1,true,[57.6,62.8],[52.6,57.6],[57.6,57.6]],
                [98,false,[0,4],[96,100],null]],
              rejected:3
            } and .compact.hygrometerComparison == .hygrometerComparison and
            .n90Identity == {
              name:"pac_n90_ean_abgleichen",
              guide:"https://getecoback.com/guide/delonghi-pac-n90-test.html#testlage",
              ean:8004399512351,
              model:"PAC N90 ECO Silent",
              manufacturer:"https://www.delonghi.com/de-de/s/PACN90ECOSILENT",
              sheet:"https://shop.sonepar.at/asset_external/downloads/pim/400901/datasheet_delonghi_PAC%20N90ECO.pdf",
              statuses:["modellangaben_passen","modellbezeichnung_klaeren","modellbezeichnung_klaeren","ean_abweicht","ean_fehlt"],
              rejected:4
            } and .compact.n90Identity == .n90Identity and
            .compact.cellarBuyerEvidence == true and
            .compact.laundryComparison == {
              topMatch:"waesche_trocknungskosten", dryerEurPerLoad:0.6, dehumidifierEurPerLoad:0.3,
              comparison:"unconfirmed", citationUrl:"https://getecoback.com/waeschetrockner-oder-luftentfeuchter.html",
              shareUrl:"https://getecoback.com/waeschetrockner-oder-luftentfeuchter.html#laundry-check",
              unconfirmedNote:"Keine Aussage, welches Verfahren bei gleicher Trocknung günstiger ist.",
              halfCentDryerLine:"Trockner: 1,4 kWh × 0,025 €/kWh = 0,04 €"
            } and
            .singleLaundry == {
              name:"luftentfeuchter_waesche_einzelkosten",
              citation:"https://getecoback.com/waeschetrockner-oder-luftentfeuchter.html",
              shareUrl:"https://getecoback.com/waeschetrockner-oder-luftentfeuchter.html#luftentfeuchter-waesche-kosten",
              outcomes:[{kwh:1.8,cost:0.63,basis:"measured"},{kwh:1.2,cost:0.42,basis:"estimate"}],
              rejected:3
            } and .compact.singleLaundry == .singleLaundry and
            .fritzValve == {
              name:"fritz_302_danfoss_adapter",
              guide:"https://getecoback.com/guide/smarte-heizkoerperthermostate-lohnen-sich.html#fritz-302-danfoss-adapter",
              outcomes:[["adapter_im_lieferumfang",true,null],["adapter_separat",false,true],["adapter_separat",false,null],
                ["modell_oder_ventil_klaeren",null,null],["modell_oder_ventil_klaeren",null,null]],
              diameterRejected:true,
              providers:[{model:"fritz-302",host:"fritz.com",reviewed:"2026-11-22"},
                {model:"bosch-ii-m",host:"www.bosch-smarthome.com",reviewed:"2026-11-22"},
                {model:"tado-v3",host:"cdn.brandfolder.io",reviewed:"2026-10-31"}]
            } and .compact.fritzValve == .fritzValve and
            (.compact.laundryPrecision | type == "array" and length == 2 and
              all(.[]; . != "waesche_trocknungskosten" and (. == null or (type == "string" and length > 0)))) and
            .compact.windowSubject == {
              kaercherTool:"fenstersauger_wv3_wv8_led_muster_einordnen",
              kaercherGuide:"https://getecoback.com/produkte.html#kaercher-fenstersauger-einsatz-und-hinweise",
              boschTool:"glassvac_kalt_lagern_einschalten_laden_getrennt",
              boschGuide:"https://getecoback.com/produkte.html#bosch-glassvac-einsatz-und-pflege",
              unsupportedMatches:0, ambiguousMatches:0,
              exactMeaning:"akkutemperatur_zu_hoch_oder_zu_tief", unconfirmedMeaning:null
            } and
            .windowCondensation == {
              name:"fenster_oberflaeche_taucheck",
              shareUrl:"https://getecoback.com/guide/fenster-beschlagen-innen.html#fenstersauger-gegen-kondenswasser",
              measurements:[[12,-2,true,"unter_taupunkt"],[12,0,false,"nahe_am_taupunkt"],
                [12,2,false,"ueber_taupunkt"],[23,-1,true,"nahe_am_taupunkt"],[23,1,false,"nahe_am_taupunkt"]],
              missingSurfaceRejected:true
            } and .compact.windowCondensation == .windowCondensation and
            .compact.glassvacTemperature == {
              name:"glassvac_kalt_lagern_einschalten_laden_getrennt",
              guideUrl:"https://getecoback.com/produkte.html#bosch-glassvac-einsatz-und-pflege",
              minusEight:{storage:true, startup:false, recommendedCharging:false},
              plusTwo:{storage:true, startup:true, recommendedCharging:true},
              missingMeasurementRejected:true, faultPromoted:false
            } and
            .compact.humidifierEfficiency == {
              name:"befeuchter_nennwatt_abgabeleistung_bezug",
              citationUrl:"https://getecoback.com/guide/luftbefeuchter-stromverbrauch.html",
              guideUrl:"https://getecoback.com/guide/luftbefeuchter-stromverbrauch.html#effizienz-vergleichen",
              independentMlPerWh:null, matchedExampleMlPerWh:3
            } and
            .compact.n90Costs == {
              name:"pac_n90_energielabel_zu_stromkosten", ean:8004399512351, labelKwhPer60Min:0.9, coolingKw:2.5,
              labelEurPer60Min:0.27, measuredRunEur:0.36, measuredEurPerHour:0.24, unknownTariffEur:null
            } and
            .compact.tadoOventrop == {
              tool:"tado_x_oventrop_ventiladapter_pruefen", separateAdapter:"1011445", ean:"4026755228717",
              direct:"direktmontage_dokumentiert", deferred:6
            } and
            .compact.householdDecisions == {
              roofBracket:"passende_halterung_vor_kauf_klaeren", universalEan:4048164118687,
              seasonalSavingsEur:16.8, breakEvenSeasons:6, insufficientData:"erst_vergleichbar_messen",
              meacoWatts:[180,216], comfee:"wertepaar_offen"
            } and
            .compact.windowWidth == {
              topMatch:"fenstersauger_sprossenfenster_duesenbreite", usableWidthMm:160, packageArticle:"06008B7000",
              entryUrl:"https://getecoback.com/produkte.html?mcp_entry=fenstersauger-breitencheck#fenstersauger-duesenbreite",
              alternativesWithoutEntry:3
            } and
            .decimalWindowWidth == [
              {existingFits:true,candidates:["06008B7000"],nextStep:"vorhandene_duese_zuerst_probesetzen",entryUrl:null},
              {existingFits:null,candidates:["06008B7000"],nextStep:"genaues_originalpaket_und_platzbedarf_pruefen",
                entryUrl:"https://getecoback.com/produkte.html?mcp_entry=fenstersauger-breitencheck#fenstersauger-duesenbreite"},
              {existingFits:null,candidates:[],nextStep:"vorhandenen_einwascher_oder_abzieher_pruefen",entryUrl:null}
            ] and .compact.decimalWindowWidth == .decimalWindowWidth and
            .compact.windowBlade == {
              topMatch:"fenstersauger_170mm_abziehlippe_geraetefamilie",
              guideUrl:"https://getecoback.com/produkte.html#fenstersauger-belege",
              statuses:["kombination_nicht_aufgelistet","offen","herstellerliste_bestaetigt"]
            } and
            .compact.windowLookup == ["fenstersauger_kaercher_fluessigkeitsgrenze_und_tank","fenstersauger_wv3_wv8_led_muster_einordnen"] and
            (.archiveReadme.replacedVersion | test("^[0-9]+\\.[0-9]+\\.[0-9]+$")) and
            .archiveReadme.registryLatestUrl == $latest and
            .resource.uri == "ecoback://evidence/de/kellerentfeuchter" and
            .resource.mimeType == "text/markdown" and .resource.missingCode == -32002 and
            (.resource.textSha256 | test("^[a-f0-9]{64}$")) and .compact.resource == .resource
          ' "$root/smoke-results.json"
          printf 'sha=%s\n' "$digest" >> "$GITHUB_OUTPUT"
          printf 'Verified CI artifact %s (SHA-256 %s)\n' "$BUNDLE" "$digest"

  publish:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'f-tiger/agi-site'
    needs: verify-artifact
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
      id-token: write
    env:
      VERIFIED_SHA: ${{ needs.verify-artifact.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.verify-artifact.outputs.artifact }}
          path: ${{ runner.temp }}/eco-local-mcpb
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate the downloaded bundle and single manifest before publication
        run: |
          root="$RUNNER_TEMP/eco-local-mcpb"
          test "$(sha256sum "$root/artifacts/$BUNDLE" | cut -d ' ' -f1)" = "$VERIFIED_SHA"
          test "$(cat "$root/artifacts/SHA256SUMS")" = "$VERIFIED_SHA  $BUNDLE"
          test "$(find "$root/servers" -maxdepth 1 -name '*.json' -type f -printf '%f\n')" = 'ecoback-local-tools.json'
          jq -e --arg name "$NAME" --arg version "$VERSION" --arg url "$PUBLIC_ASSET" --arg sha "$VERIFIED_SHA" --arg source "$SOURCE_URL" '
            .name == $name and .version == $version and ((.remotes // []) == []) and
            .websiteUrl == $source and .repository.url == $source and .repository.source == "github" and
            (.packages | length) == 1 and .packages[0].registryType == "mcpb" and
            .packages[0].identifier == $url and .packages[0].fileSha256 == $sha and
            .packages[0].transport.type == "stdio"
          ' "$root/servers/ecoback-local-tools.json"
          python -m pip install jsonschema==4.25.1
          schema="$RUNNER_TEMP/eco-local-mcpb-schema.json"
          curl -fLsS --retry 3 --connect-timeout 10 --max-time 30 "$MCPB_SCHEMA" -o "$schema"
          python - "$root/artifacts/$BUNDLE" "$schema" <<'PY'
          import json, sys, zipfile
          from pathlib import Path
          import jsonschema

          with zipfile.ZipFile(sys.argv[1]) as bundle:
              manifest = json.loads(bundle.read('manifest.json'))
          jsonschema.validate(manifest, json.loads(Path(sys.argv[2]).read_text()))
          PY
          python tools/mcp-registry/registry.py validate --manifest-dir "$root/servers"
          python - "$root/servers/ecoback-local-tools.json" <<'PY'
          import json, runpy, sys
          from pathlib import Path

          registry = runpy.run_path('tools/mcp-registry/registry.py')
          manifest = json.loads(Path(sys.argv[1]).read_text())
          record = registry['request_json'](registry['receipt_url'](manifest), missing_ok=True)
          if record is not None:
              registry['verify_receipt'](manifest, record)
          PY
      - name: Upload the missing filename to the existing release and verify public bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          root="$RUNNER_TEMP/eco-local-mcpb"
          endpoint="repos/f-tiger/agi-site/releases/tags/$RELEASE_TAG"
          gh api "$endpoint" > "$RUNNER_TEMP/eco-local-release-before.json"
          jq -e --arg tag "$RELEASE_TAG" '.tag_name == $tag and .draft == false' "$RUNNER_TEMP/eco-local-release-before.json"
          count=$(jq --arg filename "$BUNDLE" '[.assets[] | select(.name == $filename)] | length' "$RUNNER_TEMP/eco-local-release-before.json")
          if [[ "$count" == '0' ]]; then
            if ! gh release upload "$RELEASE_TAG" "$root/artifacts/$BUNDLE" --repo f-tiger/agi-site; then
              echo 'Upload response did not confirm success. Rechecking the existing filename and its public digest.'
            fi
          else
            test "$count" = '1'
          fi
          gh api "$endpoint" > "$RUNNER_TEMP/eco-local-release-after.json"
          jq -e --arg tag "$RELEASE_TAG" --arg filename "$BUNDLE" --arg url "$PUBLIC_ASSET" '
            .tag_name == $tag and .draft == false and
            ([.assets[] | select(.name == $filename and .browser_download_url == $url and .state == "uploaded")] | length) == 1
          ' "$RUNNER_TEMP/eco-local-release-after.json"
          curl -fLsS --retry 3 --connect-timeout 10 --max-time 90 "$PUBLIC_ASSET" -o "$RUNNER_TEMP/eco-local-published.mcpb"
          printf '%s  %s\n' "$VERIFIED_SHA" "$RUNNER_TEMP/eco-local-published.mcpb" | sha256sum -c -
          jq -n --arg url "$PUBLIC_ASSET" --arg sha "$VERIFIED_SHA" '{url:$url,sha256:$sha}' > "$RUNNER_TEMP/eco-local-public-asset.json"
      - name: Install the existing pinned official publisher
        run: |
          mkdir -p "$RUNNER_TEMP/eco-local-publisher"
          archive="$RUNNER_TEMP/eco-local-publisher.tar.gz"
          curl -4 -fLsS --retry 3 --connect-timeout 10 --max-time 90 https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz -o "$archive"
          printf '%s  %s\n' a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc "$archive" | sha256sum -c -
          tar xzf "$archive" -C "$RUNNER_TEMP/eco-local-publisher" mcp-publisher
      - name: Publish only the verified local manifest with GitHub OIDC
        run: |
          publisher="$RUNNER_TEMP/eco-local-publisher/mcp-publisher"
          "$publisher" login github-oidc
          python tools/mcp-registry/registry.py publish --publisher "$publisher" --manifest-dir "$RUNNER_TEMP/eco-local-mcpb/servers" --receipt "$RUNNER_TEMP/eco-local-registry-publication.json"
      - name: Read back the exact and latest active Registry records
        run: |
          for version in "$VERSION" latest; do
            record="$RUNNER_TEMP/eco-local-registry-$version.json"
            curl -fLsS --retry 3 --connect-timeout 10 --max-time 30 "$REGISTRY_VERSIONS/$version" -o "$record"
            jq -e --arg name "$NAME" --arg version "$VERSION" --arg url "$PUBLIC_ASSET" --arg sha "$VERIFIED_SHA" \
              --slurpfile manifest "$RUNNER_TEMP/eco-local-mcpb/servers/ecoback-local-tools.json" '
              .server.name == $name and .server.version == $version and
              .server.title == $manifest[0].title and .server.description == $manifest[0].description and
              ((.server.remotes // []) == []) and (.server.packages | length) == 1 and
              .server.packages[0].registryType == "mcpb" and .server.packages[0].identifier == $url and
              .server.packages[0].fileSha256 == $sha and .server.packages[0].transport.type == "stdio" and
              ._meta["io.modelcontextprotocol.registry/official"].status == "active" and
              ._meta["io.modelcontextprotocol.registry/official"].isLatest == true
            ' "$record"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eco-local-mcpb-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/eco-local-public-asset.json
            ${{ runner.temp }}/eco-local-registry-*.json
          if-no-files-found: warn
