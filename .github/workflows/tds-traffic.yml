name: Record edge traffic
# ── 迁入公开 monorepo f-tiger/agi-site(2026-08-19,owner 决定)──
# 原仓 .github 为历史档案。公开仓 Actions 分钟免费。
# 本 workflow 的 run 步骤默认 working-directory: sites/thedollscout/。


# Cloudflare counts requests at the edge, so this number survives ad blockers,
# privacy browsers and network-level blocking of Google — all of which produce
# an empty GA4 property that looks exactly like "nobody came". It answers one
# question GA4 currently cannot answer for this owner: did anyone arrive.
#
# The result is committed to content/traffic.json so the two-day growth loop can
# read real traffic without any credentials of its own, and printed to the job
# summary so it can be read from the GitHub UI.

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'  # daily, after Cloudflare has closed out yesterday

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sites/thedollscout
    steps:
      - uses: actions/checkout@v4

      - name: Pull traffic from the Cloudflare Analytics API
        # Every token secret is passed, and the script tries each in turn. It
        # used to prefer one: the owner rotated the other, and the re-run failed
        # with the byte-identical error from the stale token — a false negative
        # that read as "the permission still isn't set".
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_TOKEN_ZONE: ${{ secrets.CLOUDFLARE_API_TOKEN_ZONE }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          node scripts/cf-analytics.mjs | tee traffic-report.md
          cat traffic-report.md >> "$GITHUB_STEP_SUMMARY"
          rm -f traffic-report.md

      # GA4 and Search Console ride the same daily job. Both scripts exit 0
      # when their credentials are absent, printing what is missing — so this
      # is safe to ship before the owner finishes the console setup, and the
      # job summary itself becomes the reminder of what remains.
      - name: Pull GA4 via the Data API
        env:
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID_TDS }}
          GA4_SERVICE_ACCOUNT_JSON: ${{ secrets.GA4_SERVICE_ACCOUNT_JSON }}
        run: |
          node scripts/ga4-report.mjs | tee ga4-report.md
          cat ga4-report.md >> "$GITHUB_STEP_SUMMARY"
          rm -f ga4-report.md

      - name: Pull Search Console via the API
        env:
          GSC_SITE: sc-domain:thedollscout.com
          GA4_SERVICE_ACCOUNT_JSON: ${{ secrets.GA4_SERVICE_ACCOUNT_JSON }}
        run: |
          node scripts/gsc-report.mjs | tee gsc-report.md
          cat gsc-report.md >> "$GITHUB_STEP_SUMMARY"
          rm -f gsc-report.md

      # content/ga4.json and content/gsc.json only exist once the Google
      # credentials are configured, which they are not. Listing them in a bare
      # `git add` aborted the whole call, so content/traffic.json was staged
      # too — this job ran green every night from 2026-08-01 and committed
      # nothing, discarding eleven days of edge traffic. commit-generated.sh
      # filters to what exists and warns about what does not.

      # First-party D1 snapshot (2026-08-19): aggregates from dollscout-events
      # written back to the repo. This file is the ONLY path the growth loop has
      # to real reader/bot/click numbers — its scheduled sessions run without
      # Cloudflare MCP, so if this step does not commit, the loop is blind.
      #
      # ⚠️ 2026-08-31: this step had never once succeeded. It shelled out to
      # `wrangler d1 execute`, sent stderr to /dev/null, and printed the guess
      # "no D1 access on token" as if it were a diagnosis — twelve days of green
      # runs, no snapshot ever committed, and no way to see why. Textbook case of
      # the站内 rule 「『正常的安静结果』是自我伪装」. Now: the D1 REST API direct
      # (no npx, no wrangler config coupling, database id from wrangler.toml),
      # the real API error printed, and a ::warning:: that reaches the run summary.
      - name: Export D1 analytics snapshot
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: 6e71ddc6-b58c-49f4-b6f5-207f3778133f
        run: |
          set +e
          SQL="SELECT d, ev, path, ref, country, COUNT(*) AS n FROM hits WHERE d >= date('now','-14 days') AND path NOT LIKE '/__ci%' GROUP BY d, ev, path, ref, country ORDER BY d DESC, n DESC LIMIT 500"
          code=$(curl -sS -o d1-response.json -w '%{http_code}' \
            -X POST "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${D1_DATABASE_ID}/query" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "$(jq -n --arg sql "$SQL" '{sql:$sql}')" 2>d1-curl.err)
          ok=$(jq -r 'try .success catch "false"' d1-response.json 2>/dev/null)
          rows=$(jq -r 'try (.result[0].results | length) catch 0' d1-response.json 2>/dev/null)
          if [ "$code" = "200" ] && [ "$ok" = "true" ]; then
            mv d1-response.json content/d1-snapshot.json
            echo "d1 snapshot exported: $rows aggregate rows (14d window, /__ci excluded)"
            if [ "$rows" = "0" ]; then
              echo "::warning::d1 snapshot is EMPTY (0 rows in the 14-day window) — the query ran, but nothing was logged. Verify the beacon, do not read this as 'no traffic'."
            fi
          else
            echo "::warning::d1 snapshot FAILED (HTTP $code) — the growth loop has NO first-party numbers this run. Most likely cause: CLOUDFLARE_API_TOKEN lacks the D1 read permission (Account > D1 > Read)."
            echo "--- Cloudflare API response (secrets masked) ---"
            { jq -c '{success, errors, messages}' d1-response.json 2>/dev/null || head -c 600 d1-response.json; } \
              | sed -E 's/[A-Za-z0-9_-]{30,}/***/g'
            echo
            sed -E 's/[A-Za-z0-9_-]{30,}/***/g' d1-curl.err | tail -5
            rm -f content/d1-snapshot.json
          fi
          rm -f d1-response.json d1-curl.err

      - name: Commit the day's numbers
        run: |
          bash scripts/commit-generated.sh traffic-bot \
            "chore: record daily metrics (edge / GA4 / GSC)" \
            content/traffic.json content/ga4.json content/gsc.json content/d1-snapshot.json

      # content/ is excluded from the published site, so there is nothing to
      # deploy here — the file exists for the growth loop, not for visitors.
