name: Deploy thedollscout.com
# ── 迁入公开 monorepo f-tiger/agi-site(2026-08-19,owner 决定)──
# ── 2026-08-30 pivot(owner 决定):成人站下架,本域改为 Labubu 导购站。──
# 旧站的 12 步页面生成链随内容一起退役;现在的站是纯静态手写页,部署链只剩
# 守卫 + 组装 + 发布 + 自检。本 workflow 的 run 步骤默认 working-directory:
# sites/thedollscout/。

on:
  push:
    branches: [main]
    paths:
      # 纯簿记文件(content/ 被 assemble-dist 排除,不发布)不触发部署。
      - "sites/thedollscout/**"
      - "!sites/thedollscout/content/traffic.json"
      - "!sites/thedollscout/content/d1-snapshot.json"
      - "!sites/thedollscout/content/growth-log.md"
      - "!sites/thedollscout/content/trends-rising.json"
      - "!sites/thedollscout/content/trends-us.json"
      # 簿记文件,不发布(assemble-dist 排除 *.md)——手册更新不该烧一次部署。
      - "!sites/thedollscout/CLAUDE.md"
      - ".github/workflows/deploy-thedollscout.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sites/thedollscout
    steps:
      - uses: actions/checkout@v4

      # 防回滚守卫(2026-08-26 事故,根仓 CLAUDE.md 铁律:checkout 后第一步,
      # 永不删除):GitHub 会乱序补发数小时前的 push 事件,旧事件按自己那个历史
      # 提交部署会把线上滚回旧代码——在「旧站已下架」的今天,回滚意味着把成人站
      # 重新发回线上,后果比 gridlings 那次更糟。fail-open:网络抖动不阻断部署。
      - name: Guard — a replayed/stale push deploys main's tip, never rolls back
        if: github.event_name == 'push'
        run: |
          git fetch origin main -q || { echo "::warning::fetch failed — stale-run guard skipped"; exit 0; }
          TIP=$(git rev-parse origin/main 2>/dev/null || true)
          case "$TIP" in
            "" | *[!0-9a-f]* ) echo "::warning::main tip unresolvable — stale-run guard skipped"; exit 0 ;;
          esac
          if [ "$(git rev-parse HEAD)" != "$TIP" ]; then
            echo "::warning::stale run — HEAD $(git rev-parse --short HEAD) is behind main tip $(git rev-parse --short "$TIP"); deploying the tip instead of rolling production back"
            git reset --hard "$TIP"
          fi

      # 正确性闸门:站内不允许再出现旧站的任何痕迹——成人 meta、年龄门、
      # yourdoll 联盟。发现即失败,防止旧模板被无意识复制回来。
      - name: Gate — no trace of the retired adult site may ship
        run: |
          set -e
          if grep -rniE 'rating.*adult|age-gate|ds_age_ok|yourdoll' \
              --include='*.html' --include='*.js' --include='_headers' \
              --exclude-dir=content --exclude-dir=scripts .; then
            echo "::error::retired-site marker found in publishable files (see matches above)"; exit 1
          fi
          echo "clean: no retired-site markers in publishable files"

      # 双 tag 分市场契约(owner 2026-08-30):EN→amazon.com+ecoback0d-20,
      # /de/→amazon.de+getecoback-21。串了 = 该点击一分钱佣金都没有,构建直接失败。
      - name: Gate — affiliate tags must match their marketplace
        run: |
          set -e
          if grep -rnE 'amazon\.de[^"]*ecoback0d-20|amazon\.com[^"]*getecoback-21' --include='*.html' .; then
            echo "::error::affiliate tag crossed marketplaces (see matches above)"; exit 1
          fi
          echo "clean: every amazon link carries its own marketplace's tag"

      # llms-full.txt = 全站正文单文件渲染(GEO 面:AI 引擎一次抓取读全站)。
      # 生成器铁律(本站 8 天冻结教训):脚本内部永远 exit 0,任何失败只降级
      # 输出;这里再包一层 continue-on-error,双保险——生成器绝不阻断部署。
      - name: Build llms-full.txt (degrades, never blocks)
        continue-on-error: true
        run: node scripts/build-llms-full.mjs

      - name: Assemble static site into dist/
        run: bash scripts/assemble-dist.sh

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID_SECRET: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN repo secret is not set"; exit 1
          fi
          if [ -n "$CF_ACCOUNT_ID_SECRET" ]; then
            export CLOUDFLARE_ACCOUNT_ID="$CF_ACCOUNT_ID_SECRET"
          fi
          npx wrangler@4 pages deploy dist \
            --project-name dollscout \
            --branch claude/adult-product-distribution-site-q1bzbh

      # 部署后自检(根仓 CLAUDE.md 2026-08-27 审计要求:断言事故的形状)。
      # 本站的事故形状:①新页 404(部署没生效)②旧成人页仍 200(下架没生效)
      # ③重定向环(gridlings 教训)。三样都测。
      - name: Post-deploy self-check
        run: |
          sleep 20
          fail=0
          for p in / /rarity /fake-check /where-to-buy /how-blind-boxes-work /glossary /start /psychology /de/ /de/rarity /de/fake-check /de/where-to-buy /de/how-blind-boxes-work /de/glossary /de/start /de/psychology /data/ /robots.txt /sitemap.xml /llms.txt /llms-full.txt /img/og.png /data/rarity-odds.json /.well-known/mcp.json; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "https://thedollscout.com$p")
            redirs=$(curl -s -o /dev/null -w "%{num_redirects}" -L --max-redirs 5 --max-time 20 "https://thedollscout.com$p" || echo 99)
            echo "$p -> HTTP $code, redirects $redirs"
            [ "$code" = "200" ] || { echo "::error::$p returned $code (expected 200)"; fail=1; }
            [ "$redirs" = "0" ] || { echo "::error::$p redirected $redirs times (expected 0)"; fail=1; }
          done
          # 旧页断言:middleware 现在对退役路径回 410(比 404 更快触发引擎除名);
          # 边缘缓存抖动(run #21/#25 实测 /scam-check 忽 200 忽 404)给一次 15s
          # 重试机会,连续两次非 404/410 才判失败。
          for p in /scam-check /guides/tpe-vs-silicone /picks; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "https://thedollscout.com$p")
            if [ "$code" != "404" ] && [ "$code" != "410" ]; then
              sleep 15
              code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "https://thedollscout.com$p")
            fi
            echo "retired $p -> HTTP $code"
            case "$code" in 404|410) ;; *) echo "::error::retired page $p returned $code (expected 404/410) — takedown not effective"; fail=1 ;; esac
          done
          # MCP 冒烟:initialize 必须回 protocolVersion;计算工具算 1:72×12 盒
          # 必须回 15.x%(纯数学,答案确定)。/mcp 曾在退役 410 列表里——这两条
          # 断言同时守住「函数活着」与「410 没有误伤」。
          mcp=$(curl -s --max-time 20 -X POST https://thedollscout.com/mcp \
            -H 'Content-Type: application/json' \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}')
          echo "mcp initialize -> $mcp"
          echo "$mcp" | grep -q '"protocolVersion"' || { echo "::error::MCP initialize did not return protocolVersion"; fail=1; }
          calc=$(curl -s --max-time 20 -X POST https://thedollscout.com/mcp \
            -H 'Content-Type: application/json' \
            -d '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"secret_pull_probability","arguments":{"oddsN":72,"boxes":12}}}')
          echo "mcp secret_pull_probability(72,12) -> $calc"
          echo "$calc" | grep -q '15\.' || { echo "::error::MCP calculator did not return ~15% for 1:72 x 12 boxes"; fail=1; }
          exit $fail

      # Bing/Yandex/Seznam/Naver pick this up within minutes.
      - name: Ping IndexNow with the published URL list
        continue-on-error: true
        run: node scripts/indexnow.mjs

      # First-party analytics self-test: one POST to /api/ev must come back 204.
      - name: Self-test the /api/ev beacon endpoint
        continue-on-error: true
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST https://thedollscout.com/api/ev \
            -H 'Content-Type: text/plain' -d '{"p":"/__ci","r":""}' --max-time 15)
          echo "beacon self-test HTTP $code"
          [ "$code" = "204" ] || echo "::warning::beacon endpoint returned $code (expected 204) — D1 binding may be missing"

concurrency:
  group: deploy-thedollscout
  cancel-in-progress: true
