name: Deploy thedollscout.com
# ── 迁入公开 monorepo f-tiger/agi-site(2026-08-19,owner 决定)──
# ── 2026-08-30 pivot(owner 决定):成人站下架,本域改为 Labubu 导购站。──
# 旧站的 12 步页面生成链随内容一起退役;现在的站是纯静态手写页,部署链只剩
# 守卫 + 组装 + 发布 + 自检。本 workflow 的 run 步骤默认 working-directory:
# sites/thedollscout/。

on:
  push:
    branches: [main]
    paths:
      - "tools/revenue-studio/**"
      # 纯簿记文件(content/ 被 assemble-dist 排除,不发布)不触发部署。
      - "sites/thedollscout/**"
      - "!sites/thedollscout/content/traffic.json"
      - "!sites/thedollscout/content/d1-snapshot.json"
      - "!sites/thedollscout/content/growth-log.md"
      - "!sites/thedollscout/content/trends-rising.json"
      - "!sites/thedollscout/content/trends-us.json"
      # 簿记文件,不发布(assemble-dist 排除 *.md)——手册更新不该烧一次部署。
      - "!sites/thedollscout/CLAUDE.md"
      - ".github/workflows/deploy-thedollscout.yml"
  workflow_dispatch:
  # 每日兜底部署(2026-09-11)。**这是舰队冻结事故的直接修复**:2026-09-03 三条
  # Routine 计划触发失败,本站冻结约 86 小时——因为它的部署是纯 push 触发,没有会话
  # 推它就没有任何东西推它。零 AI 的每日任务全部只写 content/,而 content/ 既被 path
  # 过滤显式排除、又被 assemble-dist.sh 排除,所以它们在结构上到不了线上。
  # 这条 cron 是本站唯一不经过任何 AI 会话的发布路径。
  schedule:
    - cron: "20 7 * * *"

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sites/thedollscout
    steps:
      - uses: actions/checkout@v4

      # 防回滚守卫(2026-08-26 事故,根仓 CLAUDE.md 铁律:checkout 后第一步,
      # 永不删除):GitHub 会乱序补发数小时前的 push 事件,旧事件按自己那个历史
      # 提交部署会把线上滚回旧代码——在「旧站已下架」的今天,回滚意味着把成人站
      # 重新发回线上,后果比 gridlings 那次更糟。fail-open:网络抖动不阻断部署。
      - name: Guard — a replayed/stale push deploys main's tip, never rolls back
        if: github.event_name == 'push'
        run: |
          git fetch origin main -q || { echo "::warning::fetch failed — stale-run guard skipped"; exit 0; }
          TIP=$(git rev-parse origin/main 2>/dev/null || true)
          case "$TIP" in
            "" | *[!0-9a-f]* ) echo "::warning::main tip unresolvable — stale-run guard skipped"; exit 0 ;;
          esac
          if [ "$(git rev-parse HEAD)" != "$TIP" ]; then
            echo "::warning::stale run — HEAD $(git rev-parse --short HEAD) is behind main tip $(git rev-parse --short "$TIP"); deploying the tip instead of rolling production back"
            git reset --hard "$TIP"
          fi

      # 正确性闸门:站内不允许再出现旧站的任何痕迹——成人 meta、年龄门、
      # yourdoll 联盟。发现即失败,防止旧模板被无意识复制回来。
      - name: Gate — no trace of the retired adult site may ship
        run: |
          set -e
          if grep -rniE 'rating.*adult|age-gate|ds_age_ok|yourdoll' \
              --include='*.html' --include='*.js' --include='_headers' \
              --exclude-dir=content --exclude-dir=scripts .; then
            echo "::error::retired-site marker found in publishable files (see matches above)"; exit 1
          fi
          echo "clean: no retired-site markers in publishable files"

      # 双 tag 分市场契约(owner 2026-08-30):EN→amazon.com+ecoback0d-20,
      # /de/→amazon.de+getecoback-21。串了 = 该点击一分钱佣金都没有,构建直接失败。
      - name: Gate — affiliate tags must match their marketplace
        run: |
          set -e
          if grep -rnE 'amazon\.de[^"]*ecoback0d-20|amazon\.com[^"]*getecoback-21' --include='*.html' .; then
            echo "::error::affiliate tag crossed marketplaces (see matches above)"; exit 1
          fi
          # /th/ 按设计零联盟(泰国无 Amazon 联盟通路,页面已明示 unmonetized);
          # /zh/ 走 amazon.com。原来的闸门只查「tag 与 marketplace 串了没」,
          # 查不出「本不该有联盟链接的语言页出现了联盟链接」(2026-08-30 深审)。
          if grep -rnE 'tag=(ecoback0d-20|getecoback-21)' th/ 2>/dev/null; then
            echo "::error::/th/ must carry no affiliate links (see matches above)"; exit 1
          fi
          if grep -rnE 'amazon\.de[^"]*tag=' zh/ 2>/dev/null; then
            echo "::error::/zh/ must use the US marketplace, not amazon.de"; exit 1
          fi
          echo "clean: every amazon link carries its own marketplace's tag; /th/ carries none"

      # 结构化数据诚实闸门(2026-08-30 深审发现:/start 与 /psychology 的
      # 16 条 FAQ 问答只存在于 JSON-LD,页面上一个字都没有——违反站内自订铁律
      # 「LD 文本必须与页面可见文本一致」。规则一直在,只是没有任何东西执行它)。
      # 比较对表现宽容、对文字严格:实体解码 + NBSP/弯引号/破折号归一 + 去标签 +
      # 去全部空白后做子串判定。本地已跑通 0 失配,所以直接设为阻断闸门。
      # 2026-08-31:walker 原本只递归 de/,zh/ th/ legal/ data/ 从未被检查过;
      # 修好后覆盖 92 条。闸门看不见的页,闸门就管不住。
      - name: Gate — FAQ/DefinedTerm structured data must match visible text
        run: node scripts/check-structured-data.mjs

      - name: Regenerate the /odds/ cluster and prove it is in sync
        # 生成器是幂等的,所以在部署链上重跑一次等于断言「仓库里的页 == 数据脊算出来的页」。
        # 若有人手改了生成页或改了 rarity-odds.json 却忘了重跑,这一步会让 diff 非空而失败。
        run: |
          node scripts/gen-odds-pages.mjs
          if ! git diff --quiet -- odds de/odds data/pull-math.json; then
            echo "::error::/odds/ 集群与数据脊不同步 —— 有人手改了生成页,或改了 rarity-odds.json 没重跑生成器。"
            git --no-pager diff --stat -- odds de/odds data/pull-math.json
            exit 1
          fi
          echo "odds cluster in sync with data/rarity-odds.json"


      # llms-full.txt = 全站正文单文件渲染(GEO 面:AI 引擎一次抓取读全站)。
      # 生成器铁律(本站 8 天冻结教训):脚本内部永远 exit 0,任何失败只降级
      # 输出;这里再包一层 continue-on-error,双保险——生成器绝不阻断部署。
      - name: Build llms-full.txt (degrades, never blocks)
        continue-on-error: true
        run: node scripts/build-llms-full.mjs

      - name: Assemble static site into dist/
        run: |
          bash scripts/assemble-dist.sh
          # Build stamp: the self-check below compares it with the live site so a
          # deploy that silently landed on a preview branch (wrangler exits 0
          # either way) can no longer pass on last week's production.
          echo "$GITHUB_SHA" > dist/__build.txt

      - name: Build and validate practical tool workbench
        working-directory: ${{ github.workspace }}
        run: |
          npm ci --prefix tools/revenue-studio --ignore-scripts
          node --test tools/revenue-studio/test.mjs
          node tools/revenue-studio/build.mjs --site tds --out sites/thedollscout/dist
          node tools/revenue-studio/verify.mjs --site tds --out sites/thedollscout/dist

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID_SECRET: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN repo secret is not set"; exit 1
          fi
          if [ -n "$CF_ACCOUNT_ID_SECRET" ]; then
            export CLOUDFLARE_ACCOUNT_ID="$CF_ACCOUNT_ID_SECRET"
          fi
          npx wrangler@4 pages deploy dist \
            --project-name dollscout \
            --branch claude/adult-product-distribution-site-q1bzbh

      # 部署后自检(根仓 CLAUDE.md 2026-08-27 审计要求:断言事故的形状)。
      # 本站的事故形状:①新页 404(部署没生效)②旧成人页仍 200(下架没生效)
      # ③重定向环(gridlings 教训)。三样都测。
      - name: Verify every published workbench tool
        working-directory: ${{ github.workspace }}
        run: node tools/revenue-studio/verify.mjs --site tds --live

      - name: Notify verified localized tool URLs to IndexNow
        if: github.event_name == 'push'
        continue-on-error: true
        working-directory: ${{ github.workspace }}
        run: node tools/revenue-studio/indexnow.mjs --site tds --out sites/thedollscout/dist

      - name: Post-deploy self-check
        run: |
          sleep 20
          fail=0
          live=$(curl -s --max-time 20 "https://thedollscout.com/__build.txt" | tr -d '[:space:]')
          if [ "$live" != "$GITHUB_SHA" ]; then
            echo "::error::live build stamp is '${live:-<none>}', expected $GITHUB_SHA — this deploy did not reach production"; fail=1
          else
            echo "build stamp ok: $live"
          fi
          for p in / /rarity /fake-check /where-to-buy /how-blind-boxes-work /glossary /start /psychology /checker /finder /lookup /zh/ /th/ /de/ /de/rarity /de/fake-check /de/where-to-buy /de/how-blind-boxes-work /de/glossary /de/start /de/psychology /de/checker /de/finder /de/lookup /data/ /robots.txt /sitemap.xml /llms.txt /llms-full.txt /img/og.png /data/rarity-odds.json /data/labubu-glossary.json /data/labubu-fake-signals.json /data/pull-math.json /.well-known/mcp.json /legal/affiliate-disclosure /legal/privacy /odds/ /odds/one-box /odds/six-boxes /odds/twelve-boxes-full-case /odds/twenty-four-boxes /odds/seventy-two-boxes /de/odds/ /de/odds/one-box /de/odds/six-boxes /de/odds/twelve-boxes-full-case /de/odds/twenty-four-boxes /de/odds/seventy-two-boxes /0252657e77641154c50b39045dc829f8.txt; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "https://thedollscout.com$p")
            redirs=$(curl -s -o /dev/null -w "%{num_redirects}" -L --max-redirs 5 --max-time 20 "https://thedollscout.com$p" || echo 99)
            echo "$p -> HTTP $code, redirects $redirs"
            [ "$code" = "200" ] || { echo "::error::$p returned $code (expected 200)"; fail=1; }
            [ "$redirs" = "0" ] || { echo "::error::$p redirected $redirs times (expected 0)"; fail=1; }
          done
          # 旧页断言:middleware 现在对退役路径回 410(比 404 更快触发引擎除名);
          # 边缘缓存抖动(run #21/#25 实测 /scam-check 忽 200 忽 404)给一次 15s
          # 重试机会,连续两次非 404/410 才判失败。
          for p in /scam-check /guides/tpe-vs-silicone /picks; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "https://thedollscout.com$p")
            if [ "$code" != "404" ] && [ "$code" != "410" ]; then
              sleep 15
              code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "https://thedollscout.com$p")
            fi
            echo "retired $p -> HTTP $code"
            case "$code" in 404|410) ;; *) echo "::error::retired page $p returned $code (expected 404/410) — takedown not effective"; fail=1 ;; esac
          done
          # MCP 冒烟:initialize 必须回 protocolVersion;计算工具算 1:72×12 盒
          # 必须回 15.x%(纯数学,答案确定)。/mcp 曾在退役 410 列表里——这两条
          # 断言同时守住「函数活着」与「410 没有误伤」。
          mcp=$(curl -s --max-time 20 -X POST https://thedollscout.com/mcp \
            -H 'Content-Type: application/json' \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}')
          echo "mcp initialize -> $mcp"
          echo "$mcp" | grep -q '"protocolVersion"' || { echo "::error::MCP initialize did not return protocolVersion"; fail=1; }
          calc=$(curl -s --max-time 20 -X POST https://thedollscout.com/mcp \
            -H 'Content-Type: application/json' \
            -d '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"secret_pull_probability","arguments":{"oddsN":72,"boxes":12}}}')
          echo "mcp secret_pull_probability(72,12) -> $calc"
          echo "$calc" | grep -q '15\.' || { echo "::error::MCP calculator did not return ~15% for 1:72 x 12 boxes"; fail=1; }
          def=$(curl -s --max-time 20 -X POST https://thedollscout.com/mcp \
            -H 'Content-Type: application/json' \
            -d '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"define_labubu_term","arguments":{"term":"lafufu"}}}')
          echo "mcp define_labubu_term(lafufu) -> $def"
          # 这两个工具此前从未被冒烟覆盖(2026-08-30 深审发现):它们各自读一个
          # 已发布数据集,数据集换名/换形状时只有这里会喊。
          odds=$(curl -s --max-time 20 -X POST https://thedollscout.com/mcp \
            -H 'Content-Type: application/json' \
            -d '{"jsonrpc":"2.0","id":4,"method":"tools/call","params":{"name":"labubu_rarity_odds","arguments":{}}}')
          echo "$odds" | grep -q '1:72\|"72"\|:72' || { echo "::error::MCP labubu_rarity_odds returned no 1:72 row"; fail=1; }
          sig=$(curl -s --max-time 20 -X POST https://thedollscout.com/mcp \
            -H 'Content-Type: application/json' \
            -d '{"jsonrpc":"2.0","id":5,"method":"tools/call","params":{"name":"labubu_fake_signals","arguments":{}}}')
          echo "$sig" | grep -qi 'teeth' || { echo "::error::MCP labubu_fake_signals returned no teeth-count signal"; fail=1; }
          echo "$def" | grep -qi 'counterfeit' || { echo "::error::MCP define_labubu_term did not define Lafufu as counterfeit"; fail=1; }
          exit $fail

      # Bing/Yandex/Seznam/Naver pick this up within minutes.
      - name: Ping IndexNow with the published URL list
        continue-on-error: true
        run: node scripts/indexnow.mjs

      # First-party analytics self-test: one POST to /api/ev must come back 204.
      - name: Self-test the /api/ev beacon endpoint
        continue-on-error: true
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST https://thedollscout.com/api/ev \
            -H 'Content-Type: text/plain' -d '{"p":"/__ci","r":""}' --max-time 15)
          echo "beacon self-test HTTP $code"
          [ "$code" = "204" ] || echo "::warning::beacon endpoint returned $code (expected 204) — D1 binding may be missing"

      # /api/pulse (2026-09-13): token-free AI-referral aggregate read by the fleet heartbeat.
      # Hard assertion (not a warning): a missing HITS binding or a broken query is exactly
      # the shape this should catch — the beacon test above only warns.
      - name: Assert /api/pulse serves the aggregate
        run: |
          ok=0
          for try in 1 2 3 4 5; do
            pulse=$(curl -s --max-time 20 "https://thedollscout.com/api/pulse" || echo "")
            case "$pulse" in *'"ok":true'*'"ai_ref"'*) ok=1; break;; esac
            sleep 5
          done
          [ "$ok" = "1" ] && echo "OK /api/pulse" || { echo "::error::/api/pulse broken: ${pulse:0:120}"; exit 1; }

concurrency:
  group: deploy-thedollscout
  cancel-in-progress: true


