name: Deploy fleet-x-poster

# X 自动发帖器(营销铁律修订 2026-08-21,owner 授权:机器代发仅限 X 官方 API +
# owner 本人账号)。成本核算(仓库规矩):path 过滤到 tools/x-poster/**,每周
# 分发循环追加队列时跑一次 ≈0.5 分钟 × ~5 次/月 ≈ 2.5 分钟/月;公开仓免费。
#
# 密钥:owner 在 repo Settings → Secrets and variables → Actions 添加
#   X_API_KEY / X_API_SECRET / X_ACCESS_TOKEN / X_ACCESS_SECRET
# (developer.x.com 免费档,App permissions = Read and write,User authentication
# 生成 Access Token & Secret)。没配齐 = worker 部署但休眠,绝不报错。
on:
  push:
    branches: [main]
    paths:
      - "tools/x-poster/**"
      - ".github/workflows/deploy-x-poster.yml"
  workflow_dispatch: {}

concurrency:
  group: deploy-x-poster
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 防回滚守卫(2026-08-26 事故):GitHub 曾乱序补发数小时前的 push 事件,
      # 每个旧事件都按自己那个历史提交部署,把线上反复滚回旧代码——gridlings 的
      # 重定向修复当天被这样滚掉两次,CG 审核正好撞上白屏。这些站点的部署都是
      # 「按当前源码重建并发布」,所以旧事件的正确动作不是发布旧快照,而是发布
      # main 的当前 tip(幂等、绝不倒退)。用 reset --hard 而非 checkout:有 4 条
      # 流水线会 git push 回仓,detached HEAD 会让那一步失败。
      - name: Guard — a replayed/stale push deploys main's tip, never rolls back
        if: github.event_name == 'push'
        run: |
          # Fail-open by design: a network hiccup must never block a deploy —
          # without a resolvable tip we simply keep the pushed commit, which is
          # exactly the pre-guard behaviour.
          git fetch origin main -q || { echo "::warning::fetch failed — stale-run guard skipped"; exit 0; }
          TIP=$(git rev-parse origin/main 2>/dev/null || true)
          case "$TIP" in
            "" | *[!0-9a-f]* ) echo "::warning::main tip unresolvable — stale-run guard skipped"; exit 0 ;;
          esac
          if [ "$(git rev-parse HEAD)" != "$TIP" ]; then
            echo "::warning::stale run — HEAD $(git rev-parse --short HEAD) is behind main tip $(git rev-parse --short "$TIP"); deploying the tip instead of rolling production back"
            git reset --hard "$TIP"
          fi
      - name: Syntax gate
        working-directory: tools/x-poster
        run: node --check worker.js && node --check queue.js

      - name: Queue gate — every part ≤280 chars, ids unique
        working-directory: tools/x-poster
        run: |
          node -e '
            import("./queue.js").then(function(m){
              var q=m.default, ids=new Set();
              for (var it of q){
                if(ids.has(it.id)){console.error("dup id: "+it.id);process.exit(1);}
                ids.add(it.id);
                var parts=it.thread||[it.text];
                for (var t of parts){
                  if(!t||t.length>280){console.error("part >280 or empty in "+it.id);process.exit(1);}
                }
              }
              console.log("queue OK: "+q.length+" item(s)");
            });'

      - name: Deploy worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          workingDirectory: tools/x-poster
          command: deploy

      - name: Push X secrets to worker (skips silently until owner adds them)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          XK: ${{ secrets.X_API_KEY }}
          XS: ${{ secrets.X_API_SECRET }}
          XT: ${{ secrets.X_ACCESS_TOKEN }}
          XTS: ${{ secrets.X_ACCESS_SECRET }}
          XRK: ${{ secrets.X_RUN_KEY }}
        working-directory: tools/x-poster
        run: |
          if [ -z "$XK" ] || [ -z "$XS" ] || [ -z "$XT" ] || [ -z "$XTS" ] || [ -z "$XRK" ]; then
            echo "X secrets not fully configured (need 5 incl. X_RUN_KEY) — worker stays dormant (this is fine)"
            exit 0
          fi
          # printf, not a here-string: <<< appends a newline that would become part of the secret
          printf %s "$XK"  | npx wrangler@4 secret put X_API_KEY
          printf %s "$XS"  | npx wrangler@4 secret put X_API_SECRET
          printf %s "$XT"  | npx wrangler@4 secret put X_ACCESS_TOKEN
          printf %s "$XTS" | npx wrangler@4 secret put X_ACCESS_SECRET
          printf %s "$XRK" | npx wrangler@4 secret put X_RUN_KEY
          echo "x-poster ARMED"

      # Post-deploy self-check (2026-09-04): skipped while dormant (no X_RUN_KEY).
      # Read-only against /status and /; the POST /run probe deliberately carries NO
      # key and must be rejected (403 = armed, 503 = not armed). The real run key never
      # leaves GitHub Secrets here.
      - name: Post-deploy self-check
        env:
          XRK: ${{ secrets.X_RUN_KEY }}
        working-directory: tools/x-poster
        run: |
          set -u
          if [ -z "$XRK" ]; then
            echo "X_RUN_KEY not configured — poster dormant, self-check skipped"
            exit 0
          fi
          BASE="https://fleet-x-poster.tuoqiantu.workers.dev"
          fail=0
          QLEN=$(node -e 'import("./queue.js").then(m=>console.log(m.default.length))')
          echo "local queue length: $QLEN"
          ok=0
          for try in 1 2 3 4 5; do
            code=$(curl -sS -m 20 -o status.json -w '%{http_code}' "$BASE/status" || echo 000)
            if [ "$code" = "200" ] && python3 - "$QLEN" <<'PY'
          import json, sys
          j = json.load(open('status.json'))
          assert isinstance(j.get('armed'), bool), 'armed not boolean'
          assert isinstance(j.get('queue'), list), 'queue not a list'
          assert len(j['queue']) == int(sys.argv[1]), f"queue length {len(j['queue'])} != local {sys.argv[1]}"
          print('OK    /status armed=%s queue=%d' % (j['armed'], len(j['queue'])))
          PY
            then ok=1; break; fi
            sleep 5
          done
          [ "$ok" = "1" ] || { echo "::error::/status -> HTTP $code or shape mismatch"; fail=1; }
          if [ -f status.json ] && grep -Eq 'X_API|oauth_|secret|[A-Za-z0-9_-]{40,}' status.json; then
            echo "::error::/status body contains a credential-shaped string"; fail=1
          else
            echo "OK    /status body has no credential-shaped strings"
          fi
          rm -f status.json
          code=$(curl -sS -m 20 -o /dev/null -w '%{http_code}' "$BASE/" || echo 000)
          if [ "$code" = "200" ]; then echo "OK    / -> 200"
          else echo "::error::/ -> HTTP $code"; fail=1; fi
          code=$(curl -sS -m 20 -o /dev/null -w '%{http_code}' -X POST "$BASE/run" || echo 000)
          case "$code" in
            403|503) echo "OK    POST /run without key -> $code (rejected)" ;;
            *) echo "::error::POST /run without key -> HTTP $code (expected 403 or 503)"; fail=1 ;;
          esac
          [ "$fail" = "0" ] || exit 1
          echo "self-check ok"
