name: Deploy agiscorecard.com

# agi-site 是公开 monorepo(owner 决定 2026-08-19):公开仓 Actions 免费,
# 2000 分钟/月的私有仓额度问题就此解除。原私有仓 f-tiger/agiscorecard 保留作
# 历史档案,site 内容自本仓 sites/agiscorecard/ 部署。
#
# path 过滤:只有本站点目录变了才部署;其他站点的提交不会触发这里。
on:
  push:
    branches: [main]
    paths:
      - "tools/fleet-analytics/**"
      - "tools/revenue-studio/**"
      - "tools/member-studio/**"
      - "sites/baipiaoji/lib/**"
      - "sites/baipiaoji/functions/api/member*.js"
      - "sites/baipiaoji/scripts/ad-runner-config.mjs"
      - "sites/agiscorecard/**"
      - ".github/workflows/deploy-agiscorecard.yml"
      - ".github/scripts/deploy-main-guard*"
  workflow_dispatch:
    inputs:
      check_relay_ai:
        description: "Run real Relay inference after deploy (uses the existing quota)"
        type: boolean
        default: false
      refresh_future:
        description: "Refresh public interview and creator feeds before deploying"
        type: boolean
        default: false
  # 每日兜底部署(2026-09-11)。本站此前**没有自己的 schedule**——它每天能重新部署
  # 纯属副作用:fleet-trends.yml 每天把 trends-us.json 提交进 sites/agiscorecard/,
  # 撞上了本工作流的 path 过滤。那条链一停(09-08 GitHub 整天丢掉了全部计划运行),
  # 本站最长可以 7 天不重建,只能等 heartbeat 的 7 天线来救。
  # 注入器与生成器都是幂等的:平静的一天重建出字节相同的产物,照常部署,不改变什么。
  schedule:
    - cron: "50 2 * * *"

concurrency:
  group: deploy-agiscorecard
  cancel-in-progress: false

jobs:
  future-discovery:
    name: Discover interviews and creator videos
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh_future == true) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Validate discovery failure and freshness handling
        run: python3 sites/agiscorecard/tools/foresight/test_refresh.py
      - name: Read bounded public publisher feeds
        run: python3 sites/agiscorecard/tools/foresight/refresh.py
      - name: Preserve the current snapshot and visible source status
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sites/agiscorecard/foresight-assets/discovery.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore(agi): refresh public interview discovery and source health'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Report any unavailable source after preserving its last good content
        run: |
          python3 - <<'PY'
          import json
          s=json.load(open('sites/agiscorecard/foresight-assets/discovery.json'))
          print(s['checkedAt'], len(s['items']), 'items')
          bad=[x['id'] for x in s['sources'] if x['status']!='ok']
          assert not bad, 'Sources unavailable (cached content retained): '+', '.join(bad)
          PY
  deploy:
    needs: future-discovery
    # A source outage must remain visible but must not stop the site deploying
    # its last good content. Push runs skip discovery and only build/test/deploy.
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    outputs:
      deployed_sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      # All event types use current main. Network failures stop the release.
      - name: Guard — prepare current main and record the effective release
        id: release
        working-directory: ${{ github.workspace }}
        run: bash .github/scripts/deploy-main-guard.sh prepare

      - name: Test rollback prevention with isolated Git fixtures
        working-directory: ${{ github.workspace }}
        run: python3 .github/scripts/deploy-main-guard-test.py

      - name: Build and validate Work Mentor
        run: |
          node sites/agiscorecard/tools/mentor/build.mjs
          node --test sites/agiscorecard/tools/mentor/test.mjs
          node sites/agiscorecard/tools/mentor/member-test.mjs

      - name: Generate membership and workbench pages before sitemap validation
        run: |
          npm ci --prefix tools/revenue-studio --ignore-scripts
          node tools/revenue-studio/build.mjs --site agi --out sites/agiscorecard
          (cd sites/agiscorecard && python3 tools/add_breadcrumbs.py --apply)

      - name: Build and validate need-led future guide
        run: |
          python3 sites/agiscorecard/tools/foresight/test_refresh.py
          node sites/agiscorecard/tools/foresight/build.mjs
          node sites/agiscorecard/tools/foresight/build.mjs --check
          node --test sites/agiscorecard/tools/foresight/test.mjs
          node sites/agiscorecard/tools/foresight/member-test.mjs

      - name: Build and test bounded Jarvis research agent
        run: |
          node sites/agiscorecard/tools/jarvis/build.mjs
          node --test sites/agiscorecard/tools/jarvis/test.mjs

      - name: Regenerate feed and agent-readable mirrors from current pages
        working-directory: sites/agiscorecard
        run: |
          python3 tools/build_evidence_assets.py
          python3 tools/build_evidence_assets.py --check
          python3 tools/test_evidence.py
          node --test tools/test_evidence.mjs
          python3 tools/build_home_focus.py
          python3 tools/build_home_focus.py --check
          python3 tools/build_discovery.py
          python3 tools/build_discovery.py --check
          python3 tools/test_discovery.py
          node --test tools/test_indexnow.mjs
          python3 tools/gen_feed.py
          python3 tools/gen_agent_surfaces.py
          # /changelog was 2 entries behind its own JSON on 2026-09-26 because nothing regenerated it.
          python3 tools/gen_changelog.py
          # the installable skill must survive the mirror pass with its frontmatter intact
          head -1 skill.md | grep -q '^---$' || { echo "::error::skill.md lost its frontmatter (mirror generator overwrote it?)"; exit 1; }
          # grader consensus: selftest + committed JSON must equal a recompute from data.json + independent-grades.json
          python3 tools/gen_grader_consensus.py --selftest
          python3 tools/gen_grader_consensus.py --check
      - name: Build and test Earn video project library
        run: |
          node sites/agiscorecard/tools/earn/build.mjs
          node --test sites/agiscorecard/tools/earn/test.mjs sites/agiscorecard/tools/earn/checks-test.mjs


      - name: Refresh bounded SEC annual snapshots and validate research contracts
        run: |
          python3 sites/agiscorecard/tools/infrastructure/refresh.py
          python3 sites/agiscorecard/tools/infrastructure/test_data.py
          node --test sites/agiscorecard/tools/infrastructure/test.mjs
      - name: Validate Relay stories, permissions and cost caps
        run: node --test sites/agiscorecard/tools/create/test.mjs sites/agiscorecard/tools/create/ai-check-test.mjs

      - name: Build and verify registered portfolio tracker
        run: |
          python3 sites/agiscorecard/tools/portfolio/build.py
          python3 sites/agiscorecard/tools/portfolio/test_data.py
          node --test sites/agiscorecard/tools/portfolio/test.mjs sites/agiscorecard/tools/portfolio/api-test.mjs

      - name: Validate investment research arithmetic and portable records
        run: node --test sites/agiscorecard/tools/test_invest_research.mjs

      - name: Validate site (zero-fabrication gates must print OK)
        working-directory: sites/agiscorecard
        run: python3 tools/validate.py

      - name: Validate hreflang
        working-directory: sites/agiscorecard
        run: python3 tools/check_hreflang.py

      # 站规写着「每个新页都要有 BreadcrumbList JSON-LD」,但 2026-09-15 实测:英文根目录
      # 85/99 做到了,zh 只有 10/44,de/es/fr/it/ja/ko/pt 各 0/10 —— 104 页缺。补完之后
      # 加这道门,免得下一批多语言页又漏。纯正确性校验,零外部副作用,可以挂 push 路径。
      - name: Every multilingual page carries a BreadcrumbList
        working-directory: sites/agiscorecard
        run: python3 tools/add_breadcrumbs.py --check

      # The collector's field sanitisers decide what survives into D1. When they are
      # wrong they are wrong SILENTLY: from 2026-08-08 to 2026-09-08 every reader's
      # search query was stored as an empty label, and the table looked fine. Runs on
      # the push path because it is a correctness gate on the deployed worker, and it
      # costs a couple of seconds.
      - name: Test community privacy, registration and permissions
        run: node --test sites/agiscorecard/tools/community/test.mjs

      - name: Test analytics field sanitisers
        working-directory: sites/agiscorecard
        run: |
          node tools/test_analytics_sanitiser.mjs
          node --test tools/test_video_growth.mjs tools/test_home_focus.mjs

      # D1 read budget (2026-09-26): the account-wide free tier (5M rows read/day) ran out three days
      # running; /api/pulse + /api/trends were ~46% of 09-26. This pins the fix: every pageviews query
      # the two handlers issue must use the human covering index (EXPLAIN on the real SQL), numbers are
      # identical with and without it, and the server-side cache computes once per TTL and never stores
      # failures or partial results. 8 mutations verified red.
      - name: Test pulse/trends D1 read budget (index + server-side cache)
        working-directory: sites/agiscorecard
        run: node tools/test_analytics_d1.mjs
      - name: /api/crowd shape, bot exclusion and index use (zero network)
        working-directory: sites/agiscorecard
        run: node tools/test_crowd.mjs

      - name: Guard - owner privacy files must never exist in this public repo
        run: |
          bad=$(find . -path ./.git -prune -o \( -name "owner-identity*" -o -name "owner-trajectory*" \) -print | wc -l)
          if [ "$bad" != "0" ]; then
            echo "::error::owner privacy files found in public repo — refusing to deploy"
            exit 1
          fi

      - name: Build and validate practical tool workbench
        working-directory: ${{ github.workspace }}
        run: |
          node --test tools/revenue-studio/test.mjs
          node tools/revenue-studio/node_modules/playwright/cli.js install --with-deps chromium --only-shell
          node sites/agiscorecard/tools/browser_home_focus.mjs
          node sites/agiscorecard/tools/browser_evidence.mjs
          node sites/agiscorecard/tools/foresight/browser-test.mjs
          node tools/revenue-studio/browser-test.mjs
          node sites/agiscorecard/tools/browser_invest_research.cjs
          node sites/agiscorecard/tools/create/browser-test.mjs
          node sites/agiscorecard/tools/earn/browser-test.mjs
          node tools/member-studio/browser-test.mjs
          node sites/agiscorecard/tools/community/browser-test.mjs
          node sites/agiscorecard/tools/portfolio/browser-test.mjs
          node sites/agiscorecard/tools/infrastructure/browser-test.mjs
          node sites/agiscorecard/tools/mentor/browser-test.mjs
          node sites/agiscorecard/tools/jarvis/browser-test.mjs
          node tools/revenue-studio/verify.mjs --site agi --out sites/agiscorecard
          node tools/member-studio/test-isolation.mjs
          node tools/member-studio/verify.mjs --site agi --out sites/agiscorecard
          (cd sites/agiscorecard && python3 tools/add_breadcrumbs.py --apply && python3 tools/add_breadcrumbs.py --check)

      - name: Configure independent membership secrets
        working-directory: ${{ github.workspace }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADS_WALLET: ${{ secrets.ADS_WALLET }}
          ADS_WATCH_SECRET: ${{ secrets.ADS_WATCH_SECRET }}
        run: |
          node tools/member-studio/ops.mjs preflight
          node tools/member-studio/ops.mjs configure agi

      - name: Complete and verify GA4 coverage after all page generators
        working-directory: ${{ github.workspace }}
        run: |
          node --test tools/fleet-analytics/business.test.mjs
          node --test tools/fleet-analytics/integrity.test.mjs
          python3 tools/fleet-analytics/check-registry.py
          python3 tools/fleet-analytics/test_coverage.py
          node --test tools/fleet-analytics/test-worker.mjs
          python3 tools/fleet-analytics/coverage.py --site agi --out sites/agiscorecard --write
          python3 tools/fleet-analytics/coverage.py --site agi --out sites/agiscorecard
          node tools/fleet-analytics/browser-test.mjs --site agi --out sites/agiscorecard

      - name: Guard — main must still match the validated build
        working-directory: ${{ github.workspace }}
        env:
          DEPLOY_SHA: ${{ steps.release.outputs.sha }}
        run: bash .github/scripts/deploy-main-guard.sh check

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          workingDirectory: sites/agiscorecard
          command: deploy

      # Refresh the existing membership health record before Mentor checks ready.
      # A delayed scheduled watcher must not make this refresh unreachable.
      - name: Verify independent membership after deployment
        working-directory: ${{ github.workspace }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ADS_WATCH_SECRET: ${{ secrets.ADS_WATCH_SECRET }}
        run: |
          for attempt in 1 2 3 4; do
            if node tools/member-studio/ops.mjs watch agi && node tools/member-studio/verify.mjs --site agi --live; then exit 0; fi
            if [ "$attempt" != "4" ]; then sleep 8; fi
          done
          exit 1

      - name: Verify live Work Mentor and revenue counters
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ADS_WATCH_SECRET: ${{ secrets.ADS_WATCH_SECRET }}
        run: |
          node sites/agiscorecard/tools/mentor/verify.mjs
          node sites/agiscorecard/tools/mentor/metrics.mjs
          node sites/agiscorecard/tools/evidence-metrics.mjs

      - name: Verify live homepage focus and evidence versions
        run: node sites/agiscorecard/tools/verify_home_focus.mjs

      - name: Verify live SEO and agent discovery contracts
        run: |
          node sites/agiscorecard/tools/verify_discovery.mjs
          node sites/agiscorecard/tools/verify_evidence.mjs

      - name: Verify live future-guide content, assets and member catalog
        run: node sites/agiscorecard/tools/foresight/verify.mjs

      - name: Verify live Jarvis surfaces and private API boundaries
        run: node sites/agiscorecard/tools/jarvis/verify.mjs

      - name: Verify live GA4 coverage and analytics asset version
        working-directory: ${{ github.workspace }}
        run: node tools/fleet-analytics/verify-live.mjs agi

      - name: Verify discussion pages and private API boundaries
        run: |
          for attempt in 1 2 3; do
            if node sites/agiscorecard/tools/community/verify.mjs; then exit 0; fi
            if [ "$attempt" != "3" ]; then sleep 8; fi
          done
          exit 1

      - name: Verify Earn library live release
        run: node sites/agiscorecard/tools/earn/verify.mjs

      - name: Verify Relay live release
        run: node sites/agiscorecard/tools/create/verify.mjs

      - name: Verify live infrastructure research and membership catalog
        run: node sites/agiscorecard/tools/infrastructure/verify.mjs

      - name: Read Relay experiment aggregates and report backlog
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ADS_WATCH_SECRET: ${{ secrets.ADS_WATCH_SECRET }}
        run: node sites/agiscorecard/tools/create/ops.mjs stats

      - name: Read aggregate community growth and review backlog
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ADS_WATCH_SECRET: ${{ secrets.ADS_WATCH_SECRET }}
        run: node sites/agiscorecard/tools/community/ops.mjs stats

      - name: Verify every published workbench tool
        working-directory: ${{ github.workspace }}
        run: |
          # Cloudflare can briefly return the previous successful edition after deploy.
          # Retry the same strict checks; a persistently old or broken page still fails.
          for attempt in 1 2 3 4; do
            if node tools/revenue-studio/verify.mjs --site agi --live; then exit 0; fi
            if [ "$attempt" != "4" ]; then sleep 8; fi
          done
          exit 1

      - name: Post-deploy smoke (live site serves key surfaces)
        run: |
          sleep 10
          fail=0
          check() {
            url="$1"; must="$2"
            for i in 1 2 3; do
              body=$(curl -sL --max-time 20 -w "\n%{http_code}" "$url" || echo -e "\n000")
              code=$(echo "$body" | tail -1)
              [ "$code" = "200" ] && break
              sleep 5
            done
            if [ "$code" != "200" ]; then echo "::error::$url HTTP $code"; fail=1
            elif [ -n "$must" ] && ! echo "$body" | grep -q "$must"; then
              echo "::error::$url missing: $must"; fail=1
            else echo "OK $url"; fi
          }
          check "https://agiscorecard.com/" "Thesis Tracker"
          # run_worker_first + HTMLRewriter: the beacon is edge-injected, not in any page file — assert it was actually injected.
          check "https://agiscorecard.com/" "/api/e"
          check "https://agiscorecard.com/progress-index" "One Score for the 2027 Bet"
          check "https://agiscorecard.com/data.json" "predictions"
          check "https://agiscorecard.com/for-agents" "for_agents_delivery_lab"
          check "https://agiscorecard.com/sitemap.xml" "<loc>"
          check "https://agiscorecard.com/cn" "agi-focus-20261001"
          # 2026-09-26 trust-layer surfaces. The board only exists once the weekly fetch has succeeded,
          # so assert it live only when the repo carries it (never a hardcoded expectation).
          if [ -f sites/agiscorecard/agi-consensus.json ]; then
            check "https://agiscorecard.com/agi-consensus.json" '"median"'
            check "https://agiscorecard.com/agi-prediction-markets" "Consensus table"
          fi
          check "https://agiscorecard.com/skill.md" "^name: agi-scorecard"
          check "https://agiscorecard.com/ots/manifest.json" "proof"
          # MCP tools/list must equal the repo's list (live == repo, never a hardcoded count).
          want=$(grep -o "name: '\(get_\|search_\)[a-z_]*'" sites/agiscorecard/tools/analytics-worker/index.js | sed "s/name: '//;s/'//" | sort -u | tr '\n' ' ')
          got=$(curl -s --max-time 20 -X POST -H 'content-type: application/json' -H 'accept: application/json, text/event-stream' \
                -A 'agi-site-deploy-selfcheck/1.0 (+https://github.com/f-tiger/agi-site)' \
                -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' "https://agiscorecard.com/mcp" \
                | grep -o '"name":"[a-z_]*"' | sed 's/"name":"//;s/"//' | sort -u | tr '\n' ' ')
          if [ "$want" != "$got" ]; then echo "::error::MCP tools/list drift — repo: [$want] live: [$got]"; fail=1; else echo "OK /mcp tools/list == repo"; fi
          # D1 read path: /api/trends serves live rows; broken binding = broken JSON here.
          t=$(curl -s --max-time 20 -D trends-headers.txt "https://agiscorecard.com/api/trends" || echo "")
          case "$t" in
            *'"ok":true'*) echo "OK /api/trends" ;;
            *) echo "::error::/api/trends broken (HTTP $code): ${t:0:120}"; fail=1 ;;
          esac
          check "https://agiscorecard.com/api/video-growth?ci=1" '"metric":"browser_events_not_users"'
          # /api/crowd (2026-09-27): the /agi-test crowd reveal reads this; five buckets, cached.
          c=$(curl -s --max-time 20 "https://agiscorecard.com/api/crowd" || echo "")
          case "$c" in
            *'"ok":true'*'"buckets":{"accelerationist":'*'"contrarian":'*) echo "OK /api/crowd" ;;
            *) echo "::error::/api/crowd broken: ${c:0:120}"; fail=1 ;;
          esac
          # /api/pulse (2026-09-13): the fleet heartbeat reads AI-assistant referrals here, token-free.
          p=$(curl -s --max-time 20 -D pulse-headers.txt "https://agiscorecard.com/api/pulse" || echo "")
          case "$p" in
            *'"ok":true'*'"ai_ref"'*'"by_source"'*'"money":{'*) echo "OK /api/pulse" ;;
            *) echo "::error::/api/pulse broken (HTTP $code): ${p:0:120}"; fail=1 ;;
          esac
          # Server-side cache in place (2026-09-26): without it every caller recomputes the aggregates in
          # D1, which is how the account's daily read budget ran out. A partial or failed result says
          # "bypass" and already fails the ok:true checks above.
          for h in trends-headers.txt pulse-headers.txt; do
            grep -qiE '^x-agi-aggregate-cache: (hit|miss)' "$h" \
              && grep -i '^x-agi-aggregate-cache' "$h" \
              || { echo "::error::${h%%-*} is not served through the server-side cache (x-agi-aggregate-cache missing)"; fail=1; }
          done
          exit $fail

      - name: Summarize deployment and the separate AI check
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          Deployment and all live release checks passed.

          Real Relay inference is checked by the separate **Relay AI availability** job
          on the existing daily schedule, or an explicit manual run with
          `check_relay_ai=true`. A skipped AI job means **not tested**, never healthy.
          Ordinary pushes do not consume the production inference allowance.
          EOF

  relay-ai:
    name: Relay AI availability (existing quota)
    needs: deploy
    # Root CI policy: external model calls belong to the daily path or explicit
    # manual verification, not every content/analytics push. No new cron.
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.check_relay_ai == true) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          # The stale-run guard may have deployed a newer main than github.sha.
          ref: ${{ needs.deploy.outputs.deployed_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Verify real Relay AI generation within the existing quota
        # 429 and all other inference failures remain red. No retries, bypass,
        # extra identities, synthetic-success fallback or increased allowance.
        run: node sites/agiscorecard/tools/create/ai-check.mjs
