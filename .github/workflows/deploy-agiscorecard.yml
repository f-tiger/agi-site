name: Deploy agiscorecard.com

# agi-site 是公开 monorepo(owner 决定 2026-08-19):公开仓 Actions 免费,
# 2000 分钟/月的私有仓额度问题就此解除。原私有仓 f-tiger/agiscorecard 保留作
# 历史档案,site 内容自本仓 sites/agiscorecard/ 部署。
#
# path 过滤:只有本站点目录变了才部署;其他站点的提交不会触发这里。
on:
  push:
    branches: [main]
    paths:
      - "sites/agiscorecard/**"
      - ".github/workflows/deploy-agiscorecard.yml"
  workflow_dispatch: {}

concurrency:
  group: deploy-agiscorecard
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 防回滚守卫(2026-08-26 事故):GitHub 曾乱序补发数小时前的 push 事件,
      # 每个旧事件都按自己那个历史提交部署,把线上反复滚回旧代码——gridlings 的
      # 重定向修复当天被这样滚掉两次,CG 审核正好撞上白屏。这些站点的部署都是
      # 「按当前源码重建并发布」,所以旧事件的正确动作不是发布旧快照,而是发布
      # main 的当前 tip(幂等、绝不倒退)。用 reset --hard 而非 checkout:有 4 条
      # 流水线会 git push 回仓,detached HEAD 会让那一步失败。
      - name: Guard — a replayed/stale push deploys main's tip, never rolls back
        if: github.event_name == 'push'
        run: |
          # Fail-open by design: a network hiccup must never block a deploy —
          # without a resolvable tip we simply keep the pushed commit, which is
          # exactly the pre-guard behaviour.
          git fetch origin main -q || { echo "::warning::fetch failed — stale-run guard skipped"; exit 0; }
          TIP=$(git rev-parse origin/main 2>/dev/null || true)
          case "$TIP" in
            "" | *[!0-9a-f]* ) echo "::warning::main tip unresolvable — stale-run guard skipped"; exit 0 ;;
          esac
          if [ "$(git rev-parse HEAD)" != "$TIP" ]; then
            echo "::warning::stale run — HEAD $(git rev-parse --short HEAD) is behind main tip $(git rev-parse --short "$TIP"); deploying the tip instead of rolling production back"
            git reset --hard "$TIP"
          fi
      - name: Validate site (zero-fabrication gates must print OK)
        working-directory: sites/agiscorecard
        run: python3 tools/validate.py

      - name: Guard - owner privacy files must never exist in this public repo
        run: |
          bad=$(find sites -name "owner-identity*" -o -name "owner-trajectory*" | wc -l)
          if [ "$bad" != "0" ]; then
            echo "::error::owner privacy files found in public repo — refusing to deploy"
            exit 1
          fi

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          workingDirectory: sites/agiscorecard
          command: deploy

      - name: Post-deploy smoke (live site serves key surfaces)
        run: |
          sleep 10
          fail=0
          check() {
            url="$1"; must="$2"
            for i in 1 2 3; do
              body=$(curl -sL --max-time 20 -w "\n%{http_code}" "$url" || echo -e "\n000")
              code=$(echo "$body" | tail -1)
              [ "$code" = "200" ] && break
              sleep 5
            done
            if [ "$code" != "200" ]; then echo "::error::$url HTTP $code"; fail=1
            elif [ -n "$must" ] && ! echo "$body" | grep -q "$must"; then
              echo "::error::$url missing: $must"; fail=1
            else echo "OK $url"; fi
          }
          check "https://agiscorecard.com/" "Thesis Tracker"
          check "https://agiscorecard.com/progress-index" ""
          check "https://agiscorecard.com/data.json" "predictions"
          check "https://agiscorecard.com/sitemap.xml" "<loc>"
          check "https://agiscorecard.com/cn" ""
          # D1 read path: /api/trends serves live rows; broken binding = broken JSON here.
          t=$(curl -s --max-time 20 "https://agiscorecard.com/api/trends" || echo "")
          case "$t" in
            *'"'*) echo "OK /api/trends" ;;
            *) echo "::error::/api/trends broken: ${t:0:120}"; fail=1 ;;
          esac
          exit $fail
