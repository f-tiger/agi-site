name: Fleet membership report

# Aggregate reporting only. Daily cadence comes from fleet-autopilot's existing
# independent job; no new cron, growth task, watcher, deployment or IndexNow call.
on:
  workflow_call:
    inputs:
      dry_run:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run mocked tests only; do not contact live services"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - '.github/workflows/fleet-membership-report.yml'
      - '.github/workflows/fleet-autopilot.yml'
      - '.github/workflows/bpj-ad-watch.yml'
      - 'tools/fleet/*membership*'
  pull_request:
    paths:
      - '.github/workflows/fleet-membership-report.yml'
      - '.github/workflows/fleet-autopilot.yml'
      - '.github/workflows/bpj-ad-watch.yml'
      - 'tools/fleet/*membership*'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test missing, partial, malformed, stale and zero counters without live requests
        run: |
          node --test tools/fleet/membership*.test.mjs tools/fleet/test_membership_totals.mjs
          python3 tools/fleet/test_membership_snapshot.py

  report:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && inputs.dry_run != true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    concurrency:
      group: fleet-membership-report
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test current main artifact validation without live site requests
        run: |
          node --test tools/fleet/membership*.test.mjs tools/fleet/test_membership_totals.mjs
          python3 tools/fleet/test_membership_snapshot.py
      - name: Record this report start
        id: clock
        run: echo "started=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      # Same-public-repository ephemeral token only. Never dispatch the producer.
      - name: Select the latest trusted completed watcher aggregate
        id: select
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/fleet/membership_handoff.mjs select "$RUNNER_TEMP/membership-selection"
      - name: Download the exact selected data artifact
        if: steps.select.outcome == 'success'
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: f-tiger/agi-site
          run-id: ${{ steps.select.outputs.run_id }}
          artifact-ids: ${{ steps.select.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/membership-source
      - name: Validate sanitized JSON and preserve its observation time
        id: collect
        timeout-minutes: 1
        run: node tools/fleet/membership_snapshot.mjs --input "$RUNNER_TEMP/membership-source" --selection "$RUNNER_TEMP/membership-selection/selection.json"
      - name: Reject stale or misleading evidence and summarize availability
        id: current
        if: always() && steps.collect.outcome == 'success'
        run: python3 tools/fleet/check_membership_snapshot.py --summary "$GITHUB_STEP_SUMMARY"
      - name: Preserve the validated source observation
        if: always() && steps.current.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: fleet-membership-${{ github.run_id }}-${{ github.run_attempt }}
          path: data/fleet-evolution/membership.json
          retention-days: 30
          if-no-files-found: error
      - name: Commit only the validated current report
        if: always() && steps.current.outcome == 'success'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/fleet-evolution/membership.json
          git diff --cached --quiet && exit 0
          git commit -m "chore(fleet): persist observed aggregate membership report ${{ steps.clock.outputs.started }}"
          for i in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            if [ -n "$(git ls-files -u)" ]; then
              echo "::error::Concurrent membership report conflict; inspect the saved artifact."
              exit 1
            fi
            sleep $((2**i))
          done
          echo "::error::Could not persist membership report after three attempts."
          exit 1
      - name: Expose unavailable counters after preserving observed evidence
        if: always() && steps.current.outcome == 'success'
        run: python3 tools/fleet/check_membership_snapshot.py --require-available

