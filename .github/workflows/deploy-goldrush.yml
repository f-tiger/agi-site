name: Deploy goldrush

# The AI Gold Rush Ledger — 2026-08-29 建站(owner 指令,去币化合规形态)。
# 域名:goldrush.agiscorecard.com(wrangler custom_domain 自动挂载)。
# 成本核算:push ~0.7 分/次,无 schedule(进化循环搭舰队既有每日会话,零新增
# Actions 成本),公开仓免费。
# Owner 一键停止:仓里存在 sites/goldrush/KILLED 文件 → 本流水线拒绝部署,
# 线上冻结在最后版本(OWNER-CONTROL.md 第 1 条的实现)。
on:
  push:
    branches: [main]
    paths: ["sites/goldrush/**", ".github/workflows/deploy-goldrush.yml"]
  workflow_dispatch: {}
  # 每日兜底部署(2026-09-11)。原注释说「无 schedule(进化循环搭舰队既有每日会话,
  # 零新增 Actions 成本)」——而 2026-09-11 审计发现:本站没有生成器、没有数据输入、
  # 也不在任何一条 Routine 的职责里,「搭既有会话」等于没有人负责,站点自 2026-08-30
  # 起一个字节没动过。公开仓 Actions 免费,那句成本理由不成立。
  schedule:
    - cron: "35 7 * * *"

concurrency:
  group: deploy-goldrush
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 防回滚守卫(舰队标准,2026-08-26 事故):乱序补发的旧 push 事件一律部署
      # main 当前 tip,绝不把生产滚回历史版本。fail-open:网络抖动不阻塞部署。
      - name: Guard — a replayed/stale push deploys main's tip, never rolls back
        if: github.event_name == 'push'
        run: |
          git fetch origin main -q || { echo "::warning::fetch failed — stale-run guard skipped"; exit 0; }
          TIP=$(git rev-parse origin/main 2>/dev/null || true)
          case "$TIP" in
            "" | *[!0-9a-f]* ) echo "::warning::main tip unresolvable — stale-run guard skipped"; exit 0 ;;
          esac
          if [ "$(git rev-parse HEAD)" != "$TIP" ]; then
            echo "::warning::stale run — deploying main tip instead of rolling back"
            git reset --hard "$TIP"
          fi
      - name: Owner kill switch
        run: |
          if [ -f sites/goldrush/KILLED ]; then
            echo "::notice::KILLED file present — owner has frozen this site; skipping deploy."
            exit 1
          fi
      - name: Gate — expected files present and worker parses
        working-directory: sites/goldrush
        run: |
          for f in site/index.html site/ledger.json site/llms.txt site/robots.txt worker.js wrangler.jsonc; do
            [ -f "$f" ] || { echo "::error::missing $f"; exit 1; }
          done
          node --check worker.js
          node -e "JSON.parse(require('fs').readFileSync('site/ledger.json','utf8'))"
          # 2026-09-22: the registry's own admission rules applied to our own ledger (five fields,
          # written flip ≥15 chars, checkable source, corrections keep the old text), and the
          # live /fetchlog.json summariser + its SQL exclusions pinned. Both self-test first so a
          # gate that has gone blind fails here, not silently.
          node tools/check_ledger.mjs --selftest
          node tools/check_ledger.mjs
          node tools/test_fetchlog.mjs
          echo "gate ok"
      - name: Deploy worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          workingDirectory: sites/goldrush
          command: deploy
      - name: Post-deploy self-check
        # 2026-09-04：此前只有 sleep 20 + 单次探测 + 失败只 warning（首次部署 DNS 收敛的借口
        # 早在 08-29 就过期了），且从不探三条无扩展名路由——09-30 绊线全靠它们。
        # 现按 gridlings 的形状：5 次重试，任一路径非 200 就把 run 打红。全部带 ?ci=1，
        # worker 会把自测排除在 D1 之外。
        run: |
          set -u
          fail=0
          for p in / /protocol /agix /grader /how-to-verify-ai-money-claims /ledger.json /claimledger.json /.well-known/claimledger.json /llms.txt; do
            url="https://goldrush.agiscorecard.com$p?ci=1"
            ok=0; code=000
            for try in 1 2 3 4 5; do
              code=$(curl -s -o /dev/null -w '%{http_code}' -L --max-redirs 5 --max-time 20 \
                     -A 'goldrush-deploy-smoke-bot (+ci)' "$url" || echo 000)
              if [ "$code" = "200" ]; then ok=1; break; fi
              sleep 5
            done
            if [ "$ok" = "1" ]; then echo "OK    $p -> 200"; else echo "::error::$p -> HTTP $code after 5 tries"; fail=1; fi
          done
          # /api/pulse (2026-09-13): token-free AI-referral aggregate read by the fleet heartbeat
          pulse=$(curl -s --max-time 20 -A 'goldrush-deploy-smoke-bot (+ci)' "https://goldrush.agiscorecard.com/api/pulse" || echo "")
          case "$pulse" in
            *'"ok":true'*'"ai_ref"'*) echo "OK    /api/pulse" ;;
            *) echo "::error::/api/pulse broken: ${pulse:0:120}"; fail=1 ;;
          esac
          # 2026-09-22 — the protocol's own promises, asserted on the live edge:
          # (1) /claimledger.json MUST carry access-control-allow-origin: * (the grader's reader and
          #     every browser-side registry fetch it from another origin; lose the header and every
          #     protocol tool breaks while the page still returns 200);
          # (2) /fetchlog.json is computed live (live:true) and its headline equals the sum of its
          #     three parts — a served static fallback (live:false) means D1 is unreachable from the
          #     worker, which is exactly the "stale zero" failure this rewrite exists to end.
          cors=$(curl -s -o /dev/null -D - --max-time 20 -A 'goldrush-deploy-smoke-bot (+ci)' \
                 "https://goldrush.agiscorecard.com/claimledger.json?ci=1" | tr -d '\r' | grep -i '^access-control-allow-origin: \*' || true)
          if [ -n "$cors" ]; then echo "OK    /claimledger.json access-control-allow-origin: *"; else echo "::error::/claimledger.json lacks access-control-allow-origin: * — every protocol reader breaks"; fail=1; fi
          fl=$(curl -s --max-time 20 -A 'goldrush-deploy-smoke-bot (+ci)' "https://goldrush.agiscorecard.com/fetchlog.json?ci=1" || echo "")
          if printf '%s' "$fl" | node -e '
            let s=""; process.stdin.on("data",d=>s+=d).on("end",()=>{
              let j; try { j=JSON.parse(s); } catch(e){ console.error("not JSON"); process.exit(1); }
              const c=j.counts||{};
              if (j.live!==true) { console.error("live:"+j.live+" error:"+j.live_error); process.exit(1); }
              if (c.outside_fetches_of_our_claimledger!==(c.outside_fetches_crawler_ua|0)+(c.outside_fetches_browser_ua|0)+(c.outside_fetches_other_ua|0)) { console.error("sum mismatch"); process.exit(1); }
              console.log("live outside="+c.outside_fetches_of_our_claimledger+" crawler="+c.outside_fetches_crawler_ua+" browser="+c.outside_fetches_browser_ua+" as_of="+c.as_of);
            });'; then echo "OK    /fetchlog.json live"; else echo "::error::/fetchlog.json not live or inconsistent: ${fl:0:160}"; fail=1; fi
          [ "$fail" = "0" ] || exit 1
          echo "self-check ok"
