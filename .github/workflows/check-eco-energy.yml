name: Check ECO energy workbench
on:
  pull_request:
    paths:
      - 'sites/getecoback/**'
      - 'tools/eco-reporting/**'
      - '.github/workflows/eco-readonly-report.yml'
      - 'tools/eco_evolution.py'
      - 'tools/eco_demand_model.py'
      - 'tools/test_eco_demand_model.py'
      - 'data/evolution/getecoback-markets.json'
      - 'tools/test_eco_evolution.py'
      - 'data/evolution/getecoback-catalog.json'
      - '.github/workflows/eco-trends.yml'
      - 'tools/member-studio/**'
      - 'tools/fleet/membership*.mjs'
      - 'sites/baipiaoji/lib/membership.js'
      - 'sites/baipiaoji/functions/api/member-watch.js'
      - '.github/workflows/check-eco-energy.yml'
      - '.github/workflows/deploy-getecoback.yml'
      - '.github/scripts/deploy-main-guard*'
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: eco-energy-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    # Match the npm Playwright version below; browsers and system libraries are
    # already installed, avoiding repeated slow Ubuntu mirror downloads.
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
      options: --ipc=host
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: sites/getecoback
    steps:
      - uses: actions/checkout@v4
      - name: Trust this checked-out workspace in the container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify calculations, generated pages and discoverability
        run: |
          # Check committed buyer modules before generators can repair missing markup.
          node --test tools/test_buyer_decision.mjs
          node --test ../../tools/eco-reporting/report.test.mjs
          node --test tools/test_mcp_moisture.mjs
          node ../../tools/member-studio/test-isolation.mjs
          node ../../tools/member-studio/test-failure.mjs
          node ../../tools/fleet/test_membership_totals.mjs
          node --test tools/test_energy_tariffs.mjs tools/test_country_exports.mjs
          node --test tools/test_video_campaign.mjs
          node --test tools/test_pulse_cache.mjs
          node --test tools/test_affiliate_metrics.mjs
          node --test tools/test_affiliate_audit.mjs
          python3 tools/test_trend_radar.py
          python3 tools/test_auto_content_sources.py
          python3 tools/test_auto_content.py
          python3 tools/test_auto_content_render.py
          python3 tools/test_auto_discovery.py
          python3 tools/test_commit_auto_content.py
          python3 ../../.github/scripts/deploy-main-guard-test.py
          python3 tools/test_check_auto_content_release.py
          python3 tools/test_sitemap_pending_publication.py
          node --test tools/test_auto_product.mjs
          python3 -m unittest discover -s ../../tools -p test_eco_evolution.py
          python3 -m unittest discover -s ../../tools -p test_eco_demand_model.py
          node --test tools/test_agent_sources.mjs
          node --test ../../tools/fleet-analytics/business.test.mjs
          python3 tools/test_affiliate_growth.py
          python3 tools/test_tools_hub.py
          python3 tools/test_build_hreflang.py
          python3 tools/build_energy_workbench.py
          python3 tools/link_energy_workbench.py
          node --test tools/test_winter_math.mjs tools/test_au_cooling.mjs
          python3 tools/build_winter_guides.py
          python3 tools/build_winter_locales.py
          python3 tools/build_au_cooling.py
          python3 tools/build_uk_opportunities.py
          python3 tools/build_tools_hub.py
          python3 tools/build_floorcare_guide.py
          python3 tools/build_robot_guide.py
          python3 tools/build_humidifier_guide.py
          python3 tools/build_structure.py
          python3 tools/build_related.py
          python3 -m unittest discover -s tools -p test_heatpump_intent.py
          python3 -m unittest discover -s tools -p test_toppick_anchor.py
          python3 -m unittest discover -s tools -p test_buyer_comparison.py
          python3 -m unittest discover -s tools -p test_buyer_entry.py
          python3 -m unittest discover -s tools -p test_moisture_journeys.py
          python3 -m unittest discover -s tools -p test_journey_geo.py
          python3 -m unittest discover -s tools -p test_home_editorial.py
          python3 -m unittest discover -s tools -p test_buyer_geo.py
          python3 -m unittest discover -s tools -p test_air_category_entry.py
          python3 -m unittest discover -s tools -p test_humidity_evidence.py
          node --test tools/test_buyer_decision.mjs
          node --test tools/test_laundry.mjs
          node --test ../../tools/affiliate-growth/test.mjs
          # Match deployment: this regenerates the isolated workbench pages
          # after generic chrome, keeping their probe/event contract intact.
          python3 tools/link_energy_workbench.py
          python3 tools/link_household.py
          python3 tools/build_country_categories.py
          python3 tools/link_winter_guides.py
          python3 tools/check_winter_guides.py
          python3 tools/build_winter_locales.py
          python3 tools/build_au_cooling.py
          python3 tools/build_uk_opportunities.py
          python3 tools/build_product_decisions.py
          node tools/test_product_decisions.mjs
          python3 tools/build_home_fit.py
          node --test tools/test_home_fit.mjs
          python3 tools/build_upkeep_decisions.py
          python3 tools/build_upkeep_discovery.py
          python3 tools/build_auto_content.py
          python3 tools/build_auto_discovery.py
          python3 tools/build_family_workshop.py
          node --test tools/test_family_workshop.mjs
          python3 tools/build_dach_discovery.py
          # Discovery adds authored links; recompute related links after it to avoid duplicates.
          python3 tools/build_related.py
          python3 tools/build_onpage.py
          node --test tools/test_upkeep_decisions.mjs tools/test_meaco_care.mjs
          python3 tools/test_upkeep_decisions.py
          python3 tools/test_meaco_generator.py
          python3 tools/build_tools_hub.py
          python3 tools/build_hreflang.py
          python3 tools/check_purchase_intent.py
          python3 tools/check_usswitch.py
          python3 tools/check_usshelf.py
          # Storage pages and their generator were removed by the owner on 09-27.
          # Match deployment: assert the takedown instead of recreating a guide.
          node tools/test_gone.mjs
          python3 tools/check_gone.py
          python3 tools/check_expansion_queue.py
          python3 tools/build_search.py
          python3 tools/check_related.py
          python3 tools/test_dehum_catalog.py
          python3 tools/test_thermostat_catalog.py
          python3 tools/test_floorcare_guide.py
          python3 tools/test_robot_guide.py
          python3 tools/test_humidifier_catalog.py
          python3 tools/test_dach_discovery.py
          python3 tools/test_market_choice.py
          python3 tools/test_social_previews.py
          python3 tools/build_social_previews.py
          python3 tools/build_sitemap.py
          python3 tools/build_llmstxt.py
          python3 tools/build_agent_md.py
          python3 -m unittest discover -s tools -p test_llms_full.py
          python3 tools/check_auto_content_release.py
          python3 tools/check_upkeep_release.py
          python3 tools/check_winter_locales.py
          python3 tools/check_au_cooling.py
          python3 tools/check_uk_opportunities.py
          python3 tools/check_country_categories.py
          python3 tools/check_events.py
          python3 tools/check_tools_hub.py
          python3 tools/check_meta.py
          # Match the deployed opt-in channel after all page generators.
          python3 ../../tools/fleet-analytics/coverage.py --site eco --out site --write
          python3 ../../tools/fleet-analytics/coverage.py --site eco --out site
          python3 -c "import json; r=json.load(open('site/analytics-assets/coverage.json')); assert any(x['mode']=='consent' for x in r['records']), 'No public pages covered'"
      - name: Build the public workbench tools for task-flow tests
        run: |
          npm ci --prefix ../../tools/revenue-studio --ignore-scripts
          node ../../tools/revenue-studio/build.mjs --site eco --out site
          python3 tools/build_tool_experience.py
          python3 tools/build_language_nav.py
          python3 tools/test_language_nav.py
          python3 tools/build_demand_discovery.py
          python3 tools/test_demand_discovery.py
          python3 tools/build_mcp_guides.py
          node --test tools/test_mcp_guides.mjs
          python3 tools/build_home_order.py
          python3 tools/build_social_previews.py
          python3 tools/build_social_previews.py --check
          python3 tools/check_adlabel.py
          python3 tools/test_conversion_routes.py
          node --test tools/test_demand_search.mjs
          python3 ../../tools/fleet-analytics/coverage.py --site eco --out site --write
          node --test tools/test-public-engagement.mjs
          node tools/install-public-engagement.mjs --write
          node tools/install-public-engagement.mjs

      - name: Install matching browser test bindings
        run: |
          npm install --prefix "$RUNNER_TEMP/eco-playwright" --no-audit --no-fund playwright@1.58.2
      - name: Fetch fixed pre-shelf-change baseline for the affiliate audit
        run: |
          git fetch --depth=1 origin 902485034ee0598aed3dd8b21e718c9fca5569f7
          git fetch --depth=1 origin 270ed3253a1941a15e0dee45e53554dbadbca6b2
      - name: Validate final public asset header budget before browser acceptance
        run: |
          node ../../tools/fleet/worker-budget-routing.mjs --site=getecoback --write
          node ../../tools/fleet/worker-budget-routing.mjs --site=getecoback
          node ../../tools/fleet/worker-budget-routing.test.mjs
      - name: Exercise five languages, mobile, files and privacy
        run: |
          python3 -m http.server 8765 --directory site > /tmp/eco-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          for i in 1 2 3 4 5; do curl -sf http://127.0.0.1:8765/stromtarif-werkstatt.html > /dev/null && break; sleep 1; done
          BUYING_BASELINE_SHA=270ed3253a1941a15e0dee45e53554dbadbca6b2 NODE_PATH="$RUNNER_TEMP/eco-playwright/node_modules" QA_DIR="$RUNNER_TEMP/eco-energy-qa" node tools/browser_buying_friction.cjs
          NODE_PATH="$RUNNER_TEMP/eco-playwright/node_modules" QA_DIR="$RUNNER_TEMP/eco-energy-qa" node tools/browser_market_choice.cjs
          NODE_PATH="$RUNNER_TEMP/eco-playwright/node_modules" QA_DIR="$RUNNER_TEMP/eco-energy-qa" node tools/browser_country_categories.cjs
          NODE_PATH="$RUNNER_TEMP/eco-playwright/node_modules" QA_DIR="$RUNNER_TEMP/eco-energy-qa" node tools/browser_energy_workbench.cjs
          NODE_PATH="$RUNNER_TEMP/eco-playwright/node_modules" QA_DIR="$RUNNER_TEMP/eco-energy-qa" node tools/browser_energy_upload_locale.cjs
          NODE_PATH="$RUNNER_TEMP/eco-playwright/node_modules" node tools/browser_demand_discovery.cjs
          NODE_PATH="$RUNNER_TEMP/eco-playwright/node_modules" QA_DIR="$RUNNER_TEMP/eco-energy-qa" node tools/browser_energy_brand.cjs
          NODE_PATH="$RUNNER_TEMP/eco-playwright/node_modules" QA_DIR="$RUNNER_TEMP/eco-energy-qa" node tools/browser_revenue.cjs
          NODE_PATH="$RUNNER_TEMP/eco-playwright/node_modules" QA_DIR="$RUNNER_TEMP/eco-energy-qa" node tools/browser_buyer_decision.cjs
          NODE_PATH="$RUNNER_TEMP/eco-playwright/node_modules" node tools/browser_moisture_analytics.cjs
          NODE_PATH="$RUNNER_TEMP/eco-playwright/node_modules" QA_DIR="$RUNNER_TEMP/eco-energy-qa/moisture-journeys" node tools/browser_moisture_journeys.cjs
          NODE_PATH="$RUNNER_TEMP/eco-playwright/node_modules" node tools/test-public-engagement-browser.mjs
          NODE_PATH="$RUNNER_TEMP/eco-playwright/node_modules" node tools/browser_winter.cjs
          NODE_PATH="$RUNNER_TEMP/eco-playwright/node_modules" node tools/browser_au_cooling.cjs
          NODE_PATH="$RUNNER_TEMP/eco-playwright/node_modules" QA_DIR="$RUNNER_TEMP/eco-energy-qa" node tools/browser_language_nav.cjs
          env -u NODE_PATH ECO_READING_ONLY=1 node tools/browser_dach_growth.mjs
          NODE_PATH="$RUNNER_TEMP/eco-playwright/node_modules" QA_DIR="$RUNNER_TEMP/eco-energy-qa" node tools/browser_tool_experience.cjs
          NODE_PATH="$RUNNER_TEMP/eco-playwright/node_modules" node tools/browser_product_decisions.cjs
          NODE_PATH="$RUNNER_TEMP/eco-playwright/node_modules" node tools/browser_home_fit.cjs
          NODE_PATH="$RUNNER_TEMP/eco-playwright/node_modules" node tools/browser_dach_buying.cjs
          # Match deployment: resolve the locked workbench dependency without NODE_PATH.
          env -u NODE_PATH node tools/browser_categories34.cjs
          NODE_PATH="$RUNNER_TEMP/eco-playwright/node_modules" node tools/browser_thermostat_catalog.cjs
          NODE_PATH="$RUNNER_TEMP/eco-playwright/node_modules" QA_DIR="$RUNNER_TEMP/eco-energy-qa" node tools/browser_family_workshop.cjs
          NODE_PATH="$RUNNER_TEMP/eco-playwright/node_modules" QA_DIR="$RUNNER_TEMP/eco-energy-qa" node tools/browser_tool_audit.cjs
          NODE_PATH="$RUNNER_TEMP/eco-playwright/node_modules" node tools/browser_task_flows.cjs
          NODE_PATH="$RUNNER_TEMP/eco-playwright/node_modules" QA_DIR="$RUNNER_TEMP/eco-energy-qa" node tools/browser_laundry.cjs
          NODE_PATH="$RUNNER_TEMP/eco-playwright/node_modules" QA_DIR="$RUNNER_TEMP/eco-energy-qa" node tools/browser_laundry_readiness.cjs
          NODE_PATH="$RUNNER_TEMP/eco-playwright/node_modules" node tools/browser_meaco_care.cjs
          NODE_PATH="$RUNNER_TEMP/eco-playwright/node_modules" QA_DIR="$RUNNER_TEMP/eco-energy-qa" node tools/browser_auto_product.cjs
          BASE_URL=http://127.0.0.1:8765 NODE_PATH="$RUNNER_TEMP/eco-playwright/node_modules" QA_DIR="$RUNNER_TEMP/eco-energy-qa" node tools/browser_upkeep_decisions.cjs
          AFFILIATE_BASELINE_SHA=902485034ee0598aed3dd8b21e718c9fca5569f7 NODE_PATH="$RUNNER_TEMP/eco-playwright/node_modules" QA_DIR="$RUNNER_TEMP/eco-energy-qa" node tools/browser_affiliate_audit.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eco-energy-browser-evidence
          path: ${{ runner.temp }}/eco-energy-qa
          retention-days: 7
