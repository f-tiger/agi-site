name: Metaculus forecasting bot

# ── 舰队第一条「与流量无关」的营收线(2026-09-05,owner:「针对商业营收,突破性调研思考」)──
#
# Metaculus FutureEval 机器人锦标赛:每季 $50k 奖池、300–500 题、一年三季,
# 奖金按预测准确度分配——不需要一个访客。舰队的核心能力正是带日期、带翻转条件的判定
# (agiscorecard 赔率快照 / 台账 / 预登记判定线),这条线把它直接变成现金奖励。
# 决策文档:docs/revenue-breakthrough-2026-09.md;代码:tools/metaculus-bot/。
#
# 门:job 级 `vars.METACULUS_BOT_ENABLED == '1'`。变量不存在 = 整个 job 被跳过,
# 不分配 runner、不计分钟。owner 只需三步(≈10 分钟):
#   ① https://www.metaculus.com/futureeval/participate/ 建 bot 账号 → 复制 token
#   ② 仓库 Settings → Secrets → Actions:METACULUS_TOKEN(必需;只有它时 LLM 走
#      Metaculus 自己的代理 metaculus/gpt-4o,即赛事赞助算力;OPENROUTER_API_KEY 可选,
#      免费额度表单见 tools/metaculus-bot/README.md)
#   ③ Settings → Variables → Actions:METACULUS_BOT_ENABLED = 1
#   然后 Actions → 本 workflow → Run workflow → mode=test_questions 冒烟一次。
#
# 成本(CLAUDE.md 纪律:先算账再加 cron):模板默认每 20 分钟一跑(72 次/天);本仓改为
# 每 2 小时(12 次/天),题目开放窗口以天计,2 小时足够。实测估算 3–5 分钟/次(含依赖安装,
# pip 缓存后更短)→ ≤60 分钟/天 ≈ 1,800 分钟/月;公开仓 Actions 免费。未启用时 0 分钟。
# 外部副作用 = 向 Metaculus 提交预测,只挂 schedule/dispatch,永不挂 push。
# 不写回仓库,不碰任何站点;与 8 条 deploy 互不相干。

on:
  schedule:
    # 2026-09-27:每 2 小时 → 每 6 小时(题目开放窗口以天计;创业复盘的现金视角把「净美元」列为护栏指标,
    # 2 小时 × $3/次最坏 $36/天)。叠加 BOT_MAX_USD_PER_DAY(缺省 $4)从已提交的 runs.jsonl 读当日花费。
    # 分钟账:≤5 分/次 × 4 次/天 ≈ 600 分/月,公开仓免费;未启用时 0。
    - cron: "13 */6 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "tournament | test_questions | metaculus_cup"
        required: false
        default: "tournament"
        type: choice
        options: [tournament, test_questions, metaculus_cup]
      dry_run:
        description: "只推理不提交(冒烟用)"
        required: false
        default: false
        type: boolean

concurrency:
  group: metaculus-bot
  cancel-in-progress: false

permissions:
  # 2026-09-27:写回 data/metaculus/(点时预测账本 + 运行日志)。只写这一个目录。
  contents: write

jobs:
  forecast:
    # 变量缺失或 != '1' → 直接跳过(手动 dispatch 例外,便于 owner 首轮冒烟)
    if: ${{ vars.METACULUS_BOT_ENABLED == '1' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tools/metaculus-bot/requirements.txt
      - name: Install
        run: pip install -q -r tools/metaculus-bot/requirements.txt
      - name: Syntax gate
        run: python -m py_compile tools/metaculus-bot/main.py tools/metaculus-bot/ledger.py
      # 点时账本的零网络测试(2026-09-27):密封/摘要校验/当日上限/同日同错只红一次/只记已提交的预测。
      # 账本错了,「赛前记录」这条证据就不成立——所以它红了就不跑预测。
      - name: Ledger tests (zero network)
        run: python tools/metaculus-bot/test_ledger.py
      - name: Forecast
        working-directory: tools/metaculus-bot
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          ASKNEWS_CLIENT_ID: ${{ secrets.ASKNEWS_CLIENT_ID }}
          ASKNEWS_SECRET: ${{ secrets.ASKNEWS_SECRET }}
          # 2026-09-14:赛季 id 与每次花费上限走仓库 Variables(换季改变量不改代码;缺省 Fall 2026 = 33121,上限 $3/次)
          BOT_TOURNAMENT_ID: ${{ vars.BOT_TOURNAMENT_ID }}
          BOT_MINIBENCH_ID: ${{ vars.BOT_MINIBENCH_ID }}
          BOT_MAX_USD_PER_RUN: ${{ vars.BOT_MAX_USD_PER_RUN }}
          BOT_MAX_USD_PER_DAY: ${{ vars.BOT_MAX_USD_PER_DAY }}
          BOT_SHADOW_MAX: ${{ vars.BOT_SHADOW_MAX }}
        run: |
          MODE="${{ github.event.inputs.mode || 'tournament' }}"
          DRY=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then DRY="--dry-run"; fi
          python main.py --mode "$MODE" $DRY

      # 账本锚进比特币(2026-09-27 第三轮):写账本的同一个 job 里 stamp,预测提交后几分钟就拿到日历回执
      # (此前只有次日 heartbeat 才 stamp,当天开当天关的题永远拿不到赛前锚)。
      # 证明与清单在 data/metaculus/ots/,bot 开着时只有本 workflow 写(heartbeat 只在 bot 关着时做 --upgrade-only),
      # 任何时刻只有一个写入者,两边不会 rebase 冲突。日历回执是这一步拿到的;比特币区块证明在其后数小时,
      # 由下一次运行(或 bot 关着时由 heartbeat)升级进仓——只有区块时间是证明背书的「关题前」。
      # 然后用纯 stdlib 的 verify_commitments.py 核一遍只追加性与揭示绑定——账本被改写就直接红
      # (下一步照样提交:证据留在 git 里,heartbeat 每天再红一次,直到有人把字节修回来)。
      # fail-open:日历不通或客户端装不上只 warning;dry run 不写账本,也不锚定。账:~0.3 分钟/次。
      - name: Anchor the ledger in Bitcoin (OpenTimestamps) and verify it is append-only
        if: ${{ always() && github.event.inputs.dry_run != 'true' }}
        run: |
          if [ -f data/metaculus/forecasts.jsonl ]; then
            if pip install -q opentimestamps-client 2>/dev/null; then
              rc=0; python3 tools/fleet/ots_anchor.py --group ledger || rc=$?
              if [ "$rc" = 2 ]; then echo "::error::ledger anchoring refused its manifest (see the ::error above; restore it from git)"; exit 1; fi
              if [ "$rc" != 0 ]; then echo "::error::ots_anchor crashed (rc=$rc); the lines are committed but not anchored this run"; exit 1; fi
            else
              echo "::warning::ots client install failed; ledger not anchored this run (the next run stamps the new lines)"
            fi
          fi
          python3 tools/fleet/verify_commitments.py --out "$RUNNER_TEMP/fleet-commitments-bot.json"

      # 点时账本回写(2026-09-27):forecasts.jsonl(概率与影子预测已密封,公开行只有题号/时间/是否用了 house prior)
      # 与 runs.jsonl(花费、计数)。失败的运行也写,当日上限与「同错只红一次」都靠它。dry run 不写。
      - name: Commit forecast ledger
        if: ${{ always() && github.event.inputs.dry_run != 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/metaculus/ 2>/dev/null || true   # 含 data/metaculus/ots/(本 job 的证明与清单)
          if git diff --cached --quiet; then echo "ledger unchanged"; exit 0; fi
          git commit -q -m "chore(metaculus): forecast ledger $(date -u +%FT%H%MZ)"
          for i in 1 2 3; do git pull -q --rebase --autostash && git push -q && exit 0; sleep $((i*5)); done
          echo "::error::forecast ledger push failed after 3 tries"; exit 1
