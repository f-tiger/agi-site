name: Deploy gridlings

# Gridlings(第七站)—— 自研每日约束谜题,play.agiscorecard.com。
# 成本核算:仅 push 触发,~0.7 分/次;无 schedule(450 天每日谜题已预烘焙进仓库,
# 无需任何定时任务——这是刻意的零维护设计)。
on:
  push:
    branches: [main]
    paths: ["sites/gridlings/**", ".github/workflows/deploy-gridlings.yml"]
  workflow_dispatch: {}

concurrency:
  group: deploy-gridlings
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 防回滚守卫(2026-08-26 事故):GitHub 曾乱序补发数小时前的 push 事件,
      # 每个旧事件都按自己那个历史提交部署,把线上反复滚回旧代码——gridlings 的
      # 重定向修复当天被这样滚掉两次,CG 审核正好撞上白屏。这些站点的部署都是
      # 「按当前源码重建并发布」,所以旧事件的正确动作不是发布旧快照,而是发布
      # main 的当前 tip(幂等、绝不倒退)。用 reset --hard 而非 checkout:有 4 条
      # 流水线会 git push 回仓,detached HEAD 会让那一步失败。
      - name: Guard — a replayed/stale push deploys main's tip, never rolls back
        if: github.event_name == 'push'
        run: |
          # Fail-open by design: a network hiccup must never block a deploy —
          # without a resolvable tip we simply keep the pushed commit, which is
          # exactly the pre-guard behaviour.
          git fetch origin main -q || { echo "::warning::fetch failed — stale-run guard skipped"; exit 0; }
          TIP=$(git rev-parse origin/main 2>/dev/null || true)
          case "$TIP" in
            "" | *[!0-9a-f]* ) echo "::warning::main tip unresolvable — stale-run guard skipped"; exit 0 ;;
          esac
          if [ "$(git rev-parse HEAD)" != "$TIP" ]; then
            echo "::warning::stale run — HEAD $(git rev-parse --short HEAD) is behind main tip $(git rev-parse --short "$TIP"); deploying the tip instead of rolling production back"
            git reset --hard "$TIP"
          fi
      - name: Gate — files present, JSON valid, puzzles cover today+300d
        working-directory: sites/gridlings
        run: |
          for f in site/index.html site/zh.html site/app.js site/style.css site/puzzles-daily.json site/puzzles-pool.json site/balance.html site/balance-zh.html site/app-balance.js site/balance-daily.json site/balance-pool.json site/starbattle.html site/starbattle-zh.html site/app-starbattle.js site/starbattle-daily.json site/starbattle-pool.json site/trail.html site/trail-zh.html site/app-trail.js site/trail-daily.json site/trail-pool.json site/futoshiki.html site/futoshiki-zh.html site/app-futoshiki.js site/futoshiki-daily.json site/futoshiki-pool.json site/towers.html site/towers-zh.html site/app-towers.js site/towers-daily.json site/towers-pool.json site/minisudoku.html site/minisudoku-zh.html site/kropki.html site/kropki-zh.html site/sandwich.html site/sandwich-zh.html site/app-latin.js site/minisudoku-daily.json site/minisudoku-pool.json site/kropki-daily.json site/kropki-pool.json site/sandwich-daily.json site/sandwich-pool.json site/thermo.html site/thermo-zh.html site/app-thermo.js site/thermo-daily.json site/thermo-pool.json site/nonogram.html site/nonogram-zh.html site/app-nonogram.js site/nonogram-daily.json site/nonogram-pool.json site/bench.html site/bench-v1.json site/nonogram-no-guessing.html site/manifest.webmanifest site/sw.js site/icon-192.png site/icon-512.png site/archive.html site/robots.txt site/sitemap.xml site/llms.txt; do
            [ -f "$f" ] || { echo "::error::missing $f"; exit 1; }
          done
          node --check worker.js
          python3 - << 'EOF'
          import json, datetime, sys
          for name in ("puzzles", "balance", "starbattle", "trail", "futoshiki", "towers", "minisudoku", "kropki", "sandwich", "thermo", "nonogram"):
              d = json.load(open(f"site/{name}-daily.json"))
              epoch = datetime.date.fromisoformat(d["epoch"])
              today = max(datetime.date.today(), epoch)  # pre-launch: client serves the earliest board
              horizon = today + datetime.timedelta(days=300)
              missing = [x for x in (today, horizon) if x.isoformat() not in d["puzzles"]]
              if missing: sys.exit(f"{name}: dailies missing for {missing} — regenerate the generator")
              p = json.load(open(f"site/{name}-pool.json"))
              assert all(len(v) > 50 for v in p.values()), f"{name}: pool too small"
              print(f"gate ok [{name}]: {len(d['puzzles'])} dailies, pools {[len(v) for v in p.values()]}")
          EOF
      - name: Build standalone game packages (deployed as assets, never committed)
        working-directory: sites/gridlings
        run: python3 tools/build_packages.py
      - name: Push package to itch.io via butler (auto-update the listing)
        working-directory: sites/gridlings
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        # butler diffs against the previous build — only changed files upload.
        # Skips silently when the secret is absent (fork/PR contexts).
        run: |
          [ -n "$BUTLER_API_KEY" ] || { echo "no BUTLER_API_KEY — skip itch push"; exit 0; }
          curl -sL -o /tmp/butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q -o /tmp/butler.zip -d /tmp/butler && chmod +x /tmp/butler/butler
          rm -rf /tmp/itchbuild && mkdir -p /tmp/itchbuild
          python3 - << 'PYEOF'
          import zipfile
          zipfile.ZipFile("site/downloads/gridlings-all-11.zip").extractall("/tmp/itchbuild")
          PYEOF
          /tmp/butler/butler push /tmp/itchbuild gridlings/gridlings-11-daily-logic-puzzles:html --userversion "$(date -u +%F)" || echo "::warning::butler push failed — itch listing keeps previous build"
      - name: Deploy worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          workingDirectory: sites/gridlings
          command: deploy
