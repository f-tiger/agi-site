name: Deploy gridlings

# Gridlings(第七站)—— 自研每日约束谜题,play.agiscorecard.com。
# 成本核算:仅 push 触发,~0.7 分/次;无 schedule(450 天每日谜题已预烘焙进仓库,
# 无需任何定时任务——这是刻意的零维护设计)。
on:
  push:
    branches: [main]
    paths: ["sites/gridlings/**", ".github/workflows/deploy-gridlings.yml"]
  workflow_dispatch: {}

concurrency:
  group: deploy-gridlings
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gate — files present, JSON valid, puzzles cover today+300d
        working-directory: sites/gridlings
        run: |
          for f in site/index.html site/zh.html site/app.js site/style.css site/puzzles-daily.json site/puzzles-pool.json site/balance.html site/balance-zh.html site/app-balance.js site/balance-daily.json site/balance-pool.json site/starbattle.html site/starbattle-zh.html site/app-starbattle.js site/starbattle-daily.json site/starbattle-pool.json site/trail.html site/trail-zh.html site/app-trail.js site/trail-daily.json site/trail-pool.json site/futoshiki.html site/futoshiki-zh.html site/app-futoshiki.js site/futoshiki-daily.json site/futoshiki-pool.json site/towers.html site/towers-zh.html site/app-towers.js site/towers-daily.json site/towers-pool.json site/minisudoku.html site/minisudoku-zh.html site/kropki.html site/kropki-zh.html site/sandwich.html site/sandwich-zh.html site/app-latin.js site/minisudoku-daily.json site/minisudoku-pool.json site/kropki-daily.json site/kropki-pool.json site/sandwich-daily.json site/sandwich-pool.json site/thermo.html site/thermo-zh.html site/app-thermo.js site/thermo-daily.json site/thermo-pool.json site/nonogram.html site/nonogram-zh.html site/app-nonogram.js site/nonogram-daily.json site/nonogram-pool.json site/archive.html site/robots.txt site/sitemap.xml site/llms.txt; do
            [ -f "$f" ] || { echo "::error::missing $f"; exit 1; }
          done
          node --check worker.js
          python3 - << 'EOF'
          import json, datetime, sys
          for name in ("puzzles", "balance", "starbattle", "trail", "futoshiki", "towers", "minisudoku", "kropki", "sandwich", "thermo", "nonogram"):
              d = json.load(open(f"site/{name}-daily.json"))
              epoch = datetime.date.fromisoformat(d["epoch"])
              today = max(datetime.date.today(), epoch)  # pre-launch: client serves the earliest board
              horizon = today + datetime.timedelta(days=300)
              missing = [x for x in (today, horizon) if x.isoformat() not in d["puzzles"]]
              if missing: sys.exit(f"{name}: dailies missing for {missing} — regenerate the generator")
              p = json.load(open(f"site/{name}-pool.json"))
              assert all(len(v) > 50 for v in p.values()), f"{name}: pool too small"
              print(f"gate ok [{name}]: {len(d['puzzles'])} dailies, pools {[len(v) for v in p.values()]}")
          EOF
      - name: Deploy worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          workingDirectory: sites/gridlings
          command: deploy
