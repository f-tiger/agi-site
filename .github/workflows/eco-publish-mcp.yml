name: Publish MCP server to the official registry
# ── 迁入公开 monorepo f-tiger/agi-site(2026-08-19,owner 决定)──
# 原仓 .github 为历史档案。公开仓 Actions 分钟免费。
# 本 workflow 的 run 步骤默认 working-directory: sites/getecoback/。


# Active discovery instead of passive waiting: the official MCP Registry is the
# feed most clients and community directories sync from, so one publish here
# cascades. GitHub OIDC authenticates this repo's Actions as the io.github.f-tiger
# namespace — no stored token, nothing for the owner to paste.
on:
  # Publish only after the endpoint has been deployed. A simultaneous push
  # previously allowed a new registry version to point at the old worker.
  workflow_run:
    workflows: ["Deploy getecoback.com"]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sites/getecoback
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Verify the deployed name and version before publishing
        run: |
          python3 - <<'PY'
          import json, urllib.request
          manifest = json.load(open('mcp/server.json'))
          endpoint = manifest['remotes'][0]['url']
          assert endpoint == 'https://getecoback.com/mcp/v1', 'Unexpected canonical endpoint'
          body = json.dumps({'jsonrpc': '2.0', 'id': 1, 'method': 'initialize',
                             'params': {'protocolVersion': '2025-03-26', 'capabilities': {},
                                        'clientInfo': {'name': 'publish-check', 'version': '1'}}}).encode()
          request = urllib.request.Request(endpoint, data=body,
              headers={'Content-Type': 'application/json', 'User-Agent': 'getecoback-ci'})
          with urllib.request.urlopen(request, timeout=20) as response:
              info = json.load(response)['result']['serverInfo']
          assert info['name'] == manifest['name'].split('/')[-1], 'Live MCP name differs from manifest'
          assert info['version'] == manifest['version'], 'Live MCP version differs from manifest; refusing publication'
          print('Live MCP name and version match:', info['name'], info['version'])
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify real tool responses before advertising this release
        run: node tools/mcp_smoke.mjs

      - name: Install mcp-publisher
        run: |
          # Release assets carry the version in their name, so resolve the
          # linux/amd64 asset from the latest-release API instead of guessing.
          url=$(curl -s https://api.github.com/repos/modelcontextprotocol/registry/releases/latest \
                | python3 -c "import json,sys; a=[x['browser_download_url'] for x in json.load(sys.stdin)['assets'] if 'linux' in x['name'] and ('amd64' in x['name'] or 'x86_64' in x['name']) and x['name'].endswith('.tar.gz')]; print(a[0])")
          echo "downloading $url"
          curl -sL "$url" -o pub.tgz
          tar -xzf pub.tgz
          ./mcp-publisher --version || { echo "::error::mcp-publisher binary not found in asset"; exit 1; }

      - name: Registry limits (checked here, before the registry rejects them)
        run: |
          # 注册表对 description 有 100 字符硬限制,超了在 publish 那步 422(2026-09-25 实际发生:
          # 09-16 把品牌写进描述后是 199 字符,1.2.0 因此一直没发出去)。外部硬限制在本地先断言一次。
          python3 - <<'PY'
          import glob, json, sys
          bad = []
          for f in ["mcp/server.json"] + sorted(glob.glob("mcp/superseded/*.json")):
              d = json.load(open(f))
              n = len(d.get("description", ""))
              print(f"{f}: description {n} chars")
              if n > 100:
                  bad.append(f)
          if bad:
              print("::error::description over the registry's 100-char limit: " + ", ".join(bad))
              sys.exit(1)
          PY

      - name: Login (GitHub OIDC) and publish
        run: |
          ./mcp-publisher login github-oidc
          # The registry refuses to overwrite an existing name+version pair, so a
          # re-run with an unchanged file is "already published" — success, not
          # failure. Anything else must stay loud.
          pub() {
            out=$(./mcp-publisher publish "$1" 2>&1) && { echo "$out"; return 0; }
            echo "$out"
            case "$out" in
              *"cannot publish duplicate version"*) echo "already published — ok (idempotent)"; return 0 ;;
              *) return 1 ;;
            esac
          }
          # Historical names already carry their superseded notice. Their
          # immutable old versions need no repeat publication on every deploy.
          pub mcp/server.json
