# 每两天的增长闭环：取 GA4 数据 → 自动优化 → 产出选题待办 → 重建部署
# 依赖 Secrets（可选，缺失时降级为站内信号继续跑）：
#   GA4_PROPERTY_ID          GA4 媒体资源 ID（纯数字）
#   GA4_SERVICE_ACCOUNT_JSON 服务账号密钥 JSON 全文
name: Growth loop
# ── 迁入公开 monorepo f-tiger/agi-site(2026-08-19,owner 决定)──
# 原仓 .github 为历史档案。公开仓 Actions 分钟免费。
# 本 workflow 的 run 步骤默认 working-directory: sites/baipiaoji/。


on:
  # 需先在 agi-site 配置 secrets(GA4_PROPERTY_ID / GA4_SERVICE_ACCOUNT_JSON)再解除注释:
  # schedule:
  #   - cron: '0 1 */2 * *' # 每两天，北京时间 09:00
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  loop:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sites/baipiaoji
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Analyse and auto-optimise
        env:
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GA4_SERVICE_ACCOUNT_JSON: ${{ secrets.GA4_SERVICE_ACCOUNT_JSON }}
        run: node scripts/growth-loop.mjs

      - name: Commit data and report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ docs/growth-report.md
          git diff --cached --quiet || git commit -m "chore: growth loop $(date -u +%F)"
          git push

      - name: Build site
        run: node scripts/build.mjs

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler@4 pages deploy dist --project-name=aiyangmao --branch=main --commit-dirty=true

      - name: Surface the human to-do list
        run: |
          echo "## 增长闭环 $(date -u +%F)" >> $GITHUB_STEP_SUMMARY
          sed -n '/## 需要人做的/,/^## /p' docs/growth-report.md | head -20 >> $GITHUB_STEP_SUMMARY
