name: tds IndexNow push (weekly delta)

# 非 Google 发现通道(2026-08-25,owner:「有没有其他办法,你突破思考执行」)。
# tds 的三条结构性封锁(SafeSearch/AI 拒答/域龄)全部最重地压在 Google 上;
# IndexNow 背后的 Bing/Yandex/Naver/Seznam 恰是封锁最弱的一侧——Yandex 已是本站
# 最勤爬虫(34 次/28d),Naver 对应韩国进口页受众。key 文件自建站起就在站根,
# 只差推送机制。外部副作用挂 schedule 不挂 push(舰队 CI 纪律第 3 条);
# 每周一次 delta(只推 lastmod 8 天内的 URL),礼貌且协议正确。
# 成本:~0.2 分/周 ≈ 1 分/月(公开仓免费)。首次全量注册用 workflow_dispatch MODE=all。
on:
  schedule:
    - cron: '20 6 * * 3'
  workflow_dispatch:
    inputs:
      mode:
        description: 'delta (default) or all (one-time full registration)'
        type: choice
        options: [delta, all]
        default: delta

permissions:
  contents: read

concurrency:
  group: tds-indexnow
  cancel-in-progress: true

jobs:
  push:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sites/thedollscout
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Submit changed URLs to IndexNow (Bing/Yandex/Naver/Seznam)
        env:
          MODE: ${{ inputs.mode || 'delta' }}
        run: node scripts/indexnow-push.mjs
