name: Deploy getecoback.com

# ── 迁入公开 monorepo f-tiger/agi-site(2026-08-19,owner 决定)──
# 原仓 rearchfuture 为历史档案。公开仓 Actions 分钟免费,每日定时(季节轮换)
# 随迁移即刻恢复,不再等 9/1 额度重置。run 步骤默认 working-directory。

on:
  push:
    # main only. Every change here is merged to main in the same step, so the
    # working branch also being a trigger just deployed the identical commit a
    # second time — twice the runs, twice the noise, and twice the exposure to a
    # transient GitHub Actions outage (which is exactly what turned run 290 red
    # while run 291 deployed the same commit successfully).
    branches:
      - main
    paths:
      - "tools/revenue-studio/**"
      - "tools/member-studio/**"
      - "sites/baipiaoji/lib/**"
      - "sites/baipiaoji/functions/api/member*.js"
      - "sites/baipiaoji/scripts/ad-runner-config.mjs"
      - "sites/getecoback/site/**"
      - "sites/getecoback/tools/**"
      - "sites/getecoback/data/**"
      - "sites/getecoback/src/**"
      - "sites/getecoback/wrangler.jsonc"
      - ".github/workflows/deploy-getecoback.yml"
  workflow_dispatch: {}
  # Daily self-deploy: the season rotator, freshness badges and structure
  # injectors only run at deploy time, so without this the site could not turn
  # autumn on September 1st unless someone happened to push that day. The
  # injectors are idempotent — on a quiet day this rebuilds byte-identical
  # output, deploys the same assets, and the IndexNow step sees zero changed
  # URLs and stays silent.
  schedule:
    - cron: "17 3 * * *"

permissions:
  # The scheduled run writes docs/trend-radar.md back to the repo — the
  # condensation layer of the trend loop. docs/ is outside the trigger paths,
  # so this can never recurse into another deploy.
  contents: write

concurrency:
  group: deploy-getecoback
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sites/getecoback
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the IndexNow step diffs against the previous commit to
          # find what changed, and the default shallow clone makes that ref
          # unresolvable — which silently produced an empty change list.
          fetch-depth: 0

      # 防回滚守卫(2026-08-26 事故):GitHub 曾乱序补发数小时前的 push 事件,
      # 每个旧事件都按自己那个历史提交部署,把线上反复滚回旧代码——gridlings 的
      # 重定向修复当天被这样滚掉两次,CG 审核正好撞上白屏。这些站点的部署都是
      # 「按当前源码重建并发布」,所以旧事件的正确动作不是发布旧快照,而是发布
      # main 的当前 tip(幂等、绝不倒退)。用 reset --hard 而非 checkout:有 4 条
      # 流水线会 git push 回仓,detached HEAD 会让那一步失败。
      - name: Guard — a replayed/stale push deploys main's tip, never rolls back
        if: github.event_name == 'push'
        run: |
          # Fail-open by design: a network hiccup must never block a deploy —
          # without a resolvable tip we simply keep the pushed commit, which is
          # exactly the pre-guard behaviour.
          git fetch origin main -q || { echo "::warning::fetch failed — stale-run guard skipped"; exit 0; }
          TIP=$(git rev-parse origin/main 2>/dev/null || true)
          case "$TIP" in
            "" | *[!0-9a-f]* ) echo "::warning::main tip unresolvable — stale-run guard skipped"; exit 0 ;;
          esac
          if [ "$(git rev-parse HEAD)" != "$TIP" ]; then
            echo "::warning::stale run — HEAD $(git rev-parse --short HEAD) is behind main tip $(git rev-parse --short "$TIP"); deploying the tip instead of rolling production back"
            git reset --hard "$TIP"
          fi
      # The IndexNow step at the end submits URLs that are in the freshly built
      # sitemap but were not live before this deploy — that is what "new page"
      # means, whichever generator produced it. Snapshot the live inventory first.
      # Fail-open: no baseline = no new-URL submissions this run, never a flood.
      - name: Snapshot the live sitemap (baseline for the IndexNow delta)
        run: curl -sf --max-time 20 -A "getecoback-ci" https://getecoback.com/sitemap.xml -o /tmp/prev_sitemap.xml || echo "::warning::live sitemap not reachable — new-URL detection is off for this run"
      - name: Rotate homepage to current season (year-round positioning; idempotent)
        run: python3 tools/build_season.py
      - name: Refresh the homepage rising-demand rail (idempotent, honest-map)
        run: python3 tools/build_rising_rail.py

      # Live prices + ASINs from Amazon's own API (tools/product_intel/). Gate is
      # the repository variable, same pattern as the Metaculus bot: unset = this
      # step is skipped, zero minutes, pages identical. A manual dispatch runs it
      # as --dry-run so the owner can prove the credentials before opening the
      # gate, without writing anything. No secret is ever echoed.
      - name: Refresh live prices from PA-API (gated; dry-run on manual dispatch)
        if: ${{ vars.PAAPI_ENABLED == '1' || github.event_name == 'workflow_dispatch' }}
        env:
          PAAPI_ACCESS_KEY: ${{ secrets.PAAPI_ACCESS_KEY }}
          PAAPI_SECRET_KEY: ${{ secrets.PAAPI_SECRET_KEY }}
          PAAPI_PARTNER_TAG: ${{ secrets.PAAPI_PARTNER_TAG }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ vars.PAAPI_ENABLED }}" != "1" ]; then
            node tools/product_intel/refresh.mjs --dry-run || true
          else
            node tools/product_intel/refresh.mjs || echo "::warning::price refresh failed — pages fall back to search links and static price text"
          fi

      - name: Fill the UK running-cost block from the stored Ofgem cap
        run: python3 tools/build_ukcost.py

      - name: Rebuild the open-dataset landing page (refreshes sizing-data.json first)
        run: python3 tools/build_dataset_page.py

      - name: Homepage sizing table from the open dataset (idempotent)
        run: python3 tools/build_home_table.py

      # 2026-09-17：让 heizung-<N>-qm 的七页各回答一个不同的问题。改写前这一族的
      # 兄弟页相似度是 54,0%（对照组 1,3%），标题与四个 H2 只差一个数字——正是
      # Google 压制、Bing 容忍的门页形态，与「googlebot 爬 249 次/7 天、Google 引荐 0」
      # 的 D1 读数吻合。修的方向是改写不是删页：这些 URL 上有 Bing 收录和现有营收。
      # 必须跑在 build_onpage 之前，TOC 是从 <h2> 重建的。自检零 IO、变异测试验证过能红。
      - name: Differentiate the heizung room-size family (idempotent injector)
        run: |
          python3 tools/differentiate_heizung.py --selftest
          python3 tools/differentiate_heizung.py

      - name: Build country solution calculators and localized mirrors
        run: python3 tools/build_country_calculators.py
      - name: Build native CBAM and EUDR evidence checks
        run: |
          python3 tools/build_eu_evidence.py
          node tools/test_eu_evidence.cjs
      - name: Build European electricity decision workbenches
        run: |
          node --test tools/test_energy_tariffs.mjs
          python3 tools/build_energy_workbench.py
          python3 tools/build_revenue_guide.py
      # 2026-09-22: the hub was hand-written and nine tool pages never reached it. It is
      # now filled from the filesystem; check_tools_hub asserts hub == filesystem.
      - name: Fill the tools hub from the pages that exist (idempotent)
        run: python3 tools/build_tools_hub.py

      - name: Inject site chrome (nav/footer/radar; idempotent, covers new pages)
        run: python3 tools/build_structure.py

      # Deal-calendar band (2026-09-24). Date-driven: it renders only while an
      # announced Amazon event from data/deal-calendar.json is inside its window,
      # and removes itself afterwards. The daily 03:17 UTC run is what turns it on
      # and off, so no push is needed on 09-29 or 10-08.
      - name: Deal-calendar band (date-windowed; idempotent)
        run: |
          python3 tools/build_deals.py --selftest
          python3 tools/build_deals.py

      - name: Inject on-page layer (TOC + updated badge; idempotent)
        run: python3 tools/build_onpage.py

      - name: Inject room-size cross-links (idempotent)
        run: python3 tools/build_xlinks.py

      - name: Lateral related-guide links (season-weighted; idempotent)
        run: python3 tools/build_related.py

      - name: Link household decision tools from relevant existing pages
        run: python3 tools/link_household.py
      - name: Link electricity workbenches from existing content
        run: |
          python3 tools/link_energy_workbench.py
          python3 tools/build_revenue_guide.py

      - name: Verify household calculation examples and edge cases
        run: node tools/test_household.mjs

      - name: Consolidate publisher entity (@id graph; idempotent gate)
        run: python3 tools/build_entity.py

      - name: Point verified models at their product page (idempotent gate)
        run: python3 tools/build_asin_links.py

      - name: Normalize + validate hreflang pairs (idempotent gate; non-zero exit blocks deploy)
        run: python3 tools/build_hreflang.py

      - name: Rebuild sitemap from filesystem (auto-sync new pages before deploy)
        run: |
          python3 tools/build_sitemap.py --selftest
          python3 tools/build_sitemap.py

      # 2026-09-22: undated pages used to get the deploy date on every deploy (fresh
      # checkout → mtime = now). A sitemap that says "a dozen pages changed today"
      # six times a day is the freshness signal Bing learns to ignore.
      - name: Check the sitemap only claims "changed today" for pages that did (gate)
        run: |
          python3 tools/check_sitemap_lastmod.py --selftest
          python3 tools/check_sitemap_lastmod.py

      - name: Rebuild RSS feed (auto-sync new guides before deploy)
        run: python3 tools/build_feed.py

      - name: Rebuild llms.txt (AI-search index, auto-sync before deploy)
        run: python3 tools/build_llmstxt.py

      - name: Build agent surfaces (.md mirrors + sizing dataset, affiliate-link gate)
        run: python3 tools/build_agent_md.py

      - name: Rebuild site-search index (auto-sync new pages before deploy)
        run: python3 tools/build_search.py

      - name: Verify evidence-check discovery after index generation
        run: node tools/test_eu_evidence.cjs --discovery

      - name: Check every fired event is accepted by /api/ev
        run: python3 tools/check_events.py

      - name: Check every affiliate block carries a Werbekennzeichnung
        run: python3 tools/check_adlabel.py

      - name: Check FAQ JSON-LD matches visible text verbatim
        run: python3 tools/check_faq_parity.py

      - name: Check breadcrumb JSON-LD matches the visible breadcrumb
        run: python3 tools/check_crumb_parity.py

      - name: Check every tool figure exists on the page it cites
        run: python3 tools/check_cited_figures.py

      - name: Check no SERP title or description is truncated
        run: python3 tools/check_meta.py

      - name: Check the US marketplace switch still covers the links we ship
        run: python3 tools/check_usswitch.py

      - name: Check the crawler allowlist still matches real user agents
        run: node tools/test_crawler_ua.mjs

      - name: Check the US shelf is hidden by default and tagged to the right market
        run: python3 tools/check_usshelf.py

      - name: Check the winter price band is on the cost cluster and still honest
        run: python3 tools/check_stromheat.py

      - name: Check the open dataset is machine-findable and embeds credit back
        run: python3 tools/check_dataset.py

      - name: Check the UK cost tables match the stored Ofgem cap and add up
        run: python3 tools/check_ukcost.py

      - name: Check no vetoed brand reached the published site
        run: python3 tools/check_brand_veto.py

      - name: Check the lateral link blocks are suggestions, not walls
        run: python3 tools/check_related.py

      - name: Check the category hubs still describe what they link to
        run: python3 tools/check_hubcards.py
      - name: Check the tools hub lists every tool page and nothing stale (gate)
        run: |
          python3 tools/check_tools_hub.py --selftest
          python3 tools/check_tools_hub.py
      # The standing expansion queue (2026-09-24). The daily run builds from it,
      # so a queue that drifts from the site is a deploy-time error: a 'built'
      # flag on a page that does not exist, a queued slug that already has a
      # page, a built page without its bet. Running low only warns.
      - name: Check the deal band is sourced, hidden by default and in its window (gate)
        run: |
          python3 tools/check_deals.py --selftest
          python3 tools/check_deals.py
      - name: Check the expansion queue agrees with the site (gate)
        run: |
          python3 tools/check_expansion_queue.py --selftest
          python3 tools/check_expansion_queue.py

      # 页族近重复度量（2026-09-17）。**只报数不拦部署**：今天的读数本来就超标，
      # 上线即红会把一个待办变成一条坏掉的流水线。它存在的理由是把「兄弟页有多像」
      # 从一句感觉变成每次部署都重算的数字——谁去改写正文都有靶子，改完能证明降下来了。
      # 自检先跑（零 IO，能红）：判错任一方向都会让人白改或漏改。
      # --regress 是个例外，它**会**拦部署：已经改写过的页族（CEILINGS）回到门页形态
      # 不是待办，是事故——意味着有人重跑了 gen_heizung_qm.py 那个一次性脚手架，或者
      # 把差异化注入器从这条链里拿掉了。两个天花板一起看（平均 + 最差的一对），因为
      # 实测只还原 7 页里的 2 页时平均几乎不动，而那两页彼此已经又是 54,8%。
      - name: Measure near-duplication across page families (report; regression = red)
        run: |
          python3 tools/check_duplication.py --selftest
          python3 tools/check_duplication.py --regress

      - name: Check the price engine (SigV4 vector, refresher vs mock, built pages vs data)
        run: |
          node tools/product_intel/paapi.mjs --selftest
          node tools/product_intel/test_refresh.mjs
          python3 tools/check_products.py

      - name: Build and validate practical tool workbench
        working-directory: ${{ github.workspace }}
        run: |
          npm ci --prefix tools/revenue-studio --ignore-scripts
          node --test tools/revenue-studio/test.mjs
          node tools/revenue-studio/build.mjs --site eco --out sites/getecoback/site
          node tools/revenue-studio/verify.mjs --site eco --out sites/getecoback/site
          node tools/member-studio/test-isolation.mjs
          node tools/member-studio/test-failure.mjs
          node tools/member-studio/verify.mjs --site eco --out sites/getecoback/site

      - name: Configure independent membership secrets
        working-directory: ${{ github.workspace }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADS_WALLET: ${{ secrets.ADS_WALLET }}
          ADS_WATCH_SECRET: ${{ secrets.ADS_WATCH_SECRET }}
        run: |
          node tools/member-studio/ops.mjs preflight
          node tools/member-studio/ops.mjs configure eco

      - name: Deploy to Cloudflare Workers
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          workingDirectory: sites/getecoback
          command: deploy

      - name: Verify independent membership after deployment
        working-directory: ${{ github.workspace }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ADS_WATCH_SECRET: ${{ secrets.ADS_WATCH_SECRET }}
        run: |
          for attempt in 1 2 3 4; do
            if node tools/member-studio/ops.mjs watch eco && node tools/member-studio/verify.mjs --site eco --live; then exit 0; fi
            if [ "$attempt" != "4" ]; then sleep 8; fi
          done
          exit 1

      - name: Verify every published workbench tool
        if: ${{ !cancelled() && steps.deploy.outcome == 'success' }}
        working-directory: ${{ github.workspace }}
        run: node tools/revenue-studio/verify.mjs --site eco --live

      # The manifest ping submits all 12 tool URLs. Until 2026-09-22 it ran on every
      # push, i.e. the same unchanged dozen several times a day. Those pages only
      # change when their generators change, so that is the only time to ping.
      - name: Did the tool generators change in this push? (gates the manifest ping)
        id: toolsrc
        if: github.event_name == 'push'
        working-directory: ${{ github.workspace }}
        run: |
          BEFORE="${{ github.event.before }}"
          case "$BEFORE" in ""|0000000000000000000000000000000000000000) BEFORE="HEAD~1" ;; esac
          if git cat-file -e "${BEFORE}^{commit}" 2>/dev/null && git diff --quiet "$BEFORE" "${{ github.sha }}" -- tools/revenue-studio tools/member-studio; then
            echo "changed=0" >> "$GITHUB_OUTPUT"
            echo "tool generators untouched in this push — manifest ping skipped (the pages did not change)"
          else
            echo "changed=1" >> "$GITHUB_OUTPUT"
          fi
      - name: Notify verified localized tool URLs to IndexNow
        if: github.event_name == 'push' && steps.toolsrc.outputs.changed == '1'
        continue-on-error: true
        working-directory: ${{ github.workspace }}
        run: node tools/revenue-studio/indexnow.mjs --site eco --out sites/getecoback/site

      - name: Post-deploy health check (live site serves key pages)
        if: ${{ !cancelled() && steps.deploy.outcome == 'success' }}
        run: |
          sleep 15
          fail=0
          # Retries cover two different things. A non-200 is retried quickly. A 200
          # WITHOUT the expected content is retried after 10 s, up to three times:
          # right after a deploy the edge can still answer from its cache
          # (cf-cache-status: HIT) with the previous build. Run 231 (2026-09-24)
          # went red that way on a page whose new content was live seconds later.
          # Content that is still missing after ~30 s is a real failure; a copy
          # that was stale and then turned fresh is printed as a notice, so the
          # race stays visible instead of silently absorbed.
          check() {
            url="$1"; must_contain="$2"; stale=0
            for attempt in 1 2 3 4; do
              body=$(curl -sL --max-time 20 -w "\n%{http_code}" "$url" || echo -e "\n000")
              code=$(tail -1 <<<"$body")
              if [ "$code" = "200" ]; then
                if [ -z "$must_contain" ] || grep -q -- "$must_contain" <<<"$body"; then break; fi
                stale=$((stale+1)); [ "$attempt" -lt 4 ] && sleep 10
              else
                sleep 3
              fi
            done
            if [ "$code" != "200" ]; then
              echo "::error::$url returned HTTP $code"
              fail=1
            elif [ -n "$must_contain" ] && ! grep -q -- "$must_contain" <<<"$body"; then
              echo "::error::$url is 200 but missing expected content after $stale tries: $must_contain"
              fail=1
            else
              echo "OK $url ($code)"
              [ "$stale" -gt 0 ] && echo "::notice::$url served the previous build $stale time(s) before the new content (edge cache after deploy)"
              true
            fi
          }
          check "https://getecoback.com/" "tag=getecoback-21"
          check "https://getecoback.com/sitemap.xml" "<urlset"
          check "https://getecoback.com/feed.xml" "<rss"
          check "https://getecoback.com/guide/dachgeschoss-kuehlen.html" "tag=getecoback-21"
          check "https://getecoback.com/impressum.html" "Impressum"
          check "https://getecoback.com/datenschutz.html" "DSGVO"
          check "https://getecoback.com/en/" "tag=getecoback-21"
          # /api/pulse (2026-09-13): token-free AI-referral aggregate read by the fleet heartbeat
          check "https://getecoback.com/api/pulse" '"ai_ref"' 
          check "https://getecoback.com/api/pulse" '"by_source"' 
          # 钱线(2026-09-21):money 必须是对象;查询坏了 worker 会回 null,这里就红
          check "https://getecoback.com/api/pulse" '"money":{' 

          # MCP 自报名字必须与 mcp/server.json 的注册表名字一致(2026-09-16)。
          # 那次改名只改了 manifest 与 superseded/,worker 的 serverInfo.name 漏了三个多月:
          # 注册表说 hvac-btu-heat-klimaanlage,连上来的客户端却被告知是已废弃的 getecoback-raumklima。
          # 一个实体三个名字正是 entity stacking 最忌讳的事,所以这条要能红。
          want=$(python3 -c "import json;print(json.load(open('mcp/server.json'))['name'].split('/')[-1])")
          got=$(curl -s -m 25 -X POST "https://getecoback.com/mcp/v1" \
                 -H 'content-type: application/json' -H 'accept: application/json, text/event-stream' \
                 -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"deploy-check","version":"0"}}}' \
                 | grep -oE '"name":"[^"]*"' | head -1 | sed 's/.*:"//;s/"//')
          if [ "$got" = "$want" ]; then echo "OK    MCP serverInfo.name = $got(与注册表一致)"
          else echo "::error::MCP 自报名字 '$got' 与注册表名字 '$want' 不一致"; fail=1; fi
          check "https://getecoback.com/it/guide/miglior-condizionatore-portatile-italia.html" "tag=getecoback-21"
          check "https://getecoback.com/guide/btu-rechner.md" "Canonical (HTML"
          check "https://getecoback.com/sizing-data.json" "creativecommons"
          # /daten.html (2026-09-16). The accident this guards against is not a
          # 404 — it is the page rendering perfectly while carrying no Dataset
          # node, which makes it invisible to Google Dataset Search, the only
          # reason it exists. Assert the node, not the page.
          check "https://getecoback.com/daten.html" '"@type": "Dataset"'
          # UK pages (2026-09-17). These are new, so a 200 alone is already red
          # against the previous build. What is asserted instead is the shape of
          # the two accidents that would matter: the cost block quoting a cap
          # period that is not the stored one, and a shelf appearing on pages
          # whose whole argument is that they are not selling the reader anything.
          # The expected rate and period are read from the stored cap, never
          # typed here — a literal would be correct this quarter and would turn
          # the deploy red next quarter for a change that was entirely correct.
          cap_period=$(python3 -c "import json;print(json.load(open('data/ofgem-cap.json'))['period'])")
          cap_rate=$(python3 -c "import json;print(json.load(open('data/ofgem-cap.json'))['electricity_p_per_kwh'])")
          check "https://getecoback.com/en/guide/desiccant-vs-compressor-dehumidifier.html" "$cap_period"
          check "https://getecoback.com/en/guide/heated-airer-vs-dehumidifier.html" "${cap_rate}p per kWh"
          check "https://getecoback.com/en/guide/rising-damp-penetrating-damp-or-condensation.html" "penetrating damp"
          # Blackout page (2026-09-17). The accident to guard is not a 404 but the
          # page losing the one number it exists for, or its CO warning — the only
          # safety-critical sentence on this site.
          check "https://getecoback.com/guide/stromausfall-heizen.html" "Kohlenmonoxid"
          check "https://getecoback.com/guide/stromausfall-heizen.html" "30 Minuten"
          # The dehumidifier troubleshooting page (2026-09-17). Its whole value is
          # one computed figure; a page that renders without it is intact and
          # useless, which is the accident worth asserting.
          check "https://getecoback.com/guide/luftentfeuchter-zieht-kein-wasser.html" "61 g"
          # The infrared/mould page exists for one counter-marketing figure: above
          # ~62% room RH the surface cannot reach the threshold at any wall
          # temperature. A page that lost that number would read as an endorsement.
          check "https://getecoback.com/guide/infrarotheizung-gegen-schimmel.html" "62 %"
          # Country pages (2026-09-18). Each exists for one fact a reader in that
          # market cannot get from the German original, so that is what is asserted:
          # the Austrian page is worthless without the two-month deemed-consent
          # rule that the BGB does not have; the Spanish page without the heat-pump
          # ratio that makes its whole argument; the Italian page without the
          # surface-humidity figure. A 200 with those sentences missing is the
          # accident, not a 404.
