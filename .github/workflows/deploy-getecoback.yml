          # Canonical-URL middleware: every legacy variant must 301 to
          # https://getecoback.com/...*.html (matches canonical tags + sitemap)
          check_301() {
            url="$1"; expect="$2"
            for attempt in 1 2 3; do
              out=$(curl -s -o /dev/null --max-time 20 -w "%{http_code} %{redirect_url}" "$url" || echo "000")
              code="${out%% *}"
              # "${out#* }" on a space-less "000" returns "000" itself, which
              # used to print as "got 000 -> 000". Empty loc = no redirect seen.
              loc=""
              case "$out" in *" "*) loc="${out#* }" ;; esac
              [ "$code" = "301" ] && break
              sleep 3
            done
            if [ "$code" = "000" ]; then
              echo "::error::$url unreachable after 3 tries (curl failed) — expected 301 -> $expect"
              fail=1
            elif [ "$code" != "301" ] || [ "$loc" != "$expect" ]; then
              echo "::error::$url expected 301 -> $expect, got $code -> ${loc:-<no Location>}"
              fail=1
            else
              echo "OK 301 $url -> $loc"
            fi
