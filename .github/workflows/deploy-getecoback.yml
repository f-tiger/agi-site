name: Deploy getecoback.com

# ── 迁入公开 monorepo f-tiger/agi-site(2026-08-19,owner 决定)──
# 原仓 rearchfuture 为历史档案。公开仓 Actions 分钟免费,每日定时(季节轮换)
# 随迁移即刻恢复,不再等 9/1 额度重置。run 步骤默认 working-directory。

on:
  push:
    # main only. Every change here is merged to main in the same step, so the
    # working branch also being a trigger just deployed the identical commit a
    # second time — twice the runs, twice the noise, and twice the exposure to a
    # transient GitHub Actions outage (which is exactly what turned run 290 red
    # while run 291 deployed the same commit successfully).
    branches:
      - main
    paths:
      - "sites/getecoback/site/**"
      - "sites/getecoback/tools/**"
      - "sites/getecoback/src/**"
      - "sites/getecoback/wrangler.jsonc"
      - ".github/workflows/deploy-getecoback.yml"
  workflow_dispatch: {}
  # Daily self-deploy: the season rotator, freshness badges and structure
  # injectors only run at deploy time, so without this the site could not turn
  # autumn on September 1st unless someone happened to push that day. The
  # injectors are idempotent — on a quiet day this rebuilds byte-identical
  # output, deploys the same assets, and the IndexNow step sees zero changed
  # URLs and stays silent.
  schedule:
    - cron: "17 3 * * *"

permissions:
  # The scheduled run writes docs/trend-radar.md back to the repo — the
  # condensation layer of the trend loop. docs/ is outside the trigger paths,
  # so this can never recurse into another deploy.
  contents: write

concurrency:
  group: deploy-getecoback
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sites/getecoback
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the IndexNow step diffs against the previous commit to
          # find what changed, and the default shallow clone makes that ref
          # unresolvable — which silently produced an empty change list.
          fetch-depth: 0

      # 防回滚守卫(2026-08-26 事故):GitHub 曾乱序补发数小时前的 push 事件,
      # 每个旧事件都按自己那个历史提交部署,把线上反复滚回旧代码——gridlings 的
      # 重定向修复当天被这样滚掉两次,CG 审核正好撞上白屏。这些站点的部署都是
      # 「按当前源码重建并发布」,所以旧事件的正确动作不是发布旧快照,而是发布
      # main 的当前 tip(幂等、绝不倒退)。用 reset --hard 而非 checkout:有 4 条
      # 流水线会 git push 回仓,detached HEAD 会让那一步失败。
      - name: Guard — a replayed/stale push deploys main's tip, never rolls back
        if: github.event_name == 'push'
        run: |
          # Fail-open by design: a network hiccup must never block a deploy —
          # without a resolvable tip we simply keep the pushed commit, which is
          # exactly the pre-guard behaviour.
          git fetch origin main -q || { echo "::warning::fetch failed — stale-run guard skipped"; exit 0; }
          TIP=$(git rev-parse origin/main 2>/dev/null || true)
          case "$TIP" in
            "" | *[!0-9a-f]* ) echo "::warning::main tip unresolvable — stale-run guard skipped"; exit 0 ;;
          esac
          if [ "$(git rev-parse HEAD)" != "$TIP" ]; then
            echo "::warning::stale run — HEAD $(git rev-parse --short HEAD) is behind main tip $(git rev-parse --short "$TIP"); deploying the tip instead of rolling production back"
            git reset --hard "$TIP"
          fi
      - name: Rotate homepage to current season (year-round positioning; idempotent)
        run: python3 tools/build_season.py
      - name: Refresh the homepage rising-demand rail (idempotent, honest-map)
        run: python3 tools/build_rising_rail.py

      # Live prices + ASINs from Amazon's own API (tools/product_intel/). Gate is
      # the repository variable, same pattern as the Metaculus bot: unset = this
      # step is skipped, zero minutes, pages identical. A manual dispatch runs it
      # as --dry-run so the owner can prove the credentials before opening the
      # gate, without writing anything. No secret is ever echoed.
      - name: Refresh live prices from PA-API (gated; dry-run on manual dispatch)
        if: ${{ vars.PAAPI_ENABLED == '1' || github.event_name == 'workflow_dispatch' }}
        env:
          PAAPI_ACCESS_KEY: ${{ secrets.PAAPI_ACCESS_KEY }}
          PAAPI_SECRET_KEY: ${{ secrets.PAAPI_SECRET_KEY }}
          PAAPI_PARTNER_TAG: ${{ secrets.PAAPI_PARTNER_TAG }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ vars.PAAPI_ENABLED }}" != "1" ]; then
            node tools/product_intel/refresh.mjs --dry-run || true
          else
            node tools/product_intel/refresh.mjs || echo "::warning::price refresh failed — pages fall back to search links and static price text"
          fi

      - name: Fill the UK running-cost block from the stored Ofgem cap
        run: python3 tools/build_ukcost.py

      - name: Rebuild the open-dataset landing page (refreshes sizing-data.json first)
        run: python3 tools/build_dataset_page.py

      - name: Inject site chrome (nav/footer/radar; idempotent, covers new pages)
        run: python3 tools/build_structure.py

      - name: Inject on-page layer (TOC + updated badge; idempotent)
        run: python3 tools/build_onpage.py

      - name: Inject room-size cross-links (idempotent)
        run: python3 tools/build_xlinks.py

      - name: Lateral related-guide links (season-weighted; idempotent)
        run: python3 tools/build_related.py

      - name: Consolidate publisher entity (@id graph; idempotent gate)
        run: python3 tools/build_entity.py

      - name: Point verified models at their product page (idempotent gate)
        run: python3 tools/build_asin_links.py

      - name: Normalize + validate hreflang pairs (idempotent gate; non-zero exit blocks deploy)
        run: python3 tools/build_hreflang.py

      - name: Rebuild sitemap from filesystem (auto-sync new pages before deploy)
        run: python3 tools/build_sitemap.py

      - name: Rebuild RSS feed (auto-sync new guides before deploy)
        run: python3 tools/build_feed.py

      - name: Rebuild llms.txt (AI-search index, auto-sync before deploy)
        run: python3 tools/build_llmstxt.py

      - name: Build agent surfaces (.md mirrors + sizing dataset, affiliate-link gate)
        run: python3 tools/build_agent_md.py

      - name: Rebuild site-search index (auto-sync new pages before deploy)
        run: python3 tools/build_search.py

      - name: Check every fired event is accepted by /api/ev
        run: python3 tools/check_events.py

      - name: Check every affiliate block carries a Werbekennzeichnung
        run: python3 tools/check_adlabel.py

      - name: Check FAQ JSON-LD matches visible text verbatim
        run: python3 tools/check_faq_parity.py

      - name: Check breadcrumb JSON-LD matches the visible breadcrumb
        run: python3 tools/check_crumb_parity.py

      - name: Check every tool figure exists on the page it cites
        run: python3 tools/check_cited_figures.py

      - name: Check no SERP title or description is truncated
        run: python3 tools/check_meta.py

      - name: Check the US marketplace switch still covers the links we ship
        run: python3 tools/check_usswitch.py

      - name: Check the crawler allowlist still matches real user agents
        run: node tools/test_crawler_ua.mjs

      - name: Check the US shelf is hidden by default and tagged to the right market
        run: python3 tools/check_usshelf.py

      - name: Check the winter price band is on the cost cluster and still honest
        run: python3 tools/check_stromheat.py

      - name: Check the open dataset is machine-findable and embeds credit back
        run: python3 tools/check_dataset.py

      - name: Check the UK cost tables match the stored Ofgem cap and add up
        run: python3 tools/check_ukcost.py

      - name: Check no vetoed brand reached the published site
        run: python3 tools/check_brand_veto.py

      - name: Check the lateral link blocks are suggestions, not walls
        run: python3 tools/check_related.py

      - name: Check the price engine (SigV4 vector, refresher vs mock, built pages vs data)
        run: |
          node tools/product_intel/paapi.mjs --selftest
          node tools/product_intel/test_refresh.mjs
          python3 tools/check_products.py

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          workingDirectory: sites/getecoback
          command: deploy

      - name: Post-deploy health check (live site serves key pages)
        run: |
          sleep 15
          fail=0
          check() {
            url="$1"; must_contain="$2"
            for attempt in 1 2 3; do
              body=$(curl -sL --max-time 20 -w "\n%{http_code}" "$url" || echo -e "\n000")
              code=$(echo "$body" | tail -1)
              [ "$code" = "200" ] && break
              sleep 3
            done
            if [ "$code" != "200" ]; then
              echo "::error::$url returned HTTP $code"
              fail=1
            elif [ -n "$must_contain" ] && ! echo "$body" | grep -q "$must_contain"; then
              echo "::error::$url is 200 but missing expected content: $must_contain"
              fail=1
            else
              echo "OK $url ($code)"
            fi
          }
          check "https://getecoback.com/" "tag=getecoback-21"
          check "https://getecoback.com/sitemap.xml" "<urlset"
          check "https://getecoback.com/feed.xml" "<rss"
          check "https://getecoback.com/guide/dachgeschoss-kuehlen.html" "tag=getecoback-21"
          check "https://getecoback.com/impressum.html" "Impressum"
          check "https://getecoback.com/datenschutz.html" "DSGVO"
          check "https://getecoback.com/en/" "tag=getecoback-21"
          # /api/pulse (2026-09-13): token-free AI-referral aggregate read by the fleet heartbeat
          check "https://getecoback.com/api/pulse" '"ai_ref"' 
          check "https://getecoback.com/it/guide/miglior-condizionatore-portatile-italia.html" "tag=getecoback-21"
          check "https://getecoback.com/guide/btu-rechner.md" "Canonical (HTML"
          check "https://getecoback.com/sizing-data.json" "creativecommons"
          # /daten.html (2026-09-16). The accident this guards against is not a
          # 404 — it is the page rendering perfectly while carrying no Dataset
          # node, which makes it invisible to Google Dataset Search, the only
          # reason it exists. Assert the node, not the page.
          check "https://getecoback.com/daten.html" '"@type": "Dataset"'
          # UK pages (2026-09-17). These are new, so a 200 alone is already red
          # against the previous build. What is asserted instead is the shape of
          # the two accidents that would matter: the cost block quoting a cap
          # period that is not the stored one, and a shelf appearing on pages
          # whose whole argument is that they are not selling the reader anything.
          # The expected rate and period are read from the stored cap, never
          # typed here — a literal would be correct this quarter and would turn
          # the deploy red next quarter for a change that was entirely correct.
          cap_period=$(python3 -c "import json;print(json.load(open('data/ofgem-cap.json'))['period'])")
          cap_rate=$(python3 -c "import json;print(json.load(open('data/ofgem-cap.json'))['electricity_p_per_kwh'])")
          check "https://getecoback.com/en/guide/desiccant-vs-compressor-dehumidifier.html" "$cap_period"
          check "https://getecoback.com/en/guide/heated-airer-vs-dehumidifier.html" "${cap_rate}p per kWh"
          check "https://getecoback.com/en/guide/rising-damp-penetrating-damp-or-condensation.html" "penetrating damp"
          # Blackout page (2026-09-17). The accident to guard is not a 404 but the
          # page losing the one number it exists for, or its CO warning — the only
          # safety-critical sentence on this site.
          check "https://getecoback.com/guide/stromausfall-heizen.html" "Kohlenmonoxid"
          check "https://getecoback.com/guide/stromausfall-heizen.html" "30 Minuten"
          # Brand veto on the LIVE homepage. The rising rail rebuilds daily from
          # Google Trends with no human in the loop, so the veto has to be checked
          # where it can actually be violated, not only at build time.
          for vb in $(sed "s/#.*//" tools/brand_veto.txt | tr -d " \t" | grep -v "^$"); do
            if curl -sL --max-time 20 "https://getecoback.com/" | grep -qi "$vb"; then
              echo "::error::the live homepage publishes vetoed brand $vb"; fail=1
            else echo "OK homepage free of $vb"; fi
          done
          # Scripts are stripped before counting. The site-wide saved-room bar
          # builds amazon URLs by string concatenation on every page including
          # the legal ones, so a raw grep reports five links on a page that
          # renders none — a false positive, not a find. Same reasoning as
          # check_dataset.py, which was bitten by this first.
          for u in desiccant-vs-compressor-dehumidifier heated-airer-vs-dehumidifier rising-damp-penetrating-damp-or-condensation; do
            n=$(curl -sL --max-time 20 "https://getecoback.com/en/guide/$u.html" \
                 | python3 -c "import re,sys;h=re.sub(r'<script\b.*?</script>','',sys.stdin.read(),flags=re.S);print(len(re.findall(r'href=\"[^\"]*amazon[^\"]*\"',h)))" 2>/dev/null || echo ERR)
            if [ "$n" != "0" ]; then echo "::error::/en/guide/$u.html carries $n marked-up amazon link(s) — these three pages route to the sized pages instead of selling"; fail=1; else echo "OK $u sells nothing"; fi
          done
          # The CSV is claimed in that Dataset node as a text/csv DataDownload.
          # If the edge serves it as octet-stream or HTML the claim is false and
          # the file is useless to the tools that would consume it, while the
          # page still looks perfect. So assert the header, not just the body.
          csv_ct=$(curl -sIL --max-time 20 "https://getecoback.com/sizing-data.csv" | tr -d '\r' | grep -i '^content-type:' | tail -1 || true)
          case "$csv_ct" in
            *csv*) echo "OK /sizing-data.csv is $csv_ct" ;;
            *) echo "::error::/sizing-data.csv must be served as text/csv, got: ${csv_ct:-<none>}"; fail=1 ;;
          esac
          check "https://getecoback.com/sizing-data.csv" "section,key,m2,value,unit,room,guide"
          check "https://getecoback.com/for-agents.html" "MCP"
          # Crawler/agent entry points that are rebuilt every deploy.
          check "https://getecoback.com/robots.txt" "Sitemap:"
          check "https://getecoback.com/llms.txt" "getecoback.com"
          # US marketplace switch (2026-09-06). Its predecessor was live for four
          # weeks matching none of the terms readers clicked and nothing noticed,
          # so assert the shape of that accident on the live page: the block must
          # be present on both sections, carry the US associates tag, and hold a
          # rule for the term readers actually click most.
          # /api/geo (2026-09-09): the US switch asks the edge which country the
          # reader is in when the browser clock is ambiguous. It did not exist
          # before this deploy, so this assertion is red against the previous
          # build. It must be no-store — a cached country would be worse than none.
          check "https://getecoback.com/api/geo" '"c"'
          # Prove the server-side crawler log actually writes in production.
          # Uses a self-test agent, never a real crawler's, so the dataset the
          # Google question depends on is never polluted by our own probes.
          curl -s -o /dev/null --max-time 20 -A "getecoback-crawlprobe/1.0" \
            "https://getecoback.com/guide/klimaanlage-wohnmobil.html" || true
          echo "crawl-log probe sent (verify in D1: name='crawl', bot='_selftest')"
          geo_cc=$(curl -sI --max-time 20 "https://getecoback.com/api/geo" | tr -d '\r' | grep -i '^cache-control:' || true)
          case "$geo_cc" in
            *no-store*) echo "OK /api/geo is no-store" ;;
            *) echo "::error::/api/geo must be no-store, got: ${geo_cc:-<none>}"; fail=1 ;;
          esac
          check "https://getecoback.com/guide/klimaanlage-wohnmobil.html" "EB_USSWITCH"
          # Winter-airing pair (2026-09-15). Both URLs are new, so a plain 200
          # here is already red against the previous build. The assertion that
          # matters is the classification, not the 200: these are humidity pages
          # whose slugs name a window and a season, and the documented failure
          # mode for exactly that shape is falling through device_of() to "ac" —
          # which would put a cooling sizer and an air-conditioner shelf on a
          # page about condensation in January. Assert the dehumidifier shelf is
          # there AND the cooling sizer is not.
          check "https://getecoback.com/guide/schimmel-am-fenster.html" "MeacoDry"
          # Humidifier guide (2026-09-15). Its device family is "dehum" because
          # that is the humidity table's key, so the default shelf would offer
          # dehumidifiers to a reader whose air is too DRY — the page would sell
          # the opposite of what it advises. CONTEXT_MODELS overrides it; assert
          # both directions, since a silent override failure looks like nothing.
          check "https://getecoback.com/guide/luftbefeuchter-ratgeber.html" "Verdunster mit Hygrostat"
          if curl -sL --max-time 20 "https://getecoback.com/guide/luftbefeuchter-ratgeber.html" | grep -q "MeacoDry\|Comfee MDDF"; then
            echo "::error::the humidifier guide is showing dehumidifiers — CONTEXT_MODELS override lost"
            fail=1
          else
            echo "OK humidifier guide shows no dehumidifier cards"
          fi
          check "https://getecoback.com/guide/richtig-lueften-im-winter.html" "MeacoDry"
          check "https://getecoback.com/en/guide/tilt-and-turn-windows-winter-condensation.html" "MeacoDry"
          for u in "https://getecoback.com/guide/richtig-lueften-im-winter.html" \
                   "https://getecoback.com/guide/schimmel-am-fenster.html" \
                   "https://getecoback.com/en/guide/tilt-and-turn-windows-winter-condensation.html"; do
            if curl -sL --max-time 20 "$u" | grep -q "EB_SIZER"; then
              echo "::error::$u carries the cooling sizer — it has been misfiled as an 'ac' page"
              fail=1
            else
              echo "OK $u has no cooling sizer"
            fi
          done
          # US shelf (2026-09-15). Both strings are absent from the previous
          # build, so both can actually fail. "Midea Duo" was the obvious second
          # assertion and was rejected: the EB_USMARKET bridge already names it,
          # so it would have passed against the old build and proved nothing.
          check "https://getecoback.com/en/guide/portable-ac-rented-apartment.html" "eb-usshelf"
          check "https://getecoback.com/en/guide/portable-ac-rented-apartment.html" "Recommended in the US"
          # The strip is the surface above the fold and ships on more pages than
          # the shelf, including ones that have no shelf at all.
          check "https://getecoback.com/en/guide/btu-calculator.html" "eb-ustop"
          # Square-foot box (2026-09-16). These ladders carry a US shelf while
          # sizing rooms only in m², so an American was sold American machines
          # against a unit they do not use. Assert the box is there AND still
          # ships hidden — visible, it greets every German reader with
          # "Reading this in the US?", which is the louder failure of the two.
          check "https://getecoback.com/en/guide/electric-heater-20-sqm.html" "20 m² is about 215 sq ft"
          if curl -sL --max-time 20 "https://getecoback.com/en/guide/electric-heater-20-sqm.html" \
             | grep -q 'id="eb-usunits" hidden'; then
            echo "OK sq-ft box ships hidden"
          else
            echo "::error::the sq-ft box is not hidden by default — European readers see the US notice"
            fail=1
          fi
          # A European-location page must carry NO US surface: a US portable AC
          # is 115 V and will not run on a 230 V socket in Spain.
          es_body=$(curl -sL --max-time 20 "https://getecoback.com/en/guide/best-portable-air-conditioner-spain.html" || true)
          if echo "$es_body" | grep -q "eb-ustop\|eb-usshelf"; then
            echo "::error::Spain page carries a US surface (115 V goods for 230 V readers)"; fail=1
          else
            echo "OK Spain page carries no US surface"
          fi
          check "https://getecoback.com/guide/klimaanlage-wohnmobil.html" "rv rooftop air conditioner"
          # Winter exchange-price band (2026-09-15). eb-stromheat is absent from
          # the previous build, so this can fail. The disclaimer is asserted
          # separately because it is the part that makes the band safe: without
          # it the exchange price reads as a household tariff on a page about
          # what a heater costs.
          check "https://getecoback.com/guide/heizluefter-stromsparend.html" "eb-stromheat"
          check "https://getecoback.com/guide/heizluefter-stromsparend.html" "Haushaltstarif"
          # /api/strom is what the band renders from; a dead feed means every
          # band on 26 pages silently renders nothing.
          strom=$(curl -sL --max-time 20 "https://getecoback.com/api/strom" || true)
          if echo "$strom" | grep -q '"ok":true'; then
            echo "OK /api/strom serving prices"
          else
            echo "::error::/api/strom is not serving (the winter band renders nothing on 26 pages)"; fail=1
          fi
          # A cooling page must NOT carry the winter band: it would put the
          # buy-side framing on a page that already runs the weather band.
          wo_body=$(curl -sL --max-time 20 "https://getecoback.com/guide/klimaanlage-wohnmobil.html" || true)
          if echo "$wo_body" | grep -q "eb-stromheat"; then
            echo "::error::klimaanlage-wohnmobil carries the winter price band"; fail=1
          else
            echo "OK cooling page carries no winter band"
          fi
          # not_found_handling regression guard (2026-09-04): an unknown path must
          # be a real 404, not a 200 fallback that would let search engines index
          # every typo. The canonical middleware first 301s the extensionless
          # path to .html, so follow redirects and assert the final status.
          nf=""
          for attempt in 1 2 3; do
            nf=$(curl -sL -o /dev/null --max-time 20 -w "%{http_code}" "https://getecoback.com/__nope-ci" || echo "000")
            [ "$nf" = "404" ] && break
            sleep 3
          done
          if [ "$nf" = "404" ]; then
            echo "OK unknown path is a 404"
          else
            echo "::error::https://getecoback.com/__nope-ci expected 404, got $nf (not_found_handling regression?)"
            fail=1
          fi

          # Canonical-URL middleware: every legacy variant must 301 to
          # https://getecoback.com/...*.html (matches canonical tags + sitemap)
          check_301() {
            url="$1"; expect="$2"
            for attempt in 1 2 3; do
              out=$(curl -s -o /dev/null --max-time 20 -w "%{http_code} %{redirect_url}" "$url" || echo "000")
              code="${out%% *}"
              # "${out#* }" on a space-less "000" returns "000" itself, which
              # used to print as "got 000 -> 000". Empty loc = no redirect seen.
              loc=""
              case "$out" in *" "*) loc="${out#* }" ;; esac
              [ "$code" = "301" ] && break
              sleep 3
            done
            if [ "$code" = "000" ]; then
              echo "::error::$url unreachable after 3 tries (curl failed) — expected 301 -> $expect"
              fail=1
            elif [ "$code" != "301" ] || [ "$loc" != "$expect" ]; then
              echo "::error::$url expected 301 -> $expect, got $code -> ${loc:-<no Location>}"
              fail=1
            else
              echo "OK 301 $url -> $loc"
            fi
          }
          check_301 "https://www.getecoback.com/" "https://getecoback.com/"
          check_301 "https://www.getecoback.com/guide/klimaanlage-kippfenster" "https://getecoback.com/guide/klimaanlage-kippfenster.html"
          check_301 "https://getecoback.com/guide/klimaanlage-kippfenster" "https://getecoback.com/guide/klimaanlage-kippfenster.html"
          check_301 "https://getecoback.com/en/guide/best-portable-air-conditioner-europe-heatwave" "https://getecoback.com/en/guide/best-portable-air-conditioner-europe-heatwave.html"
          check_301 "https://getecoback.com/en" "https://getecoback.com/en/"

          # First-party event pipeline: the endpoint must accept a whitelisted
          # event and confirm the D1 write. Without this the funnel goes blind
          # silently (a missing binding only shows up as {"ok":false}).
          ev=$(curl -s --max-time 20 -X POST "https://getecoback.com/api/ev" \
                 -H "Content-Type: text/plain" \
                 -d '{"n":"page_view","p":"/__ci_healthcheck","r":"","m":{"ci":1}}' || echo "")
          echo "event endpoint said: $ev"
          case "$ev" in
            *'"ok":true'*) echo "OK event pipeline (D1 write confirmed)" ;;
            *) echo "::error::event pipeline broken: $ev"; fail=1 ;;
          esac
          # 漏斗事件验收(2026-08-20 触发器体检):lead_intent 与 cold_now 是两条
          # 新营收链路的唯一度量,白名单掉一个就整条链静默失明——每次部署验收。
          # affiliate_click added 2026-09-04: it is the money event of the whole
          # site, and the only one this loop did not assert.
          for evn in lead_intent cold_now affiliate_click; do
            r=$(curl -s --max-time 20 -X POST "https://getecoback.com/api/ev" \
                 -H "Content-Type: text/plain" \
                 -d '{"n":"'$evn'","p":"/__ci_healthcheck","r":"","m":{"ci":1}}' || echo "")
            case "$r" in
              *'"ok":true'*) echo "OK funnel event accepted: $evn" ;;
              *) echo "::error::funnel event $evn rejected: $r"; fail=1 ;;
            esac
          done
          # Opt-in capture (/api/sub2, 2026-09-04): the only capture surface on the
          # guide pages, and it writes to D1 directly. subs.email is the PRIMARY KEY
          # and the Worker uses INSERT OR IGNORE, so this probe is one idempotent
          # row for all time; its ev row lands on /__ci_healthcheck, which every
          # ledger query already excludes.
          s2=$(curl -s --max-time 20 -X POST "https://getecoback.com/api/sub2" \
                 -H "Content-Type: application/json" \
                 -d '{"email":"ci@getecoback.invalid","consent":true,"consent_text":"ci","page":"/__ci_healthcheck"}' || echo "")
          echo "sub2 endpoint said: $s2"
          case "$s2" in
            *'"ok":true'*) echo "OK sub2 capture (D1 write confirmed)" ;;
            *) echo "::error::sub2 capture broken: $s2"; fail=1 ;;
          esac
          # The live heat band drives the weather-reactive layer; a silent outage
          # would simply mean the site says nothing on the days that matter most.
          heat=""
          for attempt in 1 2 3; do
            heat=$(curl -s --max-time 20 "https://getecoback.com/api/heat" || echo "")
            case "$heat" in *'"level"'*) break ;; esac
            sleep 5
          done
          echo "heat endpoint said: $heat"
          case "$heat" in
            *'"level"'*) echo "OK heat endpoint" ;;
            *) echo "::error::heat endpoint broken after 3 tries: '$heat'"; fail=1 ;;
          esac
          # Winter counterpart (2026-08-20): the same payload must carry the cold
          # reading, or the reactive band silently loses its winter gear.
          case "$heat" in
            *'"cold"'*) echo "OK cold field present" ;;
            *) echo "::error::/api/heat payload missing cold field: '$heat'"; fail=1 ;;
          esac
          # Autumn counterpart (2026-08-31): the dew-point band is the live number
          # for the humidity season, and it is the only reason a reader comes to
          # the page instead of taking an assistant's summary. A silent outage
          # here costs exactly that. Note the assertion is on "ok", not on a
          # level: ok:false is a legitimate answer (upstream down) that the band
          # correctly renders as nothing — a missing field is the real failure.
          feuchte=""
          for attempt in 1 2 3; do
            feuchte=$(curl -s --max-time 20 "https://getecoback.com/api/feuchte" || echo "")
            case "$feuchte" in *'"ok"'*) break ;; esac
            sleep 5
          done
          echo "feuchte endpoint said: $feuchte"
          case "$feuchte" in
            *'"ok"'*) echo "OK feuchte endpoint" ;;
            *) echo "::error::feuchte endpoint broken after 3 tries: '$feuchte'"; fail=1 ;;
          esac
          # Exchange prices for the Strompreis-Radar. Served from the edge so
          # the reader's browser never calls aWATTar or SMARD itself; if this
          # breaks, the site's flagship energy tool shows nothing, quietly.
          strom=""
          for attempt in 1 2 3; do
            strom=$(curl -s --max-time 20 "https://getecoback.com/api/strom" || echo "")
            case "$strom" in *'"ok"'*) break ;; esac
            sleep 5
          done
          echo "strom endpoint said: ${strom:0:120}"
          case "$strom" in
            *'"ok"'*) echo "OK strom endpoint" ;;
            *) echo "::error::strom endpoint broken after 3 tries: '${strom:0:200}'"; fail=1 ;;
          esac
          # Markdown content negotiation: AI crawlers outnumber human visitors
          # here, so a silent regression to HTML would be invisible and costly.
          # Assert both directions — Markdown when asked, HTML when not.
          md=$(curl -s --max-time 20 -A "getecoback-ci" -H "Accept: text/markdown" "https://getecoback.com/guide/btu-rechner.html" || echo "")
          case "$md" in
            '# '*) echo "OK markdown negotiation" ;;
            *) echo "::error::markdown negotiation broken: '${md:0:120}'"; fail=1 ;;
          esac
          plain=$(curl -s --max-time 20 -H "Accept: text/html" "https://getecoback.com/guide/btu-rechner.html" || echo "")
          case "$plain" in
            *'<!DOCTYPE'*|*'<!doctype'*) echo "OK html still html" ;;
            *) echo "::error::browsers no longer get HTML: '${plain:0:120}'"; fail=1 ;;
          esac
          # Trend condensation feed: the daily radar reads this.
          trend=""
          for attempt in 1 2 3; do
            trend=$(curl -s --max-time 20 "https://getecoback.com/api/trend" || echo "")
            case "$trend" in *'"events"'*) break ;; esac
            sleep 5
          done
          echo "trend endpoint said: ${trend:0:150}"
          case "$trend" in
            *'"events"'*) echo "OK trend endpoint" ;;
            *) echo "::error::trend endpoint broken after 3 tries: '$trend'"; fail=1 ;;
          esac
          # MCP server: the agent-facing tool layer. initialize must round-trip.
          mcp=$(curl -s --max-time 20 -X POST "https://getecoback.com/mcp" \
                 -H "Content-Type: application/json" \
                 -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' || echo "")
          echo "mcp said: ${mcp:0:150}"
          case "$mcp" in
            *'"getecoback-raumklima"'*) echo "OK mcp endpoint" ;;
            *) echo "::error::mcp endpoint broken: '$mcp'"; fail=1 ;;
          esac
          # The URL the official registry listing actually points at. A pointer
          # nobody checks is how you end up advertising a dead server.
          mcpv1=$(curl -s --max-time 20 -X POST "https://getecoback.com/mcp/v1" \
                 -H "Content-Type: application/json" \
                 -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' || echo "")
          echo "mcp/v1 said: ${mcpv1:0:150}"
          case "$mcpv1" in
            *'"getecoback-raumklima"'*) echo "OK mcp/v1 (registry pointer)" ;;
            *) echo "::error::registry remote URL /mcp/v1 broken: '$mcpv1'"; fail=1 ;;
          esac
          # Live popular ranking: drives the homepage's self-refreshing block.
          top=""
          for attempt in 1 2 3; do
            top=$(curl -s --max-time 20 "https://getecoback.com/api/top" || echo "")
            case "$top" in *'"pages"'*) break ;; esac
            sleep 5
          done
          echo "top endpoint said: ${top:0:200}"
          case "$top" in
            *'"pages"'*) echo "OK top endpoint" ;;
            *) echo "::error::top endpoint broken after 3 tries: '$top'"; fail=1 ;;
          esac
          exit $fail

      # Rule 2 guard: the registry listing is a discovery asset — if the entry
      # ever disappears (purge, policy change), that must be a red run, not a
      # silent fade. Scheduled runs only: this asserts an external system, and
      # a registry outage should not block a content deploy.
      - name: Assert the MCP registry still lists this server (scheduled + manual)
        if: github.event_name != 'push'
        run: |
          # Fail-open on an unreachable registry, fail-closed on a real delisting.
          # 2026-08-30: the daily run went red with an EMPTY response — the API was
          # briefly unreachable from the runner, and the old check could not tell
          # "the registry says we are gone" (the thing worth alerting on) from "the
          # registry said nothing at all" (someone else's outage). It read the
          # outage as a purge. Same principle the stale-push guard above already
          # follows: infrastructure noise must never turn a green deploy red,
          # because a red run nobody can act on is how real red runs get ignored.
          entry=""
          for attempt in 1 2 3; do
            entry=$(curl -s --max-time 20 "https://registry.modelcontextprotocol.io/v0.1/servers?search=getecoback" || echo "")
            case "$entry" in *"getecoback-climate-weather"*) break ;; esac
            sleep 10
          done
          case "$entry" in
            *"getecoback-climate-weather"*)
              echo "OK registry listing present" ;;
            "")
              echo "::warning::MCP registry unreachable from this runner (empty response after 3 tries) — cannot assert the listing; not failing the deploy" ;;
            *'"servers"'*)
              # A well-formed listing that does not contain us IS the delisting
              # this guard exists to catch.
              echo "::error::MCP registry responded but no longer lists getecoback-climate-weather: ${entry:0:200}"; exit 1 ;;
            *)
              echo "::warning::MCP registry returned an unrecognised payload — treating as an outage, not a delisting: ${entry:0:200}" ;;
          esac

      # The condensation layer of the trend loop: pull the live aggregates,
      # write the radar, commit it back. Scheduled runs only — on push events
      # a concurrent commit would race the human/agent work that triggered the
      # deploy. docs/ is outside this workflow's trigger paths, so the commit
      # cannot recurse.
      - name: Write the daily trend radar (scheduled + manual runs)
        if: github.event_name != 'push'
        run: |
          python3 tools/trend_radar.py
          if ! git diff --quiet docs/trend-radar.md 2>/dev/null; then
            git config user.name "Claude"
            git config user.email "noreply@anthropic.com"
            git add docs/trend-radar.md
            git commit -m "chore: daily trend radar"
            # The injectors rewrote site files earlier in this same job, so the
            # tree is never clean here — autostash rebases around them instead of
            # refusing, and leaves them in place for the IndexNow diff below.
            git pull --rebase --autostash origin main
            git push
          else
            echo "radar substance unchanged — no commit"
          fi

      # IndexNow is this site's fastest discovery channel, and its own FAQ asks for
      # URLs that actually changed — resubmitting the whole inventory every deploy
      # reads as spam and devalues the site's future submissions. So: pages changed
      # by this push, plus pages the injectors rewrote during this run, intersected
      # with the sitemap so noindex pages never get submitted. The sitemap stays the
      # complete inventory; IndexNow carries only the delta.
      - name: Ping IndexNow with the pages that actually changed
        run: |
          sleep 20
          BEFORE="${{ github.event.before }}"
          # On a scheduled run nothing was pushed — diffing against HEAD~1 would
          # resubmit the last commit's URLs every single day. Diff HEAD against
          # itself instead, so only files the injectors rewrote in this run
          # (e.g. the season flip) get submitted.
          if [ "${{ github.event_name }}" = "schedule" ]; then BEFORE="HEAD"; fi
          case "$BEFORE" in ""|0000000000000000000000000000000000000000) BEFORE="HEAD~1" ;; esac
          if ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            echo "::warning::previous commit $BEFORE not available, falling back to HEAD~1"
            BEFORE="HEAD~1"
          fi
          git cat-file -e "${BEFORE}^{commit}" || { echo "::error::cannot determine what changed"; exit 1; }
          { git diff --name-only "$BEFORE" "${{ github.sha }}" -- 'site/*.html' 'site/**/*.html'
            git status --porcelain site | awk '{print $NF}' | grep '\.html$' || true
          } | sed 's|^sites/getecoback/||' | sort -u > /tmp/changed.txt
          echo "changed html files:"; cat /tmp/changed.txt
          python3 - <<'PY'
          import json, re
          sitemap = set(re.findall(r'<loc>([^<]+)</loc>', open('site/sitemap.xml', encoding='utf-8').read()))
          out = []
          for line in open('/tmp/changed.txt', encoding='utf-8'):
              p = line.strip()
              if not p.startswith('site/') or not p.endswith('.html'):
                  continue
              url = 'https://getecoback.com/' + p[len('site/'):]
              if url in sitemap and url not in out:
                  out.append(url)
          open('/tmp/idx_urls.json', 'w').write(json.dumps(out))
          open('/tmp/idx_count', 'w').write(str(len(out)))
          PY
          COUNT=$(cat /tmp/idx_count)
          echo "submitting $COUNT changed URL(s) to IndexNow"
          if [ "$COUNT" = "0" ]; then
            echo "nothing changed — skipping the ping (a meaningless ping costs trust)"
            exit 0
          fi
          URLS=$(cat /tmp/idx_urls.json)
          curl -s -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "{\"host\":\"getecoback.com\",\"key\":\"dc2860e32f47689a11c7bc07a21f6ffb\",\"keyLocation\":\"https://getecoback.com/dc2860e32f47689a11c7bc07a21f6ffb.txt\",\"urlList\":${URLS}}" \
            -w "\nIndexNow HTTP status: %{http_code}\n" || true
