name: BPJ receipts clock

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Verify Free eligibility, deploy, read status or pause the BPJ receipt scheduler'
        type: choice
        options: [preflight, deploy, status, pause]
        default: preflight

permissions:
  contents: read

concurrency:
  group: bpj-receipts-clock
  cancel-in-progress: false

jobs:
  operate:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - name: Guard — pin current main
        run: |
          bash .github/scripts/deploy-main-guard.sh prepare
          echo "DEPLOY_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test scheduler and account safeguards
        if: inputs.mode == 'preflight' || inputs.mode == 'deploy'
        run: node --test tools/bpj-receipts-clock/test.mjs tools/bpj-receipts-clock/operator.test.mjs
      - name: Read account billing and verify BPJ ownership
        if: inputs.mode == 'preflight'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: node tools/bpj-receipts-clock/operator.mjs preflight
      - name: Validate the standalone Worker bundle locally
        if: inputs.mode == 'deploy'
        run: npx --yes wrangler@4.168.0 deploy --config tools/bpj-receipts-clock/wrangler.toml --no-autoconfig --dry-run --outdir "$RUNNER_TEMP/bpj-receipts-clock"
      - name: Verify Free eligibility and deploy the isolated scheduler
        if: inputs.mode == 'deploy'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          ADS_WATCH_SECRET: ${{ secrets.ADS_WATCH_SECRET }}
        run: |
          secret_file="$RUNNER_TEMP/bpj-receipts-clock-secrets.json"
          account_file="$RUNNER_TEMP/bpj-receipts-clock-account-id"
          trap 'rm -f "$secret_file" "$account_file"' EXIT
          node tools/bpj-receipts-clock/operator.mjs prepare
          export CLOUDFLARE_ACCOUNT_ID="$(< "$account_file")"
          bash .github/scripts/deploy-main-guard.sh check
          if ! npx --yes wrangler@4.168.0 deploy --config tools/bpj-receipts-clock/wrangler.toml --no-autoconfig --name bpj-receipts-clock --secrets-file "$secret_file" >/dev/null 2>&1; then
            echo '::error::Cloudflare scheduler deployment failed. Check the Workers deployment permission and account quotas.'
            exit 1
          fi
          echo 'Deployed standalone BPJ receipts scheduler.'
      - name: Arm and observe two successful automatic receipt checks
        if: inputs.mode == 'deploy'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          bash .github/scripts/deploy-main-guard.sh check
          node tools/bpj-receipts-clock/operator.mjs start
      - name: Read scheduler status or confirm pause
        if: inputs.mode == 'status' || inputs.mode == 'pause'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          MODE: ${{ inputs.mode }}
        run: |
          if [[ "$MODE" == pause ]]; then bash .github/scripts/deploy-main-guard.sh check; fi
          node tools/bpj-receipts-clock/operator.mjs "$MODE"
