name: Fleet heartbeat

# ── 第①层自治（owner 2026-09-04:「舰队自己不能依赖你进化…避免强依赖你」）──
#
# 存在的理由,有事故为证:2026-09-03 起两个自绑定 Routine 被平台挂起
# (suspension_reason=plan_no_longer_eligible),thedollscout 因此冻结 ~86 小时
# 才被人发现——它的部署是纯 push 触发,没有会话推它就没有任何东西推它。
# 本 workflow 是舰队的「死人开关的反面」:AI 会话层整体死掉时,站点仍然
# ①被探活 ②超过 7 天没部署就自动重新部署 ③把健康快照写回仓库,让任何一个
# 后续会话不靠任何 MCP 就能读到舰队状态。
#
# 成本(CLAUDE.md 第 2 条要求先算账):实测 19 秒/次(2026-09-04 首跑),按最小计费
# 粒度 1 分钟/次 × 30 次/月 = <=30 分钟/月,
# agi-site 是公开仓 → Actions 免费,不占账号 2000 分钟额度。
# 无外部副作用(不推 IndexNow、不存 Wayback),只 curl 自己的站 + 派发自己的部署。

on:
  schedule:
    - cron: "0 8 * * *"   # 每日 08:00 UTC = 16:00 北京,晚于所有站点的部署窗口
  workflow_dispatch: {}

concurrency:
  group: fleet-heartbeat
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Probe every site and redeploy anything stale
        id: probe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          # site|live URL|deploy workflow file
          SITES='agiscorecard|https://agiscorecard.com/|deploy-agiscorecard.yml
          baipiaoji|https://baipiaoji.com/|deploy-baipiaoji.yml
          getecoback|https://getecoback.com/|deploy-getecoback.yml
          thedollscout|https://thedollscout.com/|deploy-thedollscout.yml
          goldrush|https://goldrush.agiscorecard.com/?ci=1|deploy-goldrush.yml
          gridlings|https://play.agiscorecard.com/|deploy-gridlings.yml
          buysomething|https://source.agiscorecard.com/|deploy-buysomething.yml
          gamesledger|https://games.agiscorecard.com/|deploy-gamesledger.yml
          after35|https://35.agiscorecard.com/?ci=1|deploy-after35.yml
          learn|https://learn.agiscorecard.com/?ci=1|deploy-learn.yml
          fanzha|https://fanzha.agiscorecard.com/?ci=1|deploy-fanzha.yml
          firstjob|https://firstjob.agiscorecard.com/?ci=1|deploy-firstjob.yml
          codeword|https://codeword.agiscorecard.com/?ci=1|deploy-codeword.yml
          powerbill|https://powerbill.agiscorecard.com/?ci=1|deploy-powerbill.yml'

          NOW=$(date -u +%s)
          BAD=0
          echo '{' > /tmp/h.json
          echo "  \"generated\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"," >> /tmp/h.json
          echo '  "sites": [' >> /tmp/h.json
          FIRST=1

          while IFS='|' read -r name url wf; do
            name=$(echo "$name" | xargs); url=$(echo "$url" | xargs); wf=$(echo "$wf" | xargs)
            [ -z "$name" ] && continue

            # ① 探活:3 次重试,只认最终 200(重定向跟随)。
            code=$(curl -sS -o /dev/null -w '%{http_code}' -L --retry 3 --retry-delay 3 \
                     --max-time 25 -A 'agi-site-fleet-heartbeat' "$url" || echo 000)

            # ② 最近一次成功部署的年龄。
            #
            # 2026-09-11 实测异常:这一步给 agiscorecard 报了 6 天,而当时它当天已经
            # 成功部署过两次(04:07 与 14:09,快照生成于 14:10)。事后用同样的查询串
            # 复查,四种变体全部返回正确的最新一条——也就是说**当时那次读取拿到了
            # 过期结果**,原因无法事后确证(最可能是 API 读副本的短暂不一致)。
            #
            # 根因查不出来就不猜。改成对这类读取本身免疫:
            #   · 取最近 5 条成功 run 的 updated_at **最大值**,而不是盲信 [0];
            #   · 把拿到的原始值打进日志,下次再出就是可诊断的,而不是靠推。
            # (教训同源:此前 itch 那次也是靠"步骤耗时"去推断而不是读日志,推错了。)
            last=$(gh api "repos/$REPO/actions/workflows/$wf/runs?status=success&per_page=5" \
                     --jq '[.workflow_runs[].updated_at] | max // ""' 2>/dev/null || echo "")
            echo "  probe $name: http=$code last_success=${last:-<none>}"
            if [ -n "$last" ]; then
              age=$(( (NOW - $(date -u -d "$last" +%s)) / 86400 ))
            else
              age=-1
            fi

            # ③ 超过 7 天没有成功部署 → 自动重新部署一次(幂等:部署链是「按当前
            #    源码重建并发布」,重跑不会改变内容,只保证线上不是陈年产物)。
            #
            # **必须连续两次读到才动手**(2026-09-11 加)。上面那次误读证明单次读数
            # 可能是假的,而这一步是有外部副作用的:凭一次假读数派发部署,既浪费一次
            # 构建,更糟的是会把这个字段训练成"经常乱报、可以无视"——一个被无视的
            # 健康信号等于没有。两次连读把瞬时抖动挡掉,代价只是真停摆时晚一天发现。
            prev=$(jq -r --arg s "$name" \
                     '.sites[]? | select(.site==$s) | .days_since_deploy' \
                     data/fleet-health.json 2>/dev/null || echo "")
            case "$prev" in ''|*[!0-9-]*) prev="" ;; esac
            redeployed=false
            if [ "$age" -ge 7 ] || [ "$age" -eq -1 ]; then
              if [ -n "$prev" ] && { [ "$prev" -ge 7 ] || [ "$prev" -eq -1 ]; }; then
                if gh workflow run "$wf" --ref main >/dev/null 2>&1; then
                  redeployed=true
                  echo "::warning::$name 连续两次读到已 ${age} 天没有成功部署,已自动派发 $wf"
                fi
              else
                echo "::warning::$name 本次读到 ${age} 天未部署,但上一次快照是 ${prev:-<无>} —— 按两次连读规则先不派发,明天复核"
              fi
            fi

            # ④ 站点打不开是硬失败:让本次 run 变红,GitHub 会直接邮件通知 owner。
            #    这是整条链上唯一不需要任何 AI 会话就能送达的告警。
            if [ "$code" != "200" ]; then
              BAD=1
              echo "::error::$name ($url) 返回 $code,不是 200"
            fi

            [ $FIRST -eq 0 ] && echo ',' >> /tmp/h.json
            FIRST=0
            printf '    {"site":"%s","url":"%s","http":"%s","days_since_deploy":%s,"redeployed":%s}' \
              "$name" "$url" "$code" "$age" "$redeployed" >> /tmp/h.json
          done <<< "$SITES"

          echo '' >> /tmp/h.json
          echo '  ]' >> /tmp/h.json
          echo '}' >> /tmp/h.json
          mkdir -p data
          cp /tmp/h.json data/fleet-health.json
          cat data/fleet-health.json
          echo "bad=$BAD" >> "$GITHUB_OUTPUT"

      # ── AI 时代的两块仪表(2026-09-12,docs/ai-era-site-2026-09-12.md)──
      # ① 八站 AI 爬虫可达性。robots.txt 放行 ≠ 边缘放行:Cloudflare 的 Bot Fight /
      #    Block AI Scrapers / Pay-Per-Crawl(2026-09-15 起默认)在 robots 之上生效,被拦的
      #    爬虫在任何一站的 D1 里都留不下痕迹。此前只有 bpj 自己探(scripts/ai-crawler-probe.mjs),
      #    舰队手册却写着「heartbeat 看到 403 先解封」——它从来没看过。现在每天看:
      #    8 站 × 8 个 AI UA × (/ 与 /llms.txt),对照组是普通浏览器 UA(对照拿不到 200 就不判)。
      #    任一站把任一 AI 爬虫 403/429/503 → 本 run 红 → GitHub 邮件。零外部副作用
      #    (只 GET 自己的站;请求带 ?__probe=1,bpj 中间件据此不计账;其余站按 bot 记 ≤1 行/日)。
      - name: Probe AI-crawler reachability on all eight sites
        id: aiprobe
        continue-on-error: true
        run: python3 tools/fleet/ai_access_probe.py

      # ② 八站 28 天「AI 助手引荐」(真人 pv 里 referrer 是 chatgpt/perplexity/claude/copilot…)。
      #    这是舰队唯一不靠 Google 的分发面,09-12 手测基线:全舰队 69 次/28d,五个站是 0。
      #    D1 REST 直连,三个 token secret 逐个试(承 tds-traffic.yml 纪律),只打印生效的 env 名;
      #    读失败保留上一份快照,连续 >3 天读不到才红(不做每天一封的噪音)。快照写回
      #    data/fleet-ai-referrals.json,autopilot 的 demand-digest 次日读它。
      - name: Read AI-assistant referrals (28d) from every site's D1
        id: airef
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_TOKEN_ZONE: ${{ secrets.CLOUDFLARE_API_TOKEN_ZONE }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 tools/fleet/ai_referrals.py --selftest
          python3 tools/fleet/ai_referrals.py

      # 快照回仓:任何后续会话(哪怕没有 Cloudflare/GitHub MCP)都能 cat 一下就
      # 知道舰队是不是活着。data/ 不在任何站点的部署 path 过滤里,不会烧部署。
      - name: Commit health snapshot
        run: |
          cd "$GITHUB_WORKSPACE"
          git config user.email noreply@anthropic.com
          git config user.name Claude
          git add data/fleet-health.json
          git add data/fleet-ai-access.json data/fleet-ai-referrals.json 2>/dev/null || true
          git diff --cached --quiet && { echo "无变化"; exit 0; }
          git commit -m "chore(fleet): heartbeat 健康快照 $(date -u +%F)"
          for i in 1 2 3 4; do
            git fetch origin main -q && git rebase -q origin/main && git push -q origin HEAD:main && break || { git rebase --abort 2>/dev/null || true; sleep $((2**i)); }
          done

      # autopilot 自己也会悄悄死。GitHub 的失败邮件是整条链上唯一不经过任何 AI 会话的

      # 告警通道,所以「每日算法停了」这件事必须从这里发出来——否则它停了之后,

      # 接下来的十二天看起来会和之前十二天一模一样(这正是 tds 的 D1 导出步骤连续

      # 十二天全绿却一次都没成功的形状)。

      - name: Assert the autopilot is still running

        run: |

          python3 - <<'PY'

          import datetime, json, os, sys

          p = 'data/autopilot/receipt.json'

          if not os.path.isfile(p):

              print('::warning::autopilot has never written a receipt yet — expected only '

                    'before its first scheduled run')

              sys.exit(0)

          d = json.load(open(p))

          day = datetime.date.fromisoformat(d['today'])

          age = (datetime.datetime.utcnow().date() - day).days

          failed = [r['site'] for r in d['runs'] if r.get('outcome') == 'failed']

          print('autopilot receipt %s (%d days old), %d site runs' % (day, age, len(d['runs'])))

          bad = False

          if age > 3:

              print('::error::autopilot last ran %s — %d days ago. The daily site update '

                    'algorithm has stopped.' % (day, age)); bad = True

          if failed:

              print('::error::autopilot reported failure on: %s' % ', '.join(failed)); bad = True

          sys.exit(1 if bad else 0)

          PY

      # 六个 worker 各有一份 bot UA 正则,09-12 之前从 9 到 55 个 token 不等——同一只爬虫
      # 在一站算 bot、在另外五站算「真人」,台账各站人类 pv 因此不可比。现在只有一份权威
      # (tools/fleet/bot_ua.txt),这里断言每个 worker 的字面量与它逐字相同,并用真实 UA 样本
      # 测两个方向(爬虫必中、浏览器必不中)。漂移 → 本 run 红 → GitHub 邮件。零外部副作用。
      - name: Assert bot-UA classifier parity across workers
        run: python3 tools/fleet/check_bot_ua.py

      # 舰队的「赌注台账」(2026-09-13,owner:「持续优化,探索,扩张」):每条预登记判定线一行,
      # 到期 3 天内提醒,过期 >7 天仍未结算 → 红 → GitHub 邮件。判定线可以判负,不可以被遗忘;
      # 这是字节「应用工厂」里唯一能被 solo 舰队照抄的机制:按日期结算,按数字加码或杀掉。
      - name: Assert no judgment line is overdue and unsettled
        run: python3 tools/fleet/check_bets.py

      # SourceRadar 的官方召回雷达是 eco/tds 货架的门(PRD P1-4);存在但 >14 天没刷新 → 红。
      - name: Assert the recall radar the shelves gate on is fresh
        run: python3 tools/fleet/recall_gate.py --check

      - name: Fail the run if any site is down, blocks AI crawlers, or the referral read is stale
        if: steps.probe.outputs.bad == '1' || steps.aiprobe.outcome == 'failure' || steps.airef.outcome == 'failure'
        run: |
          echo "site-down=${{ steps.probe.outputs.bad }} ai-crawler-blocked=${{ steps.aiprobe.outcome }} ai-referrals=${{ steps.airef.outcome }}"
          exit 1
