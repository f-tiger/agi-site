name: agiscorecard prediction-market odds (weekly)

# 迁自私有仓 f-tiger/agiscorecard(2026-08-19)。「赔率 vs 证据」周更的取数端:
# 沙箱够不到 gamma-api.polymarket.com,只有 runner 能取;取不到就红,绝不编数。
# 快照落在 sites/agiscorecard/odds-snapshot.json,gen_odds.py 原路径消费。
on:
  schedule:
    - cron: '25 3 * * 1'   # 每周一 03:25 UTC,早于 04:00 的每日运行
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agi-odds
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - working-directory: sites/agiscorecard
        run: node tools/fetch_odds.mjs
      # ── AGI 行情板(2026-09-07)────────────────────────────────────────────────
      # owner 问「能不能做个类 Polymarket 的抽佣平台」;裁定见
      # docs/prediction-market-platform-2026-09.md:不做市场,做市场旁边那层。
      # 搭载这条已有的周任务,**不新增 schedule**;增量 ~0.5 分钟/月。
      # 取不到就跳过(continue-on-error):行情板是增量,不能拖累已经在跑的赔率快照。
      - name: Fetch AGI market board
        id: board
        continue-on-error: true
        working-directory: sites/agiscorecard
        run: node tools/fetch_market_board.mjs
      - name: Build /agi-prediction-markets
        if: steps.board.outcome == 'success'
        working-directory: sites/agiscorecard
        run: |
          python3 tools/gen_market_board.py
          python3 tools/validate.py
      - name: Commit snapshot if changed
        run: |
          git config user.name 'Claude'
          git config user.email 'noreply@anthropic.com'
          # 行情板那一步可能整步跳过,所以只 add 真的存在的文件
          for f in odds-snapshot.json market-board.json agi-prediction-markets.html sitemap.xml llms.txt; do
            [ -f "sites/agiscorecard/$f" ] && git add "sites/agiscorecard/$f" || true
          done
          git diff --cached --quiet || { git commit -m "chore(odds): 预测市场赔率快照 + AGI 行情板(runner 取,带 fetched 时间戳)"; git pull --rebase origin main; git push; }
