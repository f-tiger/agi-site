name: agiscorecard prediction-market odds (weekly)

# 迁自私有仓 f-tiger/agiscorecard(2026-08-19)。「赔率 vs 证据」周更的取数端:
# 沙箱够不到 gamma-api.polymarket.com,只有 runner 能取;取不到就红,绝不编数。
# 快照落在 sites/agiscorecard/odds-snapshot.json,gen_odds.py 原路径消费。
#
# 2026-09-26 重构为两个 job(账:每周一 ~1.5 分钟 → ~6 分钟/月,无新 schedule):
#   odds  —— 原有的赔率快照 + gen_odds.py(此前 gen_odds 只在会话循环里跑,09-21 的快照
#            因此从未渲染进 /agi-odds-vs-evidence)。
#   board —— AGI 共识板:四家来源取数 + SunWatch 台账快照 + gen_market_board + gen_calibration。
#            **不再 continue-on-error**:09-07→09-26 这一步静默失败了三周,页面一直 404,而
#            run 全绿(09-24 舰队数据检查点名的那种形状)。现在它自己红、自己发邮件,
#            又不拖累 odds job——两条各管各的(无 needs),commit 各自 rebase。
on:
  schedule:
    - cron: '25 3 * * 1'   # 每周一 03:25 UTC,早于 04:00 的每日运行
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agi-odds
  cancel-in-progress: true

jobs:
  odds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - working-directory: sites/agiscorecard
        run: node tools/fetch_odds.mjs
      - name: Render the odds-vs-evidence issue from the snapshot (ledger accumulates, never rebuilt from one point)
        working-directory: sites/agiscorecard
        run: |
          python3 tools/gen_odds.py
          python3 tools/validate.py
      - name: Commit snapshot if changed
        run: |
          git config user.name 'Claude'
          git config user.email 'noreply@anthropic.com'
          git add sites/agiscorecard/odds-snapshot.json sites/agiscorecard/odds-history.json sites/agiscorecard/agi-odds-vs-evidence.html sites/agiscorecard/sitemap.xml
          git diff --cached --quiet || { git commit -m "chore(odds): 预测市场赔率快照(runner 取,带 fetched 时间戳)"; git pull --rebase --autostash origin main; git push; }

  board:
    # 与 odds 无依赖:两个 job 写不同的文件,各自 rebase 后推送;odds 红了不该拖掉共识板。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      # 四家来源:Polymarket public-search、Kalshi series→markets、Manifold search(免鉴权),
      # Metaculus api/posts(未登录 403,用机器人的只读 token;缺了就该来源 ok:false,板照出)。
      - name: Fetch the AGI consensus board (discover-then-filter, four venues)
        working-directory: sites/agiscorecard
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
        run: node tools/fetch_market_board.mjs
      - name: Snapshot the SunWatch track-record ledger for /calibration (keep last good on failure; rewrite only on change)
        working-directory: sites/agiscorecard
        run: |
          python3 - <<'EOF'
          import json, os, urllib.request, datetime
          P = 'sunwatch-track-record.json'
          try:
              req = urllib.request.Request('https://invest.agiscorecard.com/api/track-record',
                                           headers={'User-Agent': 'agi-site-odds-workflow/1.0 (+https://github.com/f-tiger/agi-site)'})
              j = json.load(urllib.request.urlopen(req, timeout=30))
              assert j.get('entries'), 'no entries'
          except Exception as e:
              print('::warning::SunWatch track-record unreadable (%r); /calibration keeps the last committed snapshot' % (e,))
              raise SystemExit(0)
          snap = {'fetched': datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ'),
                  'source': 'https://invest.agiscorecard.com/api/track-record', 'asOf': j.get('asOf'),
                  'scored': j.get('scored'), 'hits': j.get('hits'), 'hitRate': j.get('hitRate'),
                  'entries': [{'date': e.get('date'), 'verdict': e.get('verdict'), 'odds': e.get('odds'),
                               'call_en': (e.get('call_en') or '')[:200]} for e in j.get('entries', [])]}
          old = json.load(open(P)) if os.path.exists(P) else {}
          same = all(old.get(k) == snap.get(k) for k in ('asOf', 'scored', 'hits', 'hitRate', 'entries'))
          if same:
              print('sunwatch snapshot unchanged (as of %s); not rewriting' % old.get('asOf'))
              raise SystemExit(0)
          json.dump(snap, open(P, 'w'), ensure_ascii=False, indent=1)
          open(P, 'a').write('\n')
          print('sunwatch snapshot:', snap['scored'], 'scored', len(snap['entries']), 'entries')
          EOF
      - name: Build /agi-prediction-markets + agi-consensus.json + /calibration, then validate
        working-directory: sites/agiscorecard
        run: |
          python3 tools/gen_market_board.py --selftest
          python3 tools/gen_market_board.py
          python3 tools/gen_market_board.py --check
          python3 tools/gen_calibration.py
          python3 tools/validate.py
      - name: Commit board if changed
        run: |
          git config user.name 'Claude'
          git config user.email 'noreply@anthropic.com'
          for f in market-board.json agi-consensus.json agi-prediction-markets.html sunwatch-track-record.json calibration.html sitemap.xml llms.txt; do
            [ -f "sites/agiscorecard/$f" ] && git add "sites/agiscorecard/$f" || true
          done
          git diff --cached --quiet || { git commit -m "chore(odds): AGI 共识板 + 校准页快照(runner 取,带 fetched 时间戳)"; git pull --rebase --autostash origin main; git push; }
