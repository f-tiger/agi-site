name: Check TDS display measurement
on:
  pull_request:
    paths:
      - 'sites/thedollscout/js/collector-core.js'
      - 'sites/thedollscout/js/collector-tools.js'
      - 'sites/thedollscout/scripts/gen-collector-pages.mjs'
      - 'sites/thedollscout/scripts/*calculator*'
      - 'sites/thedollscout/scripts/collector-tools.test.cjs'
      - 'sites/thedollscout/*calculator.html'
      - 'sites/thedollscout/de/*calculator.html'
      - '.github/workflows/check-tds-display.yml'
permissions:
  contents: read
concurrency:
  group: tds-display-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  display:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --prefix tools/revenue-studio --ignore-scripts
      - name: Core, UI and privacy regression tests
        working-directory: sites/thedollscout
        run: node --test scripts/collector-tools.test.cjs scripts/display-calculator-ui.test.cjs scripts/collection-sync.test.cjs scripts/collection-tracker-ui.test.cjs scripts/legacy-analytics.test.cjs
      - name: Assert generated source parity
        working-directory: sites/thedollscout
        run: |
          node scripts/gen-collector-pages.mjs
          git diff --exit-code -- collection-tracker.html display-calculator.html collector-guide.html de/collection-tracker.html de/display-calculator.html de/collector-guide.html
      - name: Install pinned Playwright Chromium
        run: node tools/revenue-studio/node_modules/playwright/cli.js install --with-deps chromium --only-shell
      - name: EN and DE browser smoke (all requests locally intercepted)
        run: node sites/thedollscout/scripts/display-calculator-browser.cjs
