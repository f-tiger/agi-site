name: Deploy buysomething (cross-session request)

# buysomething 会话的协作请求(2026-08-22,owner 授意):把 f-tiger/buySomething
# 指定分支的纯静态站部署到既有 worker `buysomething`。只做部署,不改其仓库代码;
# wrangler 配置与入口 worker 运行时生成。workflow_dispatch only,无排程,零固定成本。
on:
  workflow_dispatch: {}

concurrency:
  group: deploy-buysomething
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout buySomething branch
        uses: actions/checkout@v4
        with:
          repository: f-tiger/buySomething
          ref: claude/china-bestseller-recommendation-site-fcx9gj
          path: src
      - name: Verify expected static site
        run: |
          cd src
          for f in index.html styles.css app.js data.js; do
            [ -f "$f" ] || { echo "::error::missing $f — not the expected static site, aborting"; exit 1; }
          done
          echo "site files present:"; ls -la *.html *.css *.js *.json 2>/dev/null || true
      - name: Assemble worker package
        run: |
          mkdir -p pkg/site
          cp -r src/* pkg/site/
          rm -rf pkg/site/.git pkg/site/.github
          cat > pkg/worker.js <<'EOF'
          export default { async fetch(req, env) { return env.ASSETS.fetch(req); } };
          EOF
          cat > pkg/wrangler.jsonc <<'EOF'
          {
            "name": "buysomething",
            "main": "worker.js",
            "compatibility_date": "2026-08-01",
            "workers_dev": true,
            "assets": { "directory": "site", "binding": "ASSETS" }
          }
          EOF
      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          workingDirectory: pkg
          command: deploy
