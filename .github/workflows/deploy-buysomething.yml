name: Deploy buysomething

# SourceRadar(buysomething)—— 2026-08-22 并入舰队 monorepo(sites/buysomething/)。
# 域名:source.agiscorecard.com(wrangler custom_domain 自动挂载)。
# 成本核算:push ~0.7 分/次;schedule 每日 trends 刷新 ~2 分 ≈ 60 分/月,公开仓免费。
# trendspy 管线沿用原仓设计(≥30s 间隔、429 退避、keep-last-good,零编造友好)。
on:
  push:
    branches: [main]
    paths: ["sites/buysomething/**", ".github/workflows/deploy-buysomething.yml"]
  schedule:
    - cron: "20 5 * * *"
  workflow_dispatch:
    inputs:
      skip_trends:
        description: "Skip the Google Trends refresh (official-source fetches and packs still run)"
        type: boolean
        default: false {}

concurrency:
  group: deploy-buysomething
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 防回滚守卫(2026-08-26 事故):GitHub 曾乱序补发数小时前的 push 事件,
      # 每个旧事件都按自己那个历史提交部署,把线上反复滚回旧代码——gridlings 的
      # 重定向修复当天被这样滚掉两次,CG 审核正好撞上白屏。这些站点的部署都是
      # 「按当前源码重建并发布」,所以旧事件的正确动作不是发布旧快照,而是发布
      # main 的当前 tip(幂等、绝不倒退)。用 reset --hard 而非 checkout:有 4 条
      # 流水线会 git push 回仓,detached HEAD 会让那一步失败。
      - name: Guard — a replayed/stale push deploys main's tip, never rolls back
        if: github.event_name == 'push'
        run: |
          # Fail-open by design: a network hiccup must never block a deploy —
          # without a resolvable tip we simply keep the pushed commit, which is
          # exactly the pre-guard behaviour.
          git fetch origin main -q || { echo "::warning::fetch failed — stale-run guard skipped"; exit 0; }
          TIP=$(git rev-parse origin/main 2>/dev/null || true)
          case "$TIP" in
            "" | *[!0-9a-f]* ) echo "::warning::main tip unresolvable — stale-run guard skipped"; exit 0 ;;
          esac
          if [ "$(git rev-parse HEAD)" != "$TIP" ]; then
            echo "::warning::stale run — HEAD $(git rev-parse --short HEAD) is behind main tip $(git rev-parse --short "$TIP"); deploying the tip instead of rolling production back"
            git reset --hard "$TIP"
          fi
      - name: Refresh Google Trends data (schedule/dispatch only)
        if: github.event_name != 'push'
        working-directory: sites/buysomething
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.skip_trends }}" = "true" ]; then
            echo "trends refresh skipped by dispatch input"
          else
            pip install -q trendspy
            python3 tools/fetch_trends.py || echo "::warning::trends refresh failed — site keeps last good data (by design)"
          fi
          # PRD P1 (2026-09-13, probe 200/200): official duty passport (USITC HTS) + recall radar (CPSC). Keep-last-good inside.
          python3 tools/duty_passport.py || echo "::warning::duty passport fetch failed"
          python3 tools/recall_radar.py || echo "::warning::recall radar fetch failed"
          # PRD P0-3 (2026-09-13): probe the official sources (USITC HTS / CPSC / EU Safety Gate) — status only, nothing ingested.
          python3 tools/probe_sources.py || echo "::warning::source probe failed"
          # Opportunity packs (paid product): deterministic, gated at >=10 dossiers; sample.json always public.
          python3 tools/gen_idea_packs.py || echo "::warning::pack generation failed"
      - name: Commit refreshed data (schedule/dispatch only)
        if: github.event_name != 'push'
        # Best effort: a rebase conflict on the write-back must not block publishing.
        continue-on-error: true
        run: |
          git config user.name "buysomething-bot"
          git config user.email "noreply@anthropic.com"
          # 逐文件 add:多 pathspec 版本里只要一个文件缺失,git add 整条失败且
          # 一个都不暂存(2026-08-24 实测:trends/rising 因此从未回写过仓库)
          for f in sites/buysomething/site/trends.json sites/buysomething/site/rising.json data/sr-source-probe.json \
                   sites/buysomething/site/packs/index.json sites/buysomething/site/packs/sample.json \
                   sites/buysomething/site/passports.json sites/buysomething/site/recalls.json; do
            git add "$f" 2>/dev/null || true
          done
          git add sites/buysomething/site/packs/*-W*.json 2>/dev/null || true
          git diff --cached --quiet || { git commit -m "chore(buysomething): daily trends + reader-popularity refresh $(date -u +%F)"; git pull --rebase origin main; git push origin HEAD:main; }
      - name: Gate — expected files present
        working-directory: sites/buysomething
        run: |
          for f in site/index.html site/styles.css site/app.js site/data.js \
                   site/landed-cost.html site/is-alibaba-legit.html site/sourcing-margins.html \
                   site/packs.html site/packs-thanks.html site/packs/index.json \
                   site/mcp.html site/duty-stack.json server.json mcp.js \
                   site/robots.txt site/sitemap.xml site/llms.txt \
                   site/16507d8e1997c4be371f5fbaf7ac1985.txt; do
            [ -f "$f" ] || { echo "::error::missing $f"; exit 1; }
          done
          node --check worker.js
          # PRD P0-4: every pick declares provenance; PRD P0-2: superseded tariff figures only inside the expired block
          python3 tools/validate_picks.py
          python3 - <<'PY'
          import re, sys
          s = open('site/landed-cost.html', encoding='utf-8').read()
          body = re.sub(r'<div class="expired">.*?</div>', '', s, flags=re.S)
          body = re.sub(r'<script type="application/ld\+json">.*?</script>', '', body, flags=re.S)
          body = re.sub(r'<h3>.*?</p>', '', body, flags=re.S)   # FAQ answers explain the superseded figures by name
          bad = [b for b in ['54%', '$100 flat', '$80–$200', '$80-200'] if b in body]
          sys.exit('::error::superseded tariff figures outside the expired block: %s' % bad if bad else 0)
          PY
          node --check mcp.js
          # 机器面两道闸门(2026-09-16):①duty-stack.json 与页面/llms.txt 不许漂移
          # ②MCP 协议 + 零编造 + 零联盟链接的 17 条断言。任何一条红就不发。
          python3 tools/check_duty_stack.py --selftest
          python3 tools/check_duty_stack.py
          node tools/test_mcp.mjs
          echo "gate ok"
      - name: Deploy worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          workingDirectory: sites/buysomething
          command: deploy
      # Post-deploy self-check (2026-09-04): asserts the shape of a working deploy —
      # routing, sitemap/robots/llms discovery files, the IndexNow key, JSON feeds
      # and a real 404. One deliberate POST to /e with label "__ci" (beacon truth test); never /subscribe.
      - name: Post-deploy self-check
        run: |
          set -u
          BASE="https://source.agiscorecard.com"
          UA='buysomething-deploy-selfcheck-bot (+ci; classified as bot by design)'
          fail=0
          # 1) 200 + zero redirects
          for p in / /landed-cost /is-alibaba-legit /sourcing-margins /mcp /styles.css /app.js /data.js /duty-stack.json; do
            ok=0; code=000; redirs=0
            for try in 1 2 3 4 5; do
              res=$(curl -s -o /dev/null -w '%{http_code} %{num_redirects}' -L --max-redirs 5 \
                    -A "$UA" -H 'Accept: text/html' "$BASE$p" || echo '000 0')
              code=${res%% *}; redirs=${res##* }
              if [ "$code" = "200" ] && [ "$redirs" = "0" ]; then ok=1; break; fi
              sleep 5
            done
            if [ "$ok" = "1" ]; then echo "OK    $p -> 200, no redirect"
            else echo "::error::$p -> HTTP $code after $redirs redirect(s)"; fail=1; fi
          done
          # 2) 200 + body contains
          check_body() { # path, grep-pattern...
            p="$1"; shift
            ok=0
            for try in 1 2 3 4 5; do
              body=$(curl -s -L --max-redirs 5 -A "$UA" -w '\n%{http_code}' "$BASE$p" || echo '000')
              code=$(printf '%s' "$body" | tail -n1); body=$(printf '%s' "$body" | sed '$d')
              if [ "$code" = "200" ]; then
                ok=1
                for pat in "$@"; do printf '%s' "$body" | grep -q -- "$pat" || ok=0; done
              fi
              [ "$ok" = "1" ] && break
              sleep 5
            done
            if [ "$ok" = "1" ]; then echo "OK    $p body contains: $*"
            else echo "::error::$p -> HTTP $code or body missing one of: $*"; fail=1; fi
          }
          check_body /sitemap.xml '<loc>' '/sourcing-margins'
          check_body /robots.txt 'Sitemap:'
          check_body /llms.txt 'sourcing-margins'
          check_body / 'SourceRadar'
          check_body /16507d8e1997c4be371f5fbaf7ac1985.txt ''
          # 3) JSON feeds
          check_json() { # path, python-assert-expr
            p="$1"; expr="$2"; ok=0
            for try in 1 2 3 4 5; do
              if curl -s -L --max-redirs 5 -A "$UA" "$BASE$p" -o body.json && \
                 python3 -c "import json,sys; j=json.load(open('body.json')); assert $expr, 'assert failed'" 2>/dev/null; then ok=1; break; fi
              sleep 5
            done
            if [ "$ok" = "1" ]; then echo "OK    $p JSON: $expr"
            else echo "::error::$p not valid JSON or failed: $expr"; fail=1; fi
          }
          check_json /trends.json 'True'
          check_json /api/pop '"picks" in j and "degraded" not in j'
          # /api/pulse (2026-09-13): token-free AI-referral aggregate read by the fleet heartbeat
          check_json /api/pulse 'j.get("ok") is True and isinstance(j.get("ai_ref"), int) and j.get("days") == 28'
          rm -f body.json
          # 3b) PRD P0-1 beacon truth test: POST a CI-labelled event, then read it back through the aggregate endpoint.
          curl -s -o /dev/null -X POST "$BASE/e" -H 'content-type: text/plain' --data '{"n":"calc_use","l":"__ci","p":"/__ci"}' || true
          ok=0
          for try in 1 2 3 4 5 6; do
            n=$(curl -s -A "$UA" "$BASE/api/selftest?label=__ci" | python3 -c "import json,sys; print(json.load(sys.stdin).get('n',0))" 2>/dev/null || echo 0)
            [ "${n:-0}" -ge 1 ] && { ok=1; break; }
            sleep 5
          done
          if [ "$ok" = "1" ]; then echo "OK    beacon /e → D1 → /api/selftest (n=$n)"
          else echo "::error::beacon truth test failed — /e events do not reach D1 (56 days of zero interactions may be a broken pipe, not absent readers)"; fail=1; fi
          # 3b-bis) MCP 机器面(2026-09-16):协议活着 + 零编造 + 零联盟链接,三条都要能红。
          check_json /api/mcp 'len(j.get("tools", [])) == 5 and "/api/mcp" in j["protocol"]["streamable_http"]'
          check_json '/api/mcp/duty_stack_rules?part=fees' 'j["fees"]["mpf"]["rate_pct"] == 0.3464 and "rules" not in j'
          # 零编造的线上证据:不给税率就必须拒算,而不是默认一个
          check_json '/api/mcp/landed_cost?goods_value_usd=1000' '"never guesses" in j.get("error","") and "hts.usitc.gov" in " ".join(j.get("how_to_get_it", []))'
          # JSON-RPC:initialize 与一次真实 tools/call(断言在 tools/assert_mcp_live.py,能单测)
          ok=0
          for try in 1 2 3 4 5; do
            curl -s -X POST "$BASE/api/mcp" -H 'content-type: application/json' \
              --data '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18"}}' -o mcp1.json || true
            curl -s -X POST "$BASE/api/mcp" -H 'content-type: application/json' \
              --data '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"check_import_claim","arguments":{"claim":"under $800 is duty free"}}}' -o mcp2.json || true
            if python3 sites/buysomething/tools/assert_mcp_live.py mcp1.json mcp2.json; then ok=1; break; fi
            sleep 5
          done
          [ "$ok" = "1" ] || { echo "::error::MCP live self-check failed after 5 tries"; fail=1; }
          rm -f mcp1.json mcp2.json
          # 3c) packs: public status + sample, and a non-public pack must NOT be served without a token
          check_json /api/pack/status 'j.get("ok") is True and "configured" in j'
          check_json /packs/index.json '"weeks" in j'
          code=$(curl -s -o /dev/null -w '%{http_code}' -A "$UA" "$BASE/packs/2026-W01.json" || echo 000)
          case "$code" in 403|503) echo "OK    /packs/<week>.json without token -> $code";; *) echo "::error::gated pack served without token (HTTP $code)"; fail=1;; esac
          check_body /packs 'Opportunity packs'
          # 3d) official data files, asserted only once the schedule has produced them
          if [ -f sites/buysomething/site/passports.json ]; then check_json /passports.json '"picks" in j and len(j["picks"]) == 31 and j.get("hts_release") is not None or "picks" in j'; fi
          if [ -f sites/buysomething/site/recalls.json ]; then check_json /recalls.json '"picks" in j and j.get("window_days") == 365'; fi
          # 4) real 404
          code=$(curl -s -o /dev/null -w '%{http_code}' -A "$UA" "$BASE/no-such-page-xyz" || echo 000)
          if [ "$code" = "404" ]; then echo "OK    /no-such-page-xyz -> 404"
          else echo "::error::/no-such-page-xyz -> HTTP $code (expected 404)"; fail=1; fi
          [ "$fail" = "0" ] || exit 1
          echo "self-check ok"
